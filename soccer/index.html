<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>大顆足球賽</title>
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}button,a,[role=button]{touch-action:manipulation}</style>
<script>/* 手機防誤放大 */
(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,p,{passive:false})});
document.addEventListener('touchmove',function(e){if(e.touches.length>1&&e.cancelable)e.preventDefault()},{passive:false});})();</script>
<script>try{var t=localStorage.getItem('designRequestThemeV1');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* ====== 「公司運動會」風格：木地板球場、轉播比分條、粗斜體數字、藍／紅兩隊（刻意不用遠征隊／對決的綠色面板） ====== */
:root{--ink:#14233b;--dim:#5d6f8c;--bg:#e9f2ff;--panel:#ffffff;--panel2:#f3f8ff;--line:#c4d6f0;--blue:#2f6df6;--red:#ef4b5b;--gold:#ffb703;--ok:#18b26a}
:root[data-theme=dark]{--ink:#eaf1ff;--dim:#9db2d6;--bg:#0c1426;--panel:#16213a;--panel2:#1d2c4b;--line:#2e4272;--blue:#5b8dff;--red:#ff6b78;--gold:#ffc83d;--ok:#35d58a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#eaf1ff;--dim:#9db2d6;--bg:#0c1426;--panel:#16213a;--panel2:#1d2c4b;--line:#2e4272;--blue:#5b8dff;--red:#ff6b78;--gold:#ffc83d;--ok:#35d58a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
canvas#c3{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
@media (pointer:coarse) and (orientation:portrait){
  html.playing,html.playing body{width:100vh;height:100vw}
  html.playing body{position:fixed;top:0;left:0;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
}
[hidden]{display:none!important}
.num{font-weight:900;font-style:italic;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* 比分條 */
.sb{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;border-radius:14px;overflow:hidden;box-shadow:0 6px 0 rgba(10,20,40,.28),0 0 0 3px #fff;background:var(--panel);z-index:5}
.sb .tm{display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:900;font-size:15px;min-width:92px;color:#fff}
.sb .tm.a{background:var(--blue);justify-content:flex-start}.sb .tm.b{background:var(--red);justify-content:flex-end}
.sb .tm small{font-size:10px;opacity:.85;display:block;letter-spacing:.1em}
.sb .sc{font-size:34px;line-height:1;padding:6px 14px;min-width:52px;text-align:center;color:var(--ink)}
.sb .clk{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 14px;background:var(--panel2);border-left:2px solid var(--line);border-right:2px solid var(--line);min-width:84px}
.sb .clk b{font-size:20px;line-height:1}.sb .clk small{font-size:10px;font-weight:900;color:var(--gold);letter-spacing:.12em}
.sb .clk.ot b{color:var(--red)}
/* 技能鈕（電腦在下方居中、手機在右下） */
.abs{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:14px;z-index:5;pointer-events:none}
.ab{position:relative;width:74px;height:74px;border-radius:50%;background:var(--panel);border:4px solid var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(10,20,40,.3);color:var(--ink);pointer-events:auto;touch-action:none}
.ab .ic{font-size:26px;line-height:1;font-weight:900}.ab .nm{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font-size:11px;font-weight:900;white-space:nowrap;color:var(--ink);text-shadow:0 0 4px var(--panel),0 0 4px var(--panel)}
.ab kbd{position:absolute;top:-8px;right:-4px;font:900 10px/1 system-ui;background:var(--gold);color:#3a2600;border-radius:6px;padding:3px 5px}
.ab .sw{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(10,20,40,.62) calc(var(--p,0)*360deg),transparent 0);pointer-events:none}
.ab .ct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 20px/1 system-ui;font-style:normal;color:#fff;text-shadow:0 2px 0 #000;pointer-events:none}
.ab.ready{border-color:var(--ok);box-shadow:0 0 0 3px rgba(24,178,106,.3),0 5px 0 rgba(10,20,40,.3)}
.ab.cd{border-color:#8791a8;filter:saturate(.35)}
.ab.on{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,183,3,.45),0 5px 0 rgba(10,20,40,.3)}
.ab.big{width:86px;height:86px}
#chg{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);width:200px;height:12px;border-radius:99px;background:rgba(10,20,40,.45);border:2px solid #fff;overflow:hidden;z-index:5}
#chg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe066,#ff8a3d,#ef4b5b)}
/* 橫幅 */
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:6;pointer-events:none;opacity:0;transition:opacity .15s}
#banner.on{opacity:1}
#banner b{display:inline-block;font-size:clamp(44px,9vw,110px);font-weight:900;font-style:italic;color:#fff;-webkit-text-stroke:4px #14233b;paint-order:stroke fill;text-shadow:0 8px 0 #14233b;transform:skewX(-8deg);letter-spacing:.04em}
#banner small{display:block;font-size:clamp(14px,2.4vw,26px);font-weight:900;color:#fff;text-shadow:0 2px 0 #14233b,0 0 8px #14233b;margin-top:6px}
#toast{position:absolute;left:50%;top:78px;transform:translateX(-50%);z-index:6;pointer-events:none;font-weight:900;font-size:18px;color:#fff;background:rgba(20,35,59,.85);border-radius:99px;padding:5px 16px;opacity:0;transition:opacity .15s}
#toast.on{opacity:1}
/* 暫停／系統鈕 */
.sys{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:7}
.pb{font:900 13px/1 inherit;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-radius:10px;padding:7px 11px;box-shadow:0 3px 0 rgba(10,20,40,.25);cursor:pointer}
.pb:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(10,20,40,.25)}
/* 搖桿（比照元宇宙） */
#stick{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.34),rgba(255,255,255,.12));box-shadow:inset 0 4px 10px rgba(0,0,0,.25),0 3px 0 rgba(255,255,255,.3);display:none;z-index:6;touch-action:none}
#stick i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0 10%,transparent 34%),linear-gradient(180deg,#58a0ff,#2f6df6);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 4px 0 #1a47a8,0 7px 8px rgba(0,0,0,.3);pointer-events:none}
#stick::before{content:'';position:absolute;inset:-24px}
@media (pointer:coarse){
  #stick{display:block}
  .abs{left:auto;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));transform:none;flex-direction:row-reverse;align-items:flex-end;gap:16px}
  .ab{width:58px;height:58px}.ab.big{width:78px;height:78px}.ab kbd{display:none}
  #chg{bottom:auto;top:76px;width:160px}
}
/* 選單 */
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto;background:radial-gradient(ellipse at 50% 30%,rgba(47,109,246,.22),rgba(12,20,38,.82) 80%),linear-gradient(#bfe3ff,#e9f2ff)}
:root[data-theme=dark] .ov{background:radial-gradient(ellipse at 50% 30%,rgba(91,141,255,.25),rgba(5,9,18,.92) 80%),#0c1426}
.card{width:min(720px,100%);background:var(--panel);border:4px solid var(--ink);border-radius:22px;box-shadow:0 10px 0 rgba(10,20,40,.3);padding:18px 18px 20px;text-align:center}
.logo{font-size:clamp(34px,6.5vw,56px);font-weight:900;font-style:italic;line-height:1;color:var(--blue);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);transform:skewX(-6deg)}
.logo small{display:block;font-size:12px;letter-spacing:.5em;font-style:normal;color:var(--red);-webkit-text-stroke:0;text-shadow:none;margin-bottom:6px}
.row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.lab{font-weight:900;font-size:13px;color:var(--dim);min-width:56px;text-align:right}
.pill{font:900 15px/1 inherit;color:var(--ink);background:var(--panel2);border:3px solid var(--line);border-radius:99px;padding:9px 16px;cursor:pointer}
.pill.on{background:var(--blue);border-color:var(--ink);color:#fff;box-shadow:0 3px 0 var(--ink)}
.pick{display:flex;align-items:center;gap:10px}
.pick canvas{width:84px;height:84px;border-radius:50%;border:4px solid var(--blue);background:var(--panel2)}
.pick b{font-size:20px;min-width:5em}
.arr{font:900 18px/1 inherit;width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:var(--gold);color:#3a2600;cursor:pointer}
.go{margin-top:18px;font:900 22px/1 inherit;color:#fff;background:linear-gradient(#ff7a59,#ef4b5b);border:4px solid var(--ink);border-radius:16px;padding:14px 38px;box-shadow:0 6px 0 var(--ink);cursor:pointer;letter-spacing:.1em}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.help{margin-top:14px;font-size:12.5px;line-height:1.7;color:var(--dim);text-align:left;background:var(--panel2);border-radius:12px;padding:10px 14px}
.help b{color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--panel2);border-radius:12px;padding:8px}.kv span{display:block;font-size:11px;color:var(--dim);font-weight:800}.kv b{font-size:22px}
@media (max-width:700px){
  .sb .tm{min-width:0;padding:0 8px;font-size:12px}.sb .tm small{display:none}.sb .sc{font-size:26px;padding:4px 8px;min-width:38px}.sb .clk{min-width:66px;padding:3px 8px}.sb .clk b{font-size:16px}
  .card{padding:12px}.help{display:none}.row{margin-top:8px}.pick canvas{width:60px;height:60px}.go{margin-top:12px;padding:11px 28px;font-size:18px}.logo{font-size:30px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c3"></canvas>
  <div class="sb" id="sb" hidden>
    <div class="tm a"><div><small>我方</small><span id="nA">藍隊</span></div></div>
    <div class="sc num" id="scA">0</div>
    <div class="clk" id="clkBox"><b class="num" id="clk">3:00</b><small id="clkS">上半場</small></div>
    <div class="sc num" id="scB">0</div>
    <div class="tm b"><div style="text-align:right"><small>對手</small><span id="nB">紅隊</span></div></div>
  </div>
  <div id="toast"></div>
  <div id="banner"><b id="bnT"></b><small id="bnS"></small></div>
  <div id="chg" hidden><i></i></div>
  <div class="abs" id="abs" hidden>
    <div class="ab big" id="abP"><kbd>空白</kbd><b class="ic">💪</b><span class="nm">大力推</span><i class="sw"></i><em class="ct"></em></div>
    <div class="ab" id="abD"><kbd>Shift</kbd><b class="ic">🏃</b><span class="nm">衝撞</span><i class="sw"></i><em class="ct"></em></div>
    <div class="ab" id="abV"><kbd>E</kbd><b class="ic">🧤</b><span class="nm">撲接</span><i class="sw"></i><em class="ct"></em></div>
  </div>
  <div id="stick" hidden><i></i></div>
  <div class="sys" id="sys" hidden><button class="pb" id="pauseB" type="button">暫停</button></div>

  <div class="ov" id="menu">
    <div class="card">
      <div class="logo"><small>OFFICE  SPORTS  DAY</small>大顆足球賽</div>
      <div class="row"><span class="lab">我的角色</span><div class="pick"><button class="arr" id="prev" type="button">◀</button><canvas id="pv" width="120" height="120"></canvas><b id="pvN"></b><button class="arr" id="next" type="button">▶</button></div></div>
      <div class="row"><span class="lab">模式</span><span id="gMode"></span></div>
      <div class="row"><span class="lab">難度</span><span id="gDiff"></span></div>
      <div class="row"><span class="lab">時間</span><span id="gTime"></span></div>
      <button class="go" id="startB" type="button">開球！</button>
      <div class="help"><b>電腦：</b>WASD／方向鍵移動　<b>空白鍵</b>按住蓄力、放開大力推球　<b>Shift</b> 衝撞（撞飛對手、撞球更有力）　<b>E</b> 撲接（守門用，撲完要休息一下）<br>
      <b>手機：</b>左下搖桿移動，右下三顆鈕：大力推（按住蓄力）、衝撞、撲接。<br>
      <b>規則：</b>把大球推進對方球門。時間到進球多的贏，平手進入延長賽（金球制）。</div>
    </div>
  </div>
  <div class="ov" id="endO" hidden><div class="card" id="endC"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id), Q = new URLSearchParams(location.search);
const FL = 20, FW = 12, GW = 5.2, GD = 3.2, PR = .9, BR = 1.5;          // 球場半長／半寬／球門半寬／球門深／人半徑／球半徑
const ANGLES = 12, LOCAL_NAMES = ['Machi', 'Anna', 'Leona', 'Amber', 'Noise', '余采馨', '吳冠賢', '廖秦葦', '李明庭', '王藍庭', '鄭筱舢', '黎子瑄'];
const CHAR_SCALE = { Leona: 1.1, 廖秦葦: 1.18 };
const CFG = { mode: 2, diff: 1, time: 180, who: 'Machi' };
try { Object.assign(CFG, JSON.parse(localStorage.getItem('soccerCfgV1') || '{}')); } catch (e) {}
if (!LOCAL_NAMES.includes(CFG.who)) CFG.who = 'Machi';
const saveCfg = () => { try { localStorage.setItem('soccerCfgV1', JSON.stringify(CFG)); } catch (e) {} };
const rand = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const touch = matchMedia('(pointer:coarse)').matches;

// ───────── 音效 ─────────
let AC = null;
const unlock = () => { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} };
function tone(f, d, type = 'sine', vol = .15, f2 = 0, delay = 0) { if (!AC) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02); }
const SFX = {
  thump: v => tone(150, .14, 'sine', clamp(v / 30, .05, .4), 55),
  bump: () => tone(110, .18, 'square', .12, 50),
  whistle: () => { tone(2300, .5, 'sine', .12, 2150); tone(2350, .5, 'sine', .08, 2200, .02); },
  goal: () => { [392, 523, 659, 784].forEach((f, i) => tone(f, .35, 'sawtooth', .09, 0, i * .1)); },
  beep: () => tone(880, .1, 'square', .08),
  save: () => { tone(500, .12, 'triangle', .14, 900); },
  wall: v => tone(260, .08, 'triangle', clamp(v / 40, .02, .14), 140)
};

// ───────── 場景 ─────────
const cv = $('c3'), renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(42, 16 / 9, .5, 220);
const isRot = () => touch && matchMedia('(orientation:portrait)').matches && document.documentElement.classList.contains('playing');
const rotW = () => isRot() ? innerHeight : innerWidth, rotH = () => isRot() ? innerWidth : innerHeight;
function resize() { const w = Math.max(320, rotW()), h = Math.max(240, rotH()); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); matchMedia('(orientation:portrait)').addEventListener && matchMedia('(orientation:portrait)').addEventListener('change', () => setTimeout(resize, 60));
const dark = () => { const t = document.documentElement.getAttribute('data-theme'); return t === 'dark' || (!t && matchMedia('(prefers-color-scheme:dark)').matches); };
const hemi = new THREE.HemisphereLight(0xffffff, 0xb9a98a, .9), sun = new THREE.DirectionalLight(0xffffff, .55); sun.position.set(-8, 20, 10);
scene.add(hemi, sun);
function applyTheme() { const d = dark(); scene.background = new THREE.Color(d ? 0x0b1224 : 0xbfe3ff); scene.fog = new THREE.Fog(d ? 0x0b1224 : 0xbfe3ff, 60, 130); hemi.intensity = d ? .55 : .95; sun.intensity = d ? .35 : .55; }
applyTheme(); addEventListener('storage', applyTheme); addEventListener('message', applyTheme);

const mk = (g, m) => new THREE.Mesh(g, m), lam = c => new THREE.MeshLambertMaterial({ color: c }), bas = (c, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o));
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t; }
// 木地板球場
const PXU = 20, TW = (FL * 2 + 10) * PXU, TH = (FW * 2 + 6) * PXU;
const floorTex = canvasTex(TW, TH, (g, w, h) => {
  const X = x => w / 2 + x * PXU, Z = z => h / 2 + z * PXU;
  for (let i = 0; i < Math.ceil(h / 26); i++) { g.fillStyle = i % 2 ? '#e2b67a' : '#dba96a'; g.fillRect(0, i * 26, w, 26); g.fillStyle = 'rgba(120,70,20,.16)'; g.fillRect(0, i * 26, w, 2); }
  for (let i = 0; i < 60; i++) { g.fillStyle = 'rgba(120,70,20,.06)'; g.fillRect(Math.random() * w, Math.floor(Math.random() * h / 26) * 26, rand(40, 160), 26); }
  g.fillStyle = 'rgba(47,109,246,.16)'; g.fillRect(X(-FL), Z(-FW), FL * PXU, FW * 2 * PXU); g.fillStyle = 'rgba(239,75,91,.16)'; g.fillRect(X(0), Z(-FW), FL * PXU, FW * 2 * PXU);
  g.strokeStyle = '#fff'; g.lineWidth = 7; g.lineCap = 'round'; g.strokeRect(X(-FL), Z(-FW), FL * 2 * PXU, FW * 2 * PXU);
  g.beginPath(); g.moveTo(X(0), Z(-FW)); g.lineTo(X(0), Z(FW)); g.stroke(); g.beginPath(); g.arc(X(0), Z(0), 3.6 * PXU, 0, 7); g.stroke();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(X(0), Z(0), 9, 0, 7); g.fill();
  for (const s of [-1, 1]) { g.strokeRect(s < 0 ? X(-FL) : X(FL - 6), Z(-GW - 3), 6 * PXU, (GW + 3) * 2 * PXU); g.fillStyle = s < 0 ? 'rgba(47,109,246,.55)' : 'rgba(239,75,91,.55)'; g.fillRect(s < 0 ? X(-FL - GD) : X(FL), Z(-GW), GD * PXU, GW * 2 * PXU); }
});
const floor = mk(new THREE.PlaneGeometry(FL * 2 + 10, FW * 2 + 6), new THREE.MeshLambertMaterial({ map: floorTex })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const outer = mk(new THREE.PlaneGeometry(260, 260), lam(0x7b8fb3)); outer.rotation.x = -Math.PI / 2; outer.position.y = -.05; scene.add(outer);
// 場邊矮牆
const wallM = lam(0xffffff), stripeM = lam(0xffb703);
function wallBox(w, d, x, z) { const m = mk(new THREE.BoxGeometry(w, .9, d), wallM); m.position.set(x, .45, z); scene.add(m); const s = mk(new THREE.BoxGeometry(w + .02, .2, d + .02), stripeM); s.position.set(x, .92, z); scene.add(s); }
wallBox(FL * 2 + GD * 2 + 1, .6, 0, -FW - .5); wallBox(FL * 2 + GD * 2 + 1, .6, 0, FW + .5);
for (const s of [-1, 1]) { const len = FW - GW; wallBox(.6, len, s * (FL + .4), -(GW + len / 2)); wallBox(.6, len, s * (FL + .4), GW + len / 2); wallBox(.6, FW * 2 + 1, s * (FL + GD + .4), 0); }
// 球門：資源回收桶色的門框 + 網
