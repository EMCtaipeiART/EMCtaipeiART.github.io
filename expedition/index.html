<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>設計部遠征隊</title>
<style>
/* 版面：上方標題與控制列 → 倉庫 戰場（canvas）→ 提示列 → 五張必殺卡 → 協作條 → 職業卡。單一深綠主題，沿用凱曜多元宇宙的綠色玻璃面板與厚黑邊。 */
:root{
  color-scheme:dark;
  --bg:#0b1d15; --bg2:#102a1e; --panel:#163a2a; --panel2:#1d4a36; --line:#2f6b4f;
  --ink:#eafff2; --dim:#9cc5ae; --accent:#5fe08a; --accent-d:#2fa862; --gold:#ffd166; --danger:#ff6b5e; --violet:#b79bff;
  --c-machi:#5b8def; --c-noise:#ef5b45; --c-anna:#a77bff; --c-amber:#f5a93b; --c-leona:#3fd0b4;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  background-image:radial-gradient(1200px 500px at 50% -10%,#17402d 0%,transparent 70%)}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.brand small{color:var(--accent);letter-spacing:.14em;font-size:12px}
h1{margin:0;font-size:26px;line-height:1.15;letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--dim);font-size:13px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:12px;color:var(--dim);background:var(--bg2);border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.pk{font:inherit;font-weight:700;font-size:13px;color:#06281a;background:linear-gradient(#7ff0a6,var(--accent-d));border:3px solid #000;border-radius:12px;padding:6px 12px;box-shadow:0 4px 0 #06281a;cursor:pointer}
.pk:active{transform:translateY(3px);box-shadow:0 1px 0 #06281a}
.pk.off{background:linear-gradient(#2a5a44,#1d4a36);color:var(--dim)}
.pk.big{font-size:17px;padding:10px 26px}
.pk:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#stage{position:relative;border:3px solid #000;border-radius:16px;overflow:hidden;background:#0d241a;box-shadow:0 6px 0 #04120c}
#gl{display:block;width:100%;height:auto}
#cv{position:absolute;left:0;top:0;width:100%;height:auto;pointer-events:none}
#stage:has(.overlay:not([hidden])){min-height:400px}
.overlay{overflow:auto}
#alert{position:absolute;left:50%;top:58px;transform:translateX(-50%);width:min(88%,460px);background:rgba(20,8,8,.88);border:3px solid #000;border-radius:12px;padding:3px 10px 5px;text-align:center}
#alert b{display:block;font-size:13px}
#alert i{display:block;height:8px;border-radius:4px;background:#3a1512;margin-top:5px;overflow:hidden}
#alert i u{display:block;height:100%;background:var(--danger)}
#alert.revert i u{background:var(--violet)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:rgba(6,22,15,.86)}
.overlay h2{margin:0;font-size:clamp(20px,4.6vw,32px)}
.overlay p{margin:0;color:var(--dim);max-width:46ch}
.overlay .sys{font-family:var(--mono);color:var(--gold);font-size:13px}
#dialog{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(10,32,22,.94);border:3px solid #000;border-radius:14px;padding:10px 14px;cursor:pointer;text-align:left}
#dialog b{font-size:13px;letter-spacing:.06em}
#dialog p{margin:2px 0 0;font-size:clamp(14px,2.6vw,18px)}
#dFace{position:absolute;right:10px;bottom:76px;width:300px;height:196px;background-repeat:no-repeat;background-size:3600px 300px;background-position:0 0;filter:drop-shadow(0 0 0 #000) drop-shadow(0 4px 6px rgba(0,0,0,.6));pointer-events:none;transform-origin:50% 100%;animation:dface .28s ease-out}
@keyframes dface{from{opacity:0;transform:translateX(24px) scale(.92)}to{opacity:1;transform:none}}
@media (max-width:720px){#dFace{width:210px;height:136px;background-size:2520px 210px;bottom:70px;right:2px}}
@media (prefers-reduced-motion:reduce){#dFace{animation:none}}
#dialog small{position:absolute;right:12px;top:8px;color:var(--dim);font-size:11px}
.lb{width:min(100%,560px);text-align:left;font-size:13px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.lb h3{margin:0 0 6px;font-size:14px;color:var(--gold)} .lb .r{display:flex;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line)} .lb .r i{width:26px;font-style:normal;color:var(--dim)} .lb .r span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .lb .r b{font-variant-numeric:tabular-nums} .lb .me{color:var(--gold)}
.sub{display:flex;gap:6px;width:min(100%,560px)} .sub input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:inherit;font:inherit}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px 14px;width:min(100%,560px);text-align:left;font-size:13px}
.stats div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:2px 0}
.stats span{color:var(--dim)} .stats b{font-variant-numeric:tabular-nums}
.badge{display:inline-block;border:3px solid var(--accent);color:var(--accent);font-weight:800;border-radius:8px;padding:2px 12px;transform:rotate(-4deg);letter-spacing:.2em}

#tip{min-height:42px;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--ink)}
#tip.hot{border-color:var(--gold);color:var(--gold)}

@keyframes pulse{50%{box-shadow:0 4px 0 #04120c,0 0 0 4px rgba(255,209,102,.35)}}
@media (prefers-reduced-motion:reduce){.card.ready{animation:none}}

#gauge{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
#gauge .lbl{font-size:13px;color:var(--dim)}
.pips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.pip{font-size:12px;border:2px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--dim)}
.pip.on{border-color:#000;background:var(--accent);color:#06281a;font-weight:700}
#deliver:disabled{background:linear-gradient(#2a5a44,#1d4a36);color:var(--dim);box-shadow:0 4px 0 #06281a;cursor:not-allowed}
#deliver:not(:disabled){background:linear-gradient(#ffe39a,#f0b429)}

h3{margin:16px 0 0;font-size:17px}
.sub{margin:0;color:var(--dim);font-size:13px}
#roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.job{background:var(--panel);border:3px solid #000;border-radius:14px;padding:12px 14px;min-width:0}
.job h4{margin:0;font-size:16px;display:flex;gap:8px;align-items:center}
.job q{display:block;color:var(--dim);font-size:13px;margin:2px 0 8px;quotes:"「" "」"}
.job dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.job dt{color:var(--dim);white-space:nowrap}
.job dd{margin:0}
.job dd b{color:var(--c,var(--ink));text-shadow:0 0 10px color-mix(in srgb,var(--c,#fff) 40%,transparent)}
.job{border-left:4px solid var(--c,transparent)}
.job dt{color:color-mix(in srgb,var(--c,#9ab) 70%,#fff 30%);opacity:.8}

#stage{display:flex;flex-direction:column}
#topbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:0;padding:8px 10px 0;pointer-events:none}
#topbar .side{position:relative;flex:1;height:16px;margin-top:10px;border:3px solid #000;background:rgba(6,14,28,.82);overflow:hidden;transform:skewX(-14deg)}
#topbar .foe{transform:skewX(14deg)}
#topbar u,#topbar i{position:absolute;top:0;bottom:0;display:block}
#topbar .ally u{right:0;background:linear-gradient(#59e6ff,#0a8fd6);transition:width .15s}
#topbar .ally i{right:0;background:#fff;transition:width .9s .25s}
#topbar .foe u{left:0;background:linear-gradient(#ff7b6b,#d02a2a);transition:width .15s}
#topbar .foe i{left:0;background:#fff;transition:width .9s .25s}
#topbar .side span{position:absolute;top:-2px;font:700 11px/16px var(--mono);color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;transform:skewX(14deg)}
#topbar .foe span{transform:skewX(-14deg)}
#topbar .ally span{left:8px} #topbar .foe span{right:8px}
#topbar .mid{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;margin:0 -4px;z-index:1}
#topbar .mid em{font:800 15px/1 var(--font);font-style:normal;color:#ffd7d0;width:44px;height:44px;display:grid;place-items:center;background:radial-gradient(circle,#c0302a,#6a1414);border:3px solid #000;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
#topbar .mid b{font:800 14px/1.1 var(--mono);color:#fff;text-shadow:0 1px 3px #000;margin-top:-2px;background:rgba(0,0,0,.55);border-radius:6px;padding:0 6px;font-variant-numeric:tabular-nums}
#skillPop{position:absolute;left:0;top:58px;display:flex;align-items:center;gap:10px;padding:4px 26px 4px 6px;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.6));border:3px solid #000;border-left:0;border-radius:0 30px 30px 0;pointer-events:none}
#skillPop.in{animation:skin .35s ease-out}
@keyframes skin{from{transform:translateX(-110%)}}
#skillPop i{width:38px;height:38px;border-radius:50%;border:3px solid var(--c,#fff);background:#0a1a13 url() no-repeat;background-size:456px 38px;background-position:-10px -2px;box-shadow:0 0 12px var(--c)}
#skillPop b{font-size:16px;letter-spacing:.06em;color:#fff;text-shadow:0 0 10px var(--c)}
#party{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:2}
.card{flex:none;width:78px;padding:0 0 4px;gap:3px;border:3px solid #000;border-radius:12px;background:linear-gradient(#233a52,#141f2e);box-shadow:0 3px 0 #04120c;overflow:hidden;align-items:stretch}
.card .face{display:block;height:62px;margin:0;background-color:#0e2a3a;background-repeat:no-repeat;background-size:1872px 156px;background-position:-39px -6px;border-bottom:3px solid var(--c)}
.card kbd{left:3px;right:auto;top:3px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;padding:0;font-size:11px;font-weight:700;color:#fff;background:var(--c);border:2px solid #000}
.card .hpb,.card .spb,.card .cdb{height:7px;margin:0 5px;border-radius:3px;background:#05101a;overflow:hidden;border:1px solid #000}
.card .hpb u{display:block;height:100%;background:linear-gradient(#59e6ff,#0a8fd6)}
.card .spb u{display:block;height:100%;background:linear-gradient(#ffe39a,#f0b429)}
.card .cdb{height:4px;border:0;background:#0a1620} .card .cdb u{display:block;height:100%;background:#9aa8ff}
.card .lbl{font-size:11px;font-weight:700;text-align:center;color:#9fd4ff;line-height:1.2}
.card.ready{border-color:var(--gold);background:linear-gradient(#5a4a1a,#2a2208)} .card.ready .lbl{color:var(--gold)}
.card.dead .face{filter:grayscale(1)} .card.conf .lbl{color:var(--violet)}
@media (max-width:700px){
  #party{position:static;justify-content:center;padding:8px 6px 8px;background:#0b1d15;gap:5px}
  .card{width:calc(20% - 4px);min-width:0}
  .card .face{height:58px;background-position:-48px -6px}
  #topbar .mid{width:60px} #topbar .mid em{width:36px;height:36px;font-size:12px}
  #skillPop b{font-size:15px} #skillPop i{width:36px;height:36px;background-size:432px 36px;background-position:-9px -2px}
  #stage{border-radius:14px}
  #deliver{bottom:auto;top:calc(100vw * .52 - 56px);left:8px;font-size:14px;padding:6px 14px}
}

#stage:not(.live) #party,#stage:not(.live) #topbar{display:none}
#deliver{position:absolute;left:12px;bottom:12px;z-index:3;font-size:17px;padding:8px 20px;background:linear-gradient(#ffe39a,#f0b429);animation:dpop .9s infinite}
@keyframes dpop{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){#deliver{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <small>凱曜多元宇宙</small>
      <h1>設計部遠征隊</h1>
      <p>第一章《最後一版，真的》試玩原型</p>
    </div>
    <div class="ctrl">
      <span class="pill" id="waveP">倉庫</span>
      <span class="pill" id="timeP">0:00</span>
      <button class="pk off" id="autoB" type="button">自動必殺：關</button>
      <button class="pk off" id="spdB" type="button">速度 1×</button>
      <button class="pk off" id="pauseB" type="button">暫停</button>
      <button class="pk off" id="muteB" type="button">音效：開</button>
      <button class="pk off" id="musicB" type="button">音樂：開</button>
      <button class="pk" id="exitB" type="button" hidden>離開倉庫</button>
    </div>
  </header>

  <section id="stage">
    <canvas id="gl" width="960" height="500"></canvas>
    <canvas id="cv" width="960" height="500"></canvas>
    <div id="topbar"><div class="side ally"><i id="allyL"></i><u id="allyB"></u><span id="allyT"></span></div><div class="mid"><em>VS</em><b id="timeT">0:00</b></div><div class="side foe"><i id="foeL"></i><u id="foeB"></u><span id="foeT"></span></div></div>
    <div id="skillPop" hidden><i></i><b></b></div>
    <button class="pk big" id="deliver" type="button" hidden>準時交付</button>
    <section id="party"></section>
    <div id="alert" hidden><b id="alertT"></b><i><u id="alertB"></u></i></div>
    <div id="dFace" hidden></div>
    <div id="dialog" hidden><small>點一下繼續</small><b id="dWho"></b><p id="dTxt"></p></div>
    <div class="overlay" id="startO">
      <span class="sys">17:50，設計部</span>
      <h2>《最後一版，真的》</h2>
      <p>隊伍會自動戰鬥。你只要在對的時機按下方五張卡放必殺，湊滿協作條就能「準時交付」。</p>
      <button class="pk big" id="startB" type="button">進入倉庫</button>
    </div>
    <div class="overlay" id="endO" hidden></div>
  </section>

  <div id="tip">三波敵人：插單便條、意見分身、版本九頭蛇。全程約兩分半。</div>
  <section id="gauge">
    <span class="lbl">團隊協作條</span>
    <div class="pips" id="pips"></div>
    
  </section>

  <h3>五大職業</h3>
  <p class="sub">主動技會自動施放，必殺由你決定時機。鍵盤 1～5 放必殺，空白鍵準時交付。</p>
  <section id="roster"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 戰鬥核心：固定時間步進＋隨機種子，與畫面完全分開（企劃 7.1）
const Core = (() => {
  const DT = 0.1;
  const mk = seed => { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };

  const ORDER = ['machi', 'noise', 'anna', 'amber', 'leona'];
  const HERO = {
    machi: { name: 'Machi', hp: 1900, atk: 42, def: .35, spd: 1.5, cdMax: 12, gain: 10, ult: '交付防線', act: '統一窗口', range: 1.5, mv: 3.2, lane: .6, home: [-1, .6] },
    noise: { name: 'Noise', hp: 1150, atk: 80, def: .18, spd: 1.1, cdMax: 9, gain: 10, ult: '最後一版了！', act: '直接重做', range: 3.4, mv: 3.6, lane: .4, home: [-2.8, .4] },
    anna: { name: 'Anna', hp: 800, atk: 50, def: .08, spd: .6, cdMax: 8, gain: 6, ult: '一刀定稿', act: '直達源頭', range: 5.8, mv: 4.6, lane: 2.9, home: [-4.2, 2.9] },
    amber: { name: 'Amber', hp: 760, atk: 62, def: .05, spd: 1.5, cdMax: 10, gain: 11, ult: '全案展開', act: '視覺重構', range: 9, mv: 2.6, lane: 2.3, home: [-6.4, 2.3] },
    leona: { name: 'Leona', hp: 860, atk: 30, def: .08, spd: 1.4, cdMax: 7, gain: 13, ult: '重新對齊', act: '資訊整理', range: 6.8, mv: 2.6, lane: 1, home: [-5.4, 1] },
  };
  const EN = {
    note: { name: '插單便條', hp: 520, atk: 30, def: 0, spd: 1.9, row: 'front', range: 1.5, mv: 3.1, rad: .45 },
    armor: { name: '舊版裝甲', hp: 2600, atk: 70, def: 0, armor: .75, spd: 2.2, row: 'front', range: 1.7, mv: 1.7, rad: .75 },
    clone: { name: '意見分身', hp: 3200, atk: 40, def: .1, spd: 2.1, row: 'back', range: 4.6, mv: 1.3, rad: .65 },
    hydra: { name: '版本九頭蛇', hp: 95000, atk: 150, def: .1, spd: 1.7, row: 'back', boss: true, range: 40, mv: 0, rad: 2 },
  };
  const BLAST = 820, ENRAGE_AT = 200;
  const SEQ = ['minor', 'revert', 'confuse', 'deadline'];
  const FLAGS = ['protect', 'brk', 'weak', 'control', 'cleanse'];

  const ev = (S, e) => S.events.push(e);
  const alive = a => a.filter(u => u.alive);
  const hero = (S, id) => S.heroes.find(h => h.id === id);
  const unit = o => Object.assign({ alive: true, shield: 0, shieldT: 0, st: {}, timer: 0, x: 0, z: 0, fx: 1, fz: 0, mvg: false, tgt: null, rad: .5 }, o);
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
function go(u, tx, tz, stop, k = 1) { const dx = tx - u.x, dz = tz - u.z, d = Math.hypot(dx, dz); if (d > 1e-6) { u.fx = dx / d; u.fz = dz / d; } if (d > stop && u.mv > 0) { const st = Math.min(u.mv * k * DT, d - stop); u.x += dx / d * st; u.z += dz / d * st; u.mvg = true; } }

  function newGame(seed) {
    const S = {
      t: 0, seed, rand: mk(seed), wave: 0, eTot: 1, phase: 'between', betweenT: 1.2, waveT: 0,
      heroes: [], enemies: [], events: [], queue: [], n: 0, boss: null,
      gauge: { protect: false, brk: false, weak: false, control: false, cleanse: false },
      stats: { dmg: {}, heal: 0, absorb: 0, interrupts: 0, reverts: 0, combos: 0, delivered: 0, downs: 0 },
    };
    for (const id of ORDER) {
      const d = HERO[id];
      S.heroes.push(unit({ uid: id, id, side: 'hero', name: d.name, hp: d.hp, max: d.hp, atk: d.atk, def: d.def, spd: d.spd, x: d.home[0], z: d.home[1], range: d.range, mv: d.mv, lane: d.lane, home: d.home, rad: .5, energy: 0, cd: d.cdMax * .5, cdMax: d.cdMax, timer: d.spd * S.rand(), rage: 0, stacks: 0, pas: 4, barrage: 0, barrageT: 0 }));
      S.stats.dmg[id] = 0;
    }
    return S;
  }

  const spawnX = (k, s) => k === 'note' ? 7.6 + (s % 2) * .8 : k === 'armor' ? 7 : k === 'clone' ? 7.2 : 4.7;
const spawnZ = (k, s) => k === 'note' ? -2 + (s >> 1) * .75 : k === 'armor' ? -1.6 + s * 1.2 : k === 'clone' ? -.8 : -.5;
function spawn(S, kind) {
    const d = EN[kind];
    let slot = 0;
    const used = alive(S.enemies).filter(e => e.kind === kind).map(e => e.slot);
    while (used.includes(slot)) slot++;
    if (kind === 'note' && slot > 7) return null;
    const e = unit({ uid: 'e' + (++S.n), kind, side: 'enemy', name: d.name, hp: d.hp, max: d.hp, atk: d.atk, def: d.def, armor: d.armor || 0, spd: d.spd, row: d.row, range: d.range, mv: d.mv, rad: d.rad, x: spawnX(kind, slot), z: spawnZ(kind, slot), fx: -1, fz: 0, boss: !!d.boss, slot, timer: d.spd * (.4 + S.rand() * .6), sum: 3 });
    S.enemies.push(e);
    ev(S, { type: 'spawn', uid: e.uid });
    return e;
  }

  function startWave(S) {
    S.wave++; S.phase = 'fight'; S.waveT = 0; S.queue = [];
    S.eTot = [12 * EN.note.hp, 2 * EN.armor.hp + EN.clone.hp + 2 * EN.note.hp, EN.hydra.hp][S.wave - 1] || 1;
    S.enemies = S.enemies.filter(e => e.alive);
    if (S.wave === 1) { for (let i = 0; i < 4; i++) spawn(S, 'note'); S.queue.push({ t: 7, kind: 'note', n: 4 }, { t: 15, kind: 'note', n: 4 }); }
    if (S.wave === 2) { spawn(S, 'armor'); spawn(S, 'armor'); spawn(S, 'clone'); spawn(S, 'note'); spawn(S, 'note'); }
    if (S.wave === 3) { const b = spawn(S, 'hydra'); S.boss = { uid: b.uid, skillT: 7, seq: 0, cast: null, enraged: false }; }
    ev(S, { type: 'wave', n: S.wave });
  }

  function kill(S, u) {
    u.alive = false; u.hp = 0; u.st = {}; u.shield = 0;
    if (u.side === 'hero') S.stats.downs++;
    ev(S, { type: 'die', uid: u.uid });
  }

  // 套用防禦、護盾後實際扣血
  function land(S, src, dst, a, opt) {
    if (!opt.true) {
      let d = dst.def;
      if (dst.armor && !dst.st.broken) d = dst.armor;
      if (dst.st.guard) d = Math.min(.8, d + .3);
      a *= 1 - d;
    }
    a = Math.round(a);
    let sh = 0;
    if (dst.shield > 0) { sh = Math.min(dst.shield, a); dst.shield -= sh; }
    const real = a - sh;
    dst.hp -= real;
    if (src && src.side === 'hero') S.stats.dmg[src.id] += a;
    if (dst.side === 'hero') {
      dst.energy = Math.min(100, dst.energy + (dst.st.confuse ? 0 : (dst.id === 'machi' ? 4 : 2)));
      if (dst.id === 'noise') dst.rage = Math.min(10, dst.rage + 1);
    }
    ev(S, { type: 'hit', src: src ? src.uid : null, dst: dst.uid, amt: a, shield: sh, crit: !!opt.wasCrit, ult: !!opt.ult });
    if (dst.hp <= 0) kill(S, dst);
    return a;
  }

  function hurt(S, src, dst, raw, opt = {}) {
    if (!dst || !dst.alive) return 0;
    let a = raw * (.92 + S.rand() * .16);
    if (opt.crit && S.rand() < opt.crit) { opt.wasCrit = true; a *= dst.st.mark ? 2.2 : 1.6; }
    if (src && src.id === 'noise') a *= 1 + .04 * src.rage;
    if (dst.st.broken) a *= 1.4;
    if (opt.ult && dst.boss && S.boss && S.boss.cast && S.boss.cast.kind === 'revert') {
      S.boss.cast = null; S.stats.interrupts++;
      ev(S, { type: 'interrupt', by: src.uid });
    }
    if (dst.side === 'hero' && dst.id !== 'machi' && !opt.true) {
      const m = hero(S, 'machi');
      let share = 0;
      if (m.alive) { if (m.st.cover) share = .4; else if (dst.hp / dst.max < .35) share = .3; }
      if (share) { const part = a * share; a -= part; S.stats.absorb += land(S, src, m, part, { redirected: true }); }
    }
    return land(S, src, dst, a, opt);
  }

  function heal(S, dst, amt) {
    if (!dst.alive) return;
    const v = Math.round(Math.min(dst.max - dst.hp, amt));
    dst.hp += v; S.stats.heal += v;
    ev(S, { type: 'heal', dst: dst.uid, amt: v });
  }
  function shield(S, dst, amt, dur) {
    if (!dst.alive) return;
    dst.shield += amt; dst.shieldT = Math.max(dst.shieldT, dur);
    ev(S, { type: 'shield', dst: dst.uid, amt });
  }
  function combo(S, name, line) { S.stats.combos++; ev(S, { type: 'combo', name, line }); }
  function flag(S, k) { if (!S.gauge[k]) { S.gauge[k] = true; ev(S, { type: 'flag', k }); } }
  const gaugeReady = S => FLAGS.every(k => S.gauge[k]);

  function front(S) {
    const en = alive(S.enemies); if (!en.length) return null;
    const f = en.filter(e => e.row === 'front').sort((a, b) => (a.kind === b.kind ? a.slot - b.slot : a.kind === 'armor' ? -1 : 1));
    return f[0] || en[0];
  }
  function back(S) {
    const en = alive(S.enemies); if (!en.length) return null;
    return en.find(e => e.kind === 'clone') || en.find(e => e.st.mark) || en.find(e => e.boss) || en[0];
  }
  const anyEnemy = S => { const en = alive(S.enemies); return en.length ? en[Math.floor(S.rand() * en.length)] : null; };
  const lowest = S => alive(S.heroes).sort((a, b) => a.hp / a.max - b.hp / b.max)[0];

  function nearest(S, u) { return alive(S.enemies).sort((a, b) => dist(u, a) - dist(u, b))[0] || null; }
  function aim(S, h) {
    if (h.id === 'machi') { const f = alive(S.enemies).filter(e => e.row === 'front'); return f.length ? f.sort((a, b) => dist(h, a) - dist(h, b))[0] : nearest(S, h); }
    if (h.id === 'noise') return front(S);
    if (h.id === 'anna') return alive(S.enemies).find(e => e.st.mark) || back(S);
    return nearest(S, h);
  }
  function basic(S, h, t) {
    if (!t) return;
    ev(S, { type: 'basic', src: h.uid, dst: t.uid });
    hurt(S, h, t, h.atk, { crit: h.id === 'anna' ? .3 : .08 });
    if (!h.st.confuse) h.energy = Math.min(100, h.energy + HERO[h.id].gain);
    if (h.id === 'amber') h.stacks = Math.min(4, h.stacks + 1);
  }

  function stand(h, t) { const stop = h.range * .85 + t.rad + h.rad; let lz = h.lane; const dz = lz - t.z; if (Math.abs(dz) >= stop * .92) lz = t.z + Math.sign(dz || 1) * stop * .92; return [t.x - Math.sqrt(Math.max(.01, stop * stop - (lz - t.z) ** 2)), lz]; }
  function dashTo(S, h, t) { h._ox = h.x; h._oz = h.z; const p = stand(h, t); h.x = p[0]; h.z = p[1]; h.fx = t.x - h.x; h.fz = t.z - h.z; }
  function active(S, h) {
    const en = alive(S.enemies);
    ev(S, { type: 'cast', src: h.uid, name: HERO[h.id].act });
    if (h.id === 'machi') { en.forEach(e => e.st.taunt = 5); h.st.guard = 5; }
    if (h.id === 'noise') {
      const t = front(S); if (!t) return;
      h.fx = t.x - h.x; h.fz = t.z - h.z;
      hurt(S, h, t, 170, {});
      if (t.alive) {
        t.st.broken = 6;
        if (t.st.taunt) { t.st.broken = 9; combo(S, '你扛我輸出', '前面我頂住，你把它解決。'); }
      }
      flag(S, 'brk');
    }
    if (h.id === 'anna') { const t = back(S); if (t) { dashTo(S, h, t); ev(S, { type: 'dash', src: h.uid, dst: t.uid, fx: h._ox, fz: h._oz }); hurt(S, h, t, 210, { crit: .5 }); } }
    if (h.id === 'amber') {
      const m = h.stacks >= 4 ? 1.6 : 1; h.stacks = 0;
      ev(S, { type: 'grid', big: m > 1 });
      en.forEach(e => { hurt(S, h, e, 105 * m, {}); if (e.alive) e.st.slow = 4; });
      if (en.length >= 2 || en.some(e => e.boss)) flag(S, 'control');
    }
    if (h.id === 'leona') {
      const hs = alive(S.heroes);
      const t = hs.find(x => x.st.confuse) || hs.find(x => x.st.delay && x.hp / x.max < .8) || lowest(S);
      heal(S, t, 250);
      const k = t.st.confuse ? 'confuse' : t.st.delay ? 'delay' : null;
      if (k) { delete t.st[k]; flag(S, 'cleanse'); ev(S, { type: 'cleanse', dst: t.uid }); }
      const m = hero(S, 'machi');
      if (m.alive && m.st.cover) { hs.forEach(x => shield(S, x, 160, 5)); m.st.cover += 2; combo(S, '這次一起扛', '不要全部自己吞。'); }
    }
  }

  function castUlt(S, id) {
    const h = hero(S, id);
    if (S.phase !== 'fight' || !h || !h.alive || h.energy < 100) return false;
    h.energy = 0;
    ev(S, { type: 'cast', src: h.uid, name: HERO[id].ult, ult: true });
    if (id === 'machi') { alive(S.heroes).forEach(x => shield(S, x, 480, 6)); h.st.cover = 6; flag(S, 'protect'); }
    if (id === 'noise') { h.st.frenzy = 6; hurt(S, h, front(S) || anyEnemy(S), 260, { ult: true }); const b = alive(S.enemies).find(e => e.boss); if (b && S.boss.cast) hurt(S, h, b, 120, { ult: true }); }
    if (id === 'anna') {
      const marked = alive(S.enemies).filter(e => e.st.mark).sort((a, b) => b.hp - a.hp)[0];
      const t = marked || back(S);
      if (t) {
        let base = 850;
        if (t.st.mark) { base *= 1.5; flag(S, 'weak'); }
        if (t.st.slow) { base *= 1.4; combo(S, '重點已標好', '我幫你框好了。'); }
        dashTo(S, h, t); ev(S, { type: 'dash', src: h.uid, dst: t.uid, ult: true, fx: h._ox, fz: h._oz });
        hurt(S, h, t, base, { ult: true });
        if (!t.alive) h.energy = 50;
      }
    }
    if (id === 'amber') { h.barrage = 5; h.barrageT = 0; flag(S, 'control'); }
    if (id === 'leona') {
      let cleared = false;
      alive(S.heroes).forEach(x => {
        heal(S, x, x.max * .35);
        if (x.st.confuse || x.st.delay) cleared = true;
        delete x.st.confuse; delete x.st.delay; x.st.immune = 6;
      });
      if (cleared) flag(S, 'cleanse');
      ev(S, { type: 'align' });
    }
    return true;
  }

  function deliver(S) {
    if (S.phase !== 'fight' || !gaugeReady(S)) return false;
    FLAGS.forEach(k => S.gauge[k] = false);
    S.stats.delivered++;
    ev(S, { type: 'deliver' });
    alive(S.enemies).forEach(e => {
      const fin = e.boss && e.hp / e.max <= .25;
      hurt(S, null, e, fin ? e.hp + e.shield + 1 : 2600, { true: true });
    });
    alive(S.heroes).forEach(h => heal(S, h, h.max * .25));
    return true;
  }

  function bossStep(S, e) {
    const B = S.boss;
    if (!B.enraged && S.waveT > ENRAGE_AT) { B.enraged = true; e.atk *= 2; ev(S, { type: 'boss', kind: 'enrage', name: '加班到天亮' }); }
    if (B.cast) {
      B.cast.t -= DT;
      if (B.cast.t <= 0) {
        const k = B.cast.kind; B.cast = null;
        if (k === 'revert') { S.stats.reverts++; const v = Math.round(e.max * .1); e.hp = Math.min(e.max, e.hp + v); ev(S, { type: 'heal', dst: e.uid, amt: v }); ev(S, { type: 'boss', kind: 'reverted', name: '回到舊版了…' }); }
        if (k === 'deadline') { ev(S, { type: 'blast' }); alive(S.heroes).forEach(h => hurt(S, e, h, BLAST * (B.enraged ? 1.3 : 1), {})); }
      }
      return;
    }
    B.skillT -= DT;
    if (B.skillT > 0) return;
    B.skillT = 8;
    const k = SEQ[B.seq++ % 4];
    if (k === 'minor') { ev(S, { type: 'boss', kind: k, name: '再小改一下' }); for (let i = 0; i < 3; i++) spawn(S, 'note'); const n = hero(S, 'noise'); if (n.alive) n.rage = Math.min(10, n.rage + 3); }
    if (k === 'revert') { ev(S, { type: 'boss', kind: k, name: '剛剛那版比較好' }); B.cast = { kind: k, t: 4, max: 4 }; }
    if (k === 'confuse') { ev(S, { type: 'boss', kind: k, name: '意見還沒整合' }); alive(S.heroes).forEach(h => { if (h.id !== 'leona' && !h.st.immune) h.st.confuse = 10; }); }
    if (k === 'deadline') { ev(S, { type: 'boss', kind: k, name: '今天能出嗎？' }); B.cast = { kind: k, t: 5, max: 5 }; }
  }

  function step(S) {
    if (S.phase === 'won' || S.phase === 'lost') return;
    S.t += DT;
    if (S.phase === 'between') { S.betweenT -= DT; S.heroes.forEach(h => { h.mvg = false; if (h.alive) go(h, h.home[0], h.home[1], .05, 1.4); }); if (S.betweenT <= 0) startWave(S); return; }
    S.waveT += DT;
    for (const q of S.queue) if (!q.done && S.waveT >= q.t) { q.done = true; for (let i = 0; i < q.n; i++) spawn(S, q.kind); }

    for (const u of S.heroes.concat(S.enemies)) {
      if (!u.alive) continue;
      for (const k in u.st) { u.st[k] -= DT; if (u.st[k] <= 0) { delete u.st[k]; if (k === 'frenzy') u.rage = 0; } }
      if (u.shield > 0) { u.shieldT -= DT; if (u.shieldT <= 0) u.shield = 0; }
    }

    for (const u of S.heroes.concat(S.enemies)) u.mvg = false;
    for (const h of S.heroes) {
      if (!h.alive) continue;
      const en = alive(S.enemies).length;
      const conf = !!h.st.confuse;
      if (!conf) { h.energy = Math.min(100, h.energy + 1.5 * DT); h.cd -= DT; }
      h.pas -= DT;
      if (h.pas <= 0) {
        if (h.id === 'anna') { h.pas = 6; const t = back(S); if (t) { t.st.mark = 8; ev(S, { type: 'mark', dst: t.uid }); } }
        else if (h.id === 'leona') { h.pas = 7; const t = lowest(S); if (t && t.hp / t.max < .9) shield(S, t, 130, 6); }
        else h.pas = 99;
      }
      if (h.barrage > 0) { h.barrageT -= DT; if (h.barrageT <= 0) { h.barrage--; h.barrageT = .4; ev(S, { type: 'barrage' }); alive(S.enemies).forEach(e => hurt(S, h, e, 135, { ult: true })); } }
      if (!en) continue;
      const t = aim(S, h), d = t ? dist(h, t) - t.rad - h.rad : 0;
      if (t) { if (d > h.range * .98) { const p = stand(h, t); go(h, p[0], p[1], .05, h.st.delay ? .75 : 1); } else { go(h, h.x, h.lane, .05, .5); h.fx = t.x - h.x; h.fz = t.z - h.z; } }
      const inR = t && d <= h.range * 1.05;
      h.timer = Math.max(0, h.timer - DT * (conf ? .6 : 1) * (h.st.delay ? .75 : 1));
      if (h.timer <= 0 && inR) { h.timer = h.st.frenzy ? .35 : h.spd; basic(S, h, t); }
      const can = h.id === 'noise' ? inR : h.id === 'amber' ? t && d <= 9.5 : true;
      if (h.cd <= 0 && can) { h.cd = h.cdMax; active(S, h); }
    }

    for (const e of S.enemies) {
      if (!e.alive) continue;
      if (e.boss) bossStep(S, e);
      if (!e.alive) continue;
      if (e.kind === 'clone') { e.sum -= DT; if (e.sum <= 0) { e.sum = 5; if (alive(S.enemies).filter(x => x.kind === 'note').length < 6) { ev(S, { type: 'cast', src: e.uid, name: '再補一點意見' }); spawn(S, 'note'); } } }
      const hs = alive(S.heroes); if (!hs.length) break;
      const m = hero(S, 'machi');
      let t = e.tgt && hs.find(h => h.uid === e.tgt);
      if (e.range < 2.5 && m.alive) t = m;
      else if (e.st.taunt && m.alive) t = m;
      else if (!t) { const w = hs.map(h => h.id === 'machi' ? 3 : h.id === 'noise' ? 2 : 1); let r = S.rand() * w.reduce((a, b) => a + b, 0); for (let i = 0; i < hs.length; i++) { r -= w[i]; if (r <= 0) { t = hs[i]; break; } } t = t || hs[0]; }
      e.tgt = t.uid;
      const dd = dist(e, t) - t.rad - e.rad;
      if (dd > e.range) {
        if (e.range < 2.5) { const D = e.range * .7 + t.rad + e.rad, dx = Math.sqrt(Math.max(.04, D * D - .81)); go(e, t.x + dx, t.z - .9, .05, e.st.slow ? .6 : 1); }
        else go(e, t.x, t.z, e.range * .8 + t.rad + e.rad, e.st.slow ? .6 : 1);
      } else { e.fx = t.x - e.x; e.fz = t.z - e.z; }
      e.timer = Math.max(0, e.timer - DT * (e.st.slow ? .7 : 1));
      if (e.timer > 0 || dd > e.range * 1.1) continue;
      e.timer = e.spd;
      ev(S, { type: 'basic', src: e.uid, dst: t.uid });
      hurt(S, e, t, e.atk, {});
      if (e.kind === 'note' && t.alive && !t.st.immune && S.rand() < .22) { t.st.delay = 6; ev(S, { type: 'debuff', dst: t.uid, name: '拖延' }); }
    }

    const us = alive(S.heroes).concat(alive(S.enemies));
    for (let i = 0; i < us.length; i++) for (let j = i + 1; j < us.length; j++) {
      const a = us[i], b = us[j], need = a.rad + b.rad; let dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
      if (d >= need) continue; if (d < 1e-4) { dx = (i % 2 ? 1 : -1) * .01; dz = .01; d = .014; }
      const p = (need - d) * .5 / d, wa = a.mv ? 1 : 0, wb = b.mv ? 1 : 0, w = wa + wb || 1;
      a.x -= dx * p * 2 * wa / w; a.z -= dz * p * 2 * wa / w; b.x += dx * p * 2 * wb / w; b.z += dz * p * 2 * wb / w;
    }
    const mA = hero(S, 'machi').alive, bs = S.enemies.find(e => e.boss && e.alive);
    for (const u of us) { u.z = u.side === 'hero' ? Math.max(.2, Math.min(3.1, u.z)) : Math.max(-2.7, Math.min(mA ? .2 : 3, u.z)); u.x = Math.max(-6.8, Math.min(9, u.x)); if (bs && u.side === 'hero') u.x = Math.min(u.x, bs.x - (u.range * .85 + bs.rad + u.rad) * .85); }
    if (!alive(S.heroes).length) { S.phase = 'lost'; ev(S, { type: 'lost' }); return; }
    if (!alive(S.enemies).length && S.queue.every(q => q.done)) {
      if (S.wave >= 3) { S.phase = 'won'; ev(S, { type: 'won' }); return; }
      S.phase = 'between'; S.betweenT = 3.5;
      S.heroes.forEach(h => { if (!h.alive) { h.alive = true; h.hp = h.max * .4; h.timer = h.spd; } else h.hp = Math.min(h.max, h.hp + h.max * .3); h.st = {}; h.barrage = 0; });
      ev(S, { type: 'clear', n: S.wave });
    }
  }

  // 自動必殺策略（也是平衡測試用的「會玩的玩家」）
  function auto(S) {
    const out = []; if (S.phase !== 'fight') return out;
    const B = S.boss, en = alive(S.enemies), hs = alive(S.heroes), bossWave = S.wave === 3;
    const ready = id => { const h = hero(S, id); return h.alive && h.energy >= 100; };
    if (ready('machi')) {
      if (B && B.cast && B.cast.kind === 'deadline') { if (B.cast.t <= 1.2) out.push('machi'); }
      else if (!bossWave && hs.some(h => h.hp / h.max < .45)) out.push('machi');
    }
    const R = ['anna', 'noise', 'amber'].filter(ready);
    if (B && B.cast && B.cast.kind === 'revert') { if (R.length) out.push(R[0]); }
    else if (!bossWave) R.forEach(id => { if (en.length) out.push(id); });
    else if (R.length >= 2) out.push(R[0]);
    if (ready('leona') && (hs.filter(h => h.st.confuse).length >= 2 || hs.reduce((a, h) => a + h.hp / h.max, 0) / hs.length < .55)) out.push('leona');
    if (gaugeReady(S)) { const b = en.find(e => e.boss); if (b && b.hp / b.max <= .25) out.push('deliver'); }
    return out;
  }

  return { DT, dist, ORDER, HERO, EN, FLAGS, newGame, step, castUlt, deliver, gaugeReady, auto, alive, hero };
})();
if (typeof module !== 'undefined') module.exports = Core;

    const r = big ? .66 : .4, h = big ? 7.5 : 4.2;
    const beam = M(G.cyl, col); g.add(beam);
    const core = M(G.cyl, '#ffffff'); core.scale.set(r * .4, h, r * .4); g.add(core);
    const pool = flat(M(G.plane, col, { map: TX.glow })); pool.scale.setScalar(big ? 3.8 : 2.3); g.add(pool);
    const rings = Array.from({ length: big ? 3 : 1 }, () => { const m = flat(M(G.ring, col), .06); g.add(m); return m; });
    const sparks = Array.from({ length: big ? 24 : 8 }, (_, i) => { const s = SP(i % 3 ? TX.glow : TX.star, col); s.userData = { a: Math.random() * 6.283, rad: .3 + Math.random() * .8, v: 1 + Math.random() * 1.8, d: Math.random() * D * .4, s: .16 + Math.random() * .26 }; g.add(s); return s; });

      beam.material.opacity = .42 * env; beam.scale.set(r * w, h, r * w); beam.rotation.y = t * 2; core.material.opacity = .3 * env;
      pool.material.opacity = .9 * env;

      sparks.forEach(s => { const u = s.userData, q = Math.max(0, t - u.d), y = q * u.v * 1.6; s.position.set(Math.cos(u.a + q * 2.4) * u.rad, .1 + y, Math.sin(u.a + q * 2.4) * u.rad); s.material.opacity = q > 0 ? Math.min(1, q * 5) * Math.max(0, 1 - y / (h * .7)) * env : 0; s.scale.setScalar(u.s); });

function loop(ts) {
