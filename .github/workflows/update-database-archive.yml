name: Update database archive snapshot

on:
  push:
    branches:
      - main
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: database-archive-snapshot
  cancel-in-progress: false

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate snapshot
        run: node scripts/generate_database_archive_snapshot.mjs

      - name: Check for snapshot changes
        id: changes
        run: |
          if git diff --quiet -- data/database_archive.json; then
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changed snapshot
        if: steps.changes.outputs.snapshot == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/database_archive.json
          git commit -m "chore: update database archive snapshot"
          git push

      - name: Configure GitHub Pages
        if: steps.changes.outputs.snapshot == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changes.outputs.snapshot == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        if: steps.changes.outputs.snapshot == 'true' || github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v4
