name: Sync history database with current database

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - database_changed
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: history-database-sync
  cancel-in-progress: true

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Align and push history database from latest current database
        id: sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A database write can land while this workflow is running. Always
          # regenerate from the newest main instead of rebasing an archive that
          # was generated from an older database revision.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            node scripts/recalculate_database_weights.mjs
            node scripts/generate_database_archive_snapshot.mjs

            if git diff --quiet -- backend/data/db.json data/database_archive.json; then
              echo "snapshot=false" >> "$GITHUB_OUTPUT"
              echo "History database already matches current database."
              exit 0
            fi

            git add backend/data/db.json data/database_archive.json
            git commit -m "data: align history database with current database"
            if git push origin HEAD:main; then
              echo "snapshot=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main changed during snapshot attempt ${attempt}; regenerating from the newest database revision."
            sleep $((attempt * 2))
          done

          echo "::error::Could not align history database after five attempts because main kept changing."
          exit 1

      - name: Configure GitHub Pages
        if: steps.sync.outputs.snapshot == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.sync.outputs.snapshot == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        if: steps.sync.outputs.snapshot == 'true' || github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v4
