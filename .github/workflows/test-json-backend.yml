name: Test JSON backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site.js'
      - 'site.css'
      - 'legacy.html'
      - 'json_database_admin.html'
      - 'backend/**'
      - '!backend/data/audit-log.json'
      - '!backend/data/do-backup.enc.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/test-json-backend.yml'

permissions:
  contents: read

concurrency:
  group: test-json-backend
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate JSON database
        run: node -e "JSON.parse(require('node:fs').readFileSync('backend/data/db.json', 'utf8'))"
      - name: Align history snapshot for this database revision
        run: |
          node scripts/recalculate_database_weights.mjs
          node scripts/generate_database_archive_snapshot.mjs
      - name: Run backend tests
        run: npm test
      - name: Browser smoke test (main pages open without errors)
        run: |
          npm ci
          npm run smoke
