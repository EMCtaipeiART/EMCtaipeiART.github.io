  <script>
    const SNAPSHOT_URL='data/database_archive.json';
    const PRIMARY_DATABASE_URL='backend/data/db.json';
    const APPS_SCRIPT_FALLBACK_URL='https://script.google.com/macros/s/AKfycbxNi2pdh70uzRyTF7Fo6OZ8MTROwHSZpqITwwHBs6UHLPhtSeZEHxkga5N_fPT4_qW15A/exec';
    function configuredApi(){try{const value=new URL(location.href).searchParams.get('api')||localStorage.getItem('designRequestApiUrl')||'';return String(value).trim()}catch(error){return ''}}
    const DATABASE_API=configuredApi()||(location.hostname.endsWith('github.io')?APPS_SCRIPT_FALLBACK_URL:new URL('/api',location.origin).href);
    const APPS_SCRIPT_MODE=/script\.google\.com\/macros\/s\//.test(DATABASE_API);
    const AUTO_REFRESH_MS=15000;
    const DEFAULT_COLUMNS=['案件編號','月份','客戶別','專案名稱','專案負責人','設計種類','階段','數量','開始日期','結束日期','設計負責人','項目細節','狀態','加權','填單時間','時間標記','繳交時間','使用平台','設計簡報說明','設計簡報連結','客戶素材說明','客戶素材連結','參考範例說明','參考範例連結','其他說明','其他連結'];
    const LONG_FIELDS=new Set(['項目細節','設計簡報說明','客戶素材說明','參考範例說明','其他說明']);
    const $=id=>document.getElementById(id);
    let snapshot=null,fileHandle=null,page=1,filteredRows=[],editingRow=null,editingIsNew=false,dirty=false,changeCount=0,baseGeneratedAt='',sortKey='__latest',sortDirection='desc',currentSource='remote',lastRemoteVersion='';
    function sessionValue(key){return localStorage.getItem(key)||sessionStorage.getItem(key)||''}
    function taipeiParts(){return Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(part=>[part.type,part.value]))}
    function todayAdminToken(){const p=taipeiParts();return `local-admin:${p.year}${p.month}${p.day}`}
    function openerAdminToken(){try{return window.opener&&!window.opener.closed&&window.opener.location.origin===location.origin?window.opener.sessionStorage.getItem('designDashboardAdminTokenV1')||'':''}catch(error){return ''}}
    function handoffAdminToken(){try{const key='designArchiveAccessHandoffV1',handoff=JSON.parse(localStorage.getItem(key)||'{}');localStorage.removeItem(key);return Number(handoff.expiresAt)>Date.now()?String(handoff.token||''):''}catch(error){return ''}}
    function hasAdminAccess(){const dashboardToken=sessionStorage.getItem('designDashboardAdminTokenV1')||openerAdminToken()||handoffAdminToken();if(dashboardToken===todayAdminToken()){sessionStorage.setItem('designDashboardAdminTokenV1',dashboardToken);return true}if(sessionValue('designRequestEditorLoggedOut')==='1')return false;const group=sessionValue('designRequestEditorGroup'),token=sessionValue('designRequestEditorToken');if(group!=='管理者'||!token)return false;return !token.startsWith('local-admin:')||token===todayAdminToken()}
    function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    function notice(message,type=''){const el=$('notice');el.textContent=message;el.className=`notice ${type}`.trim()}
    function archiveCaseId(row){return String(row?.['\u6848\u4ef6\u7de8\u865f']||row?.id||'').trim()}
    function alignHistoryWithPrimary(history,primary){const data=JSON.parse(JSON.stringify(history||{})),historyRows=Array.isArray(data.rows)?data.rows:[],primaryRows=primary?.tables?.database?.rows;if(!Array.isArray(primaryRows))throw new Error('db.json 缺少 database 資料表');const occurrences=new Map(),indexes=new Map();historyRows.forEach((row,index)=>{const id=archiveCaseId(row);if(!id)return;const occurrence=(occurrences.get(id)||0)+1;occurrences.set(id,occurrence);indexes.set(`${id}#${occurrence}`,index)});const currentOccurrences=new Map();let added=0,updated=0;primaryRows.forEach(source=>{const row=JSON.parse(JSON.stringify(source)),id=archiveCaseId(row),occurrence=(currentOccurrences.get(id)||0)+1;currentOccurrences.set(id,occurrence);const key=id?`${id}#${occurrence}`:`__current__#${currentOccurrences.size}`,index=indexes.get(key);if(index===undefined){historyRows.push(row);indexes.set(key,historyRows.length-1);added++;return}const merged={...historyRows[index],...row};if(JSON.stringify(merged)!==JSON.stringify(historyRows[index]))updated++;historyRows[index]=merged});data.rows=historyRows;data.rowCount=historyRows.length;data.columns=[...new Set([...(data.columns||[]),...(primary?.tables?.database?.headers||[]),...historyRows.flatMap(row=>Object.keys(row))])].filter(Boolean);data.linkedDatabaseRevision=primary.revision;data.linkedDatabaseUpdatedAt=primary.updatedAt;data.liveAlignment={source:'backend/data/db.json',revision:primary.revision,updatedAt:primary.updatedAt,currentRows:primaryRows.length,historyRows:historyRows.length,added,updated,preservedHistorical:Math.max(0,historyRows.length-primaryRows.length),alignedAt:new Date().toISOString()};return data}
    function databaseToken(){return sessionValue('designRequestEditorToken')||sessionStorage.getItem('designDashboardAdminTokenV1')||''}
    function publishDatabaseRefresh(action,data={}){const message={type:'database-updated',action:String(action||''),revision:Number(data?.revision)||0,at:Date.now()};try{localStorage.setItem('designDatabaseRefreshV1',JSON.stringify(message));localStorage.setItem('designDatabaseRefreshPingV1',String(message.at))}catch(error){}try{const channel=new BroadcastChannel('design-database-refresh');channel.postMessage(message);channel.close()}catch(error){}}
    async function databaseRequest(action,payload={}){const editorToken=databaseToken();if(!editorToken)throw new Error('\u7ba1\u7406\u54e1\u767b\u5165\u5df2\u904e\u671f\uff0c\u8acb\u56de\u5100\u8868\u677f\u91cd\u65b0\u767b\u5165');const response=await fetch(DATABASE_API,{method:'POST',headers:{'Content-Type':APPS_SCRIPT_MODE?'text/plain;charset=UTF-8':'application/json'},body:JSON.stringify({action,editorToken,...payload}),cache:'no-store',credentials:'omit',redirect:'follow',referrerPolicy:'no-referrer'});const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch(error){throw new Error(`\u8cc7\u6599\u5eab\u56de\u61c9\u683c\u5f0f\u932f\u8aa4 (${response.status})`)}if(!response.ok||data?.ok===false)throw new Error(data?.error||`\u8cc7\u6599\u5eab\u5beb\u5165\u5931\u6557 (${response.status})`);publishDatabaseRefresh(action,data);return data}
    function validate(data){if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('JSON 根節點必須是物件。');if(!Array.isArray(data.rows))throw new Error('JSON 缺少 rows 陣列。');if(data.rows.some(row=>!row||typeof row!=='object'||Array.isArray(row)))throw new Error('rows 內每筆資料必須是物件。');if(!Array.isArray(data.columns)||!data.columns.length)data.columns=[...DEFAULT_COLUMNS];data.columns=[...new Set([...data.columns,...data.rows.flatMap(row=>Object.keys(row))])].filter(Boolean);return data}
    function duplicateIds(){const seen=new Set(),duplicates=new Set();snapshot?.rows.forEach(row=>{const id=String(row['案件編號']||'').trim();if(!id)return;if(seen.has(id))duplicates.add(id);else seen.add(id)});return duplicates}
    function displayDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?['—','—']:[date.toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei'}),date.toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})]}
    function touch(amount=1){if(!snapshot)return;dirty=true;changeCount+=Math.max(1,Number(amount)||1);snapshot.rowCount=snapshot.rows.length;snapshot.generatedAt=new Date().toISOString();snapshot.manualEdit={baseGeneratedAt:baseGeneratedAt||snapshot.generatedAt,editedAt:snapshot.generatedAt,editor:sessionValue('designRequestEditorDisplayName')||sessionValue('designRequestEditorUser')||'管理者'};updateSummary()}
    function updateSummary(){if(!snapshot)return;const [date,time]=displayDate(snapshot.generatedAt),duplicates=duplicateIds();$('rowCount').textContent=snapshot.rows.length.toLocaleString('zh-TW');$('columnCount').textContent=`${snapshot.columns.length} 個欄位`;$('generatedDate').textContent=date;$('generatedTime').textContent=time;$('changeCount').textContent=changeCount.toLocaleString('zh-TW');$('changeSummary').textContent=dirty?'尚未儲存至檔案':'已與目前載入版本同步';$('validationState').textContent='格式正常';$('duplicateState').textContent=duplicates.size?`${duplicates.size} 個重複案件編號`:'無重複案件編號';$('dirtyState').textContent=dirty?'● 有尚未儲存的變更':'';$('saveFile').disabled=false}
    function snapshotVersion(data){return `${String(data?.rowsSha256||data?.generatedAt||'')}|${String(data?.linkedDatabaseRevision||'')}`}
    function setSnapshot(data,{name='歷史資料庫（database_archive.json）',handle=null,source='remote',message=''}={}){snapshot=validate(data);snapshot.rowCount=snapshot.rows.length;baseGeneratedAt=snapshot.generatedAt||'';fileHandle=handle;currentSource=source;if(source==='remote')lastRemoteVersion=snapshotVersion(snapshot);page=1;dirty=false;changeCount=0;sortKey='__latest';sortDirection='desc';$('fileName').textContent=name;updateFilterOptions();applyFilters();updateSummary();const alignment=snapshot.liveAlignment;notice(message||(alignment?`歷史資料庫 ${snapshot.rows.length.toLocaleString('zh-TW')} 筆，已與目前 database revision ${alignment.revision} 的 ${alignment.currentRows.toLocaleString('zh-TW')} 筆資料對齊。`:`已載入 ${snapshot.rows.length.toLocaleString('zh-TW')} 筆歷史資料。`),'success')}
    async function loadRemote(options={}){const automatic=options?.automatic===true;if(automatic&&(dirty||currentSource!=='remote'||document.hidden))return;if(!automatic&&dirty&&!confirm('尚未儲存的變更會被取代，繼續嗎？'))return;if(!automatic)notice('正在同步歷史資料庫與目前 database...');try{const stamp=Date.now(),responses=await Promise.all([fetch(`${SNAPSHOT_URL}?v=${stamp}`,{cache:'no-store'}),fetch(`${PRIMARY_DATABASE_URL}?v=${stamp}`,{cache:'no-store'})]);if(!responses[0].ok)throw new Error(`歷史資料庫 HTTP ${responses[0].status}`);if(!responses[1].ok)throw new Error(`database HTTP ${responses[1].status}`);const data=alignHistoryWithPrimary(await responses[0].json(),await responses[1].json()),version=snapshotVersion(data);if(automatic&&version&&version===lastRemoteVersion)return;setSnapshot(data,{source:'remote',message:automatic?`偵測到 database 更新；歷史資料庫已重新對齊，共 ${data.rows.length.toLocaleString('zh-TW')} 筆。`:''})}catch(error){if(!automatic)notice(`歷史資料庫同步失敗：${error.message}`,'error')}}
    async function readFile(file,handle=null){try{setSnapshot(JSON.parse(await file.text()),{name:file.name,handle,source:'local'})}catch(error){notice(`JSON 開啟失敗：${error.message}`,'error')}}
    async function openFile(){if(dirty&&!confirm('尚未儲存的變更會被取代，繼續嗎？'))return;try{if('showOpenFilePicker'in window){const [handle]=await showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}],multiple:false});await readFile(await handle.getFile(),handle)}else $('fileInput').click()}catch(error){if(error.name!=='AbortError')notice(`檔案開啟失敗：${error.message}`,'error')}}
    function serialize(){snapshot.rowCount=snapshot.rows.length;return `${JSON.stringify(snapshot,null,2)}\n`}
    async function saveFile(){if(!snapshot)return;try{if(!fileHandle&&'showSaveFilePicker'in window)fileHandle=await showSaveFilePicker({suggestedName:'database_archive.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});if(!fileHandle){downloadFile();notice('瀏覽器不支援直接覆寫，已下載 JSON 副本。','success');return}const writable=await fileHandle.createWritable();await writable.write(serialize());await writable.close();dirty=false;changeCount=0;$('fileName').textContent=fileHandle.name;updateSummary();notice(`已儲存至 ${fileHandle.name}。`,'success')}catch(error){if(error.name!=='AbortError')notice(`儲存失敗：${error.message}`,'error')}}
    function downloadFile(){if(!snapshot)return;const blob=new Blob([serialize()],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='database_archive.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    function rowPeriod(row){const id=String(row['案件編號']||'').trim().match(/^(\d{2})(\d{2})\d{4,}$/);if(id)return {year:2000+Number(id[1]),month:Number(id[2])};for(const key of ['填單時間','開始日期','結束日期','繳交時間']){const match=String(row[key]||'').match(/(20\d{2})[\/-](\d{1,2})/);if(match)return {year:Number(match[1]),month:Number(match[2])}}return {year:0,month:Number(String(row['月份']||'').match(/\d{1,2}/)?.[0]||0)}}
    function latestValue(row){const id=String(row['案件編號']||'').replace(/\D/g,'');if(id)return Number(id);const period=rowPeriod(row);return period.year*100+period.month}
    function sortValue(row,key){if(key==='__latest')return latestValue(row);if(key==='設計種類')return row[key]||row['設計類型']||row['設計總類']||'';if(key==='狀態')return row[key]||row['案件狀態']||'';if(key==='加權'){const value=String(row[key]??'').trim();return value===''?'':Number(value.replace(/,/g,''))}if(key.includes('日期')){const date=new Date(String(row[key]||'').replace(/-/g,'/'));return Number.isNaN(date.getTime())?'':date.getTime()}return row[key]??''}
    function compareRows(a,b){const av=sortValue(a,sortKey),bv=sortValue(b,sortKey),aBlank=av===''||av==null||Number.isNaN(av),bBlank=bv===''||bv==null||Number.isNaN(bv);if(aBlank!==bBlank)return aBlank?1:-1;let result=0;if(typeof av==='number'&&typeof bv==='number')result=av-bv;else result=String(av).localeCompare(String(bv),'zh-Hant',{numeric:true,sensitivity:'base'});if(result)return sortDirection==='asc'?result:-result;return latestValue(b)-latestValue(a)}
    function updateSortIndicators(){document.querySelectorAll('#tableHead th[data-sort]').forEach(th=>{const active=th.dataset.sort===sortKey,button=th.querySelector('.sort-button');th.setAttribute('aria-sort',active?(sortDirection==='asc'?'ascending':'descending'):'none');button.classList.toggle('active',active);button.classList.toggle('desc',active&&sortDirection==='desc')})}
    function updateFilterOptions(){const selected={year:$('yearFilter').value,month:$('monthFilter').value,status:$('statusFilter').value},periods=snapshot.rows.map(row=>rowPeriod(row)),years=[...new Set(periods.map(period=>period.year).filter(Boolean))].sort((a,b)=>b-a),months=[...new Set(periods.map(period=>period.month).filter(month=>month>=1&&month<=12))].sort((a,b)=>a-b),statuses=[...new Set(snapshot.rows.map(row=>String(row['狀態']||row['案件狀態']||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));$('yearFilter').innerHTML='<option value="">全部年份</option>'+years.map(year=>`<option value="${year}">${year} 年</option>`).join('');$('monthFilter').innerHTML='<option value="">全部月份</option>'+months.map(month=>`<option value="${month}">${month} 月</option>`).join('');$('statusFilter').innerHTML='<option value="">全部狀態</option>'+statuses.map(status=>`<option value="${esc(status)}">${esc(status)}</option>`).join('');if(years.includes(Number(selected.year)))$('yearFilter').value=selected.year;if(months.includes(Number(selected.month)))$('monthFilter').value=selected.month;if(statuses.includes(selected.status))$('statusFilter').value=selected.status}
    function applyFilters(){if(!snapshot)return;const query=$('searchInput').value.trim().toLocaleLowerCase('zh-Hant'),year=Number($('yearFilter').value),month=Number($('monthFilter').value),status=$('statusFilter').value;filteredRows=snapshot.rows.filter(row=>{const period=rowPeriod(row);return (!year||period.year===year)&&(!month||period.month===month)&&(!status||String(row['狀態']||row['案件狀態']||'')===status)&&(!query||Object.values(row).some(value=>String(value??'').toLocaleLowerCase('zh-Hant').includes(query)))}).sort(compareRows);const pages=Math.max(1,Math.ceil(filteredRows.length/Number($('pageSize').value)));page=Math.min(page,pages);updateSortIndicators();renderTable()}
    function renderTable(){const size=Number($('pageSize').value),pages=Math.max(1,Math.ceil(filteredRows.length/size)),start=(page-1)*size,rows=filteredRows.slice(start,start+size);$('tableBody').innerHTML=rows.length?rows.map(row=>`<tr data-index="${snapshot.rows.indexOf(row)}"><td>${esc(row['案件編號'])}</td><td>${esc(row['客戶別'])}</td><td class="project" title="${esc(row['專案名稱'])}">${esc(row['專案名稱'])}</td><td>${esc(row['專案負責人'])}</td><td>${esc(row['設計種類']||row['設計類型']||row['設計總類'])}</td><td>${esc(row['階段'])}</td><td>${esc(row['設計負責人'])}</td><td>${esc(row['狀態']||row['案件狀態'])}</td><td>${esc(row['加權'])}</td><td>${esc(row['開始日期'])}</td><td>${esc(row['結束日期'])}</td><td><div class="row-actions"><button type="button" data-action="edit">編輯</button><button class="delete" type="button" data-action="delete">刪除</button></div></td></tr>`).join(''):'<tr><td colspan="12">沒有符合條件的資料</td></tr>';$('resultCount').textContent=`${filteredRows.length.toLocaleString('zh-TW')} 筆`;$('pageRange').textContent=filteredRows.length?`顯示 ${start+1}–${Math.min(start+size,filteredRows.length)}，共 ${filteredRows.length.toLocaleString('zh-TW')} 筆`:'共 0 筆';$('pageLabel').textContent=`${page} / ${pages}`;$('firstPage').disabled=$('prevPage').disabled=page<=1;$('lastPage').disabled=$('nextPage').disabled=page>=pages}
    function openEditor(row=null){editingIsNew=!row;editingRow=row||Object.fromEntries(snapshot.columns.map(column=>[column,'']));$('modalTitle').textContent=editingIsNew?'新增歷史資料':'編輯歷史資料';$('editFields').innerHTML=snapshot.columns.map(column=>{const value=editingRow[column]??'',wide=LONG_FIELDS.has(column)?' wide':'';return `<label class="field${wide}">${esc(column)}${LONG_FIELDS.has(column)?`<textarea name="${esc(column)}">${esc(value)}</textarea>`:`<input name="${esc(column)}" value="${esc(value)}">`}</label>`}).join('');$('editModal').hidden=false;setTimeout(()=>$('editFields').querySelector('input,textarea')?.focus(),20)}
    function closeEditor(){$('editModal').hidden=true;editingRow=null;editingIsNew=false}
    async function saveEditor(event){event.preventDefault();const wasNew=editingIsNew,originalRow=editingRow,originalId=archiveCaseId(originalRow),form=new FormData(event.currentTarget),updated={};snapshot.columns.forEach(column=>updated[column]=String(form.get(column)||'').trim());if(wasNew){notice('新增資料請由前台建立，此頁僅編輯已存在的正式資料。','error');return}if(!originalId){notice('這筆歷史資料沒有案件編號，無法對應正式資料庫。','error');return}const submit=event.currentTarget.querySelector('[type="submit"]');if(submit)submit.disabled=true;notice(`正在更新正式資料庫案件 ${originalId}...`);try{await databaseRequest('update',{id:originalId,row:updated,forceHeaders:snapshot.columns,writeHeaders:snapshot.columns});Object.assign(originalRow,updated);closeEditor();dirty=false;updateFilterOptions();applyFilters();updateSummary();notice(`案件 ${originalId} 已更新正式 JSON 資料庫；歷史資料庫將持續與 database 對齊。`,'success');setTimeout(()=>loadRemote({automatic:true}),1200)}catch(error){notice(`更新失敗：${error.message}。若為純歷史資料，可能已不存在於正式資料庫。`,'error')}finally{if(submit)submit.disabled=false}}
    async function deleteRow(row){const id=archiveCaseId(row),label=id||row['專案名稱']||'這筆資料';if(!id){notice('這筆歷史資料沒有案件編號，無法對應正式資料庫。','error');return}if(!confirm(`確定從正式資料庫刪除「${label}」？\n\n歷史資料庫仍會保留這筆紀錄，不會刪除 8,000 多筆舊資料。`))return;notice(`正在從正式資料庫刪除案件 ${id}...`);try{await databaseRequest('delete',{id});notice(`案件 ${id} 已從正式 JSON 資料庫刪除；歷史資料庫仍保留這筆歷史紀錄。`,'success');setTimeout(()=>loadRemote({automatic:true}),1200)}catch(error){notice(`刪除失敗：${error.message}。若為純歷史資料，可能已不存在於正式資料庫。`,'error')}}
    function showPane(name){const raw=name==='raw';$('tablePane').hidden=raw;$('rawPane').hidden=!raw;$('tableTab').classList.toggle('active',!raw);$('rawTab').classList.toggle('active',raw);$('tableTab').setAttribute('aria-selected',String(!raw));$('rawTab').setAttribute('aria-selected',String(raw));if(raw&&snapshot)$('rawJson').value=serialize()}
    function applyRaw(){try{const parsed=validate(JSON.parse($('rawJson').value));snapshot=parsed;baseGeneratedAt=baseGeneratedAt||snapshot.generatedAt||'';touch();updateFilterOptions();applyFilters();$('rawJson').value=serialize();notice('JSON 已套用。','success')}catch(error){notice(`JSON 驗證失敗：${error.message}`,'error')}}
    let historySyncTimer=null;function scheduleHistoryDatabaseSync(delay=900){clearTimeout(historySyncTimer);historySyncTimer=setTimeout(()=>loadRemote({automatic:true}),delay)}
    const databaseRequestWithoutAccessContext=databaseRequest;
    databaseRequest=function(action,payload={}){return databaseRequestWithoutAccessContext(action,{accessContext:'archive',...payload})};
    window.addEventListener('storage',event=>{if(['designDatabaseRefreshV1','designDatabaseRefreshPingV1','machiDatabaseRefreshV1'].includes(event.key))scheduleHistoryDatabaseSync()});
    const historySyncChannels=[];if('BroadcastChannel'in window){for(const name of ['design-database-refresh','machi-database-refresh-v1']){try{const channel=new BroadcastChannel(name);channel.addEventListener('message',()=>scheduleHistoryDatabaseSync());historySyncChannels.push(channel)}catch(error){}}}
    async function startArchiveAdmin(){
      await window.MachiAccess?.refresh({account:sessionValue('designRequestEditorAccount'),user:sessionValue('designRequestEditorUser'),group:sessionValue('designRequestEditorGroup'),department:sessionValue('designRequestEditorDepartment'),token:sessionValue('designRequestEditorToken')});
      const legacyAdmin=hasAdminAccess(),canView=legacyAdmin||Boolean(window.MachiAccess?.can('page.archive')),canEdit=legacyAdmin||Boolean(window.MachiAccess?.can('archive.edit'));
      if(!canView){$('accessGate').hidden=false;return}
      $('app').hidden=false;
      if(!canEdit){$('app').classList.add('archive-readonly');notice('目前為唯讀權限，可查看但不可修改歷史資料庫。')}
      await loadRemote();setInterval(()=>loadRemote({automatic:true}),AUTO_REFRESH_MS);
    }
    startArchiveAdmin();
    $('backButton').addEventListener('click',()=>{if(dirty&&!confirm('尚未儲存的變更會遺失，繼續嗎？'))return;if(window.opener&&!window.opener.closed){window.opener.focus();window.close();setTimeout(()=>location.href='design_dashboard.html',100)}else location.href='design_dashboard.html'});
    $('loadRemote').addEventListener('click',()=>loadRemote());$('openFile').addEventListener('click',openFile);$('saveFile').addEventListener('click',saveFile);$('fileInput').addEventListener('change',event=>{const file=event.target.files?.[0];if(file)readFile(file);event.target.value=''});
    $('searchInput').addEventListener('input',()=>{page=1;applyFilters()});['yearFilter','monthFilter','statusFilter','pageSize'].forEach(id=>$(id).addEventListener('change',()=>{page=1;applyFilters()}));$('addRow').addEventListener('click',()=>openEditor());
    $('tableHead').addEventListener('click',event=>{const th=event.target.closest('th[data-sort]');if(!th)return;const key=th.dataset.sort;if(sortKey===key)sortDirection=sortDirection==='asc'?'desc':'asc';else{sortKey=key;sortDirection=['案件編號','加權','開始日期','結束日期'].includes(key)?'desc':'asc'}page=1;applyFilters()});
    $('tableBody').addEventListener('click',event=>{const button=event.target.closest('[data-action]'),tr=event.target.closest('tr[data-index]');if(!button||!tr)return;const row=snapshot.rows[Number(tr.dataset.index)];if(button.dataset.action==='edit')openEditor(row);else deleteRow(row)});
    $('firstPage').addEventListener('click',()=>{page=1;renderTable()});$('prevPage').addEventListener('click',()=>{page=Math.max(1,page-1);renderTable()});$('nextPage').addEventListener('click',()=>{page++;renderTable()});$('lastPage').addEventListener('click',()=>{page=Math.max(1,Math.ceil(filteredRows.length/Number($('pageSize').value)));renderTable()});
    $('tableTab').addEventListener('click',()=>showPane('table'));$('rawTab').addEventListener('click',()=>showPane('raw'));$('formatJson').addEventListener('click',()=>{try{$('rawJson').value=`${JSON.stringify(JSON.parse($('rawJson').value),null,2)}\n`;notice('JSON 格式正常。','success')}catch(error){notice(`JSON 格式錯誤：${error.message}`,'error')}});$('applyJson').addEventListener('click',applyRaw);
    $('editForm').addEventListener('submit',saveEditor);$('modalClose').addEventListener('click',closeEditor);$('modalCancel').addEventListener('click',closeEditor);$('editModal').addEventListener('click',event=>{if(event.target===$('editModal'))closeEditor()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('editModal').hidden)closeEditor()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('app').hidden)loadRemote({automatic:true})});window.addEventListener('beforeunload',event=>{if(!dirty)return;event.preventDefault();event.returnValue=''})
  </script>
