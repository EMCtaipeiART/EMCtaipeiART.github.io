  <script>
    const SNAPSHOT_URL='data/database_archive.json';
    const API_URL='https://script.google.com/macros/s/AKfycbxNi2pdh70uzRyTF7Fo6OZ8MTROwHSZpqITwwHBs6UHLPhtSeZEHxkga5N_fPT4_qW15A/exec';
    const SPREADSHEET_ID='1cHxWBed715H0XufNhMOOk3hcZPTSpq5rA64-b5m8vWY';
    const DATABASE_GID='1244538986';
    const DEFAULT_COLUMNS=['案件編號','月份','客戶別','專案名稱','專案負責人','設計種類','階段','數量','開始日期','結束日期','設計負責人','項目細節','狀態','加權','填單時間','時間標記','繳交時間','使用平台','設計簡報說明','設計簡報連結','客戶素材說明','客戶素材連結','參考範例說明','參考範例連結','其他說明','其他連結'];
    const LONG_FIELDS=new Set(['項目細節','設計簡報說明','客戶素材說明','參考範例說明','其他說明']);
    const $=id=>document.getElementById(id);
    let snapshot=null,fileHandle=null,page=1,filteredRows=[],editingRow=null,editingIsNew=false,dirty=false,changeCount=0,baseGeneratedAt='';
    function sessionValue(key){return localStorage.getItem(key)||sessionStorage.getItem(key)||''}
    function taipeiParts(){return Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(part=>[part.type,part.value]))}
    function todayAdminToken(){const p=taipeiParts();return `local-admin:${p.year}${p.month}${p.day}`}
    function hasAdminAccess(){if(sessionValue('designRequestEditorLoggedOut')==='1')return false;const dashboardToken=sessionStorage.getItem('designDashboardAdminTokenV1')||'',group=sessionValue('designRequestEditorGroup'),token=sessionValue('designRequestEditorToken');if(dashboardToken===todayAdminToken())return true;if(group!=='管理者'||!token)return false;return !token.startsWith('local-admin:')||token===todayAdminToken()}
    function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    function notice(message,type=''){const el=$('notice');el.textContent=message;el.className=`notice ${type}`.trim()}
    function validate(data){if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('JSON 根節點必須是物件。');if(!Array.isArray(data.rows))throw new Error('JSON 缺少 rows 陣列。');if(data.rows.some(row=>!row||typeof row!=='object'||Array.isArray(row)))throw new Error('rows 內每筆資料必須是物件。');if(!Array.isArray(data.columns)||!data.columns.length)data.columns=[...DEFAULT_COLUMNS];data.columns=[...new Set([...data.columns,...data.rows.flatMap(row=>Object.keys(row))])].filter(Boolean);return data}
    function duplicateIds(){const seen=new Set(),duplicates=new Set();snapshot?.rows.forEach(row=>{const id=String(row['案件編號']||'').trim();if(!id)return;if(seen.has(id))duplicates.add(id);else seen.add(id)});return duplicates}
    function displayDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?['—','—']:[date.toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei'}),date.toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})]}
    function touch(amount=1){if(!snapshot)return;dirty=true;changeCount+=Math.max(1,Number(amount)||1);snapshot.rowCount=snapshot.rows.length;snapshot.generatedAt=new Date().toISOString();snapshot.manualEdit={baseGeneratedAt:baseGeneratedAt||snapshot.generatedAt,editedAt:snapshot.generatedAt,editor:sessionValue('designRequestEditorDisplayName')||sessionValue('designRequestEditorUser')||'管理者'};updateSummary()}
    function updateSummary(){if(!snapshot)return;const [date,time]=displayDate(snapshot.generatedAt),duplicates=duplicateIds();$('rowCount').textContent=snapshot.rows.length.toLocaleString('zh-TW');$('columnCount').textContent=`${snapshot.columns.length} 個欄位`;$('generatedDate').textContent=date;$('generatedTime').textContent=time;$('changeCount').textContent=changeCount.toLocaleString('zh-TW');$('changeSummary').textContent=dirty?'尚未儲存至檔案':'已與目前載入版本同步';$('validationState').textContent='格式正常';$('duplicateState').textContent=duplicates.size?`${duplicates.size} 個重複案件編號`:'無重複案件編號';$('dirtyState').textContent=dirty?'● 有尚未儲存的變更':'';$('saveFile').disabled=false;$('downloadFile').disabled=false}
    function setSnapshot(data,{name='database_archive.json',handle=null}={}){snapshot=validate(data);snapshot.rowCount=snapshot.rows.length;baseGeneratedAt=snapshot.generatedAt||'';fileHandle=handle;page=1;dirty=false;changeCount=0;$('fileName').textContent=name;updateStatusOptions();applyFilters();updateSummary();notice(`已載入 ${snapshot.rows.length.toLocaleString('zh-TW')} 筆資料。`,'success')}
    async function loadRemote(){if(dirty&&!confirm('尚未儲存的變更會被取代，繼續嗎？'))return;notice('正在讀取線上快照...');try{const response=await fetch(`${SNAPSHOT_URL}?v=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);setSnapshot(await response.json())}catch(error){notice(`線上快照讀取失敗：${error.message}`,'error')}}
    function slashDate(value){const text=String(value||'').trim();return /^\d{4}-\d{2}-\d{2}$/.test(text)?text.replaceAll('-','/'):text}
    function liveRowToSnapshot(row={}){const clean=value=>String(value??'').trim();return {'案件編號':clean(row.id),'月份':clean(row.month),'客戶別':clean(row.client),'專案名稱':clean(row.project),'專案負責人':clean(row.owner),'設計種類':clean(row.type),'階段':clean(row.stage),'數量':clean(row.qty),'開始日期':slashDate(row.start),'結束日期':slashDate(row.end),'設計負責人':clean(row.designer),'項目細節':clean(row.details),'狀態':clean(row.status),'加權':clean(row.weight),'填單時間':clean(row.submittedAt),'使用平台':clean(row.platforms),'設計簡報說明':clean(row.briefNote),'設計簡報連結':clean(row.briefUrl),'客戶素材說明':clean(row.assetNote),'客戶素材連結':clean(row.assetUrl),'參考範例說明':clean(row.referenceNote),'參考範例連結':clean(row.referenceUrl),'其他說明':clean(row.otherNote),'其他連結':clean(row.otherUrl)};}
    function liveComparable(row){return Object.fromEntries(['案件編號','月份','客戶別','專案名稱','專案負責人','設計種類','階段','數量','開始日期','結束日期','設計負責人','項目細節','狀態','加權','使用平台','設計簡報說明','設計簡報連結','客戶素材說明','客戶素材連結','參考範例說明','參考範例連結','其他說明','其他連結'].map(key=>[key,String(row[key]??'')]))}
    function apiJsonp(url,timeoutMs=60000){return new Promise((resolve,reject)=>{const callback=`archiveSync_${Date.now()}_${Math.random().toString(36).slice(2)}`,script=document.createElement('script'),timer=setTimeout(()=>finish(new Error('database 即時讀取逾時')),timeoutMs);function finish(error,data){clearTimeout(timer);script.remove();delete window[callback];error?reject(error):resolve(data)}window[callback]=data=>finish(null,data);script.onerror=()=>finish(new Error('database 即時讀取失敗'));script.src=`${url}&callback=${encodeURIComponent(callback)}`;document.head.appendChild(script)})}
    async function syncSheet(){
      if(!snapshot){await loadRemote();if(!snapshot)return}
      if(dirty&&!confirm('同步會以 database 的最新內容覆蓋同案件編號欄位，繼續嗎？'))return;
      const button=$('syncSheet'),original=button.innerHTML;
      button.disabled=true;button.textContent='同步中...';notice('正在讀取 database 即時資料...');
      try{
        const params=new URLSearchParams({action:'list',noCache:'true',targetSpreadsheetId:SPREADSHEET_ID,targetSheetName:'database',targetSheetId:DATABASE_GID,ts:String(Date.now())});
        const data=await apiJsonp(`${API_URL}?${params}`);
        if(!data.ok||!Array.isArray(data.rows))throw new Error(data.error||'database 未回傳 rows');
        const indexes=new Map();
        snapshot.rows.forEach((row,index)=>{const id=String(row['案件編號']||'').trim();if(!id)return;if(!indexes.has(id))indexes.set(id,[]);indexes.get(id).push(index)});
        const occurrences=new Map();
        let added=0,updated=0,unchanged=0;
        data.rows.map(liveRowToSnapshot).forEach(live=>{
          const id=live['案件編號'],occurrence=occurrences.get(id)||0,index=indexes.get(id)?.[occurrence];
          occurrences.set(id,occurrence+1);
          if(index===undefined){snapshot.rows.push(live);if(!indexes.has(id))indexes.set(id,[]);indexes.get(id).push(snapshot.rows.length-1);added++;return}
          const current=snapshot.rows[index];
          if(JSON.stringify(liveComparable(current))===JSON.stringify(liveComparable(live))){unchanged++;return}
          const merged={...current};
          Object.entries(live).forEach(([key,value])=>{
            if(key==='填單時間'&&String(current[key]||'').length>String(value||'').length)return;
            if(value!==''||key==='項目細節'||key==='加權')merged[key]=value;
          });
          snapshot.rows[index]=merged;updated++;
        });
        snapshot.sources=snapshot.sources||{};
        snapshot.sources.database={...(snapshot.sources.database||{}),sheetName:'database',gid:DATABASE_GID,rowCount:data.rows.length,fetchedAt:new Date().toISOString(),transport:'apps-script-no-cache'};
        snapshot.mergeSummary={added,updated,unchanged,addedCaseIds:added?data.rows.slice(-added).map(row=>String(row.id||'')).filter(Boolean):[]};
        if(added||updated){touch(added+updated);updateStatusOptions();applyFilters();notice(`database 同步完成：新增 ${added} 筆、更新 ${updated} 筆，請按「儲存至檔案」寫入 JSON。`,'success')}
        else notice(`database 同步完成：${data.rows.length} 筆，與 JSON 沒有差異。`,'success');
      }catch(error){notice(`database 同步失敗：${error.message}`,'error')}
      finally{button.disabled=false;button.innerHTML=original}
    }
    async function readFile(file,handle=null){try{setSnapshot(JSON.parse(await file.text()),{name:file.name,handle})}catch(error){notice(`JSON 開啟失敗：${error.message}`,'error')}}
    async function openFile(){if(dirty&&!confirm('尚未儲存的變更會被取代，繼續嗎？'))return;try{if('showOpenFilePicker'in window){const [handle]=await showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}],multiple:false});await readFile(await handle.getFile(),handle)}else $('fileInput').click()}catch(error){if(error.name!=='AbortError')notice(`檔案開啟失敗：${error.message}`,'error')}}
    function serialize(){snapshot.rowCount=snapshot.rows.length;return `${JSON.stringify(snapshot,null,2)}\n`}
    async function saveFile(){if(!snapshot)return;try{if(!fileHandle&&'showSaveFilePicker'in window)fileHandle=await showSaveFilePicker({suggestedName:'database_archive.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});if(!fileHandle){downloadFile();notice('瀏覽器不支援直接覆寫，已下載 JSON 副本。','success');return}const writable=await fileHandle.createWritable();await writable.write(serialize());await writable.close();dirty=false;changeCount=0;$('fileName').textContent=fileHandle.name;updateSummary();notice(`已儲存至 ${fileHandle.name}。`,'success')}catch(error){if(error.name!=='AbortError')notice(`儲存失敗：${error.message}`,'error')}}
    function downloadFile(){if(!snapshot)return;const blob=new Blob([serialize()],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='database_archive.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    function updateStatusOptions(){const current=$('statusFilter').value,statuses=[...new Set(snapshot.rows.map(row=>String(row['狀態']||row['案件狀態']||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));$('statusFilter').innerHTML='<option value="">全部狀態</option>'+statuses.map(status=>`<option value="${esc(status)}">${esc(status)}</option>`).join('');if(statuses.includes(current))$('statusFilter').value=current}
    function applyFilters(){if(!snapshot)return;const query=$('searchInput').value.trim().toLocaleLowerCase('zh-Hant'),status=$('statusFilter').value;filteredRows=snapshot.rows.filter(row=>(!status&&true||String(row['狀態']||row['案件狀態']||'')===status)&&(!query||Object.values(row).some(value=>String(value??'').toLocaleLowerCase('zh-Hant').includes(query))));const pages=Math.max(1,Math.ceil(filteredRows.length/Number($('pageSize').value)));page=Math.min(page,pages);renderTable()}
    function renderTable(){const size=Number($('pageSize').value),pages=Math.max(1,Math.ceil(filteredRows.length/size)),start=(page-1)*size,rows=filteredRows.slice(start,start+size);$('tableBody').innerHTML=rows.length?rows.map(row=>`<tr data-index="${snapshot.rows.indexOf(row)}"><td>${esc(row['案件編號'])}</td><td>${esc(row['客戶別'])}</td><td class="project" title="${esc(row['專案名稱'])}">${esc(row['專案名稱'])}</td><td>${esc(row['專案負責人'])}</td><td>${esc(row['設計種類']||row['設計類型']||row['設計總類'])}</td><td>${esc(row['階段'])}</td><td>${esc(row['設計負責人'])}</td><td>${esc(row['狀態']||row['案件狀態'])}</td><td>${esc(row['開始日期'])}</td><td>${esc(row['結束日期'])}</td><td><div class="row-actions"><button type="button" data-action="edit">編輯</button><button class="delete" type="button" data-action="delete">刪除</button></div></td></tr>`).join(''):'<tr><td colspan="11">沒有符合條件的資料</td></tr>';$('resultCount').textContent=`${filteredRows.length.toLocaleString('zh-TW')} 筆`;$('pageRange').textContent=filteredRows.length?`顯示 ${start+1}–${Math.min(start+size,filteredRows.length)}，共 ${filteredRows.length.toLocaleString('zh-TW')} 筆`:'共 0 筆';$('pageLabel').textContent=`${page} / ${pages}`;$('firstPage').disabled=$('prevPage').disabled=page<=1;$('lastPage').disabled=$('nextPage').disabled=page>=pages}
    function openEditor(row=null){editingIsNew=!row;editingRow=row||Object.fromEntries(snapshot.columns.map(column=>[column,'']));$('modalTitle').textContent=editingIsNew?'新增封存資料':'編輯封存資料';$('editFields').innerHTML=snapshot.columns.map(column=>{const value=editingRow[column]??'',wide=LONG_FIELDS.has(column)?' wide':'';return `<label class="field${wide}">${esc(column)}${LONG_FIELDS.has(column)?`<textarea name="${esc(column)}">${esc(value)}</textarea>`:`<input name="${esc(column)}" value="${esc(value)}">`}</label>`}).join('');$('editModal').hidden=false;setTimeout(()=>$('editFields').querySelector('input,textarea')?.focus(),20)}
    function closeEditor(){$('editModal').hidden=true;editingRow=null;editingIsNew=false}
    function saveEditor(event){event.preventDefault();const form=new FormData(event.currentTarget),updated={};snapshot.columns.forEach(column=>updated[column]=String(form.get(column)||'').trim());if(editingIsNew)snapshot.rows.unshift(updated);else Object.assign(editingRow,updated);closeEditor();touch();updateStatusOptions();applyFilters();notice(editingIsNew?'已新增資料。':'已更新資料。','success')}
    function deleteRow(row){const label=row['案件編號']||row['專案名稱']||'這筆資料';if(!confirm(`確定刪除「${label}」？`))return;const index=snapshot.rows.indexOf(row);if(index>=0)snapshot.rows.splice(index,1);touch();updateStatusOptions();applyFilters();notice('已刪除資料。','success')}
    function showPane(name){const raw=name==='raw';$('tablePane').hidden=raw;$('rawPane').hidden=!raw;$('tableTab').classList.toggle('active',!raw);$('rawTab').classList.toggle('active',raw);$('tableTab').setAttribute('aria-selected',String(!raw));$('rawTab').setAttribute('aria-selected',String(raw));if(raw&&snapshot)$('rawJson').value=serialize()}
    function applyRaw(){try{const parsed=validate(JSON.parse($('rawJson').value));snapshot=parsed;baseGeneratedAt=baseGeneratedAt||snapshot.generatedAt||'';touch();updateStatusOptions();applyFilters();$('rawJson').value=serialize();notice('JSON 已套用。','success')}catch(error){notice(`JSON 驗證失敗：${error.message}`,'error')}}
    if(!hasAdminAccess())$('accessGate').hidden=false;else{$('app').hidden=false;loadRemote()}
    $('backButton').addEventListener('click',()=>{if(dirty&&!confirm('尚未儲存的變更會遺失，繼續嗎？'))return;location.href='index.html'});
    $('loadRemote').addEventListener('click',loadRemote);$('syncSheet').addEventListener('click',syncSheet);$('openFile').addEventListener('click',openFile);$('saveFile').addEventListener('click',saveFile);$('downloadFile').addEventListener('click',downloadFile);$('fileInput').addEventListener('change',event=>{const file=event.target.files?.[0];if(file)readFile(file);event.target.value=''});
    $('searchInput').addEventListener('input',()=>{page=1;applyFilters()});$('statusFilter').addEventListener('change',()=>{page=1;applyFilters()});$('pageSize').addEventListener('change',()=>{page=1;applyFilters()});$('addRow').addEventListener('click',()=>openEditor());
    $('tableBody').addEventListener('click',event=>{const button=event.target.closest('[data-action]'),tr=event.target.closest('tr[data-index]');if(!button||!tr)return;const row=snapshot.rows[Number(tr.dataset.index)];if(button.dataset.action==='edit')openEditor(row);else deleteRow(row)});
    $('firstPage').addEventListener('click',()=>{page=1;renderTable()});$('prevPage').addEventListener('click',()=>{page=Math.max(1,page-1);renderTable()});$('nextPage').addEventListener('click',()=>{page++;renderTable()});$('lastPage').addEventListener('click',()=>{page=Math.max(1,Math.ceil(filteredRows.length/Number($('pageSize').value)));renderTable()});
    $('tableTab').addEventListener('click',()=>showPane('table'));$('rawTab').addEventListener('click',()=>showPane('raw'));$('formatJson').addEventListener('click',()=>{try{$('rawJson').value=`${JSON.stringify(JSON.parse($('rawJson').value),null,2)}\n`;notice('JSON 格式正常。','success')}catch(error){notice(`JSON 格式錯誤：${error.message}`,'error')}});$('applyJson').addEventListener('click',applyRaw);
    $('editForm').addEventListener('submit',saveEditor);$('modalClose').addEventListener('click',closeEditor);$('modalCancel').addEventListener('click',closeEditor);$('editModal').addEventListener('click',event=>{if(event.target===$('editModal'))closeEditor()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('editModal').hidden)closeEditor()});window.addEventListener('beforeunload',event=>{if(!dirty)return;event.preventDefault();event.returnValue=''})
  </script>
</body>
