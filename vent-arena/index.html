<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f6"><meta name="description" content="EMC 出氣擂台：十一位角色、辦公室道具與連擊挑戰，獨立試玩版。"><title>出氣擂台 · EMC ARCADE</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23bdfba5'/%3E%3Ctext x='8' y='47' font-size='45'%3E⚡%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="arena.css?v=20261018c"><link rel="stylesheet" href="combat.css?v=20261018c"><link rel="stylesheet" href="arcade.css?v=20261018c"><link rel="stylesheet" href="daylight.css?v=20261018c"><link rel="stylesheet" href="emc-theme.css?v=20261018c"><link rel="stylesheet" href="portrait-arena.css?v=20261018c"><link rel="stylesheet" href="cabinet.css?v=20261018c"><link rel="stylesheet" href="dark.css?v=20261018d"><link rel="stylesheet" href="overrides.css?v=20261018j"><link rel="stylesheet" href="duel.css?v=20261019g"></head>
<body>
<main><div class="arena-title"><h1>出氣擂台</h1><a class="arena-home" href="../EMC-ART-Pixel-Office/dist/">返回元宇宙 ↗</a></div>
<div class="game-layout"><aside class="panel roster"><div class="panel-heading"><h2>上場名單</h2></div><div class="role-tabs" role="group" aria-label="選擇要更換的角色"><button id="role-player" aria-pressed="false">我的角色</button><button id="role-target" aria-pressed="true">陪練角色</button></div><div id="roster"></div></aside>
<section class="arena-section"><div class="arena" id="arena"><div class="opponent-hud"><span id="target-name">Noise</span><div class="health"><div id="health-fill"></div><span id="hp-number">300 / 300</span></div><span id="injury-status" class="injury-status">狀態完好</span></div><div class="rage-panel"><div><span>怒氣能量 <b id="rage-text">0%</b></span><div class="rage"><div id="rage-fill"></div></div></div><button id="ultimate" disabled><span class="ultimate-label">✦ 下班衝擊波</span></button></div><div class="self-hud"><span id="self-name"></span><div class="health"><div id="self-fill"></div><span id="self-hp"></span></div></div><button id="duel-block" class="duel-block" type="button"><span aria-hidden="true">🛡</span>格擋</button><canvas id="stage" tabindex="0" role="button" aria-label="擂台：點擊或按住連打，空白鍵出拳"></canvas><div class="live-score"><span>分數</span><strong id="hud-score">0</strong></div><div class="bubble" id="bubble">今天也辛苦了，來場友誼賽！</div><div class="combo" id="combo" aria-hidden="true"><strong>0</strong><span><svg viewBox="0 0 160 42" aria-hidden="true"><defs><linearGradient id="combo-ink" x2="0" y2="1"><stop stop-color="#fffdf0"/><stop offset="1" stop-color="#ffe95a"/></linearGradient></defs><text x="80" y="32" text-anchor="middle" fill="url(#combo-ink)" stroke="#111111" stroke-width="6" paint-order="stroke fill" font-family="Impact, Arial Black, sans-serif" font-style="italic" font-weight="900" font-size="32" letter-spacing="-1">COMBO!</text></svg></span></div><div id="stage-message" aria-live="polite"></div><div class="fighter-label me-label"><b id="player-name">Machi</b></div><div class="fighter-label foe-label"><b id="foe-name">Noise</b></div><div class="floor-hint">點擊擂台 / 按住連打 <span>SPACE</span></div></div><div class="arsenal"><div class="actions-heading"><h2>攻擊道具</h2></div><div id="weapons"></div></div></section>
<aside class="panel settings"><div class="panel-heading"><h2>本局成績</h2><button id="sound" aria-pressed="false" title="音效開關">♫ 音效關</button></div><div class="stats"><div><span>消氣分數</span><strong id="score">0</strong></div><div><span>擊倒次數</span><strong id="kos">0</strong></div><div><span id="record-title">最高分</span><strong id="best">0</strong></div></div><h2 class="mode-title">遊戲模式</h2><div class="mode-buttons" role="group" aria-label="遊戲模式"><button data-mode="free" aria-pressed="true"><span>∞</span><b>自由出氣<small>不計時，照自己的節奏</small></b></button><button data-mode="timed" aria-pressed="false"><span>◷</span><b>60 秒挑戰<small>看看能打出多少連擊</small></b></button><button id="duel-open" aria-pressed="false"><span>⚔</span><b>一對一對戰<small>邀請同事線上對決</small></b></button></div><div class="challenge"><p id="mode-label">自由出氣</p><strong id="timer">∞</strong><span id="timer-hint">喘口氣，慢慢來也可以。</span><button id="start">重新開局 ↗</button></div><div class="scene-switch"><button id="change-scene" title="切換場景">▧ 換場景</button><button id="heal" title="回滿陪練血量，分數保留">↻ 回滿狀態</button></div><button id="leaderboard-open">查看排行榜</button></aside></div></main>
<dialog id="leaderboard"><h2>排行榜</h2><p>前十名紀錄</p><ol id="leaderboard-list"></ol><button id="leaderboard-close">關閉</button></dialog><dialog id="result"><p class="eyebrow">TIME'S UP. STRESS DOWN.</p><h2>下班快樂！</h2><p>這一回合，你把壞心情打散了。</p><strong id="result-score">0</strong><span>消氣分數</span><div id="result-stats"></div><button id="again">再挑戰一回 ↗</button><button id="close-result">留在擂台</button></dialog><div id="toast" role="status" aria-live="polite"></div><audio id="background-music" src="assets/toy-piano-loop.mp3" loop preload="auto"></audio><script src="weapon-art.js?v=fist-20261018" defer></script><script src="combat-fx.js?v=20261018d" defer></script><script src="scenes.js?v=20261018c" defer></script><script src="arena.js?v=20261019k" defer></script><script src="duel.js?v=20261019o" defer></script></body></html>
