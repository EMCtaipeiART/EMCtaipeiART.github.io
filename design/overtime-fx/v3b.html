<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3b · 最後的聚光（效能版）</title><style>*{box-sizing:border-box}body{margin:0;background:#090E1B;color:#E8F4FF;font:15px/1.7 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:40px 24px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #293247;padding-bottom:18px}small{color:#A59AFF;letter-spacing:.16em}nav{display:flex;gap:20px}a{color:#94A4BF;text-decoration:none}a[aria-current]{color:#E8F4FF;border-bottom:2px solid #9565FF}h1{font-size:32px;margin:24px 0 8px}p{color:#A4B2CA;margin:0 0 24px}canvas{display:block;width:100%;height:auto;border:1px solid #293247;image-rendering:pixelated}.labels{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:18px 0;color:#A4B2CA;font-size:12px}.labels span{display:block;font-size:11px;color:#7587A5}footer{border-top:1px solid #293247;border-bottom:0;padding-top:18px;color:#7587A5;font-size:12px}button{background:transparent;color:#B9DEFF;border:1px solid #465174;padding:8px 14px;cursor:pointer}@media(max-width:600px){main{padding:24px 12px}small{font-size:9px}h1{font-size:26px}.labels{font-size:10px}}header,footer{flex-wrap:wrap}body.light{background:#fff;color:#28334c}body.light p,body.light .labels,body.light button,body.light a[aria-current]{color:#55627b}</style><main><header><small>AFTER HOURS / OVERTIME FX · 03B</small><nav aria-label="加班特效預覽"><a href="v1.html" >V1</a><a href="v2.html" >V2</a><a href="v3.html">V3</a><a href="v3b.html" aria-current="page">V3b</a></nav></header><h1>V3b · 最後的聚光（效能版）</h1><p>強烈舞台聚光與明顯暗場，三簇藍紫鬼火緩慢繞身公轉。</p><canvas id="scene" width="1080" height="480" aria-label="加班特效預覽"></canvas><div class="labels"><div>矮身 · 方頭 · 淺膚<span>H = 116 px</span></div><div>標準 · 圓頭 · 中膚<span>H = 142 px</span></div><div>高身 · 寬頭 · 深膚<span>H = 170 px</span></div></div><footer><div>冷白 × 藍紫鬼火<br>腳底錨點 · 全身冷調 · 10 FPS</div><button id="background" type="button" aria-pressed="false">背景：深色／白色（目前深色）</button><button id="pause" type="button">暫停動畫</button></footer><p>三人特效平均耗時：<output id="performance">0.000</output> ms（最近 <span id="samples">0</span>／60 次）</p></main><script>
function drawOvertimeFx(ctx, feetX, feetY, H = 142, t = 0, sprite, opts = { light: false }) {
 const light=!!opts.light,B=Math.max(8,Math.round(H/8)*8),u=t/1000;
 const assets=drawOvertimeFx._assets||(drawOvertimeFx._assets=new Map()),key=B+':'+light;
 let f=assets.get(key);
 if(!f){
  const x=Math.ceil(B*1.1),y=Math.ceil(B*1.65),bottom=Math.ceil(B*.55);
  function surface(){const c=document.createElement('canvas');c.width=2*x;c.height=y+bottom;const g=c.getContext('2d');g.translate(x,y);return [c,g]}
  const [base,g]=surface(),[beam,q]=surface();
  const dark=g.createRadialGradient(0,-B*.55,B*.25,0,-B*.55,B*1.05);dark.addColorStop(0,'rgba(40,35,90,0)');dark.addColorStop(.72,light?'rgba(40,35,90,.22)':'rgba(40,35,90,.55)');dark.addColorStop(1,'rgba(40,35,90,0)');g.fillStyle=dark;g.fillRect(-x,-y,2*x,y+bottom);
  g.save();g.scale(1,.24);const pool=g.createRadialGradient(0,0,0,0,0,B*.67);pool.addColorStop(0,light?'rgba(150,180,255,.32)':'rgba(232,244,255,.532)');pool.addColorStop(.65,'rgba(197,219,255,.152)');pool.addColorStop(1,'rgba(197,219,255,0)');g.fillStyle=pool;g.fillRect(-B*.7,-B*.7,B*1.4,B*1.4);g.restore();
  g.strokeStyle='rgba(120,110,255,.55)';g.lineWidth=B/H;g.beginPath();g.ellipse(0,0,B*.67,B*.1608,0,0,Math.PI*2);g.stroke();
  const cone=q.createLinearGradient(0,-B*1.62,0,0);cone.addColorStop(0,light?'rgba(150,180,255,.08)':'rgba(232,244,255,.095)');cone.addColorStop(.8,light?'rgba(150,180,255,.22)':'rgba(232,244,255,.38)');cone.addColorStop(1,light?'rgba(150,180,255,.12)':'rgba(232,244,255,.152)');q.fillStyle=cone;q.strokeStyle='rgba(120,110,255,.55)';q.lineWidth=B/H;q.beginPath();q.moveTo(-B*.05,-B*1.62);q.lineTo(B*.05,-B*1.62);q.lineTo(B*.64,0);q.lineTo(-B*.64,0);q.closePath();q.fill();q.stroke();
  const fire=document.createElement('canvas'),size=B*.125,step=size/7,pad=Math.ceil(size*2);fire.width=fire.height=pad*2;const fg=fire.getContext('2d');fg.translate(pad,pad);const glow=fg.createRadialGradient(0,-size*.4,0,0,-size*.4,size*1.5);glow.addColorStop(0,'rgba(125,92,255,.32)');glow.addColorStop(1,'rgba(125,92,255,0)');fg.fillStyle=glow;fg.fillRect(-pad,-pad,2*pad,2*pad);
  ['0001000','0011000','0011100','0111110','1111110','1111111','0111110','0011100'].forEach((row,j)=>{for(let i=0;i<7;i++)if(row[i]==='1'){fg.fillStyle=j>3&&i>1&&i<5?'#B9DEFF':i<3?'#586BFF':'#9565FF';fg.fillRect(Math.round((i-3)*step),Math.round((j-7)*step),Math.ceil(step),Math.ceil(step))}});
  f={base,beam,fire,x,y,pad};assets.set(key,f);
 }
 const r=H/B,alpha=ctx.globalAlpha;ctx.save();ctx.translate(feetX,feetY);ctx.imageSmoothingEnabled=false;
 ctx.drawImage(f.base,-f.x*r,-f.y*r,f.base.width*r,f.base.height*r);ctx.globalAlpha=alpha*(.97+.03*Math.sin(u));ctx.drawImage(f.beam,-f.x*r,-f.y*r,f.beam.width*r,f.beam.height*r);ctx.globalAlpha=alpha;
 function layer(back){for(let i=0;i<3;i++){const angle=u*.3+i*Math.PI*2/3;if((Math.sin(angle)<0)!==back)continue;ctx.globalAlpha=alpha*(.68+.32*(.5+.5*Math.sin(u*1.8+i)));ctx.drawImage(f.fire,Math.cos(angle)*H*.48-f.pad*r,(-.48+Math.sin(angle)*.15)*H-f.pad*r,f.fire.width*r,f.fire.height*r)}ctx.globalAlpha=alpha}
 layer(true);
 if(sprite&&sprite.width>0&&sprite.height>0){const cache=drawOvertimeFx._cache||(drawOvertimeFx._cache=new WeakMap());let toned=cache.get(sprite);if(!toned||toned.width!==sprite.width||toned.height!==sprite.height){toned=document.createElement('canvas');toned.width=sprite.width;toned.height=sprite.height;const tc=toned.getContext('2d');tc.drawImage(sprite,0,0);tc.globalCompositeOperation='source-atop';tc.fillStyle='rgba(120,140,180,.32)';tc.fillRect(0,0,toned.width,toned.height);tc.fillStyle='rgba(35,45,75,.12)';tc.fillRect(0,0,toned.width,toned.height);cache.set(sprite,toned)}const w=H*sprite.width/sprite.height;ctx.drawImage(toned,-w/2,-H,w,H)}
 layer(false);ctx.restore();
}

const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
function sprite(k){const c=document.createElement('canvas');c.width=48;c.height=76;const g=c.getContext('2d'),skin=['#F0C9AD','#B67E60','#724E43'][k],shirt=['#668995','#807599','#6F829C'][k];function r(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
 r(14,65,8,9,'#303C55');r(26,65,8,9,'#303C55');r(11,73,12,3,'#101927');r(26,73,12,3,'#101927');r(11,34,26,31,shirt);r(7,39,5,22,skin);r(37,39,5,22,skin);r(22,30,5,7,skin);
 if(k===0){r(13,6,22,25,skin);r(12,4,24,7,'#253042');r(12,10,4,12,'#253042')}
 if(k===1){r(14,4,20,29,skin);r(10,10,28,17,skin);r(14,2,20,7,'#242239');r(10,7,5,12,'#242239')}
 if(k===2){r(8,11,32,19,skin);r(12,6,24,25,skin);r(8,7,32,7,'#343441');r(7,12,5,15,'#343441')}
 r(17,19,3,3,'#253042');r(29,19,3,3,'#253042');r(22,27,5,2,'#7E6469');return c;}
const actors=[{x:180,h:116,s:sprite(0)},{x:540,h:142,s:sprite(1)},{x:900,h:170,s:sprite(2)}];
let light=false;const durations=[];
function render(t){ctx.fillStyle=light?'#ffffff':'#141E30';ctx.fillRect(0,0,1080,480);ctx.strokeStyle=light?'#edf0f5':'#202C41';for(let y=260;y<480;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1080,y);ctx.stroke()}for(let x=-240;x<1400;x+=120){ctx.beginPath();ctx.moveTo(540+(x-540)*.55,220);ctx.lineTo(x,480);ctx.stroke()}
 actors.forEach(a=>{if(light){ctx.strokeStyle='#cdd2db';ctx.lineWidth=1;[[a.x-100,142,200,12],[a.x-87,154,8,91],[a.x+79,154,8,91],[a.x-35,83,70,49],[a.x-30,88,60,39],[a.x-3,132,6,10],[a.x-30,236,60,46],[a.x-24,282,5,34],[a.x+19,282,5,34]].forEach(r=>ctx.strokeRect(...r));return;}ctx.fillStyle='#202C40';ctx.fillRect(a.x-100,142,200,12);ctx.fillStyle='#101827';ctx.fillRect(a.x-87,154,8,91);ctx.fillRect(a.x+79,154,8,91);ctx.fillStyle='#34425A';ctx.fillRect(a.x-35,83,70,49);ctx.fillStyle='#18273C';ctx.fillRect(a.x-30,88,60,39);ctx.fillStyle='#34425A';ctx.fillRect(a.x-3,132,6,10)});const begin=performance.now();actors.forEach(a=>drawOvertimeFx(ctx,a.x,374,a.h,t,a.s,{light}));durations.push(performance.now()-begin);if(durations.length>60)durations.shift();document.getElementById('performance').textContent=(durations.reduce((a,b)=>a+b,0)/durations.length).toFixed(3);document.getElementById('samples').textContent=durations.length;}
let previous=-Infinity,paused=false,elapsed=0,last=null;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'繼續動畫':'暫停動畫'};
document.getElementById('background').onclick=()=>{light=!light;document.body.classList.toggle('light',light);const button=document.getElementById('background');button.setAttribute('aria-pressed',String(light));button.textContent='背景：深色／白色（目前'+(light?'白色':'深色')+'）';durations.length=0;render(elapsed)};
function tick(now){requestAnimationFrame(tick);if(last!==null&&!paused)elapsed+=now-last;last=now;if(now-previous<100)return;previous=now;if(!paused)render(elapsed)}render(0);requestAnimationFrame(tick);
</script></html>
