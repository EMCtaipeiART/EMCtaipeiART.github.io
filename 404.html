<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>連結轉址中</title>
  <style>
    :root{font-family:Arial,"Noto Sans TC",sans-serif;color:#24302a;background:#f5f8f6}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(420px,100%);padding:24px;border:1px solid #dce5e0;border-radius:8px;background:#fff;text-align:center;box-shadow:0 12px 30px rgba(16,24,40,.09)}
    h1{margin:0 0 10px;font-size:20px}p{margin:0;color:#66736d;font-size:14px;line-height:1.6}
    a{color:#08714d;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1 id="title">連結轉址中</h1>
    <p id="message">正在開啟補充資料…</p>
  </main>
  <script>
    (() => {
      const apiUrl = 'https://script.google.com/macros/s/AKfycbxNi2pdh70uzRyTF7Fo6OZ8MTROwHSZpqITwwHBs6UHLPhtSeZEHxkga5N_fPT4_qW15A/exec';
      const spreadsheetId = '1cHxWBed715H0XufNhMOOk3hcZPTSpq5rA64-b5m8vWY';
      const linkSheetName = '補充資料連結';
      const match = location.pathname.match(/^\/([a-d])\/(\d{8})\/?$/i);
      const title = document.querySelector('#title');
      const message = document.querySelector('#message');
      const fail = text => {
        title.textContent = '無法開啟連結';
        message.innerHTML = `${text}<br><a href="/">回到設計需求系統</a>`;
      };
      if (!match) {
        fail('找不到這個頁面。');
        return;
      }

      const slot = match[1].toLowerCase();
      const id = match[2];
      const cacheKey = `supplementLink:${slot}:${id}`;
      let settled = false;
      let failures = 0;
      let overallTimer = null;
      const scripts = [];
      const callbacks = [];
      const cleanup = () => {
        scripts.forEach(script => script.remove());
        callbacks.forEach(callback => delete window[callback]);
      };
      const redirect = url => {
        if (settled || !/^https?:\/\//i.test(url || '')) return false;
        settled = true;
        clearTimeout(overallTimer);
        try { localStorage.setItem(cacheKey, JSON.stringify({ url, expires: Date.now() + 600000 })); } catch (error) {}
        cleanup();
        location.replace(url);
        return true;
      };
      const rejectSource = () => {
        failures += 1;
        if (!settled && failures >= 2) {
          clearTimeout(overallTimer);
          cleanup();
          fail('找不到對應的補充資料連結。');
        }
      };
      const addJsonp = (src, callback, onData) => {
        const script = document.createElement('script');
        callbacks.push(callback);
        scripts.push(script);
        window[callback] = data => {
          delete window[callback];
          script.remove();
          onData(data);
        };
        script.onerror = rejectSource;
        script.src = src;
        document.head.appendChild(script);
      };

      try {
        const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
        if (cached && cached.expires > Date.now() && redirect(cached.url)) return;
      } catch (error) {}

      overallTimer = setTimeout(() => {
        if (settled) return;
        settled = true;
        cleanup();
        fail('連結查詢逾時，請稍後再試。');
      }, 8000);
      const gvizCallback = `__supplementGviz_${Date.now()}`;
      const apiCallback = `__supplementApi_${Date.now()}`;
      const column = String.fromCharCode(66 + slot.charCodeAt(0) - 97);
      const query = `select ${column} where A = '${id}' limit 1`;
      const gvizBase = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?sheet=${encodeURIComponent(linkSheetName)}&tq=${encodeURIComponent(query)}`;
      const tqx = encodeURIComponent(`out:json;responseHandler:${gvizCallback}`);
      addJsonp(`${gvizBase}&tqx=${tqx}&ts=${Date.now()}`, gvizCallback, data => {
        const cell = data && data.table && data.table.rows && data.table.rows[0] && data.table.rows[0].c && data.table.rows[0].c[0];
        if (!redirect(cell && (cell.f || cell.v))) rejectSource();
      });
      addJsonp(`${apiUrl}?action=resolveSupplementLink&id=${encodeURIComponent(id)}&slot=${slot}&callback=${apiCallback}`, apiCallback, data => {
        if (!redirect(data && data.ok && data.url)) rejectSource();
      });
    })();
  </script>
</body>
</html>
