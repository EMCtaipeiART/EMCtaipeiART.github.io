<!doctype html>
<!-- LAST_MODIFIED: 2026-10-06 Asia/Taipei | build: 20261006-short-link-removed-1 -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="assets/EMC_design_logo.ico">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="app-version" content="20261006-short-link-removed-1">
  <title>EMC 找不到頁面</title>
  <style>
    :root{font-family:Arial,"Noto Sans TC",sans-serif;color:#1d2924;background:#f3f6f4;letter-spacing:0}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#edf5f0 0,#f7f8f7 55%,#eef1f0 100%)}
    main{width:min(560px,100%);padding:32px;border:1px solid #d9e2dd;border-radius:8px;background:#fff;box-shadow:0 18px 46px rgba(22,39,31,.11)}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;color:#08714d;font-size:13px;font-weight:900}
    .brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:7px;background:#08714d;color:#fff;font-size:12px}
    h1{margin:0 0 8px;font-size:28px;line-height:1.2;color:#17211d}
    .lead{margin:0 0 24px;color:#66736d;font-size:14px;line-height:1.65}
    form{display:grid;gap:10px}form[hidden]{display:none!important}
    label{font-size:13px;font-weight:800;color:#3e5048}
    .input-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
    input{width:100%;min-width:0;height:46px;border:1px solid #cbd7d1;border-radius:7px;padding:0 13px;background:#fff;color:#17211d;font:inherit;font-size:15px;outline:none}
    input:focus{border-color:#0f8f61;box-shadow:0 0 0 3px rgba(15,143,97,.13)}
    button{min-height:46px;border:0;border-radius:7px;padding:0 18px;background:#08714d;color:#fff;font:inherit;font-weight:900;cursor:pointer}
    button:hover{background:#075d40}button:disabled{cursor:wait;opacity:.62}
    .status{min-height:22px;margin:8px 0 0;color:#66736d;font-size:13px;line-height:1.55}
    .status.error{color:#b42318}
    .result{margin-top:18px;padding-top:18px;border-top:1px solid #e4ebe7}
    .result[hidden]{display:none}
    .result-label{margin:0 0 8px;color:#66736d;font-size:12px;font-weight:800}
    .result-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
    .short-url{display:flex;align-items:center;min-height:44px;overflow:hidden;border:1px solid #bcd8ca;border-radius:7px;padding:0 12px;background:#f1faf5;color:#075d40;font-weight:900;text-decoration:none;text-overflow:ellipsis;white-space:nowrap}
    .copy-button{min-height:44px;background:#e8efeb;color:#274339;border:1px solid #d1ded7}
    .copy-button:hover{background:#dce9e2}
    .redirect{text-align:center}
    .redirect .spinner{width:34px;height:34px;margin:2px auto 18px;border:3px solid #dce9e2;border-top-color:#08714d;border-radius:50%;animation:spin .8s linear infinite}
    .redirect h1{font-size:22px}.redirect p{margin:0;color:#66736d;font-size:14px;line-height:1.6}
    .home-link{display:inline-block;margin-top:14px;color:#08714d;font-weight:800}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:520px){body{padding:16px}main{padding:24px 18px}.input-row,.result-row{grid-template-columns:1fr}h1{font-size:24px}button{width:100%}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <main id="notfound">
    <div class="brand"><span class="brand-mark">EMC</span><span>EMC 設計需求系統</span></div>
    <h1>找不到這個頁面</h1>
    <p class="lead">短網址功能已經移除。請改用原始網址，或回到<a class="home-link" href="/">設計需求系統</a>。</p>
  </main>
  <main class="redirect" id="redirector" hidden>
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <h1 id="redirectTitle">連結轉址中</h1>
    <p id="redirectMessage">正在開啟目的頁面…</p>
  </main>
  <script>
    /* 只保留舊的補充資料連結（/a/12345678 這種）轉址；其他路徑一律顯示找不到頁面。 */
    (() => {
      const apiUrl = 'https://machi-design-api.machi-chen.workers.dev/api';
      const legacyMatch = location.pathname.match(/^\/([a-d])\/(\d{8})\/?$/i);
      if (!legacyMatch) return;
      const slot = legacyMatch[1].toLowerCase(), id = legacyMatch[2];
      document.querySelector('#notfound').hidden = true;
      document.querySelector('#redirector').hidden = false;
      const fail = text => {
        document.querySelector('#spinner').hidden = true;
        document.querySelector('#redirectTitle').textContent = '無法開啟連結';
        document.querySelector('#redirectMessage').textContent = text;
      };
      fetch(apiUrl, {
        method: 'POST', credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ action: 'resolveSupplementLink', id, slot })
      }).then(r => r.json()).then(data => {
        if (data && data.ok && /^https?:\/\//i.test(data.url || '')) location.replace(data.url);
        else fail((data && data.error) || '找不到對應的補充資料連結。');
      }).catch(() => fail('連線失敗，請稍後再試。'));
    })();
  </script>
</body>
</html>
