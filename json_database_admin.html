<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="app-version" content="20260811-account-settings-10">
  <title>資料庫後台｜EMC 設計部</title>
  <style>
    :root{--bg:#f4f6f5;--panel:#fff;--soft:#f7f9f8;--ink:#1c2521;--muted:#707b76;--line:#e0e6e2;--green:#0f8f61;--green2:#eaf6f0;--red:#c93636;--shadow:0 10px 28px rgba(18,38,28,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;font-size:13px;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
    .btn,.icon-btn{min-height:36px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-weight:600;font-size:13px}.btn{padding:7px 12px}.icon-btn{width:36px;padding:0}.btn.primary{border-color:var(--green);background:var(--green);color:#fff}.btn.danger{color:var(--red)}
    .notice{min-height:40px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted);font-size:12.5px;font-weight:500;margin-bottom:12px;display:flex;align-items:center}.notice.ok{border-color:#a9d9c2;background:var(--green2);color:#0b6b4c}.notice.error{border-color:#eab8b8;background:#fff4f4;color:var(--red)}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 14px}.metric{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#fff}.metric span{color:var(--muted);font-size:11.5px;font-weight:600}.metric b{display:block;margin-top:4px;font-size:18px;font-weight:600}

    /* Shell: sidebar + content */
    .shell{display:flex;align-items:stretch;min-height:100vh}
    .sidebar{width:224px;flex:0 0 224px;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;z-index:20}
    .side-brand{display:flex;align-items:center;gap:8px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
    .side-brand .icon-btn{flex:0 0 auto}
    .side-brand h1{margin:0;font-size:14px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
    .side-brand span{display:block;color:var(--muted);font-size:10.5px;font-weight:500;margin-top:2px;word-break:break-all}
    .side-nav{flex:1;overflow:auto;padding:8px;display:grid;gap:2px;align-content:start}
    .side-tab{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:38px;border:0;border-radius:7px;background:transparent;color:var(--ink);padding:8px 10px;font-weight:500;font-size:12.5px;text-align:left}
    .side-tab:hover{background:var(--soft)}
    .side-tab.active{background:var(--green2);color:var(--green);font-weight:600}
    .side-tab-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .side-tab small{flex:0 0 auto;color:var(--muted);font-weight:600;background:var(--soft);border-radius:999px;padding:2px 7px;font-size:10.5px}
    .side-tab.active small{background:#fff;color:var(--green)}
    .side-foot{padding:10px;border-top:1px solid var(--line);display:grid;gap:8px}
    .content{flex:1;min-width:0;padding:20px 24px 60px}
    .content-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
    .content-title h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
    .content-title p{margin:3px 0 0;color:var(--muted);font-size:12px;font-weight:500}
    .content-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .content-actions input{width:min(250px,100%);height:36px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:12.5px}
    .content-actions select{height:36px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 9px;font-size:12.5px}
    .content-actions .count{color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap}
    @media(max-width:860px){
      .shell{flex-direction:column}
      .sidebar{width:100%;flex:0 0 auto;height:auto;position:static;flex-direction:row;align-items:center}
      .side-brand{border-bottom:0;border-right:1px solid var(--line);padding:10px 12px;flex:0 0 auto}
      .side-brand span{display:none}
      .side-nav{display:flex;flex-direction:row;gap:6px;padding:8px;overflow:auto}
      .side-tab{width:auto;white-space:nowrap}
      .side-foot{border-top:0;border-left:1px solid var(--line);flex-direction:row;flex:0 0 auto}
      .content{padding:12px}
      .metrics{grid-template-columns:1fr}
    }

    /* Generic table */
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:var(--shadow);max-height:calc(100vh - 300px)}
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}th{position:sticky;top:0;z-index:2;background:var(--soft);color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
    .action-col{position:sticky!important;left:0;z-index:3;background:#fff;box-shadow:1px 0 0 var(--line)}th.action-col{top:0;z-index:5;background:var(--soft)}
    .sort{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:inherit;padding:0;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.02em}.sort::after{content:'↕';opacity:.4}.sort.active::after{content:'↑';opacity:1;color:var(--green)}.sort.active.desc::after{content:'↓'}
    td.clip{max-width:340px;overflow:hidden;text-overflow:ellipsis}
    .row-actions{display:flex;align-items:center;gap:6px}.row-actions button{min-height:28px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px 8px;font-size:11.5px;font-weight:600}.row-actions button:disabled{opacity:.55;cursor:wait}.row-actions .delete{color:var(--red)}
    .stack{display:grid;gap:4px;white-space:normal;min-width:150px;align-content:center}.stack b{color:var(--ink);font-weight:600}.stack small{color:var(--muted)}
    .link-lines{display:grid;gap:7px;min-width:260px;max-width:480px;white-space:normal}.link-line{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;align-items:center}.link-line b{color:var(--green);font-weight:600}.link-line a{overflow-wrap:anywhere;color:#1769aa}
    .weight-editor{display:flex;align-items:center;gap:6px}.weight-editor select,.weight-editor input{height:32px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:4px 7px;font-size:12.5px}.weight-editor input{width:78px}.weight-editor button{height:32px;border:0;border-radius:7px;background:var(--green);color:#fff;padding:4px 10px;font-weight:600;font-size:12px}
    .badge{display:inline-flex;align-items:center;border-radius:999px;background:var(--green2);color:var(--green);padding:3px 9px;font-size:11.5px;font-weight:700}

    /* Footer / pager */
    .footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;margin-top:8px}.pager{display:flex;align-items:center;gap:8px}.pager button{width:32px;height:30px;border:1px solid var(--line);border-radius:6px;background:#fff}.pager button:disabled{opacity:.45}.page-label{min-width:80px;text-align:center;color:var(--muted);font-size:11.5px;font-weight:600}

    /* Cards */
    .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(324px,1fr));gap:20px}
    .card{border:1px solid var(--line);border-radius:11px;background:#fff;padding:18px;box-shadow:var(--shadow)}
    .card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .card-avatar{width:44px;height:44px;border-radius:11px;object-fit:cover;background:#eef3f0;flex:0 0 44px}
    .card-title{min-width:0;overflow:hidden}
    .card-title b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .card-title span{display:block;color:var(--muted);font-size:11.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
    .card-actions{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
    .card-actions button{min-height:28px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px 8px;font-size:11.5px;font-weight:600}.card-actions .delete{color:var(--red)}
    .card-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
    .card-section-title{color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px}
    .tag-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
    .tag{display:inline-flex;align-items:center;border-radius:999px;background:var(--soft);color:var(--ink);padding:3px 9px;font-size:11.5px;font-weight:600}
    .kv-list{display:grid;gap:9px;font-size:12px}
    .kv-list div{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;color:var(--muted)}
    .kv-list b{color:var(--ink);font-weight:600}
    .kv-list a{color:#1769aa;overflow-wrap:anywhere}
    .kv-list a.trunc{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .link-cell{display:flex;flex-direction:column;gap:4px;min-width:0}
    a.short-badge{align-self:flex-start;text-decoration:none;font-weight:700}
    details.adv{margin-top:14px}
    details.adv summary{cursor:pointer;color:var(--muted);font-size:11.5px;font-weight:600;padding:6px 0}
    details.adv .kv-list{margin-top:10px}
    .quote-line{font-style:italic;color:var(--muted);font-size:12px;margin:2px 0 10px}

    /* Grouped accordions (weighting / modification history) */
    .group{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden;background:#fff}
    .group.nested{margin:10px 0 0;border-color:#e9efeb}
    .group>summary{cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--soft);font-weight:600;font-size:12.5px;list-style:none}
    .group>summary::-webkit-details-marker{display:none}
    .group>summary::before{content:'›';color:var(--muted);transition:transform .15s;flex:0 0 auto;font-size:15px;line-height:1}
    .group[open]>summary::before{transform:rotate(90deg)}
    .group-count{margin-left:auto;color:var(--muted);font-weight:600;font-size:11.5px}
    .group-body{padding:6px 13px 13px}

    /* Weighting rows */
    .weight-row{display:flex;align-items:center;gap:16px;padding:11px 4px;border-bottom:1px solid var(--line)}
    .weight-row:last-child{border-bottom:0}
    .weight-row-info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
    .weight-row-info b{font-weight:600;font-size:12.5px}
    .weight-row-info span{color:var(--muted);font-size:11.5px}
    .weight-row-score{flex:0 0 auto}
    .weight-row-actions{flex:0 0 auto;display:flex;align-items:center;gap:6px}

    .timeline{display:grid;gap:8px}
    .timeline-item{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
    .timeline-item time{color:var(--muted);font-size:11.5px;font-weight:600}
    .timeline-item p{margin:0 0 4px;font-size:12.5px}
    .timeline-item .confirm{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
    @media(max-width:640px){.timeline-item{grid-template-columns:1fr}}

    /* Kanban (bug reports) */
    .kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
    .kanban-col{background:var(--soft);border-radius:9px;padding:11px}
    .kanban-col h4{margin:0 0 9px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
    .kanban-col h4 span{color:var(--muted);font-weight:700;background:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
    .kanban-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:9px;font-size:12px}
    .kanban-card b{display:block;margin-bottom:3px;font-weight:600}
    .kanban-card p{margin:6px 0}
    .kanban-card .meta{color:var(--muted);font-size:11px}

    /* Reels */
    .reel-media{width:100%;max-width:220px;border-radius:9px;overflow:hidden;background:#111;margin-bottom:10px}
    .reel-media img{width:100%;display:block;object-fit:cover;max-height:280px}
    .reaction-row{display:flex;align-items:center;gap:16px;margin:6px 0 10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
    .reaction-row b{color:var(--ink);font-weight:600}
    .comment-list{display:grid;gap:9px;max-height:220px;overflow:auto;margin-top:6px}
    .comment{display:flex;align-items:flex-start;gap:8px}
    .comment img{width:24px;height:24px;border-radius:999px;object-fit:cover;flex:0 0 24px;background:#eef3f0}
    .comment .bubble{background:var(--soft);border-radius:9px;padding:6px 9px;font-size:12px}
    .comment .bubble small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}

    /* Editor modal */
    .gate,.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:18px;background:rgba(8,14,12,.46);backdrop-filter:blur(3px)}.gate-card,.modal-card{width:min(980px,100%);max-height:calc(100vh - 36px);overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.2)}.gate-card{width:min(420px,100%);padding:24px}.gate-card h2{margin-top:0;font-size:16px}.gate-card label{display:grid;gap:6px;margin:12px 0;font-weight:600;font-size:12.5px}.gate-card input{min-height:38px;border:1px solid var(--line);border-radius:7px;padding:8px 10px}.gate-error{min-height:20px;color:var(--red);font-size:12.5px}
    .modal-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff}.modal-head h2{margin:0;font-size:15px;font-weight:700}
    .fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;padding:15px}.field{display:grid;gap:5px;color:var(--muted);font-size:11.5px;font-weight:600}.field.wide{grid-column:span 2}.field input,.field textarea{width:100%;min-height:36px;border:1px solid var(--line);border-radius:7px;background:var(--soft);padding:8px;font-size:12.5px;font-weight:400;color:var(--ink)}.field textarea{min-height:80px;resize:vertical}
    .field-adv{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
    .field-adv summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:12px;padding:4px 0}
    .field-adv .fields-inner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:8px}
    .modal-actions{position:sticky;bottom:0;justify-content:flex-end;padding:11px 15px;border-top:1px solid var(--line);background:#fff;display:flex;gap:8px}
    @media(max-width:800px){.fields,.field-adv .fields-inner{grid-template-columns:1fr}.field.wide{grid-column:auto}}

    /* Account access control */
    .permission-layout{display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr);gap:14px;align-items:start}
    .permission-users,.permission-editor{border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:var(--shadow)}
    .permission-users{max-height:calc(100vh - 250px);overflow:auto;padding:8px;overflow-anchor:none}.permission-user-group{margin:0 0 7px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}.permission-user-group summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;cursor:pointer;background:var(--soft);font-size:12px;font-weight:800;list-style:none}.permission-user-group summary::-webkit-details-marker{display:none}.permission-user-group summary::before{content:'›';color:var(--muted);font-size:17px;line-height:1;transform:rotate(0deg);transition:transform .15s ease}.permission-user-group[open] summary::before{transform:rotate(90deg)}.permission-user-group summary span:first-of-type{flex:1}.permission-user-group summary small{border-radius:999px;background:#fff;padding:2px 7px;color:var(--muted);font-size:10.5px}.permission-user-list{padding:4px}.permission-user{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;width:100%;padding:10px;border:0;border-radius:8px;background:transparent;text-align:left;color:var(--ink)}.permission-user:hover{background:var(--soft)}.permission-user.active{background:var(--green2);color:var(--green)}.permission-user b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.permission-user small{grid-column:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.permission-user .permission-state{grid-column:2;grid-row:1/3;align-self:center;border-radius:999px;padding:2px 7px;background:var(--soft);color:var(--muted);font-size:10.5px;font-weight:700}.permission-user .permission-state.explicit{background:#eef4ff;color:#315cba}.permission-user .permission-state.off{background:#fff1f1;color:var(--red)}
    .permission-editor{padding:18px}.permission-editor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}.permission-editor-head h3{margin:0;font-size:16px}.permission-editor-head p{margin:3px 0 0;color:var(--muted)}.permission-editor-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.permission-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:15px 0}.permission-controls label{display:grid;gap:5px;color:var(--muted);font-size:11.5px;font-weight:700}.permission-controls select{height:38px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 9px;color:var(--ink)}

        note(deletedTable==='database'?`${deletedLabel} 已從 JSON 刪除；試算表備份由背景處理。`:`${deletedLabel} 已從 JSON 刪除，不等待試算表備份。`,'ok');
      }catch(error){
        if(APPS_SCRIPT_MODE&&previous){directDatabase.tables[deletedTable].rows.splice(Math.min(index,directDatabase.tables[deletedTable].rows.length),0,previous);refreshCachedTableView()}
        if(container){container.disabled=false;container.textContent='刪除'}
        note(`刪除失敗：${error.message}`,'error');
      }
    }
    function showLogin(message='請先回到前台，以管理者身份登入後再進入。'){$('gateMessage').textContent=message;$('loginGate').hidden=false;$('app').hidden=true}
    function showApp(){$('loginGate').hidden=true;$('app').hidden=false}
    function publishDatabaseRefresh(action,data={}){const table=String(data?.table||tableName||'').trim(),tables=Array.isArray(data?.changedTables)?data.changedTables.filter(Boolean):(table?[table]:[]),message={type:'machi-database-refresh',action,tables,revision:Number(data?.jsonRevision)||0,commitSha:String(data?.githubCommitSha||''),sentAt:Date.now(),nonce:`${Date.now()}-${Math.random().toString(36).slice(2)}`,source:'database-admin',sourceInstance:ADMIN_REFRESH_INSTANCE};try{localStorage.setItem(DATABASE_REFRESH_STORAGE_KEY,JSON.stringify(message))}catch(error){}if('BroadcastChannel' in window){try{const channel=new BroadcastChannel(DATABASE_REFRESH_CHANNEL);channel.postMessage(message);channel.close()}catch(error){}}}
    function parseRefreshMessage(value){if(!value)return null;if(typeof value==='object')return value;try{return JSON.parse(value)}catch(error){return null}}
    let pendingRefreshMessage=null;
    function receiveDatabaseRefresh(value){const message=parseRefreshMessage(value);if(!message||message.type!=='machi-database-refresh'||message.sourceInstance===ADMIN_REFRESH_INSTANCE||message.nonce===lastRefreshNonce)return;lastRefreshNonce=String(message.nonce||'');if(document.hidden){pendingRefresh=true;pendingRefreshMessage=message;return}clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>refreshFromBackend(message),120)}
    async function refreshFromBackend(message={}){if(refreshInFlight){pendingRefresh=true;pendingRefreshMessage=message;return}refreshInFlight=true;pendingRefresh=false;pendingRefreshMessage=null;try{const expectedRevision=Number(message.revision)||0,commitSha=String(message.commitSha||'');let data=null;for(let attempt=0;attempt<5;attempt++){data=APPS_SCRIPT_MODE?await loadDatabaseFile({fresh:true,commitSha,store:false}):await request('/tables');if(!expectedRevision||databaseRevision(data)>=expectedRevision)break;await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)))}stageDatabaseSnapshot(data,message)}catch(error){if(!message.quiet)note(`即時刷新失敗：${error.message}`,'error')}finally{refreshInFlight=false;if(pendingRefresh){const next=pendingRefreshMessage||{tables:[tableName]};pendingRefreshMessage=null;setTimeout(()=>refreshFromBackend(next),100)}}}
    window.addEventListener('storage',event=>{if(event.key===DATABASE_REFRESH_STORAGE_KEY)receiveDatabaseRefresh(event.newValue)});
    if('BroadcastChannel' in window){try{const databaseChannel=new BroadcastChannel(DATABASE_REFRESH_CHANNEL);databaseChannel.onmessage=event=>receiveDatabaseRefresh(event.data);window.addEventListener('pagehide',()=>databaseChannel.close(),{once:true})}catch(error){}}
    const backgroundPollMs=18000;
    async function backgroundPollTick(){if($('app').hidden||document.hidden||!$('editor').hidden||refreshInFlight)return;await refreshFromBackend({quiet:true})}
    setInterval(backgroundPollTick,backgroundPollMs);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(pendingRefresh){const next=pendingRefreshMessage||{tables:[tableName]};pendingRefreshMessage=null;refreshFromBackend(next)}else backgroundPollTick()});
    $('tabs').addEventListener('click',event=>{const button=event.target.closest('[data-table]');if(!button)return;tableName=button.dataset.table;page=1;if(tableName==='database'){sortKey='案件編號';sortOrder='desc'}else if(tableName==='修改統計表'){sortKey='建立日期';sortOrder='desc'}else{sortKey='';sortOrder='asc'}renderTabs();loadRows()});
    $('view').addEventListener('change',event=>{const select=event.target.closest('[data-weight-select]');if(!select)return;const custom=select.closest('[data-key]')?.querySelector('[data-weight-other]');if(custom){custom.hidden=select.value!=='other';if(!custom.hidden)custom.focus()}});
    $('view').addEventListener('click',event=>{
      const roleTemplate=event.target.closest('[data-role-template]');
      if(roleTemplate){roleTemplateSelected=roleTemplate.dataset.roleTemplate;renderTable({table:'角色權限範本',total:roleTemplateRowsCache.length,offset:0,limit:10,rows:roleTemplateRowsCache});return}
      if(event.target.closest('[data-template-save]')){saveRoleTemplate();return}
      if(event.target.closest('[data-template-all]')){setRoleTemplateEditorMode('all');return}
      if(event.target.closest('[data-template-readonly]')){setRoleTemplateEditorMode('readonly');return}
      const columnMove=event.target.closest('[data-account-column-move]');if(columnMove){moveAccountColumn(columnMove);return}
      const reelEdit=event.target.closest('[data-account-reel-edit]');
      if(reelEdit){const row=accountReelsRows.find(item=>String(item._rowNumber)===reelEdit.dataset.accountReelEdit);if(row)openEditor(row,'reels');else note('找不到這筆 REELS，請重新讀取','error');return}
      const reelDelete=event.target.closest('[data-account-reel-delete]');
      if(reelDelete){const row=accountReelsRows.find(item=>String(item._rowNumber)===reelDelete.dataset.accountReelDelete);if(row)deleteRow(row,'reels');else note('找不到這筆 REELS，請重新讀取','error');return}
      const permissionAccount=event.target.closest('[data-permission-account]');
      if(permissionAccount){selectPermissionAccount(permissionAccount.dataset.permissionAccount);return}
      if(event.target.closest('[data-account-cancel]')){cancelAccountCreate();return}
      if(event.target.closest('[data-permission-save]')){savePermission();return}
      if(event.target.closest('[data-permission-reset]')){resetPermission();return}
      if(event.target.closest('[data-permission-all]')){setPermissionEditorMode('all');return}
      if(event.target.closest('[data-permission-readonly]')){setPermissionEditorMode('readonly');return}
      const sortBtn=event.target.closest('[data-sort]');
      if(sortBtn){if(sortKey===sortBtn.dataset.sort)sortOrder=sortOrder==='asc'?'desc':'asc';else{sortKey=sortBtn.dataset.sort;sortOrder='asc'}page=1;loadRows();return}
      const container=event.target.closest('[data-key]');if(!container)return;
      const row=rowsByKey.get(container.dataset.key);if(!row)return;
      if(event.target.closest('[data-weight-save]')){saveInlineWeight(row,container);return}
      if(event.target.closest('[data-edit]'))openEditor(row);
      if(event.target.closest('[data-delete]'))deleteRow(row);
    });
    $('view').addEventListener('change',event=>{const role=event.target.closest('[data-permission-role]');if(role){syncAccountEditorState({applyRole:true});return}if(event.target.matches('[data-account-column]')){refreshAccountColumnOrder();return}if(event.target.matches('[data-account-field="組別"]')){syncAccountEditorState();return}if(event.target.matches('[data-permission-page],[data-permission-capability]')){const select=permissionEditorElement()?.querySelector('[data-permission-role]');if(select&&!select.disabled)select.value='自訂';syncAccountEditorState()}});
    $('view').addEventListener('input',event=>{if(event.target.matches('[data-account-field="顯示名"],[data-account-field="名字"],[data-account-field="頭像連結"]'))syncAccountEditorState()});
    $('view').addEventListener('toggle',event=>{const group=event.target.closest?.('[data-account-group]');if(group)accountGroupOpenState.set(group.dataset.accountGroup,group.open)},true);
    $('view').addEventListener('dragstart',event=>{const item=event.target.closest('[data-account-column-item]');if(!item)return;accountColumnDragged=item;item.classList.add('dragging');event.dataTransfer.effectAllowed='move'});
    $('view').addEventListener('dragover',event=>{const target=event.target.closest('[data-account-column-item]');if(!accountColumnDragged||!target||target===accountColumnDragged)return;event.preventDefault();const rect=target.getBoundingClientRect(),before=event.clientY<rect.top+rect.height/2;target.parentElement.insertBefore(accountColumnDragged,before?target:target.nextElementSibling);refreshAccountColumnOrder()});
    $('view').addEventListener('drop',event=>{if(!accountColumnDragged)return;event.preventDefault();accountColumnDragged.classList.remove('dragging');accountColumnDragged=null;refreshAccountColumnOrder()});
    $('view').addEventListener('dragend',()=>{accountColumnDragged?.classList.remove('dragging');accountColumnDragged=null});
    $('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;loadRows()},240)});$('pageSize').addEventListener('change',()=>{page=1;loadRows()});$('add').addEventListener('click',()=>{if(tableName==='帳號權限')beginAccountCreate();else openEditor()});$('reload').addEventListener('click',manualReload);$('back').addEventListener('click',()=>location.href='index.html');$('logout').addEventListener('click',()=>location.href='index.html');$('closeEditor').addEventListener('click',closeEditor);$('cancelEditor').addEventListener('click',closeEditor);$('editorForm').addEventListener('submit',saveEditor);$('editor').addEventListener('click',event=>{if(event.target===$('editor'))closeEditor()});
    $('first').addEventListener('click',()=>{page=1;loadRows()});$('prev').addEventListener('click',()=>{page=Math.max(1,page-1);loadRows()});$('next').addEventListener('click',()=>{page++;loadRows()});$('last').addEventListener('click',()=>{page=Math.max(1,Math.ceil(Number($('totalRows').textContent.replace(/,/g,''))/effectivePageSize()));loadRows()});
    async function start(){token=stored(FRONT_TOKEN_KEY)||token;if(!token){showLogin('管理者登入狀態不存在，請回前台重新登入。');return}await window.MachiAccess?.refresh({token,account:stored('designRequestEditorAccount'),user:stored(FRONT_USER_KEY),group:stored(FRONT_GROUP_KEY)});if(!validFrontAdmin()){showLogin('Cloudflare Worker 驗證失敗，或此帳號沒有資料庫管理權限。');return}sessionStorage.setItem(TOKEN_KEY,token);showApp();try{await loadMetadata()}catch(error){if(/401|權限|TOKEN_EXPIRED|登入/.test(error.message)){showLogin('管理者登入狀態已失效，請回前台重新登入。');return}note(`後台讀取失敗：${error.message}`,'error')}}
    start();
  </script>
