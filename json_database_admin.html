<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="app-version" content="20260810-admin-redesign-1">
  <title>資料庫後台｜EMC 設計部</title>
  <style>
    :root{--bg:#f3f6f4;--panel:#fff;--soft:#f7faf8;--ink:#17211d;--muted:#68756f;--line:#dce4df;--green:#0f8f61;--green2:#e7f6ef;--red:#c93636;--shadow:0 12px 32px rgba(18,38,28,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
    .btn,.icon-btn{min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-weight:800}.btn{padding:8px 12px}.icon-btn{width:38px;padding:0}.btn.primary{border-color:var(--green);background:var(--green);color:#fff}.btn.danger{color:var(--red)}
    .notice{min-height:42px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:13px;font-weight:750;margin-bottom:12px}.notice.ok{border-color:#8bd1b0;background:var(--green2);color:#087249}.notice.error{border-color:#e8aaaa;background:#fff3f3;color:var(--red)}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 14px}.metric{padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fff}.metric span{color:var(--muted);font-size:12px;font-weight:800}.metric b{display:block;margin-top:4px;font-size:20px}

    /* Shell: sidebar + content */
    .shell{display:flex;align-items:stretch;min-height:100vh}
    .sidebar{width:230px;flex:0 0 230px;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;z-index:20}
    .side-brand{display:flex;align-items:center;gap:8px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
    .side-brand .icon-btn{flex:0 0 auto}
    .side-brand h1{margin:0;font-size:16px;line-height:1.3}
    .side-brand span{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-top:2px;word-break:break-all}
    .side-nav{flex:1;overflow:auto;padding:10px;display:grid;gap:3px;align-content:start}
    .side-tab{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:40px;border:0;border-radius:8px;background:transparent;color:var(--ink);padding:8px 10px;font-weight:800;text-align:left}
    .side-tab:hover{background:var(--soft)}
    .side-tab.active{background:var(--green2);color:var(--green)}
    .side-tab-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .side-tab small{flex:0 0 auto;color:var(--muted);font-weight:800;background:var(--soft);border-radius:999px;padding:2px 7px;font-size:11px}
    .side-tab.active small{background:#fff;color:var(--green)}
    .side-foot{padding:10px;border-top:1px solid var(--line);display:grid;gap:8px}
    .content{flex:1;min-width:0;padding:18px 22px 60px}
    .content-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}
    .content-title h2{margin:0;font-size:19px}
    .content-title p{margin:3px 0 0;color:var(--muted);font-size:12.5px;font-weight:700}
    .content-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .content-actions input{width:min(260px,100%);height:38px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
    .content-actions select{height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 9px}
    .content-actions .count{color:var(--muted);font-size:12px;font-weight:800;white-space:nowrap}
    @media(max-width:860px){
      .shell{flex-direction:column}
      .sidebar{width:100%;flex:0 0 auto;height:auto;position:static;flex-direction:row;align-items:center}
      .side-brand{border-bottom:0;border-right:1px solid var(--line);padding:10px 12px;flex:0 0 auto}
      .side-brand span{display:none}
      .side-nav{display:flex;flex-direction:row;gap:6px;padding:8px;overflow:auto}
      .side-tab{width:auto;white-space:nowrap}
      .side-foot{border-top:0;border-left:1px solid var(--line);flex-direction:row;flex:0 0 auto}
      .content{padding:12px}
      .metrics{grid-template-columns:1fr}
    }

    /* Generic table */
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:var(--shadow);max-height:calc(100vh - 300px)}
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}th{position:sticky;top:0;z-index:2;background:var(--soft);color:var(--muted);font-size:12px}
    .action-col{position:sticky!important;left:0;z-index:3;background:#fff;box-shadow:1px 0 0 var(--line)}th.action-col{top:0;z-index:5;background:var(--soft)}
    .sort{display:inline-flex;gap:5px;border:0;background:transparent;color:inherit;padding:0;font-weight:850}.sort::after{content:'↕';opacity:.45}.sort.active::after{content:'↑';opacity:1;color:var(--green)}.sort.active.desc::after{content:'↓'}
    td.clip{max-width:340px;overflow:hidden;text-overflow:ellipsis}
    .row-actions{display:flex;gap:6px}.row-actions button{min-height:29px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px 8px;font-size:12px;font-weight:800}.row-actions button:disabled{opacity:.55;cursor:wait}.row-actions .delete{color:var(--red)}
    .stack{display:grid;gap:4px;white-space:normal;min-width:150px}.stack b{color:var(--ink)}.stack small{color:var(--muted)}
    .link-lines{display:grid;gap:7px;min-width:260px;max-width:480px;white-space:normal}.link-line{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px}.link-line b{color:var(--green)}.link-line a{overflow-wrap:anywhere;color:#1769aa}
    .weight-editor{display:flex;align-items:center;gap:6px}.weight-editor select,.weight-editor input{height:32px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:4px 7px}.weight-editor input{width:82px}.weight-editor button{height:32px;border:0;border-radius:7px;background:var(--green);color:#fff;padding:4px 10px;font-weight:850}
    .badge{display:inline-flex;border-radius:999px;background:var(--green2);color:var(--green);padding:3px 8px;font-size:12px;font-weight:900}

    /* Footer / pager */
    .footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;margin-top:8px}.pager{display:flex;align-items:center;gap:8px}.pager button{width:34px;height:32px;border:1px solid var(--line);border-radius:6px;background:#fff}.pager button:disabled{opacity:.45}.page-label{min-width:86px;text-align:center;color:var(--muted);font-size:12px;font-weight:800}

    /* Cards */
    .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
    .card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;box-shadow:var(--shadow)}
    .card-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .card-avatar{width:44px;height:44px;border-radius:12px;object-fit:cover;background:#eef3f0;flex:0 0 44px}
    .card-title{min-width:0;overflow:hidden}
    .card-title b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .card-title span{display:block;color:var(--muted);font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .card-actions{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
    .card-actions button{min-height:29px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px 8px;font-size:12px;font-weight:800}.card-actions .delete{color:var(--red)}
    .card-section{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
    .card-section-title{color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
    .tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
    .tag{display:inline-flex;border-radius:999px;background:var(--soft);color:var(--ink);padding:3px 8px;font-size:12px;font-weight:800}
    .kv-list{display:grid;gap:6px;font-size:12.5px}
    .kv-list div{display:grid;grid-template-columns:104px 1fr;gap:6px;color:var(--muted);word-break:break-word}
    .kv-list b{color:var(--ink);font-weight:700}
    .kv-list a{color:#1769aa;overflow-wrap:anywhere}
    details.adv{margin-top:10px}
    details.adv summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:800;padding:6px 0}
    details.adv .kv-list{margin-top:6px}
    .quote-line{font-style:italic;color:var(--muted);font-size:12.5px;margin:2px 0 8px}

    /* Grouped accordions (weighting / modification history) */
    .group{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;background:#fff}
    .group.nested{margin:8px 0 0;border-color:#e6ede9}
    .group>summary{cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--soft);font-weight:850;list-style:none}
    .group>summary::-webkit-details-marker{display:none}
    .group>summary::before{content:'▸';color:var(--muted);transition:transform .15s;flex:0 0 auto}
    .group[open]>summary::before{transform:rotate(90deg)}
    .group-count{margin-left:auto;color:var(--muted);font-weight:800;font-size:12px}
    .group-body{padding:10px 13px 13px}
    .group-body table{border:1px solid var(--line);border-radius:8px;overflow:hidden}
    .timeline{display:grid;gap:8px}
    .timeline-item{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:start;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
    .timeline-item time{color:var(--muted);font-size:12px;font-weight:800}
    .timeline-item p{margin:0 0 4px;font-size:13px}
    .timeline-item .confirm{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
    @media(max-width:640px){.timeline-item{grid-template-columns:1fr}}

    /* Kanban (bug reports) */
    .kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
    .kanban-col{background:var(--soft);border-radius:10px;padding:10px}
    .kanban-col h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
    .kanban-col h4 span{color:var(--muted);font-weight:800;background:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
    .kanban-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;font-size:12.5px}
    .kanban-card b{display:block;margin-bottom:3px}
    .kanban-card p{margin:6px 0}
    .kanban-card .meta{color:var(--muted);font-size:11px}

    /* Reels */
    .reel-media{width:100%;max-width:220px;border-radius:10px;overflow:hidden;background:#111;margin-bottom:10px}
    .reel-media img{width:100%;display:block;object-fit:cover;max-height:280px}
    .reaction-row{display:flex;gap:14px;margin:6px 0 8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
    .reaction-row b{color:var(--ink)}
    .comment-list{display:grid;gap:8px;max-height:220px;overflow:auto;margin-top:6px}
    .comment{display:flex;gap:8px}
    .comment img{width:26px;height:26px;border-radius:999px;object-fit:cover;flex:0 0 26px;background:#eef3f0}
    .comment .bubble{background:var(--soft);border-radius:10px;padding:6px 9px;font-size:12.5px}
    .comment .bubble small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}

    /* Editor modal */
    .gate,.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:18px;background:rgba(8,14,12,.48);backdrop-filter:blur(3px)}.gate-card,.modal-card{width:min(980px,100%);max-height:calc(100vh - 36px);overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 22px 58px rgba(0,0,0,.24)}.gate-card{width:min(420px,100%);padding:24px}.gate-card h2{margin-top:0}.gate-card label{display:grid;gap:6px;margin:12px 0;font-weight:800}.gate-card input{min-height:40px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}.gate-error{min-height:20px;color:var(--red);font-size:13px}
    .modal-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff}.modal-head h2{margin:0;font-size:18px}
    .fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;padding:15px}.field{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:800}.field.wide{grid-column:span 2}.field input,.field textarea{width:100%;min-height:38px;border:1px solid var(--line);border-radius:7px;background:var(--soft);padding:8px}.field textarea{min-height:82px;resize:vertical}
    .field-adv{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
    .field-adv summary{cursor:pointer;color:var(--muted);font-weight:850;font-size:12.5px;padding:4px 0}
    .field-adv .fields-inner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:8px}
    .modal-actions{position:sticky;bottom:0;justify-content:flex-end;padding:11px 15px;border-top:1px solid var(--line);background:#fff;display:flex;gap:8px}
    @media(max-width:800px){.fields,.field-adv .fields-inner{grid-template-columns:1fr}.field.wide{grid-column:auto}}
  </style>
</head>
<body>
  <section class="gate" id="loginGate" hidden>
    <div class="gate-card"><h2>資料庫後台</h2><p id="gateMessage">請先回到前台，以管理者身份登入後再進入。</p><div class="gate-error" id="loginError"></div><a class="btn primary" href="index.html">返回前台登入</a></div>
  </section>
  <div id="app" hidden>
    <div class="shell">
      <aside class="sidebar">
        <div class="side-brand">
          <button class="icon-btn" id="back" type="button" aria-label="返回前台">←</button>
          <div><h1>資料庫後台</h1><span id="apiLabel">/api</span></div>
        </div>
        <nav class="side-nav" id="tabs" aria-label="資料表"></nav>
        <div class="side-foot"><button class="btn" id="reload" type="button">↻ 重新讀取</button><button class="btn" id="logout" type="button">返回前台</button></div>
      </aside>
      <main class="content">
        <div class="content-head">
          <div class="content-title"><h2 id="tableTitle">—</h2><p id="tableSubtitle"></p></div>
          <div class="content-actions">
            <input id="search" type="search" placeholder="搜尋目前資料表" aria-label="搜尋目前資料表">
            <span id="pageSizeWrap"><select id="pageSize" aria-label="每頁筆數"><option>25</option><option selected>50</option><option>100</option><option>200</option></select></span>
            <button class="btn primary" id="add" type="button">+ 新增資料</button>
            <span class="count" id="count">0 筆</span>
          </div>
        </div>
        <div class="notice" id="notice" role="status">正在連線...</div>
        <section class="metrics"><div class="metric"><span>資料庫修訂版</span><b id="revision">—</b></div><div class="metric"><span>目前資料表</span><b id="currentTable">—</b></div><div class="metric"><span>資料總數</span><b id="totalRows">0</b></div></section>
        <div id="view"></div>
        <footer class="footer" id="footer"><span id="range">—</span><div class="pager"><button id="first" type="button">«</button><button id="prev" type="button">‹</button><span class="page-label" id="pageLabel">1 / 1</span><button id="next" type="button">›</button><button id="last" type="button">»</button></div></footer>
      </main>
    </div>
  </div>
  <div class="modal" id="editor" hidden><form class="modal-card" id="editorForm"><header class="modal-head"><h2 id="editorTitle">編輯資料</h2><button class="icon-btn" id="closeEditor" type="button">×</button></header><div class="fields" id="fields"></div><footer class="modal-actions"><button class="btn" id="cancelEditor" type="button">取消</button><button class="btn primary" id="saveEditor" type="submit">儲存變更</button></footer></form></div>
  <script>
    const TABLE_ORDER=['database','加權計分標準','短連結','補充資料連結','修改統計表','設定','reels','bug_report'];
    const TABLE_INFO={
      database:{icon:'📁',desc:'所有設計需求案件的完整清單'},
      '加權計分標準':{icon:'⚖️',desc:'依設計種類與階段分組的加權分數規則'},
      '短連結':{icon:'🔗',desc:'一般短網址與原始網址對照'},
      '補充資料連結':{icon:'📎',desc:'各案件的補充資料 A–D 連結'},
      '修改統計表':{icon:'🕘',desc:'依案件編號分組的修改歷程'},
      '設定':{icon:'👤',desc:'設計師與使用者個人設定'},
      reels:{icon:'🎬',desc:'限時動態、按讚倒讚與留言'},
      bug_report:{icon:'🐞',desc:'問題回報進度看板'}
    };
    const BOARD_VIEWS=['加權計分標準','補充資料連結','修改統計表','設定','reels','bug_report'];
    const SETTINGS_PRIMARY=['部門','組別','名字','顯示名','帳號','頭像連結','頭像大圖連結','分享音樂','音樂起始秒數','技能','對話框','新專案輪值'];
    const BUG_STATUSES=['回報中','評估中','處理中','已完成','已否決'];
    const TOKEN_KEY='machiJsonAdminTokenV1';
    const FRONT_TOKEN_KEY='designRequestEditorToken';
    const FRONT_GROUP_KEY='designRequestEditorGroup';
    const FRONT_USER_KEY='designRequestEditorUser';
    const FRONT_LOGGED_OUT_KEY='designRequestEditorLoggedOut';
    const DATABASE_REFRESH_CHANNEL='machi-database-refresh-v1';
    const DATABASE_REFRESH_STORAGE_KEY='machiDatabaseRefreshV1';
    const $=id=>document.getElementById(id);
    function stored(key){try{if(localStorage.getItem(FRONT_LOGGED_OUT_KEY)==='1'||sessionStorage.getItem(FRONT_LOGGED_OUT_KEY)==='1')return '';return localStorage.getItem(key)||sessionStorage.getItem(key)||''}catch(error){return ''}}
    function configuredApi(){const query=new URLSearchParams(location.search).get('api')||'',meta=document.querySelector('meta[name="design-api-url"]')?.content||'';let saved='';try{saved=localStorage.getItem('designRequestApiUrl')||''}catch(error){}return String(query||meta||saved).trim()}
    const APPS_SCRIPT_FALLBACK='https://script.google.com/macros/s/AKfycbxNi2pdh70uzRyTF7Fo6OZ8MTROwHSZpqITwwHBs6UHLPhtSeZEHxkga5N_fPT4_qW15A/exec';
    const CONFIGURED_API=configuredApi();
    const API=CONFIGURED_API||(location.hostname==='emctaipeiart.github.io'?APPS_SCRIPT_FALLBACK:(location.protocol==='file:'?'http://127.0.0.1:8787/api':new URL('/api',location.origin).href));
    const APPS_SCRIPT_MODE=/script\.google\.com/i.test(API);
    const DATABASE_FILE_URL=new URL('backend/data/db.json',location.href).href;
    let token=stored(FRONT_TOKEN_KEY)||sessionStorage.getItem(TOKEN_KEY)||'',metadata={},directDatabase=null,tableName='database',page=1,sortKey='案件編號',sortOrder='desc',editing=null,editingTableName='',searchTimer=null,refreshTimer=null,refreshInFlight=false,pendingRefresh=false,lastRefreshNonce='',rowLoadSequence=0,rowsByKey=new Map();
    $('apiLabel').textContent=APPS_SCRIPT_MODE?'GitHub JSON｜試算表僅備份':API;
    function note(message,type=''){const el=$('notice');el.textContent=message;el.className=`notice ${type}`.trim()}
    async function request(path='',options={}){const response=await fetch(`${API.replace(/\/$/,'')}${path}`,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{}) ,...(options.headers||{})}});const data=await response.json().catch(()=>({ok:false,error:`HTTP ${response.status}`}));if(!response.ok||data.ok===false)throw new Error(data.error||`HTTP ${response.status}`);return data}
    async function appsScriptRequest(action,payload={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);try{const response=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,editorToken:token,...payload}),credentials:'omit',cache:'no-store',redirect:'follow',referrerPolicy:'no-referrer',signal:controller.signal});if(!response.ok)throw new Error(`Apps Script HTTP ${response.status}`);const data=await response.json().catch(()=>({ok:false,error:'Apps Script 回傳格式錯誤'}));if(data.ok===false)throw new Error(data.error||'Apps Script 處理失敗');if(['adminTableUpdate','adminTableDelete'].includes(action))publishDatabaseRefresh(action,data);return data}catch(error){if(error?.name==='AbortError')throw new Error('JSON 寫入超過 45 秒，請重新讀取確認結果');throw error}finally{clearTimeout(timer)}}
    async function loadDatabaseFile({fresh=false,commitSha=''}={}){if(directDatabase&&!fresh&&!commitSha)return directDatabase;const source=commitSha&&location.hostname==='emctaipeiart.github.io'?`https://raw.githubusercontent.com/EMCtaipeiART/EMCtaipeiART.github.io/${encodeURIComponent(commitSha)}/backend/data/db.json`:DATABASE_FILE_URL,url=new URL(source);url.searchParams.set('v',fresh||commitSha?String(Date.now()):'20260810-admin-redesign-1');const response=await fetch(url,{cache:fresh||commitSha?'no-store':'default',credentials:'omit',referrerPolicy:'no-referrer'});if(!response.ok)throw new Error(`JSON 資料庫 HTTP ${response.status}`);const database=await response.json();if(!database?.tables||typeof database.tables!=='object')throw new Error('JSON 資料庫格式錯誤');directDatabase=database;return database}
    function metadataFromDatabase(database){return Object.fromEntries(Object.entries(database.tables||{}).map(([name,table])=>[name,{headers:Array.isArray(table.headers)?table.headers:[],primaryKey:table.primaryKey||'',rowCount:Array.isArray(table.rows)?table.rows.length:0}]))}

    function queryPath(){const size=effectivePageSize(),params=new URLSearchParams({offset:String((page-1)*size),limit:String(size)});if($('search').value.trim())params.set('q',$('search').value.trim());if(sortKey){params.set('sort',sortKey);params.set('order',sortOrder)}return `/table/${encodeURIComponent(tableName)}?${params}`}
    function modificationGroupTime(row){const raw=String(row['建立日期']||row['修改日期']||'').replace(/-/g,'/'),time=Date.parse(raw);return Number.isFinite(time)?time:0}
    function databaseFileRows(){
      const table=directDatabase?.tables?.[tableName];if(!table||!Array.isArray(table.rows))throw new Error(`資料庫檔案缺少資料表：${tableName}`);
      const headers=table.headers||[],query=$('search').value.trim().toLocaleLowerCase(),descending=sortOrder==='desc',size=effectivePageSize(),offset=(page-1)*size;
      let rows=table.rows.map((row,index)=>Object.assign({_rowNumber:index+2},row));
      if(query)rows=rows.filter(row=>Object.values(row).some(value=>String(value||'').toLocaleLowerCase().includes(query)));
      if(tableName==='修改統計表'&&sortKey==='建立日期'){
        const latest=new Map();
        for(const row of rows){const id=String(row['案件編號']||''),stamp=modificationGroupTime(row);latest.set(id,Math.max(latest.get(id)||0,stamp))}
        rows.sort((left,right)=>(latest.get(String(right['案件編號']))||0)-(latest.get(String(left['案件編號']))||0)||String(right['案件編號']||'').localeCompare(String(left['案件編號']||''),'zh-Hant',{numeric:true})||Number(right['修改次數']||0)-Number(left['修改次數']||0));
      }else if(sortKey&&headers.includes(sortKey)){
        rows.sort((left,right)=>{const result=String(left[sortKey]||'').localeCompare(String(right[sortKey]||''),'zh-Hant',{numeric:true,sensitivity:'base'});return descending?-result:result});
      }
      return {table:tableName,total:rows.length,offset,limit:size,rows:rows.slice(offset,offset+size)};
    }
    async function loadRows(){const requestedTable=tableName,sequence=++rowLoadSequence,path=queryPath(),label=tableLabel(requestedTable);note(`正在讀取 ${label} JSON...`);try{if(APPS_SCRIPT_MODE&&!directDatabase)await loadDatabaseFile();const data=APPS_SCRIPT_MODE?databaseFileRows():await request(path);if(sequence!==rowLoadSequence||requestedTable!==tableName)return;renderTable(data);note(`${label} 已從 JSON 載入 ${Number(data.total).toLocaleString('zh-TW')} 筆。`,'ok')}catch(error){if(sequence!==rowLoadSequence||requestedTable!==tableName)return;if(/401|權限|TOKEN_EXPIRED/.test(error.message))showLogin('管理者登入狀態已失效，請回前台重新登入。');note(`讀取失敗：${error.message}`,'error')}}

    function renderTable(data){
      const table=metadata[tableName];
      $('currentTable').textContent=tableLabel(tableName);
      $('totalRows').textContent=Number(data.total).toLocaleString('zh-TW');
      $('count').textContent=`${Number(data.total).toLocaleString('zh-TW')} 筆`;
      updateViewChrome();
      const view=$('view');
      if(tableName==='短連結')view.innerHTML=shortLinkTableHtml(data);
      else if(tableName==='加權計分標準')view.innerHTML=weightGroupsHtml(data.rows);
      else if(tableName==='補充資料連結')view.innerHTML=supplementCardsHtml(data.rows);
      else if(tableName==='修改統計表')view.innerHTML=modificationGroupsHtml(data.rows);
      else if(tableName==='設定')view.innerHTML=settingsCardsHtml(data.rows);
      else if(tableName==='reels')view.innerHTML=reelsCardsHtml(data.rows);
      else if(tableName==='bug_report')view.innerHTML=bugBoardHtml(data.rows);
      else view.innerHTML=databaseTableHtml(table,data);
      rowsByKey=new Map(data.rows.map(row=>[rowKeyFor(row),row]));
      if(!isBoardView()){
        const size=effectivePageSize(),pages=Math.max(1,Math.ceil(data.total/size));
        page=Math.min(page,pages);
        $('range').textContent=data.total?`顯示 ${(page-1)*size+1}–${Math.min(page*size,data.total)}，共 ${Number(data.total).toLocaleString('zh-TW')} 筆`:'共 0 筆';
        $('pageLabel').textContent=`${page} / ${pages}`;
        $('first').disabled=$('prev').disabled=page<=1;
        $('last').disabled=$('next').disabled=page>=pages;
      }
    }

    function directRowIndex(table,row,name=tableName){const source=directDatabase?.tables?.[name];if(!source)return -1;const primaryKey=table.primaryKey;return primaryKey?source.rows.findIndex(item=>String(item[primaryKey]||'')===String(row[primaryKey]||'')):Number(row._rowNumber)-2}
    function spreadsheetBackupOptions(name=tableName){const backupToSpreadsheet=name==='database';return {backupToSpreadsheet,skipSpreadsheetBackup:!backupToSpreadsheet,backupMode:backupToSpreadsheet?'database-only':'json-only'}}
    function refreshCachedTableView(){if(!APPS_SCRIPT_MODE||!directDatabase)return;metadata=metadataFromDatabase(directDatabase);renderTabs();renderTable(databaseFileRows());$('revision').textContent=String(directDatabase.revision??'—')}
    function scheduleWeightRuleRefresh(){[8000,20000,40000].forEach(delay=>setTimeout(()=>{if(document.hidden)return;refreshFromBackend({tables:['database','加權計分標準']})},delay))}
    async function saveEditor(event){
      event.preventDefault();
      const editedTable=editingTableName||tableName,editedLabel=tableLabel(editedTable),headers=metadata[editedTable].headers||[],row=Object.fromEntries(headers.map(header=>[header,String(new FormData(event.currentTarget).get(header)||'').trim()])),table=metadata[editedTable],original=editing,key=original?(table.primaryKey?original[table.primaryKey]:original._rowNumber):'',index=original?directRowIndex(table,original,editedTable):-1,previous=index>=0?{...directDatabase.tables[editedTable].rows[index]}:null,button=$('saveEditor'),buttonText=button.textContent;
      let insertedIndex=-1;
      button.disabled=true;button.textContent='儲存中…';note(`${editedLabel} 正在寫入 JSON…`);
      try{
        let data=null;
        if(APPS_SCRIPT_MODE){
          if(original&&index<0)throw new Error('找不到要編輯的資料，請重新讀取');
          if(!original&&editedTable!=='設定')throw new Error('目前僅開放從後台新增人員設定');
          if(original)directDatabase.tables[editedTable].rows[index]={...row};
          else{insertedIndex=directDatabase.tables[editedTable].rows.length;directDatabase.tables[editedTable].rows.push({...row})}
          closeEditor();refreshCachedTableView();note(`${editedLabel} 已先更新畫面，JSON 背景寫入中…`);
          data=await appsScriptRequest(original?'adminTableUpdate':'adminTableInsert',original?{table:editedTable,rowNumber:original._rowNumber,expectedRow:original,row,...spreadsheetBackupOptions(editedTable)}:{table:editedTable,row,...spreadsheetBackupOptions(editedTable)});
          if(data.jsonRevision)directDatabase.revision=data.jsonRevision;refreshCachedTableView();
        }else{
          data=await request(`/table/${encodeURIComponent(editedTable)}${key?`/${encodeURIComponent(key)}`:''}`,{method:key?'PATCH':'POST',body:JSON.stringify({row})});closeEditor();await loadMetadata();
        }
        if(editedTable==='加權計分標準'&&APPS_SCRIPT_MODE){scheduleWeightRuleRefresh();note('權重已寫入 JSON；database 加權將於背景重算。','ok')}
        else note(editedTable==='database'?`${editedLabel} 已寫入 JSON；試算表備份由背景處理。`:`${editedLabel} 已寫入 JSON，不等待試算表備份。`,'ok');
      }catch(error){
        if(APPS_SCRIPT_MODE&&previous){directDatabase.tables[editedTable].rows[index]=previous;refreshCachedTableView();openEditor({...previous,_rowNumber:original._rowNumber})}
        else if(APPS_SCRIPT_MODE&&insertedIndex>=0){directDatabase.tables[editedTable].rows.splice(insertedIndex,1);refreshCachedTableView();openEditor()}
        note(`儲存失敗：${error.message}`,'error');
      }finally{button.disabled=false;button.textContent=buttonText}
    }
    async function saveInlineWeight(row,container){
      const select=container.querySelector('[data-weight-select]'),custom=container.querySelector('[data-weight-other]'),button=container.querySelector('[data-weight-save]'),value=select.value==='other'?custom.value.trim():select.value,table=metadata['加權計分標準'],index=directRowIndex(table,row,'加權計分標準');
      if(!value){custom.hidden=false;custom.focus();note('請輸入自訂權重。','error');return}
      if(index<0){note('找不到加權規則，請重新讀取。','error');return}
      const previous={...directDatabase.tables['加權計分標準'].rows[index]},updated={...previous,'權重':value};button.disabled=true;button.textContent='儲存中…';directDatabase.tables['加權計分標準'].rows[index]=updated;refreshCachedTableView();note(`「${updated['項目細節']}」權重 ${value} 分正在寫入 JSON…`);
      try{const data=await appsScriptRequest('adminTableUpdate',{table:'加權計分標準',rowNumber:row._rowNumber,expectedRow:row,row:updated,...spreadsheetBackupOptions('加權計分標準')});if(data.jsonRevision)directDatabase.revision=data.jsonRevision;refreshCachedTableView();scheduleWeightRuleRefresh();note(`「${updated['項目細節']}」已設定為 ${value} 分。`,'ok')}
      catch(error){directDatabase.tables['加權計分標準'].rows[index]=previous;refreshCachedTableView();note(`權重儲存失敗：${error.message}`,'error')}
    }
    async function deleteRow(row){
      const deletedTable=tableName,deletedLabel=tableLabel(deletedTable),table=metadata[deletedTable],key=table.primaryKey?row[table.primaryKey]:row._rowNumber;
      if(!confirm(`確定刪除 ${deletedLabel} 的這筆資料？此動作無法復原。`))return;
      const container=$('view').querySelector(`[data-key="${CSS.escape(rowKeyFor(row))}"] [data-delete]`),index=directRowIndex(table,row,deletedTable),previous=index>=0?{...directDatabase.tables[deletedTable].rows[index]}:null;
      if(container){container.disabled=true;container.textContent='刪除中…'}
      try{
        if(APPS_SCRIPT_MODE){
          if(index<0)throw new Error('找不到要刪除的資料，請重新讀取');
          directDatabase.tables[deletedTable].rows.splice(index,1);refreshCachedTableView();note(`${deletedLabel} 已先從畫面移除，JSON 背景刪除中…`);
          const data=await appsScriptRequest('adminTableDelete',{table:deletedTable,rowNumber:row._rowNumber,expectedRow:row,...spreadsheetBackupOptions(deletedTable)});
          if(data.jsonRevision)directDatabase.revision=data.jsonRevision;refreshCachedTableView();
        }else{await request(`/table/${encodeURIComponent(deletedTable)}/${encodeURIComponent(key)}`,{method:'DELETE',body:'{}'});await loadMetadata()}
        note(deletedTable==='database'?`${deletedLabel} 已從 JSON 刪除；試算表備份由背景處理。`:`${deletedLabel} 已從 JSON 刪除，不等待試算表備份。`,'ok');
      }catch(error){
        if(APPS_SCRIPT_MODE&&previous){directDatabase.tables[deletedTable].rows.splice(Math.min(index,directDatabase.tables[deletedTable].rows.length),0,previous);refreshCachedTableView()}
        if(container){container.disabled=false;container.textContent='刪除'}
        note(`刪除失敗：${error.message}`,'error');
      }
    }
    function showLogin(message='請先回到前台，以管理者身份登入後再進入。'){$('gateMessage').textContent=message;$('loginGate').hidden=false;$('app').hidden=true}
    function showApp(){$('loginGate').hidden=true;$('app').hidden=false}
    function publishDatabaseRefresh(action,data={}){const table=String(data?.table||tableName||'').trim(),message={type:'machi-database-refresh',action,tables:table?[table]:[],revision:Number(data?.jsonRevision)||0,commitSha:String(data?.githubCommitSha||''),sentAt:Date.now(),nonce:`${Date.now()}-${Math.random().toString(36).slice(2)}`,source:'database-admin'};try{localStorage.setItem(DATABASE_REFRESH_STORAGE_KEY,JSON.stringify(message))}catch(error){}if('BroadcastChannel' in window){try{const channel=new BroadcastChannel(DATABASE_REFRESH_CHANNEL);channel.postMessage(message);channel.close()}catch(error){}}}
    function parseRefreshMessage(value){if(!value)return null;if(typeof value==='object')return value;try{return JSON.parse(value)}catch(error){return null}}
    function receiveDatabaseRefresh(value){const message=parseRefreshMessage(value);if(!message||message.type!=='machi-database-refresh'||message.source==='database-admin'||message.nonce===lastRefreshNonce)return;lastRefreshNonce=String(message.nonce||'');if(document.hidden){pendingRefresh=true;return}clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>refreshFromBackend(message),120)}
    async function refreshFromBackend(message={}){if(refreshInFlight){pendingRefresh=true;return}refreshInFlight=true;pendingRefresh=false;try{const expectedRevision=Number(message.revision)||0,commitSha=String(message.commitSha||'');let data=null;for(let attempt=0;attempt<5;attempt++){data=await loadMetadata({fresh:true,commitSha});if(!expectedRevision||Number(data.revision)>=expectedRevision)break;await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)))}const tables=Array.isArray(message.tables)?message.tables.filter(Boolean):[];note(`已收到即時更新${tables.length?`：${tables.join('、')}`:''}，JSON 修訂版 ${data?.revision??'—'} 已刷新。`,'ok')}catch(error){note(`即時刷新失敗：${error.message}`,'error')}finally{refreshInFlight=false;if(pendingRefresh)setTimeout(()=>refreshFromBackend({tables:[tableName]}),100)}}
    window.addEventListener('storage',event=>{if(event.key===DATABASE_REFRESH_STORAGE_KEY)receiveDatabaseRefresh(event.newValue)});
    if('BroadcastChannel' in window){try{const databaseChannel=new BroadcastChannel(DATABASE_REFRESH_CHANNEL);databaseChannel.onmessage=event=>receiveDatabaseRefresh(event.data);window.addEventListener('pagehide',()=>databaseChannel.close(),{once:true})}catch(error){}}
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pendingRefresh)refreshFromBackend({tables:[tableName]})});
    $('tabs').addEventListener('click',event=>{const button=event.target.closest('[data-table]');if(!button)return;tableName=button.dataset.table;page=1;if(tableName==='database'){sortKey='案件編號';sortOrder='desc'}else if(tableName==='修改統計表'){sortKey='建立日期';sortOrder='desc'}else{sortKey='';sortOrder='asc'}renderTabs();loadRows()});
    $('view').addEventListener('change',event=>{const select=event.target.closest('[data-weight-select]');if(!select)return;const custom=select.closest('[data-key]')?.querySelector('[data-weight-other]');if(custom){custom.hidden=select.value!=='other';if(!custom.hidden)custom.focus()}});
    $('view').addEventListener('click',event=>{
      const sortBtn=event.target.closest('[data-sort]');
      if(sortBtn){if(sortKey===sortBtn.dataset.sort)sortOrder=sortOrder==='asc'?'desc':'asc';else{sortKey=sortBtn.dataset.sort;sortOrder='asc'}page=1;loadRows();return}
      const container=event.target.closest('[data-key]');if(!container)return;
      const row=rowsByKey.get(container.dataset.key);if(!row)return;
      if(event.target.closest('[data-weight-save]')){saveInlineWeight(row,container);return}
      if(event.target.closest('[data-edit]'))openEditor(row);
      if(event.target.closest('[data-delete]'))deleteRow(row);
    });
    $('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;loadRows()},240)});$('pageSize').addEventListener('change',()=>{page=1;loadRows()});$('add').addEventListener('click',()=>openEditor());$('reload').addEventListener('click',()=>loadMetadata({fresh:true}));$('back').addEventListener('click',()=>location.href='index.html');$('logout').addEventListener('click',()=>location.href='index.html');$('closeEditor').addEventListener('click',closeEditor);$('cancelEditor').addEventListener('click',closeEditor);$('editorForm').addEventListener('submit',saveEditor);$('editor').addEventListener('click',event=>{if(event.target===$('editor'))closeEditor()});
    $('first').addEventListener('click',()=>{page=1;loadRows()});$('prev').addEventListener('click',()=>{page=Math.max(1,page-1);loadRows()});$('next').addEventListener('click',()=>{page++;loadRows()});$('last').addEventListener('click',()=>{page=Math.max(1,Math.ceil(Number($('totalRows').textContent.replace(/,/g,''))/effectivePageSize()));loadRows()});
    async function start(){if(!validFrontAdmin()){showLogin();return}token=stored(FRONT_TOKEN_KEY)||token;sessionStorage.setItem(TOKEN_KEY,token);showApp();try{await loadMetadata()}catch(error){if(/401|權限|TOKEN_EXPIRED/.test(error.message)){showLogin('管理者登入狀態已失效，請回前台重新登入。');return}note(`後台讀取失敗：${error.message}`,'error')}}
    start();
  </script>
