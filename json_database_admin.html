<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="app-version" content="20260808-admin-fast-write-12">
  <title>資料庫後台｜EMC 設計部</title>
  <style>
    :root{--bg:#f3f6f4;--panel:#fff;--soft:#f7faf8;--ink:#17211d;--muted:#68756f;--line:#dce4df;--green:#0f8f61;--green2:#e7f6ef;--red:#c93636;--shadow:0 12px 32px rgba(18,38,28,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
    .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:10px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}
    .brand,.actions,.toolbar,.pager,.modal-actions{display:flex;align-items:center;gap:8px}.brand h1{margin:0;font-size:18px}.brand span{display:block;color:var(--muted);font-size:12px;font-weight:700}.btn,.icon-btn{min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-weight:800}.btn{padding:8px 12px}.icon-btn{width:38px;padding:0}.btn.primary{border-color:var(--green);background:var(--green);color:#fff}.btn.danger{color:var(--red)}
    main{width:min(1680px,100%);margin:auto;padding:18px 20px 44px}.notice{min-height:42px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:13px;font-weight:750}.notice.ok{border-color:#8bd1b0;background:var(--green2);color:#087249}.notice.error{border-color:#e8aaaa;background:#fff3f3;color:var(--red)}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.metric{padding:14px;border:1px solid var(--line);border-radius:9px;background:#fff}.metric span{color:var(--muted);font-size:12px;font-weight:800}.metric b{display:block;margin-top:5px;font-size:22px}
    .workspace{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:var(--shadow)}.tabs{display:flex;gap:6px;overflow:auto;padding:10px;border-bottom:1px solid var(--line)}.tab{flex:0 0 auto;min-height:36px;border:0;border-radius:7px;background:transparent;color:var(--muted);padding:7px 11px;font-weight:850}.tab.active{background:var(--green2);color:var(--green)}.tab small{margin-left:5px}
    .toolbar{flex-wrap:wrap;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--soft)}.toolbar input{width:min(360px,100%);height:38px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}.toolbar select{height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 9px}.count{margin-left:auto;color:var(--muted);font-size:12px;font-weight:800}
    .table-wrap{max-height:calc(100vh - 330px);overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;z-index:2;background:var(--soft);color:var(--muted);font-size:12px}.action-col{position:sticky!important;left:0;z-index:3;background:#fff;box-shadow:1px 0 0 var(--line)}th.action-col{top:0;z-index:5;background:var(--soft)}.sort{display:inline-flex;gap:5px;border:0;background:transparent;color:inherit;padding:0;font-weight:850}.sort::after{content:'↕';opacity:.45}.sort.active::after{content:'↑';opacity:1;color:var(--green)}.sort.active.desc::after{content:'↓'}td.clip{max-width:340px;overflow:hidden;text-overflow:ellipsis}.row-actions{display:flex;gap:6px}.row-actions button{min-height:29px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px 8px;font-size:12px;font-weight:800}.row-actions button:disabled{opacity:.55;cursor:wait}.row-actions .delete{color:var(--red)}
    .footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--soft)}.pager button{width:34px;height:32px;border:1px solid var(--line);border-radius:6px;background:#fff}.pager button:disabled{opacity:.45}.page-label{min-width:86px;text-align:center;color:var(--muted);font-size:12px;font-weight:800}
    .gate,.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:18px;background:rgba(8,14,12,.48);backdrop-filter:blur(3px)}.gate-card,.modal-card{width:min(980px,100%);max-height:calc(100vh - 36px);overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 22px 58px rgba(0,0,0,.24)}.gate-card{width:min(420px,100%);padding:24px}.gate-card h2{margin-top:0}.gate-card label{display:grid;gap:6px;margin:12px 0;font-weight:800}.gate-card input{min-height:40px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}.gate-error{min-height:20px;color:var(--red);font-size:13px}
    .modal-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff}.modal-head h2{margin:0;font-size:18px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;padding:15px}.field{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:800}.field.wide{grid-column:span 2}.field input,.field textarea{width:100%;min-height:38px;border:1px solid var(--line);border-radius:7px;background:var(--soft);padding:8px}.field textarea{min-height:82px;resize:vertical}.modal-actions{position:sticky;bottom:0;justify-content:flex-end;padding:11px 15px;border-top:1px solid var(--line);background:#fff}
    @media(max-width:800px){main{padding:12px}.topbar{padding:9px 12px}.metrics{grid-template-columns:1fr}.count{width:100%;margin-left:0}.table-wrap{max-height:none}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.brand span{display:none}}
  </style>
</head>
<body>
  <section class="gate" id="loginGate" hidden>
    <div class="gate-card"><h2>資料庫後台</h2><p id="gateMessage">請先回到前台，以管理者身份登入後再進入。</p><div class="gate-error" id="loginError"></div><a class="btn primary" href="index.html">返回前台登入</a></div>
  </section>
  <div id="app" hidden>
    <header class="topbar"><div class="brand"><button class="icon-btn" id="back" type="button" aria-label="返回前台">←</button><div><h1>資料庫後台</h1><span id="apiLabel">/api</span></div></div><div class="actions"><button class="btn" id="reload" type="button">↻ 重新讀取</button><button class="btn" id="logout" type="button">返回前台</button></div></header>
    <main><div class="notice" id="notice" role="status">正在連線...</div><section class="metrics"><div class="metric"><span>資料庫修訂版</span><b id="revision">—</b></div><div class="metric"><span>目前資料表</span><b id="currentTable">—</b></div><div class="metric"><span>資料總數</span><b id="totalRows">0</b></div></section>
      <section class="workspace"><nav class="tabs" id="tabs" aria-label="資料表"></nav><div class="toolbar"><input id="search" type="search" placeholder="搜尋目前資料表" aria-label="搜尋目前資料表"><select id="pageSize" aria-label="每頁筆數"><option>25</option><option selected>50</option><option>100</option><option>200</option></select><button class="btn primary" id="add" type="button">+ 新增資料</button><span class="count" id="count">0 筆</span></div><div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div><footer class="footer"><span id="range">—</span><div class="pager"><button id="first" type="button">«</button><button id="prev" type="button">‹</button><span class="page-label" id="pageLabel">1 / 1</span><button id="next" type="button">›</button><button id="last" type="button">»</button></div></footer></section>
    </main>
  </div>
  <div class="modal" id="editor" hidden><form class="modal-card" id="editorForm"><header class="modal-head"><h2 id="editorTitle">編輯資料</h2><button class="icon-btn" id="closeEditor" type="button">×</button></header><div class="fields" id="fields"></div><footer class="modal-actions"><button class="btn" id="cancelEditor" type="button">取消</button><button class="btn primary" id="saveEditor" type="submit">儲存變更</button></footer></form></div>
  <script>
    const TABLE_ORDER=['database','加權計分標準','短連結','修改統計表','補充資料連結','設定','reels','bug_report'];
    const TOKEN_KEY='machiJsonAdminTokenV1';
    const FRONT_TOKEN_KEY='designRequestEditorToken';
    const FRONT_GROUP_KEY='designRequestEditorGroup';
    const FRONT_USER_KEY='designRequestEditorUser';
    const FRONT_LOGGED_OUT_KEY='designRequestEditorLoggedOut';
    const DATABASE_REFRESH_CHANNEL='machi-database-refresh-v1';
    const DATABASE_REFRESH_STORAGE_KEY='machiDatabaseRefreshV1';
    const $=id=>document.getElementById(id);
    function stored(key){try{if(localStorage.getItem(FRONT_LOGGED_OUT_KEY)==='1'||sessionStorage.getItem(FRONT_LOGGED_OUT_KEY)==='1')return '';return localStorage.getItem(key)||sessionStorage.getItem(key)||''}catch(error){return ''}}
    function configuredApi(){const query=new URLSearchParams(location.search).get('api')||'',meta=document.querySelector('meta[name="design-api-url"]')?.content||'';let saved='';try{saved=localStorage.getItem('designRequestApiUrl')||''}catch(error){}return String(query||meta||saved).trim()}
    const APPS_SCRIPT_FALLBACK='https://script.google.com/macros/s/AKfycbxNi2pdh70uzRyTF7Fo6OZ8MTROwHSZpqITwwHBs6UHLPhtSeZEHxkga5N_fPT4_qW15A/exec';
    const CONFIGURED_API=configuredApi();
    const API=CONFIGURED_API||(location.hostname==='emctaipeiart.github.io'?APPS_SCRIPT_FALLBACK:(location.protocol==='file:'?'http://127.0.0.1:8787/api':new URL('/api',location.origin).href));
    const APPS_SCRIPT_MODE=/script\.google\.com/i.test(API);
    const DATABASE_FILE_URL=new URL('backend/data/db.json',location.href).href;
    let token=stored(FRONT_TOKEN_KEY)||sessionStorage.getItem(TOKEN_KEY)||'',metadata={},directDatabase=null,tableName='database',page=1,sortKey='案件編號',sortOrder='desc',editing=null,searchTimer=null,refreshTimer=null,refreshInFlight=false,pendingRefresh=false,lastRefreshNonce='',rowLoadSequence=0;
    $('apiLabel').textContent=APPS_SCRIPT_MODE?'GitHub JSON｜試算表僅備份':API;
    function note(message,type=''){const el=$('notice');el.textContent=message;el.className=`notice ${type}`.trim()}
    async function request(path='',options={}){const response=await fetch(`${API.replace(/\/$/,'')}${path}`,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{}) ,...(options.headers||{})}});const data=await response.json().catch(()=>({ok:false,error:`HTTP ${response.status}`}));if(!response.ok||data.ok===false)throw new Error(data.error||`HTTP ${response.status}`);return data}
    async function appsScriptRequest(action,payload={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);try{const response=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,editorToken:token,...payload}),credentials:'omit',cache:'no-store',redirect:'follow',referrerPolicy:'no-referrer',signal:controller.signal});if(!response.ok)throw new Error(`Apps Script HTTP ${response.status}`);const data=await response.json().catch(()=>({ok:false,error:'Apps Script 回傳格式錯誤'}));if(data.ok===false)throw new Error(data.error||'Apps Script 處理失敗');if(['adminTableUpdate','adminTableDelete'].includes(action))publishDatabaseRefresh(action,data);return data}catch(error){if(error?.name==='AbortError')throw new Error('JSON 寫入超過 45 秒，請重新讀取確認結果');throw error}finally{clearTimeout(timer)}}
    function decodeGithubContent(value=''){const binary=atob(String(value).replace(/\s+/g,'')),bytes=Uint8Array.from(binary,char=>char.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
    async function loadDatabaseFile({fresh=false,commitSha=''}={}){if(directDatabase&&!fresh&&!commitSha)return directDatabase;const source=commitSha&&location.hostname==='emctaipeiart.github.io'?`https://raw.githubusercontent.com/EMCtaipeiART/EMCtaipeiART.github.io/${encodeURIComponent(commitSha)}/backend/data/db.json`:DATABASE_FILE_URL,url=new URL(source);url.searchParams.set('v',fresh||commitSha?String(Date.now()):'20260808-admin-fast-write-12');const response=await fetch(url,{cache:fresh||commitSha?'no-store':'default',credentials:'omit',referrerPolicy:'no-referrer'});if(!response.ok)throw new Error(`JSON 資料庫 HTTP ${response.status}`);const database=await response.json();if(!database?.tables||typeof database.tables!=='object')throw new Error('JSON 資料庫格式錯誤');directDatabase=database;return database}
    function metadataFromDatabase(database){return Object.fromEntries(Object.entries(database.tables||{}).map(([name,table])=>[name,{headers:Array.isArray(table.headers)?table.headers:[],primaryKey:table.primaryKey||'',rowCount:Array.isArray(table.rows)?table.rows.length:0}]))}
    function taipeiDateParts(){return Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(part=>[part.type,part.value]))}
    function validFrontAdmin(){const group=stored(FRONT_GROUP_KEY),user=stored(FRONT_USER_KEY),value=stored(FRONT_TOKEN_KEY);if(!value)return false;if(value.startsWith('local-admin:')){const parts=taipeiDateParts();return value===`local-admin:${parts.year}${parts.month}${parts.day}`}return group==='管理者'||user==='管理者'}
    async function loadMetadata({fresh=false,commitSha=''}={}){const data=APPS_SCRIPT_MODE?await loadDatabaseFile({fresh,commitSha}):await request('/tables');metadata=APPS_SCRIPT_MODE?metadataFromDatabase(data):(data.tables||{});$('revision').textContent=String(data.revision??'—');$('add').hidden=APPS_SCRIPT_MODE;renderTabs();await loadRows();return data}
    function renderTabs(){$('tabs').innerHTML=TABLE_ORDER.filter(name=>metadata[name]).map(name=>`<button class="tab ${name===tableName?'active':''}" type="button" data-table="${name}">${name}<small>${Number(metadata[name].rowCount||0).toLocaleString('zh-TW')}</small></button>`).join('')}
    function queryPath(){const params=new URLSearchParams({offset:String((page-1)*Number($('pageSize').value)),limit:$('pageSize').value});if($('search').value.trim())params.set('q',$('search').value.trim());if(sortKey){params.set('sort',sortKey);params.set('order',sortOrder)}return `/table/${encodeURIComponent(tableName)}?${params}`}
    function databaseFileRows(){const table=directDatabase?.tables?.[tableName];if(!table||!Array.isArray(table.rows))throw new Error(`資料庫檔案缺少資料表：${tableName}`);const headers=table.headers||[],query=$('search').value.trim().toLocaleLowerCase(),descending=sortOrder==='desc',offset=(page-1)*Number($('pageSize').value),limit=Number($('pageSize').value);let rows=table.rows.map((row,index)=>Object.assign({_rowNumber:index+2},row));if(query)rows=rows.filter(row=>headers.some(header=>String(row[header]||'').toLocaleLowerCase().includes(query)));if(sortKey&&headers.includes(sortKey))rows.sort((left,right)=>{const result=String(left[sortKey]||'').localeCompare(String(right[sortKey]||''),'zh-Hant',{numeric:true,sensitivity:'base'});return descending?-result:result});return {table:tableName,total:rows.length,offset,limit,rows:rows.slice(offset,offset+limit)}}
    async function loadRows(){const requestedTable=tableName,sequence=++rowLoadSequence,path=queryPath();note(`正在讀取 ${requestedTable} JSON...`);try{if(APPS_SCRIPT_MODE&&!directDatabase)await loadDatabaseFile();const data=APPS_SCRIPT_MODE?databaseFileRows():await request(path);if(sequence!==rowLoadSequence||requestedTable!==tableName)return;renderTable(data);note(`${requestedTable} 已從 JSON 載入 ${Number(data.total).toLocaleString('zh-TW')} 筆，可編輯或刪除。`,'ok')}catch(error){if(sequence!==rowLoadSequence||requestedTable!==tableName)return;if(/401|權限|TOKEN_EXPIRED/.test(error.message))showLogin('管理者登入狀態已失效，請回前台重新登入。');note(`讀取失敗：${error.message}`,'error')}}
    function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    function renderTable(data){const table=metadata[tableName],headers=table.headers||[],size=Number($('pageSize').value),pages=Math.max(1,Math.ceil(data.total/size));page=Math.min(page,pages);$('currentTable').textContent=tableName;$('totalRows').textContent=Number(data.total).toLocaleString('zh-TW');$('count').textContent=`${Number(data.total).toLocaleString('zh-TW')} 筆`;$('head').innerHTML='<th class="action-col">編輯／刪除</th>'+headers.map(header=>`<th><button class="sort ${sortKey===header?'active':''} ${sortKey===header&&sortOrder==='desc'?'desc':''}" type="button" data-sort="${esc(header)}">${esc(header)}</button></th>`).join('');$('body').innerHTML=data.rows.length?data.rows.map(row=>`<tr data-key="${esc(table.primaryKey?row[table.primaryKey]:row._rowNumber)}"><td class="action-col"><div class="row-actions"><button type="button" data-edit>編輯</button><button class="delete" type="button" data-delete>刪除</button></div></td>${headers.map(header=>`<td class="clip" title="${esc(row[header])}">${esc(row[header])}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length+1}">沒有符合條件的資料</td></tr>`;$('range').textContent=data.total?`顯示 ${(page-1)*size+1}–${Math.min(page*size,data.total)}，共 ${Number(data.total).toLocaleString('zh-TW')} 筆`:'共 0 筆';$('pageLabel').textContent=`${page} / ${pages}`;$('first').disabled=$('prev').disabled=page<=1;$('last').disabled=$('next').disabled=page>=pages;$('body').querySelectorAll('tr[data-key]').forEach((tr,index)=>tr._row=data.rows[index])}
    function openEditor(row=null){editing=row;const headers=metadata[tableName].headers||[];$('editorTitle').textContent=row?`編輯 ${tableName}`:`新增 ${tableName}`;$('fields').innerHTML=headers.map(header=>{const value=row?.[header]??'',wide=String(value).length>80||/(內容|說明|留言|建議|連結)/.test(header);return `<label class="field ${wide?'wide':''}">${esc(header)}${wide?`<textarea name="${esc(header)}">${esc(value)}</textarea>`:`<input name="${esc(header)}" value="${esc(value)}">`}</label>`}).join('');$('editor').hidden=false;setTimeout(()=>$('fields').querySelector('input,textarea')?.focus(),20)}
    function closeEditor(){$('editor').hidden=true;editing=null}
    function directRowIndex(table,row){const source=directDatabase?.tables?.[tableName];if(!source)return -1;const primaryKey=table.primaryKey;return primaryKey?source.rows.findIndex(item=>String(item[primaryKey]||'')===String(row[primaryKey]||'')):Number(row._rowNumber)-2}
    function spreadsheetBackupOptions(name=tableName){const backupToSpreadsheet=name==='database';return {backupToSpreadsheet,skipSpreadsheetBackup:!backupToSpreadsheet,backupMode:backupToSpreadsheet?'database-only':'json-only'}}
    function refreshCachedTableView(){if(!APPS_SCRIPT_MODE||!directDatabase)return;metadata=metadataFromDatabase(directDatabase);renderTabs();renderTable(databaseFileRows());$('revision').textContent=String(directDatabase.revision??'—')}
    function scheduleWeightRuleRefresh(){[8000,20000,40000].forEach(delay=>setTimeout(()=>{if(document.hidden)return;refreshFromBackend({tables:['database','加權計分標準']})},delay))}
    async function saveEditor(event){
      event.preventDefault();
      const headers=metadata[tableName].headers||[],row=Object.fromEntries(headers.map(header=>[header,String(new FormData(event.currentTarget).get(header)||'').trim()])),table=metadata[tableName],original=editing,key=original?(table.primaryKey?original[table.primaryKey]:original._rowNumber):'',editedTable=tableName,index=original?directRowIndex(table,original):-1,previous=index>=0?{...directDatabase.tables[editedTable].rows[index]}:null,button=$('saveEditor'),buttonText=button.textContent;
      button.disabled=true;button.textContent='儲存中…';note(`${editedTable} 正在寫入 JSON…`);
      try{
        let data=null;
        if(APPS_SCRIPT_MODE){
          if(!original||index<0)throw new Error('找不到要編輯的資料，請重新讀取');
          directDatabase.tables[editedTable].rows[index]={...row};closeEditor();refreshCachedTableView();note(`${editedTable} 已先更新畫面，JSON 背景寫入中…`);
          data=await appsScriptRequest('adminTableUpdate',{table:editedTable,rowNumber:original._rowNumber,expectedRow:original,row,...spreadsheetBackupOptions(editedTable)});
          if(data.jsonRevision)directDatabase.revision=data.jsonRevision;refreshCachedTableView();
        }else{
          data=await request(`/table/${encodeURIComponent(editedTable)}${key?`/${encodeURIComponent(key)}`:''}`,{method:key?'PATCH':'POST',body:JSON.stringify({row})});closeEditor();await loadMetadata();
        }
        if(editedTable==='加權計分標準'&&APPS_SCRIPT_MODE){scheduleWeightRuleRefresh();note('權重已寫入 JSON；database 加權將於背景重算。','ok')}
        else note(editedTable==='database'?`${editedTable} 已寫入 JSON；試算表備份由背景處理。`:`${editedTable} 已寫入 JSON，不等待試算表備份。`,'ok');
      }catch(error){
        if(APPS_SCRIPT_MODE&&previous){directDatabase.tables[editedTable].rows[index]=previous;refreshCachedTableView();openEditor({...previous,_rowNumber:original._rowNumber})}
        note(`儲存失敗：${error.message}`,'error');
      }finally{button.disabled=false;button.textContent=buttonText}
    }
    async function deleteRow(row){
      const table=metadata[tableName],deletedTable=tableName,key=table.primaryKey?row[table.primaryKey]:row._rowNumber;
      if(!confirm(`確定刪除 ${deletedTable} 的這筆資料？此動作無法復原。`))return;
      const button=[...$('body').querySelectorAll('tr[data-key]')].find(tr=>tr._row===row)?.querySelector('[data-delete]'),index=directRowIndex(table,row),previous=index>=0?{...directDatabase.tables[deletedTable].rows[index]}:null;
      if(button){button.disabled=true;button.textContent='刪除中…'}
      try{
        if(APPS_SCRIPT_MODE){
          if(index<0)throw new Error('找不到要刪除的資料，請重新讀取');
          directDatabase.tables[deletedTable].rows.splice(index,1);refreshCachedTableView();note(`${deletedTable} 已先從畫面移除，JSON 背景刪除中…`);
          const data=await appsScriptRequest('adminTableDelete',{table:deletedTable,rowNumber:row._rowNumber,expectedRow:row,...spreadsheetBackupOptions(deletedTable)});
          if(data.jsonRevision)directDatabase.revision=data.jsonRevision;refreshCachedTableView();
        }else{await request(`/table/${encodeURIComponent(deletedTable)}/${encodeURIComponent(key)}`,{method:'DELETE',body:'{}'});await loadMetadata()}
        note(deletedTable==='database'?`${deletedTable} 已從 JSON 刪除；試算表備份由背景處理。`:`${deletedTable} 已從 JSON 刪除，不等待試算表備份。`,'ok');
      }catch(error){
        if(APPS_SCRIPT_MODE&&previous){directDatabase.tables[deletedTable].rows.splice(Math.min(index,directDatabase.tables[deletedTable].rows.length),0,previous);refreshCachedTableView()}
        if(button){button.disabled=false;button.textContent='刪除'}note(`刪除失敗：${error.message}`,'error');
      }
    }
    function showLogin(message='請先回到前台，以管理者身份登入後再進入。'){$('gateMessage').textContent=message;$('loginGate').hidden=false;$('app').hidden=true}
    function showApp(){$('loginGate').hidden=true;$('app').hidden=false}
    function publishDatabaseRefresh(action,data={}){const table=String(data?.table||tableName||'').trim(),message={type:'machi-database-refresh',action,tables:table?[table]:[],revision:Number(data?.jsonRevision)||0,commitSha:String(data?.githubCommitSha||''),sentAt:Date.now(),nonce:`${Date.now()}-${Math.random().toString(36).slice(2)}`,source:'database-admin'};try{localStorage.setItem(DATABASE_REFRESH_STORAGE_KEY,JSON.stringify(message))}catch(error){}if('BroadcastChannel' in window){try{const channel=new BroadcastChannel(DATABASE_REFRESH_CHANNEL);channel.postMessage(message);channel.close()}catch(error){}}}
    function parseRefreshMessage(value){if(!value)return null;if(typeof value==='object')return value;try{return JSON.parse(value)}catch(error){return null}}
    function receiveDatabaseRefresh(value){const message=parseRefreshMessage(value);if(!message||message.type!=='machi-database-refresh'||message.source==='database-admin'||message.nonce===lastRefreshNonce)return;lastRefreshNonce=String(message.nonce||'');if(document.hidden){pendingRefresh=true;return}clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>refreshFromBackend(message),120)}
    async function refreshFromBackend(message={}){if(refreshInFlight){pendingRefresh=true;return}refreshInFlight=true;pendingRefresh=false;try{const expectedRevision=Number(message.revision)||0,commitSha=String(message.commitSha||'');let data=null;for(let attempt=0;attempt<5;attempt++){data=await loadMetadata({fresh:true,commitSha});if(!expectedRevision||Number(data.revision)>=expectedRevision)break;await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)))}const tables=Array.isArray(message.tables)?message.tables.filter(Boolean):[];note(`已收到即時更新${tables.length?`：${tables.join('、')}`:''}，JSON 修訂版 ${data?.revision??'—'} 已刷新。`,'ok')}catch(error){note(`即時刷新失敗：${error.message}`,'error')}finally{refreshInFlight=false;if(pendingRefresh)setTimeout(()=>refreshFromBackend({tables:[tableName]}),100)}}
    window.addEventListener('storage',event=>{if(event.key===DATABASE_REFRESH_STORAGE_KEY)receiveDatabaseRefresh(event.newValue)});
    if('BroadcastChannel' in window){try{const databaseChannel=new BroadcastChannel(DATABASE_REFRESH_CHANNEL);databaseChannel.onmessage=event=>receiveDatabaseRefresh(event.data);window.addEventListener('pagehide',()=>databaseChannel.close(),{once:true})}catch(error){}}
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pendingRefresh)refreshFromBackend({tables:[tableName]})});
    $('tabs').addEventListener('click',event=>{const button=event.target.closest('[data-table]');if(!button)return;tableName=button.dataset.table;page=1;sortKey=tableName==='database'?'案件編號':'';sortOrder=tableName==='database'?'desc':'asc';renderTabs();loadRows()});
    $('head').addEventListener('click',event=>{const button=event.target.closest('[data-sort]');if(!button)return;if(sortKey===button.dataset.sort)sortOrder=sortOrder==='asc'?'desc':'asc';else{sortKey=button.dataset.sort;sortOrder='asc'}page=1;loadRows()});
    $('body').addEventListener('click',event=>{const tr=event.target.closest('tr[data-key]');if(!tr)return;if(event.target.closest('[data-edit]'))openEditor(tr._row);if(event.target.closest('[data-delete]'))deleteRow(tr._row)});
    $('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;loadRows()},240)});$('pageSize').addEventListener('change',()=>{page=1;loadRows()});$('add').addEventListener('click',()=>{if(!APPS_SCRIPT_MODE)openEditor()});$('reload').addEventListener('click',()=>loadMetadata({fresh:true}));$('back').addEventListener('click',()=>location.href='index.html');$('logout').addEventListener('click',()=>location.href='index.html');$('closeEditor').addEventListener('click',closeEditor);$('cancelEditor').addEventListener('click',closeEditor);$('editorForm').addEventListener('submit',saveEditor);$('editor').addEventListener('click',event=>{if(event.target===$('editor'))closeEditor()});
    $('first').addEventListener('click',()=>{page=1;loadRows()});$('prev').addEventListener('click',()=>{page=Math.max(1,page-1);loadRows()});$('next').addEventListener('click',()=>{page++;loadRows()});$('last').addEventListener('click',()=>{page=Math.max(1,Math.ceil(Number($('totalRows').textContent.replace(/,/g,''))/Number($('pageSize').value)));loadRows()});
    async function start(){if(!validFrontAdmin()){showLogin();return}token=stored(FRONT_TOKEN_KEY)||token;sessionStorage.setItem(TOKEN_KEY,token);showApp();try{await loadMetadata()}catch(error){if(/401|權限|TOKEN_EXPIRED/.test(error.message)){showLogin('管理者登入狀態已失效，請回前台重新登入。');return}note(`後台讀取失敗：${error.message}`,'error')}}
    start();
  </script>
</body>
</html>
