<style>
:root{--ink:#182e54;--dim:#6f7c92;--bg:#eef3fb;--line:#c9d2e0;--blue:#3b6fd8;--gold:#f0b429;--red:#d9534f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 16px 28px}

#stage{position:relative;border:4px solid var(--ink);border-radius:12px;overflow:hidden;background:#cfe0f4;touch-action:none;user-select:none}
#c3{display:block;width:100%;aspect-ratio:5/3;cursor:crosshair}

      <ul class="tips"><li>按住畫面往左下拖曳，放開就投出；拉得越長力道越大，虛線是預估軌跡。</li><li>普通進球 100 分，空心 150 分，連續進球每球再加 20（最多 +200）。</li><li>20 秒後垃圾桶開始左右移動，35 秒起有風（右上角顯示風向）。</li><li>同一天風向固定，所有人可比排行榜。</li></ul>
      <button class="pk big" id="startB" type="button">開始</button>
      <div class="note" id="who"></div>
    </div>

<script type="module">
import { GEO, launchVelocity, pointsFor, createBall, stepBall, previewPath, binXAt, makeWindSchedule, windAt, PHASES } from './sim.js';
import { createRng, hashString } from './rng.js';

const $ = id => document.getElementById(id);
const SITE_THEME_KEY = 'designRequestThemeV1';   // 網站左側「深色／淺色」按鈕存的值（同網域，直接讀）
const siteTheme = () => { try { const t = localStorage.getItem(SITE_THEME_KEY); return t === 'dark' || t === 'light' ? t : ''; } catch (e) { return ''; } };
const isDarkNow = () => { const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
function syncTheme(t) { t = t || siteTheme(); if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); if (window.__themeChanged) window.__themeChanged(); }
addEventListener('storage', e => { if (e.key === SITE_THEME_KEY) syncTheme(); });
addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.type === 'pixelOfficeTheme' && (e.data.theme === 'dark' || e.data.theme === 'light')) syncTheme(e.data.theme); });

const API = 'https://machi-design-api.machi-chen.workers.dev/minigames';
const GAME = 'hoops', DURATION = 60, TICKS = DURATION * 60, K = .02;   // 1 世界像素＝0.02 單位
const embed = /[?&]embed=1/.test(location.search);
if (embed) { $('exitB').hidden = false; $('exitB').onclick = () => { try { parent.postMessage({ type: 'expeditionExit' }, location.origin); } catch (e) {} }; }
const wx = x => x * K, wy = y => (GEO.floorY - y) * K;   // 模擬座標（y 向下）→ 3D

// ───────── 存檔 ─────────
const SAVE_KEY = 'hoops3d:save';
let save = { best: 0, plays: 0, streak: 0, lastDay: '', ach: {} };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };
const TITLES = [[0, '紙團新手'], [500, '垃圾桶見習'], [1000, '準頭不錯'], [1600, '神射手'], [2300, '紙團狙擊手'], [3200, '籃下霸主'], [4200, '辦公室傳奇']];
const titleFor = v => TITLES.filter(t => v >= t[0]).pop()[1];
const ACH = [['swish3', '空心 3 次', s => s.swishes >= 3], ['combo5', '連擊 5', s => s.bestCombo >= 5], ['combo10', '連擊 10', s => s.bestCombo >= 10],
  ['shots25', '單局投 25 球', s => s.shots >= 25], ['acc60', '命中率 60%（10 球以上）', s => s.shots >= 10 && s.makes / s.shots >= .6], ['wind', '強風中進球', s => s.windMakes >= 1], ['score2k', '單局 2000 分', s => s.score >= 2000], ['streak3', '連續 3 天挑戰', () => save.streak >= 3]];
const TOKEN = () => { try { if (localStorage.getItem('designRequestEditorLoggedOut') === '1') return ''; const h = JSON.parse(localStorage.getItem('pixelViewerHandoff') || 'null'); if (h && h.token && Date.now() - Number(h.at) < 86400000) return h.token; return localStorage.getItem('designRequestEditorToken') || sessionStorage.getItem('designRequestEditorToken') || ''; } catch (e) { return ''; } };
const taipeiDay = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
let DEVICE = ''; try { DEVICE = localStorage.getItem('hoops3d:device') || ''; } catch (e) {}
const post = (path, body) => fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(body) }).then(async r => ({ status: r.status, j: await r.json().catch(() => ({})) }));

// ───────── 音效（WebAudio 合成）─────────
const SFX = (() => {
  let ac = null, master = null, bus = null, muted = false, musicOn = true, mus = null, out = null, nbuf = null;
  try { muted = localStorage.getItem('hoops3d:mute') === '1'; musicOn = localStorage.getItem('hoops3d:music') !== '0'; } catch (e) {}
  const ok = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = muted ? 0 : .5; master.connect(ac.destination); bus = ac.createGain(); bus.gain.value = musicOn ? .5 : 0; bus.connect(master); } catch (e) { return false; } } if (ac.state === 'suspended') ac.resume(); return true; };
  function tone(f0, dur, type = 'sine', vol = .15, f1 = null, delay = 0) { if (!ok()) return; const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(out || master); o.start(t); o.stop(t + dur + .02); }
  function noise(dur, vol, f0, f1, type = 'bandpass', delay = 0) { if (!ok()) return; if (!nbuf) { nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } const t = ac.currentTime + delay, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = nbuf; s.loop = true; fl.type = type; fl.frequency.setValueAtTime(f0, t); if (f1) fl.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur); s.connect(fl); fl.connect(g); g.connect(out || master); s.start(t, Math.random()); s.stop(t + dur + .02); }
  const N = m => 440 * Math.pow(2, (m - 69) / 12);
  return {
    get muted() { return muted; }, get musicOn() { return musicOn; },
    setMuted(v) { muted = v; try { localStorage.setItem('hoops3d:mute', v ? '1' : '0'); } catch (e) {} if (master) master.gain.value = v ? 0 : .5; },
    setMusic(v) { musicOn = v; try { localStorage.setItem('hoops3d:music', v ? '1' : '0'); } catch (e) {} if (bus) bus.gain.setTargetAtTime(v ? .5 : 0, ac.currentTime, .05); },
    unlock() { ok(); }, click() { tone(660, .06, 'square', .06, 990); },
    throw(p) { noise(.22, .12 + p * .1, 500, 2600 + p * 1500, 'bandpass'); }, clank() { tone(1100, .08, 'triangle', .1, 700); noise(.05, .06, 3000, null, 'highpass'); },
    make(combo) { tone(N(72 + Math.min(combo, 10)), .14, 'triangle', .16); tone(N(79 + Math.min(combo, 10)), .18, 'sine', .1, null, .06); },
    swish() { noise(.3, .12, 5000, 1500, 'highpass'); tone(N(91), .3, 'sine', .08, null, .05); },
    miss() { tone(130, .18, 'sine', .2, 60); noise(.08, .06, 600, 250, 'lowpass'); }, tick() { tone(1200, .04, 'square', .05); },
    count() { tone(520, .14, 'triangle', .14); }, go() { tone(784, .3, 'triangle', .16, 1175); },
    end() { [84, 79, 76, 72].forEach((m, i) => tone(N(m), .3, 'triangle', .12, null, i * .14)); },
    music(on) {
      if (!ok()) return; if (!on) { if (mus) { clearInterval(mus.t); mus = null; } return; } if (mus) return;
      const st = 60 / 112 / 4, ROOT = [45, 41, 43, 40], CH = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 56, 59]];
      mus = { step: 0, next: ac.currentTime + .1, hot: false, t: null };
      mus.t = setInterval(() => { while (mus && mus.next < ac.currentTime + .3) { const i = mus.step, bar = Math.floor(i / 16) % 4, k = i % 16, d = mus.next - ac.currentTime; out = bus;
        if (k % 4 === 0) { tone(N(ROOT[bar]), st * 3.5, 'triangle', .11, null, d); tone(110, .1, 'sine', .2, 45, d); }
        if (k % 4 === 2) noise(.04, .04, 6000, null, 'highpass', d);
        if (k % 2 === 1) tone(N(CH[bar][(k >> 1) % 3] + 12), st * .8, 'square', .026, null, d);
        if (mus.hot && k % 2 === 0) tone(900, .03, 'square', .025, null, d);
        out = null; mus.step++; mus.next += st; } }, 60);
    },
    hot(v) { if (mus) mus.hot = v; }
  };
})();
{ const mb = $('sndB'), sync = () => { mb.textContent = SFX.muted ? '音效：關' : '音效：開'; mb.classList.toggle('off', !SFX.muted); }; sync(); mb.onclick = () => { SFX.unlock(); SFX.setMuted(!SFX.muted); sync(); SFX.click(); };
  const xb = $('musB'), xs = () => { xb.textContent = SFX.musicOn ? '音樂：開' : '音樂：關'; xb.classList.toggle('off', !SFX.musicOn); }; xs(); xb.onclick = () => { SFX.unlock(); SFX.setMusic(!SFX.musicOn); xs(); SFX.click(); }; }

// ───────── 3D 場景 ─────────
const cv = $('c3'), stage = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.shadowMap.enabled = true;
const mq = matchMedia('(prefers-color-scheme: dark)'); let DARK = isDarkNow();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfe0f4); scene.fog = new THREE.Fog(0xcfe0f4, 40, 80);
const camera = new THREE.PerspectiveCamera(40, 5 / 3, .1, 200);
camera.position.set(10, 5.4, 19); camera.lookAt(10, 3.9, 0);
const hemi = new THREE.HemisphereLight(0xf2f5fa, 0x9aa7bd, .78); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3df, .55); sun.position.set(6, 16, 12); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 12, bottom: -8, near: 1, far: 50 }); scene.add(sun);
const M = c => new THREE.MeshLambertMaterial({ color: c });
const box = (w, h, d, col, x, y, z, parent = scene, shadow = true) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(col)); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m; };
const edge = m => { const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x182e54 })); m.add(e); return m; };
const redraws = [];
const canvasTex = (w, h, draw, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; redraws.push(() => { const g = c.getContext('2d'); g.clearRect(0, 0, w, h); draw(g, w, h); t.needsUpdate = true; }); if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; };

// 地板（淡灰格線）
{ const t = canvasTex(128, 128, (g, w, h) => { g.fillStyle = DARK ? '#2f5a46' : '#b4bdcc'; g.fillRect(0, 0, w, h); g.strokeStyle = DARK ? 'rgba(190,250,215,.22)' : 'rgba(24,46,84,.12)'; g.lineWidth = 3; g.strokeRect(0, 0, w, h); }, [30, 14]);

function resize() { const w = stage.clientWidth, h = Math.round(w * 3 / 5); renderer.setSize(w, h, false); }

// ───────── 遊戲狀態 ─────────

  $('rankChip').textContent = titleFor(save.best); $('who').textContent = TOKEN() ? '已登入，成績會記在你的帳號下' : '尚未登入：成績會顯示為「未登入」';

async function start() {

// 輸入：拖曳往左下、放開投出（與 2D 版同一個手感）
function pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

function onEvent(ev, b) {

    '<div class="lb" id="lb"><h3><span>今日排行（驗證中…）</span></h3></div><div><button class="pk big" id="againB" type="button">再丟一次</button></div>';

const esc = v => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function showBoard(range, info) {

    (rows ? (rows.length ? rows.slice(0, 10).map(r => '<div class="r"><i>' + r.rank + '</i><span>' + esc(r.name) + '</span><b>' + r.score + '</b></div>').join('') : '<div class="r"><span>還沒有人上榜</span></div>') : '<div class="r"><span>排行榜暫時連不上</span></div>') +
    (info && range === 'today' ? '<div class="r me"><i>你</i><span>今日第 ' + info.rank + ' 名（今日最佳 ' + info.dayBest + '）</span><b>' + info.score + '</b></div>' : '');

// ───────── 主迴圈 ─────────
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (phase === 'play' && G) {
    acc += dt; while (acc >= 1 / 60 && phase === 'play') { acc -= 1 / 60; tickOnce(); }
    if (G) { const left = Math.max(0, DURATION - G.tick / 60); $('hTime').textContent = Math.ceil(left) + ' 秒'; $('barI').style.width = left / DURATION * 100 + '%'; const hot = left <= 10; $('bar').classList.toggle('hot', hot); SFX.hot(hot); if (hot && Math.ceil(left) !== G.tickAt) { G.tickAt = Math.ceil(left); SFX.tick(); }
      const ws = G.tick / 60 >= PHASES.windFrom; $('wind').style.display = ws ? 'block' : 'none'; if (ws) $('wind').textContent = '風　' + (G.wind === 0 ? '無' : (G.wind > 0 ? '→ ' : '← ') + '■'.repeat(Math.abs(G.wind / 45))); }
  }

  const b = G && G.ball;

  const arm = thrower.userData.arm; if (G && G.armT > 0) { G.armT -= dt; arm.rotation.z = -.3 + (1 - G.armT / .25) * -1.6; } else arm.rotation.z += ((drag ? .9 : -.3) - arm.rotation.z) * Math.min(1, dt * 10);

    const sc = pxPerWorld(), px = (drag.ox - drag.x) / sc, py = (drag.oy - drag.y) / sc, len = Math.hypot(px, py);
    if (len >= 18) { const l = launchVelocity(px, py), path = previewPath(l.vx, l.vy, G.wind); dots.forEach((d, i) => { const p = path[i]; d.visible = !!p; if (p) d.position.set(wx(p.x), wy(p.y), 0); });
      $('power').style.display = 'block'; $('powerI').style.width = l.power * 100 + '%'; $('powerI').style.background = l.power > .85 ? '#d9534f' : '#4caf6a'; } else { $('power').style.display = 'none'; dots.forEach(d => d.visible = false); }
  }
  for (let i = bits.length - 1; i >= 0; i--) { const p = bits[i]; p.t += dt; p.vy -= 12 * dt; p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt; p.m.rotation.x += dt * 6; p.m.rotation.y += dt * 5; if (p.t > p.life || p.m.position.y < 0) { scene.remove(p.m); bits.splice(i, 1); } }
  const sw = Math.sin(performance.now() / 4000) * .35; camera.position.x = 10 + sw; camera.lookAt(10, 3.9, 0);
  renderer.render(scene, camera);
}
$('startB').onclick = start;
