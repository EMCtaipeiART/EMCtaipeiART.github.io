<!doctype html>
<!-- 設計需求系統 v5.0 新版首頁（試作）。現行系統仍是 index.html；這一頁與它共用登入（localStorage 的 designRequestEditor*）與同一個 Worker。
     資料：案件、客戶別、人員頭像、加權表（設計種類／階段）、修改紀錄都讀公開的 backend/data/db.json；
     設計師狀態／等級稱號讀 Worker 的 pixelOfficeState；新增案件走 Worker 的 add／batchAdd，寄信走 sendCaseMail。
     畫面分成四個「頁」（不用彈窗）：board 列表、form 填寫、mail 信件編輯、detail 案件詳情。 -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>設計需求系統 v5.0</title>
  <link rel="icon" type="image/png" href="assets/EMC_design_logo.ico" />
  <link rel="preconnect" href="https://machi-design-api.machi-chen.workers.dev" crossorigin />
  <script>
    (()=>{try{document.documentElement.dataset.theme=localStorage.getItem('designRequestThemeV1')==='dark'?'dark':'light'}catch(err){document.documentElement.dataset.theme='light'}})();
  </script>
  <style>
    :root{
      --brand:#159E31;--brand-deep:#0f7f27;--brand-soft:#e8f6ec;
      --bg:#f5f7f6;--panel:#ffffff;--ink:#17211d;--muted:#6b7772;--faint:#98a39e;--line:#e3e9e5;
      /* 狀態配色沿用現行系統：未開始紅、執行中黃、過稿中藍、修改中橘、已完成綠 */
      --st-todo:#e11d48;--st-todo-bg:#fff1f2;--st-todo-ink:#be123c;--st-todo-line:#fecdd3;
      --st-doing:#f5b800;--st-doing-bg:#fff7cc;--st-doing-ink:#9a6500;--st-doing-line:#fde68a;
      --st-review:#0ea5e9;--st-review-bg:#e0f2fe;--st-review-ink:#0369a1;--st-review-line:#bae6fd;
      --st-revise:#f97316;--st-revise-bg:#feece0;--st-revise-ink:#a14503;--st-revise-line:#fdd6ba;
      --st-done:#22c55e;--st-done-bg:#dcfce7;--st-done-ink:#166534;--st-done-line:#bbf7d0;
      --st-cancel:#9ca3af;--st-cancel-bg:#f3f4f6;--st-cancel-ink:#4b5563;--st-cancel-line:#d1d5db;
      --shadow:0 10px 30px rgba(18,38,28,.08);--shadow-lg:0 22px 50px rgba(18,38,28,.18);
      --rail:76px;
    }
    html[data-theme="dark"]{
      --bg:#141817;--panel:#1d2321;--ink:#e9efec;--muted:#a3aeaa;--faint:#78837f;--line:#2c3431;
      --brand-soft:#173323;--shadow:0 10px 30px rgba(0,0,0,.35);--shadow-lg:0 22px 50px rgba(0,0,0,.55);
      --st-todo-bg:#3d1d24;--st-todo-ink:#ffb4c0;--st-todo-line:#5c2a35;
      --st-doing-bg:#3a3213;--st-doing-ink:#f6dc7a;--st-doing-line:#5c4f1c;
      --st-review-bg:#13303f;--st-review-ink:#8fd3f4;--st-review-line:#1d4a60;
      --st-revise-bg:#3a2515;--st-revise-ink:#ffc596;--st-revise-line:#5c3a20;
      --st-done-bg:#16301f;--st-done-ink:#8fe0a5;--st-done-line:#24502f;
      --st-cancel-bg:#262b2a;--st-cancel-ink:#b4bdb9;--st-cancel-line:#3a4140;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit;color:inherit}
    a{color:inherit}
    [hidden]{display:none!important}

    /* 左側窄欄 */
    .rail{position:fixed;inset:0 auto 0 0;width:var(--rail);z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;background:var(--panel);border-right:1px solid var(--line)}
    .rail-logo{width:42px;height:42px;border-radius:12px;margin-bottom:14px;display:block}
    .rail-item{width:60px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 7px;border-radius:14px;border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;text-decoration:none;cursor:pointer}
    .rail-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .rail-item:hover{background:var(--brand-soft);color:var(--brand-deep)}
    html[data-theme="dark"] .rail-item:hover{color:#8fe0a5}
    .rail-item.is-active{background:var(--brand-soft);color:var(--brand)}
    .rail-spacer{flex:1}
    .rail-version{font-size:10.5px;color:var(--faint);font-weight:700}
    .rail-login{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:8px}
    .login-avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--muted);display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:0;font-size:16px;font-weight:900}
    .login-avatar:hover,.login-avatar:focus-visible{border-color:var(--brand);outline:none}
    .login-avatar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .login-avatar img{width:100%;height:100%;object-fit:cover}
    .login-avatar.is-in{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
    .login-label{font-size:10.5px;color:var(--muted);font-weight:700;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .login-menu{position:absolute;left:calc(100% + 10px);bottom:0;min-width:190px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:60}
    .login-menu b{display:block;font-size:14px;font-weight:900}
    .login-menu small{display:block;margin:2px 0 10px;color:var(--muted);font-weight:700;font-size:12px}
    .login-menu button{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:13px;cursor:pointer;margin-top:6px}
    .login-menu button:hover{background:var(--bg)}
    main{margin-left:var(--rail)}

    /* 綠色主視覺 */
    .hero{position:relative;z-index:5;background:radial-gradient(1200px 500px at 50% -10%,#2bbf4c 0%,var(--brand) 45%,var(--brand-deep) 100%);color:#fff;padding:64px 24px 54px;text-align:center}
    .hero h1{margin:0 0 26px;font-size:clamp(26px,4vw,40px);font-weight:900;letter-spacing:.02em}
    .prompt-slot{max-width:720px;margin:0 auto}
    .prompt.is-stuck{position:fixed;top:12px;z-index:60;margin:0;box-shadow:0 12px 30px rgba(0,0,0,.28)}
    .prompt{position:relative;display:flex;align-items:center;gap:6px;max-width:720px;height:62px;margin:0 auto;padding:7px 8px 7px 16px;border-radius:20px;background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.18);color:#17211d}
    .prompt:focus-within{box-shadow:0 14px 34px rgba(0,0,0,.18),0 0 0 4px rgba(255,255,255,.45)}
    .prompt-plus{position:absolute;left:16px;top:50%;transform:translateY(-50%);pointer-events:none;z-index:1;width:30px;height:30px;fill:none;stroke:var(--brand);stroke-width:2.6;stroke-linecap:round}
    .prompt select{flex:1;min-width:0;height:100%;border:0;background:transparent;font-size:16px;font-weight:700;color:#17211d;outline:none;cursor:pointer;padding:0 34px 0 46px;margin-left:-16px;border-radius:14px;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237b8a83' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
    .prompt select.is-empty{color:#8a968f;font-weight:500}
    .prompt select option{color:#17211d}
    .prompt-go{flex:0 0 auto;height:46px;padding:0 22px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
    .prompt-go:hover{background:var(--brand-deep)}
    .prompt-go:disabled{opacity:.45;cursor:not-allowed}
    .prompt-hint{margin:10px 0 0;font-size:12.5px;color:rgba(255,255,255,.85);font-weight:600;min-height:1.4em}

    .team{display:flex;justify-content:center;flex-wrap:wrap;gap:22px 30px;margin:34px auto 0;max-width:820px;padding:0;list-style:none;max-height:260px;transition:max-height .35s ease,opacity .25s ease,margin-top .35s ease}
    .team.is-collapsed{max-height:0;opacity:0;margin-top:0;overflow:hidden;pointer-events:none}
    .member{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;width:92px}
    .avatar-btn{position:relative;width:84px;height:84px;padding:0;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:#fff;cursor:pointer;box-shadow:0 10px 22px rgba(0,0,0,.18);transition:transform .18s ease,box-shadow .18s ease;overflow:visible}
    .avatar-btn:hover,.avatar-btn:focus-visible{transform:translateY(-4px);box-shadow:0 16px 30px rgba(0,0,0,.24);outline:none}
    .avatar-clip{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#fff;display:grid;place-items:center}
    .avatar-clip img.head{width:112%;height:auto;margin-top:18%}
    .avatar-clip img.head.is-short{width:96%;margin-top:6%}
    .avatar-clip img.status-icon{width:66%;height:66%;object-fit:contain}
    .member.is-away .avatar-clip{background:#eef2f0}
    .member.is-away .avatar-btn{border-color:rgba(255,255,255,.55)}
    .avatar-badge{position:absolute;right:-4px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--brand);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.18)}
    .avatar-badge img{width:22px;height:22px;object-fit:contain}
    .avatar-plus{display:grid;place-items:center;background:rgba(255,255,255,.16);border:3px dashed rgba(255,255,255,.85);color:#fff}
    .avatar-plus svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
    .avatar-plus:hover,.avatar-plus:focus-visible{background:rgba(255,255,255,.26)}
    .member-name{font-size:14px;font-weight:800;line-height:1.2}
    .member-status{margin-top:-4px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.85)}

    /* 浮動資料卡 */
    .hover-card{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);width:260px;z-index:40;padding:14px 16px;border-radius:16px;background:var(--panel);color:var(--ink);text-align:left;box-shadow:var(--shadow-lg);border:1px solid var(--line);opacity:0;visibility:hidden;transition:opacity .16s ease,visibility .16s;pointer-events:none}
    .hover-card::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;background:var(--panel);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
    .member.is-open .hover-card{opacity:1;visibility:visible;pointer-events:auto}
    .hc-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
    .hc-name{font-size:16px;font-weight:900}
    .hc-level{font-size:13px;font-weight:900;color:var(--brand)}
    .hc-title{margin-top:2px;font-size:12px;color:var(--muted);font-weight:700}
    .hc-xp{height:7px;margin:9px 0 4px;border-radius:99px;background:var(--line);overflow:hidden}
    .hc-xp span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#2bbf4c,var(--brand))}
    .hc-xp-text{font-size:11px;color:var(--faint);font-weight:700}
    .hc-section{margin-top:11px;font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.04em}
    .hc-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
    .hc-count{padding:7px 0;border-radius:10px;background:var(--bg);text-align:center}
    .hc-count b{display:block;font-size:17px;line-height:1.1}
    .hc-count small{font-size:10.5px;color:var(--muted);font-weight:700}
    .hc-status{margin-top:10px;font-size:12px;font-weight:700;color:var(--muted)}

    /* 白底內容區 */
    .stage-wrap{max-width:1360px;margin:0 auto;padding:34px 28px 60px}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
    .section-head h2{margin:0;font-size:24px;font-weight:900}
    .section-head p{margin:4px 0 0;color:var(--muted);font-size:13px;font-weight:600}
    .section-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .board-sync{font-size:12px;color:var(--faint);font-weight:700}
    .seg-btns{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
    .seg-btns button{height:38px;padding:0 12px;border:0;background:transparent;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .seg-btns button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .seg-btns button.on{background:var(--brand-soft);color:var(--brand-deep)}
    .tool-btn{height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:800;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .tool-btn:hover{background:var(--bg)}
    .tool-btn.on{border-color:var(--brand);color:var(--brand-deep);background:var(--brand-soft)}
    .tool-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .filter-wrap{position:relative}
    .filter-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:45;width:min(380px,calc(100vw - 32px));padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-lg);display:grid;gap:14px}
    .filter-pop h4{margin:0 0 8px;font-size:12.5px;color:var(--muted);font-weight:900}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chips label{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;font-weight:700;cursor:pointer;user-select:none}
    .chips input{accent-color:var(--brand);margin:0}
    .chips label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
    .filter-foot{display:flex;justify-content:space-between;align-items:center}
    .filter-foot button{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:13px;cursor:pointer}
    .search{position:relative}
    .list-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
    .list-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:1180px}
    .list-table th{position:sticky;top:0;background:#f0f6f3;color:#43524b;font-size:13px;font-weight:900;padding:13px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
    html[data-theme="dark"] .list-table th{background:#242c29;color:#c3cbc8}
    .list-table td{padding:11px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700;vertical-align:middle}
    .list-table tr:hover td{background:color-mix(in srgb,var(--brand-soft) 55%,transparent)}
    .list-table td.lt-link{cursor:pointer}
    .list-table td.lt-link:hover{color:var(--brand-deep);text-decoration:underline}
    .list-table td.l{text-align:left;min-width:220px;max-width:300px}
    .list-wrap{cursor:grab;user-select:none}
    .list-wrap.is-grabbing{cursor:grabbing}
    .list-table th[draggable]{cursor:move}
    .list-table th.col-dragging{opacity:.4}
    .list-table th.col-over{box-shadow:inset 3px 0 0 var(--brand)}
    .lt-edit{cursor:pointer;transition:box-shadow .12s}
    .cell-pop{position:fixed;z-index:240;width:min(320px,calc(100vw - 24px));max-height:min(360px,calc(100vh - 24px));overflow:auto;border:1px solid #e3e9e5;border-radius:14px;background:#fff;color:#17211d;box-shadow:0 12px 30px rgba(16,24,40,.10);padding:10px}
    .cell-pop h3{margin:0 0 8px;font-size:14px;font-weight:900}
    .cell-pop .option-list{display:grid;gap:6px}
    .cell-pop .empty{padding:10px 4px;color:#6b7772;font-size:13px;font-weight:700}
    .cell-pop button.option{width:100%;display:flex;justify-content:space-between;align-items:center;background:#f8fbf9;color:#17211d;border:1px solid #e3e9e5;border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700;text-align:left;cursor:pointer}
    .cell-pop button.option:hover{background:#eef6f1}
    .cell-pop button.option.active{border-color:#9bd4b4;background:#e7f6ef;color:#0f5138}
    .cell-pop button.option b{font-weight:900}
    .cell-pop label.option{display:flex;align-items:center;gap:8px;border:1px solid #e3e9e5;border-radius:10px;padding:8px 10px;background:#f8fbf9;font-weight:700;font-size:14px;cursor:pointer}
    .cell-pop input{width:auto;min-height:auto;margin:0;accent-color:#159E31}
    .cell-pop .status-option{border-radius:999px;justify-content:center;gap:8px;font-weight:900}
    .cell-pop .status-option.active{box-shadow:inset 0 0 0 2px rgba(31,41,55,.12)}
    .cell-pop button.option.status-option.st-todo{background:#fff1f2;color:#be123c;border-color:#fecdd3}
    .cell-pop button.option.status-option.st-doing{background:#fff7cc;color:#9a6500;border-color:#fde68a}
    .cell-pop button.option.status-option.st-review{background:#e0f2fe;color:#0369a1;border-color:#bae6fd}
    .cell-pop button.option.status-option.st-revise{background:#feece0;color:#a14503;border-color:#fdd6ba}
    .cell-pop button.option.status-option.st-done{background:#dcfce7;color:#166534;border-color:#bbf7d0}
    .cell-pop button.option.status-option.st-cancel{background:#f1f3f2;color:#6b7280;border-color:#e5e7eb}
    .cell-pop .popover-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
    .cell-pop .popover-actions button{min-height:34px;border-radius:10px;padding:0 16px;font-weight:800;font-size:13px;cursor:pointer;border:1px solid #e3e9e5;background:#fff;color:#17211d}
    .cell-pop .popover-actions button[data-cp-details]{background:#159E31;border-color:#159E31;color:#fff}
    .lt-id{color:#119466;font-weight:900;font-size:13px}
    .lt-proj{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
    .lt-qty,.lt-date{font-variant-numeric:tabular-nums}
    .lt-name,.lt-detail,.lt-rev,.lt-type,.lt-stage,.lt-status{display:inline-flex;align-items:center;justify-content:center;min-height:26px;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:850;line-height:1.15;white-space:nowrap;border:1px solid transparent}
    .lt-name{background:#f3f4f6;color:#4b5563;border-color:#e5e7eb}
    .lt-detail{background:#fff;color:#344641;border-color:var(--line);max-width:170px;overflow:hidden;text-overflow:ellipsis;display:inline-block;line-height:18px}
    .lt-rev{background:#d1d5db;color:#17211d;min-width:44px;padding:4px 10px}
    .lt-rev.is-draft{background:#fff;border-color:var(--line)}
    .lt-dash{color:var(--faint)}
    .lt-status{font-weight:900;font-size:13px;padding:4px 14px;border-width:1px}
    .lt-status.st-todo{background:#fee2e2;color:#991b1b;border-color:#fecaca}
    .lt-status.st-doing{background:#fef9c3;color:#854d0e;border-color:#fde68a}
    .lt-status.st-review{background:#e0f2fe;color:#0369a1;border-color:#bae6fd}
    .lt-status.st-revise{background:#feece0;color:#a14503;border-color:#fdd6ba}
    .lt-status.st-done{background:#dcfce7;color:#166534;border-color:#bbf7d0}
    .lt-status.st-cancel{background:#f3f4f6;color:#4b5563;border-color:#e5e7eb}
    .lt-type-平面{background:#fdeef4;color:#9f4566;border-color:#f7d5e0}
    .lt-type-影音{background:#eaf4ff;color:#25638f;border-color:#cfe6fb}
    .lt-type-採購{background:#fff4df;color:#8a5a00;border-color:#f4dfad}
    .lt-stage{background:#f3eefd;color:#6d4a9d;border-color:#e3d8f6}
    .lt-stage-再製{background:#f1e8ff;color:#6b21a8;border-color:#d8b4fe}
    .lt-stage-前製{background:#f4f0ff;color:#694aa5;border-color:#e4dafb}
    .lt-stage-印刷{background:#fff7e6;color:#8b6508;border-color:#f2dfb4}
    .lt-stage-後製,.lt-stage-新製{background:#eef8f3;color:#21724d;border-color:#d5eadf}
    .lt-stage-拍攝{background:#fff0f5;color:#a74469;border-color:#f8d6e3}
    .lt-stage-提案{background:#eef7ff;color:#27617f;border-color:#d5eafa}
    .lt-stage-結案{background:#f1f5f4;color:#596963;border-color:#dde7e3}
    html[data-theme="dark"] .lt-name,html[data-theme="dark"] .lt-detail,html[data-theme="dark"] .lt-rev{background:#2a2f2e;color:#c3cbc8;border-color:#3a4140}
    .list-table tr:last-child td{border-bottom:0}
    .search input{height:38px;width:230px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 12px 0 34px;font-size:13.5px;font-weight:600;outline:none}
    .search input:focus{border-color:var(--brand)}
    .search svg{position:absolute;left:11px;top:50%;width:16px;height:16px;transform:translateY(-50%);fill:none;stroke:var(--faint);stroke-width:2.2;stroke-linecap:round}

    .block-title{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:17px;font-weight:900}
    .block-title small{font-size:12px;color:var(--muted);font-weight:700}
    .latest{margin-bottom:34px}
    .latest-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
    .column{border-radius:22px;background:color-mix(in srgb,var(--panel) 55%,var(--bg));border:1px solid var(--line);padding:14px 12px}
    .column-head{display:flex;align-items:center;gap:8px;padding:2px 6px 10px}
    .column-dot{width:10px;height:10px;border-radius:50%}
    .column-title{font-size:15.5px;font-weight:900}
    .column-count{margin-left:auto;font-size:12px;font-weight:800;color:var(--muted);padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel)}
    .column-bar{height:5px;border-radius:99px;margin:0 6px 12px}
    .cards{display:grid;gap:12px}
    .more-btn{width:100%;margin-top:14px;height:40px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-weight:800;font-size:13px;cursor:pointer}
    .more-btn:hover{background:var(--panel)}
    .empty{padding:26px 10px;text-align:center;color:var(--faint);font-size:13px;font-weight:700}
    .skeleton{height:110px;border-radius:18px;background:linear-gradient(90deg,var(--line),var(--panel),var(--line));background-size:200% 100%;animation:shimmer 1.2s infinite}
    @keyframes shimmer{to{background-position:-200% 0}}

    /* 卡牌 */
    .card{position:relative;display:block;width:100%;text-align:left;padding:14px 15px 12px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;overflow:hidden}
        .card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow-lg);outline:none}
    .card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
    .id-pill{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand-deep);font-variant-numeric:tabular-nums;letter-spacing:.02em}
    html[data-theme="dark"] .id-pill{color:#8fe0a5}
    .client-text{font-size:12.5px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
    .chip{margin-left:auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;border:1px solid transparent}
    .chip.late{margin-left:0;background:#ffe3e3;color:#b42318;border-color:#fecaca}
    html[data-theme="dark"] .chip.late{background:#3d1d1d;color:#ffb4b4;border-color:#5c2a2a}
    .card-title{margin:0;font-size:15px;font-weight:800;line-height:1.45;overflow-wrap:anywhere}
    .progress{margin-top:12px}
    .progress-label{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:5px}
    .progress-track{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
    .progress-track span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#a3e635 0%,#facc15 50%,#f97316 100%);background-repeat:no-repeat;transition:width .4s ease}
    
    .card-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;margin-top:12px}
    .faces{display:flex;align-items:center}
    .face{position:relative;width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);background:var(--brand-soft);display:grid;place-items:center;overflow:hidden;font-size:12px;font-weight:900;color:var(--brand-deep)}
    .face+.face{margin-left:-8px}
    .face img{width:100%;height:100%;object-fit:cover}
    .face img.head{width:118%;height:auto;object-fit:contain;margin-top:8%}
    .face img.head.is-short{width:100%;margin-top:4%}
    .face.is-designer{background:#fff}
    .card-info{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:4px 6px;margin:8px 0 0}
    .card-qty{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
    .card-info span{font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
    .card-info .ci-type{background:#e0e7ff;color:#3730a3;border-color:#c7d2fe}
    .card-info .ci-g-re{background:#e0f2fe;color:#075985;border-color:#bae6fd}
    .card-info .ci-v-re{background:#f3e8ff;color:#6b21a8;border-color:#e9d5ff}
    html[data-theme="dark"] .card-info .ci-g-re{background:#13303f;color:#8fd3f4;border-color:#1d4a60}
    html[data-theme="dark"] .card-info .ci-v-re{background:#3b1f52;color:#e9d5ff;border-color:#563078}
    .stick-band{position:fixed;top:0;left:var(--rail);right:0;height:86px;z-index:55;background:linear-gradient(90deg,var(--brand-deep),var(--brand));box-shadow:0 8px 22px rgba(0,0,0,.16);opacity:0;pointer-events:none;transition:opacity .2s}
    .stick-band.show{opacity:1}
    .card-info .ci-video{background:#fce7f3;color:#9d174d;border-color:#fbcfe8}
    html[data-theme="dark"] .card-info .ci-video{background:#4a1d36;color:#fbcfe8;border-color:#6b2a4d}
    .card-info .ci-date{background:#fef3c7;color:#92400e;border-color:#fde68a}
    .card-info .ci-qty{background:#ccfbf1;color:#0f766e;border-color:#99f6e4}
    html[data-theme="dark"] .card-info .ci-type{background:#25285a;color:#c7d2fe;border-color:#363b80}
    html[data-theme="dark"] .card-info .ci-date{background:#3a2f12;color:#fde68a;border-color:#5c4a1c}
    html[data-theme="dark"] .card-info .ci-qty{background:#12332f;color:#99f6e4;border-color:#1d514a}
    .card[draggable="true"]{cursor:grab}
    .card.dragging{opacity:.4}
    .column.drop-ok{outline:2px dashed var(--brand);outline-offset:-4px;background:var(--brand-soft)}
    .no-hero .hero{display:none}
    .no-hero .stage-wrap{padding-top:30px}
    .stage-wrap.wide{max-width:1760px}
    .board.five{grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
    .board.five .column:nth-child(-n+3){grid-column:span 2}
    .board.five .column:nth-child(n+4){grid-column:span 3}
    .drag-note{font-size:12.5px;color:var(--muted);font-weight:700;margin:-6px 0 14px}
    .detail-pick{display:grid;gap:8px;max-height:46vh;overflow:auto;margin:8px 0}
    .detail-pick label{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:14px;cursor:pointer}
    .detail-pick input{accent-color:var(--brand);width:17px;height:17px;margin:0}
    .detail-pick label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
    .login-page{max-width:420px;margin:30px auto;padding:34px 30px 28px;border-radius:24px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);text-align:center}
    .login-page img.lp-logo{width:64px;height:64px;border-radius:18px;margin-bottom:12px}
    .login-page h2{margin:0 0 4px;font-size:22px;font-weight:900}
    .login-page p.lp-sub{margin:0 0 22px;color:var(--muted);font-size:13.5px;font-weight:600}
    .google-btn{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:15px;cursor:pointer}
    .google-btn:hover{background:var(--bg)}
    .google-btn b{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:#4285f4;font-size:14px}
    .lp-toggle{margin-top:16px;background:none;border:0;color:var(--muted);font-weight:800;font-size:13px;cursor:pointer}
    .lp-form{display:grid;gap:10px;margin-top:12px;text-align:left}
    .lp-form .input{background:var(--bg)}
    .lp-error{margin-top:14px;font-size:13px;font-weight:700;color:#b42318;line-height:1.55}
    .lp-note{margin-top:14px;font-size:12px;color:var(--faint);font-weight:600}
    .card-meta{font-size:11px;font-weight:800;line-height:1.4;white-space:nowrap;padding:3px 10px;border-radius:99px;border:1px solid transparent;background:var(--bg);color:var(--muted)}
    .card-meta.client-pill{background:#f1f3f2;color:#4b5563;border-color:#e0e4e2;overflow:hidden;text-overflow:ellipsis;max-width:60%;height:22px;line-height:16px;display:inline-flex;align-items:center;font-size:11px;white-space:nowrap;padding:0 9px}
    
    html[data-theme="dark"] .card-meta.client-pill{background:#2a2f2e;color:#c3cbc8;border-color:#3a4140}
    .card-meta.cd-ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}
    .card-meta.cd-soon{background:#fef9c3;color:#854d0e;border-color:#fde68a}
    .card-meta.cd-today{background:#ffedd5;color:#9a3412;border-color:#fed7aa}
    .card-meta.cd-late{background:#ffe3e3;color:#b42318;border-color:#fecaca}
    html[data-theme="dark"] .card-meta.cd-ok{background:#16301f;color:#8fe0a5;border-color:#24502f}
    html[data-theme="dark"] .card-meta.cd-soon{background:#3a3213;color:#f6dc7a;border-color:#5c4f1c}
    html[data-theme="dark"] .card-meta.cd-today{background:#3a2515;color:#ffc596;border-color:#5c3a20}
    html[data-theme="dark"] .card-meta.cd-late{background:#3d1d1d;color:#ffb4b4;border-color:#5c2a2a}
    .st-todo{--card-color:var(--st-todo)} .st-doing{--card-color:var(--st-doing)} .st-review{--card-color:var(--st-review)} .st-revise{--card-color:var(--st-revise)} .st-done{--card-color:var(--st-done)} .st-cancel{--card-color:var(--st-cancel)}
    .chip.st-todo,.pill.st-todo{background:var(--st-todo-bg);color:var(--st-todo-ink);border-color:var(--st-todo-line)}
    .chip.st-doing,.pill.st-doing{background:var(--st-doing-bg);color:var(--st-doing-ink);border-color:var(--st-doing-line)}
    .chip.st-review,.pill.st-review{background:var(--st-review-bg);color:var(--st-review-ink);border-color:var(--st-review-line)}
    .chip.st-revise,.pill.st-revise{background:var(--st-revise-bg);color:var(--st-revise-ink);border-color:var(--st-revise-line)}
    .chip.st-done,.pill.st-done{background:var(--st-done-bg);color:var(--st-done-ink);border-color:var(--st-done-line)}
    .chip.st-cancel,.pill.st-cancel{background:var(--st-cancel-bg);color:var(--st-cancel-ink);border-color:var(--st-cancel-line)}
    .pill{display:inline-block;font-size:12.5px;font-weight:800;padding:4px 12px;border-radius:99px;border:1px solid transparent}

    /* 通用「頁」外框：填寫／信件／詳情 */
    .page{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px 28px}
    .page-top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
    .back-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:13.5px;cursor:pointer}
    .back-btn:hover{background:var(--bg)}
    .page-title{margin:0;font-size:22px;font-weight:900}
    .page-sub{margin:2px 0 0;color:var(--muted);font-size:13px;font-weight:600}
    .notice{padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:700;line-height:1.55;margin-bottom:16px;background:var(--st-doing-bg);color:var(--st-doing-ink);border:1px solid var(--st-doing-line)}
    .notice.error{background:var(--st-todo-bg);color:var(--st-todo-ink);border-color:var(--st-todo-line)}
    .notice a{color:inherit;font-weight:900;text-decoration:underline}

    /* 表單 */
    .form-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px 18px}
    .field{display:grid;gap:6px;align-content:start;min-width:0}
    .field.c2{grid-column:span 2}.field.c3{grid-column:span 3}.field.c4{grid-column:span 4}.field.c6{grid-column:span 6}
    .field label,.field .label,.supp-item .label{font-size:13px;font-weight:800;color:var(--muted)}
    .field label b,.label b{color:#e11d48}
    .input,.field select,.field textarea{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:14.5px;font-weight:600;outline:none}
    .input:focus,.field select:focus{border-color:var(--brand);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
    .seg{display:flex;gap:8px;flex-wrap:wrap}
    .seg label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;user-select:none}
    .seg input{accent-color:var(--brand);width:17px;height:17px;margin:0}
    .seg label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
    html[data-theme="dark"] .seg label:has(input:checked){color:#8fe0a5}
    .supp{grid-column:span 6;border:1px solid var(--line);border-radius:14px;padding:0 16px;background:var(--bg)}
    .supp summary{padding:14px 0;font-weight:800;font-size:14px;cursor:pointer;color:var(--muted)}
    .supp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;padding-bottom:16px}
    .supp-item{display:grid;gap:6px}
    .supp-item .input{background:var(--panel)}
    .form-actions{display:flex;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 24px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:15px;cursor:pointer;text-decoration:none}
    .btn:hover{background:var(--bg)}
    .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .btn.primary:hover{background:var(--brand-deep)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn.ghost{border-style:dashed}
    .batch-box{grid-column:span 6;display:grid;gap:12px;border:1px dashed var(--line);border-radius:16px;padding:16px;background:color-mix(in srgb,var(--bg) 60%,var(--panel))}
    .batch-box h4{margin:0;font-size:14px;font-weight:900}
    .batch-box p{margin:0;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.55}
    .batch-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 14px;align-items:start;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
    .batch-row>h5{grid-column:1/-1;margin:0;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:900}
    .batch-row .field.c6,.batch-row .supp{grid-column:span 6}
    .batch-row .input,.batch-row select{min-height:42px;background:var(--bg);border-radius:10px;border:1px solid var(--line);padding:0 10px;font-size:14px;font-weight:600;width:100%}
    .batch-row .cal{z-index:35}
    .batch-del{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12.5px;font-weight:800;color:var(--muted)}
    .batch-del:hover{color:#e11d48}
    .batch-actions{display:flex;gap:10px;flex-wrap:wrap}
    /* AI 判斷階段 */
    .ai-modal{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:20px;background:rgba(10,20,14,.5)}
    .ai-card{width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:20px;background:var(--panel);box-shadow:var(--shadow-lg);padding:22px}
    .ai-card h3{margin:0 0 4px;font-size:18px;font-weight:900}
    .ai-sub{margin:0 0 14px;color:var(--muted);font-size:13px;font-weight:600;line-height:1.55}
    .ai-drop{display:grid;place-items:center;gap:6px;min-height:110px;border:2px dashed var(--line);border-radius:14px;background:var(--bg);cursor:pointer;text-align:center;padding:14px;font-size:13px;font-weight:700;color:var(--muted)}
    .ai-drop:hover,.ai-drop.over{border-color:var(--brand);background:var(--brand-soft)}
    .ai-drop b{color:var(--ink);font-size:14px}
    .ai-prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .ai-prev div{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
    .ai-prev img{width:100%;height:100%;object-fit:cover}
    .ai-prev button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
    .ai-err{color:#b42318;font-size:13px;font-weight:700;margin:10px 0 0}
    .ai-verdict{padding:14px;border-radius:14px;background:var(--brand-soft);margin-bottom:10px}
    .ai-verdict.is-rework{background:var(--st-revise-bg)}.ai-verdict.is-unknown{background:var(--bg)}
    .ai-verdict-head{display:flex;justify-content:space-between;font-weight:900;font-size:16px}
    .ai-verdict p{margin:6px 0 0;font-size:13.5px;line-height:1.6}
    .ai-detail{margin-top:10px;font-size:13px;line-height:1.6}
    .ai-detail b{display:block;font-size:12px;color:var(--muted)}
    .ai-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
    .ai-loading{display:grid;gap:12px;text-align:center;padding:26px 0;font-weight:800}
    .ai-loading small{color:var(--muted);font-weight:600}
    .spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .edit-actions{display:flex;gap:10px;flex-wrap:wrap}

    /* 日期區間（旅遊網站式） */
    .range{position:relative}
    .range-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;cursor:pointer;font-size:14.5px;font-weight:700}
    .range-btn:focus-visible,.range-btn[aria-expanded="true"]{border-color:var(--brand);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent);outline:none}
    .range-btn svg{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .range-text{flex:1;min-width:0}
    .range-days{font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap}
    .cal{position:absolute;z-index:30;top:calc(100% + 8px);left:0;padding:16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-lg);width:max-content;max-width:calc(100vw - 40px)}
    .cal-months{display:flex;gap:26px}
    .cal-month{width:252px}
    .cal-head{display:flex;align-items:center;justify-content:space-between;height:34px;margin-bottom:6px;font-weight:900;font-size:14.5px}
    .cal-nav{width:32px;height:32px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--muted);visibility:hidden}
    .cal-nav.show{visibility:visible}
    .cal-nav:hover{background:var(--bg)}
    .cal-week,.cal-days{display:grid;grid-template-columns:repeat(7,1fr)}
    .cal-week span{text-align:center;font-size:11.5px;font-weight:800;color:var(--faint);padding:4px 0}
    .cal-day{position:relative;height:36px;border:0;background:transparent;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink);padding:0}
    .cal-day span{position:relative;z-index:1;display:grid;place-items:center;width:34px;height:34px;margin:1px auto;border-radius:50%}
    .cal-day:hover span{background:var(--brand-soft)}
    .cal-day.out{visibility:hidden}
    .cal-day.past{color:var(--faint)}
    .cal-day.today span{box-shadow:inset 0 0 0 1.5px var(--brand)}
    .cal-day.in-range{background:var(--brand-soft)}
    .cal-day.range-start{background:linear-gradient(90deg,transparent 50%,var(--brand-soft) 50%)}
    .cal-day.range-end{background:linear-gradient(90deg,var(--brand-soft) 50%,transparent 50%)}
    .cal-day.range-start.range-end{background:transparent}
    .cal-day.range-start span,.cal-day.range-end span{background:var(--brand);color:#fff}
    .cal-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
    .cal-summary{font-size:13px;font-weight:800;color:var(--muted)}
    .cal-foot .btn{min-height:36px;padding:0 16px;font-size:13.5px;border-radius:10px}

    /* 信件編輯器 */
    .mail-head{display:grid;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
    .mail-row{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;border-bottom:1px solid var(--line);background:var(--panel)}
    .mail-row:last-child{border-bottom:0}
    .mail-row>span{padding:0 14px;font-size:13px;font-weight:800;color:var(--muted)}
    .mail-row input{border:0;background:transparent;min-height:46px;padding:0 14px 0 0;font-size:14.5px;font-weight:600;outline:none;width:100%}
    .mail-row .static{padding:12px 14px 12px 0;font-size:14px;font-weight:700;color:var(--muted)}
    .editor-tools{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
    .tool{min-width:36px;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:13.5px;cursor:pointer}
    .tool:hover{background:var(--bg)}
    .editor{min-height:340px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:18px 20px;font-size:14.5px;line-height:1.75;outline:none;overflow-wrap:anywhere}
    .editor:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
    .editor a{color:#2563eb}
    .signature{margin-top:12px;padding:14px 20px;border:1px dashed var(--line);border-radius:14px;font-size:13px;color:var(--muted);background:var(--bg)}
    .signature-label{display:block;font-size:11.5px;font-weight:800;margin-bottom:6px;color:var(--faint)}
    .queue-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
    .queue-step{font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;background:var(--brand-soft);color:var(--brand-deep)}
    .queue-bar .btn{min-height:36px;padding:0 16px;font-size:13.5px;border-radius:10px}

    /* 案件詳情 */
    .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
    .detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 0}
    .kv{padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
    .kv dt{font-size:11.5px;font-weight:800;color:var(--faint);margin-bottom:4px}
    .kv dd{margin:0;font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
    .person{display:flex;align-items:center;gap:8px}
    .person .face{margin:0;border-color:var(--bg)}
    .detail-sec{margin-top:22px}
    .detail-sec h3{margin:0 0 10px;font-size:16px;font-weight:900}
    .supp-list{display:grid;gap:8px}
    .supp-row{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-radius:12px;background:var(--bg);font-size:14px;font-weight:600}
    .supp-row b{flex:0 0 auto;min-width:64px;color:var(--muted);font-weight:800}
    .supp-row a{color:#2563eb;overflow-wrap:anywhere}
    .rev{padding:14px 16px;border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
    .rev-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
    .rev-no{font-weight:900;font-size:14px}
    .rev-meta{font-size:12px;color:var(--faint);font-weight:700}
    .rev-text{font-size:14px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap}
    .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .thumbs a{display:block;width:96px;height:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
    .thumbs img{width:100%;height:100%;object-fit:cover;display:block}

    /* 凱躍多元宇宙（舊版像素辦公室） */
    .universe{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(10,20,14,.55)}
    .universe-card{width:min(1040px,100%);border-radius:22px;background:var(--panel);box-shadow:var(--shadow-lg);overflow:hidden}
    .universe-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
    .universe-head h3{margin:0;font-size:18px;font-weight:900}
    .universe-close{width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;font-size:20px;line-height:1}
    .universe-frame{display:block;width:100%;aspect-ratio:16/10;max-height:calc(100vh - 110px);border:0;background:#eef8f2}

    .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:200;max-width:min(92vw,560px);padding:13px 20px;border-radius:14px;background:#17211d;color:#fff;font-size:14px;font-weight:700;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.error{background:#b42318}

    @media (max-width:1180px){.board.five{grid-template-columns:repeat(2,minmax(0,1fr))}.board.five .column:nth-child(n){grid-column:auto}.board{grid-template-columns:repeat(2,minmax(0,1fr))}.latest-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:980px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.field.c2,.field.c3,.field.c4{grid-column:span 1}.field.c6,.supp,.batch-box{grid-column:span 2}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.batch-row{grid-template-columns:repeat(2,minmax(0,1fr))}.batch-row .field.c2,.batch-row .field.c3,.batch-row .field.c4{grid-column:span 1}.batch-row .field.c6,.batch-row .supp{grid-column:span 2}}
    @media (max-width:720px){
      :root{--rail:0px}
      .rail{inset:auto 0 0 0;width:100%;height:64px;flex-direction:row;justify-content:space-around;padding:0 8px;border-right:0;border-top:1px solid var(--line)}
      .rail-logo,.rail-spacer,.rail-version{display:none}
      body{padding-bottom:64px}
      .hero{padding:44px 16px 40px}
      .prompt{height:auto;flex-wrap:wrap;padding:10px 12px}
      .prompt select{height:46px;flex:1 1 60%}
      .prompt-go{flex:1 1 100%}
      .team{gap:18px 14px}
      .member{width:76px}
      .avatar-btn{width:68px;height:68px}
      .hover-card{width:230px}
      .stage-wrap{padding:26px 16px 40px}
      .board,.board.five,.latest-grid{grid-template-columns:1fr}
      .page{padding:20px 16px}
      .form-grid{grid-template-columns:1fr}.field.c6,.supp,.batch-box{grid-column:span 1}
      .batch-row{grid-template-columns:1fr}.batch-row .field.c2,.batch-row .field.c3,.batch-row .field.c4,.batch-row .field.c6,.batch-row .supp{grid-column:span 1}
      .rail-login{position:static;margin:0}.login-avatar{width:38px;height:38px}.login-menu{position:fixed;left:auto;right:12px;bottom:72px}
      .supp-grid,.detail-grid{grid-template-columns:1fr}
      .cal-months{flex-direction:column;gap:12px}.cal-month{width:100%}.cal{left:0;right:0;width:auto}
      .mail-row{grid-template-columns:62px minmax(0,1fr)}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <nav class="rail" aria-label="主選單">

    <span class="rail-spacer"></span>

    <div class="rail-login" id="railLogin"></div>
  </nav>

  <main id="top">
    <section class="hero">
      <h1>你今天想設計些什麼呢？</h1>
      <div class="stick-band" id="stickBand"></div>
      <div class="prompt-slot" id="promptSlot"><form class="prompt" id="prompt">
        <svg class="prompt-plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>

  <div class="universe" id="universe" hidden>
    <div class="universe-card" role="dialog" aria-modal="true" aria-labelledby="universeTitle">
      <div class="universe-head"><h3 id="universeTitle">凱躍多元宇宙</h3><button type="button" class="universe-close" id="universeClose" aria-label="關閉">×</button></div>
      <div id="universeBody"></div>
    </div>
  </div>
  <div class="ai-modal" id="aiModal" hidden>
    <div class="ai-card" role="dialog" aria-modal="true" aria-labelledby="aiTitle"><h3 id="aiTitle">AI 判斷階段（beta）</h3><p class="ai-sub">上傳需求單截圖，AI 會判斷這是「新製」還是「再製」，再由你決定要填入哪一個。</p><div id="aiBody"></div></div>
  </div>
  <div class="ai-modal" id="detailModal" hidden>
    <div class="ai-card" role="dialog" aria-modal="true" aria-labelledby="dmTitle"><h3 id="dmTitle">選擇項目細節</h3><p class="ai-sub" id="dmSub"></p><div class="detail-pick" id="dmList"></div><div class="ai-actions"><button type="button" class="btn" data-dm="cancel">取消</button><button type="button" class="btn primary" data-dm="ok">確認並改為執行中</button></div></div>
  </div>
  <div class="lightbox" id="lightbox" hidden><button type="button" class="lb-btn lb-close" data-lb-act="close" aria-label="關閉">×</button><button type="button" class="lb-btn lb-prev" data-lb-act="prev" aria-label="上一張">‹</button><figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure><button type="button" class="lb-btn lb-next" data-lb-act="next" aria-label="下一張">›</button></div>
  <div class="cell-pop" id="cellPop" hidden></div>
  <div class="toast" id="toast" role="status"></div>

  <script>
  (()=>{
    'use strict';
    const API='https://machi-design-api.machi-chen.workers.dev/api';
    const DESIGNERS=['Machi','Anna','Amber','Leona','Noise'];
    const SHORT_HEADS=new Set(['Machi','Noise']); // 男生頭像圖只到下巴，顯示比例要另外調
    const STATUS_TEXT={present:'在座工作中',overtime:'加班中',lunch:'用餐中',meeting:'開會中',leave:'休假中',offwork:'已下班',toilet:'去廁所',abroad:'出國中',out:'公出工作中'};
    const WORKING=new Set(['present','overtime']);
    /* 狀態：顯示名稱、配色 class。「未執行」＝資料庫的「未開始」。 */
    const ST={'未開始':{label:'未執行',cls:'st-todo'},'執行中':{label:'執行中',cls:'st-doing'},'過稿中':{label:'過稿中',cls:'st-review'},'修改中':{label:'修改中',cls:'st-revise'},'已完成':{label:'已完成',cls:'st-done'},'已取消':{label:'已取消',cls:'st-cancel'},'暫停中':{label:'暫停中',cls:'st-cancel'}};
    const COLUMNS=[
      {key:'todo',title:'未執行',color:'var(--st-todo)',status:'未開始'},
      {key:'doing',title:'執行中',color:'var(--st-doing)',status:'執行中'},
      {key:'revise',title:'修改中',color:'var(--st-revise)',status:'修改中'},
      {key:'review',title:'過稿中',color:'var(--st-review)',status:'過稿中'},
      {key:'done',title:'已完成',color:'var(--st-done)',status:'已完成'}
    ];
    const PLATFORMS=['Facebook','Instagram','Line','其他平台'];
    const PLATFORM_SPECS={Facebook:'1:1，1200 x 1200px',Instagram:'4:5，1080 x 1350px',Line:'1:1，1040 x 1040px'};
    const DEFAULT_CC=['machi.chen@emctaipei.com','anna.hsu@emctaipei.com','amber.tian@emctaipei.com','leona.chen@emctaipei.com','eric.fu@emctaipei.com'];
    const RECIPIENT_NAMES={Machi:'陳柏政',Anna:'許芷芸',Karl:'李卡爾',Noise:'Noise',Amber:'Amber Tian',Leona:'陳家蓁'};
    const LATEST_PAGE=12,COLUMN_PAGE=10;
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const norm=value=>String(value||'').trim().toLowerCase();
    const state={
      rows:[],localRows:new Map(),settings:[],avatars:new Map(),customers:[],weights:[],mods:new Map(),people:{},levelConfig:null,archive:null,archiveLoading:false,
      loaded:false,view:'board',query:'',latestLimit:LATEST_PAGE,layout:(()=>{try{return localStorage.getItem('v5Layout')==='list'?'list':'grid'}catch(err){return 'grid'}})(),sort:'desc',filters:{months:new Set(),statuses:new Set(),designers:new Set()},filterOpen:false,loginMenu:false,pendingStart:'',editing:false,editRow:null,saving:false,edits:new Map(),limits:{todo:COLUMN_PAGE,doing:COLUMN_PAGE,review:COLUMN_PAGE,revise:COLUMN_PAGE,done:COLUMN_PAGE},home:'board',lb:[],lbList:null,lbIdx:0,cols:null,colsOpen:false,colDrag:'',plistLimit:50,drag:null,pendingMove:null,
      form:null,mail:null,detailId:'',gmail:null,signature:null,officeLoaded:false,syncText:''
    };

    /* ---------- 登入（與 index.html 共用 localStorage） ---------- */
    function sessionValue(key){try{if(localStorage.getItem('designRequestEditorLoggedOut')==='1'||sessionStorage.getItem('designRequestEditorLoggedOut')==='1')return '';return localStorage.getItem(key)||sessionStorage.getItem(key)||''}catch(err){return ''}}
    const session=()=>({token:sessionValue('designRequestEditorToken'),user:sessionValue('designRequestEditorUser'),name:sessionValue('designRequestEditorDisplayName')||sessionValue('designRequestEditorUser'),account:sessionValue('designRequestEditorAccount')});
    const loggedIn=()=>{const s=session();return Boolean(s.token&&(s.user||s.name))};
    async function api(action,payload={}){
      const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,...payload,editorToken:session().token}),cache:'no-store'});
      const data=await res.json();
      if(!data||data.ok===false){const err=new Error(data?.error||'操作失敗');err.reason=data?.reason;throw err}
      return data;
    }
    function toast(message,error=false){const el=$('toast');el.textContent=message;el.classList.toggle('error',error);el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),error?5200:3200)}

    /* ---------- 日期（台北時間） ---------- */
    const DAY=86400000;
    const ymd=ms=>{const d=new Date(ms);return `${d.getUTCFullYear()}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${String(d.getUTCDate()).padStart(2,'0')}`};
    function taipeiParts(){return Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]))}
    function taipeiToday(){const p=taipeiParts();return Date.UTC(+p.year,+p.month-1,+p.day)}
    /** 填需求的預設開始日：台北時間 18:00 以後算隔天（跟現行系統同一套規則）。 */
    function defaultStart(){const p=taipeiParts();return Date.UTC(+p.year,+p.month-1,+p.day)+(+p.hour>=18?DAY:0)}
    function parseDay(value){const m=String(value||'').match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);return m?Date.UTC(+m[1],+m[2]-1,+m[3]):NaN}
    /** 倒數與進度：最後一天 99%，第一天約 1/總天數，逾期維持 99% 並標紅。 */
    function schedule(row){
      const start=parseDay(row['開始日期']),end=parseDay(row['結束日期']),today=taipeiToday();
      if(Number.isNaN(end))return {remaining:null,percent:0,late:false,total:null};
      const remaining=Math.round((end-today)/DAY);
      const total=Number.isNaN(start)?null:Math.max(1,Math.round((end-start)/DAY)+1);
      let percent=0;
      if(remaining<=0)percent=99;
      else if(total)percent=Math.max(0,Math.min(99,Math.round((1-remaining/total)*100)));
      return {remaining,percent,late:remaining<0,total};
    }
    function countdownText(s){if(s.remaining===null)return '未填結束日';if(s.remaining<0)return `已逾期 ${-s.remaining} 天`;if(s.remaining===0)return '今天截止';return `倒數 ${s.remaining} 天`}

    /* ---------- 頭像 ---------- */
    function buildAvatarMap(settingsRows){
      const map=new Map();
      for(const row of settingsRows||[]){const url=String(row['頭像連結']||'').trim();if(!/^https?:\/\//.test(url))continue;for(const key of [row['名字'],row['顯示名'],row['帳號']])if(norm(key))map.set(norm(key),url)}
      return map;
    }
    function personAvatar(name){const email=(String(name||'').match(/[\w.+-]+@[\w.-]+\.[a-z]{2,}/i)||[''])[0].toLowerCase();return state.avatars.get(norm(name))||(email&&state.avatars.get(email))||''}
    function initial(name){const text=String(name||'').replace(/<[^>]*>/g,'').trim();return text?[...text][0].toUpperCase():'?'}
    function headImg(name){return `<img class="head${SHORT_HEADS.has(name)?' is-short':''}" src="assets/v5/heads/${esc(name)}.webp" alt="">`}
    function faceHtml(name,role){
      const label=`${role}：${name||'未填'}`;
      if(role==='設計負責人'&&DESIGNERS.includes(String(name||'').trim()))return `<span class="face is-designer" title="${esc(label)}">${headImg(String(name).trim())}</span>`;
      const url=personAvatar(name);
      return `<span class="face" title="${esc(label)}">${url?`<img src="${esc(url)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(initial(name))}'))">`:esc(initial(name))}</span>`;
    }

    /* ---------- 設計師列 ---------- */
    function designerCases(name){const c={'未開始':0,'執行中':0,'修改中':0,'過稿中':0};for(const r of allRows())if(norm(r['設計負責人'])===norm(name)&&r['狀態'] in c)c[r['狀態']]++;return c}
    function levelInfo(name){
      const cfg=state.levelConfig||{steps:[1,10,20,30,40,50],videoMembers:['Noise'],titles:{graphic:['設計新秀','資深設計師','設計菁英','設計大師','傳奇設計師','設計神話'],video:['影音新秀','資深剪輯師','影音菁英','影音大師','傳奇導演','影像神話']}};
      if(!state.archive)return null;
      const score=state.archive[name]||0,level=Math.floor(Math.sqrt(score/10))+1,current=10*(level-1)**2,next=10*level**2;
      const group=(cfg.videoMembers||[]).includes(name)?'video':'graphic',list=(cfg.titles&&cfg.titles[group])||[];
      let title=list[0]||'';(cfg.steps||[]).forEach((step,i)=>{if(level>=step&&list[i])title=list[i]});

    const WEEK=['日','一','二','三','四','五','六'];

    function monthHtml(offset){
      const base=new Date(cal.anchor),date=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()+offset,1)),today=taipeiToday();
      const rangeEnd=!Number.isNaN(cal.end)?cal.end:(cal.picking&&!Number.isNaN(cal.hover)&&cal.hover>=cal.start?cal.hover:NaN);
      const y=date.getUTCFullYear(),m=date.getUTCMonth(),lead=date.getUTCDay(),days=new Date(Date.UTC(y,m+1,0)).getUTCDate(),cells=[];
      for(let i=0;i<lead;i++)cells.push('<span class="cal-day out"></span>');
      for(let d=1;d<=days;d++){
        const ms=Date.UTC(y,m,d),cls=['cal-day'];
        if(ms<today)cls.push('past');if(ms===today)cls.push('today');
        if(ms===cal.start)cls.push('range-start');if(!Number.isNaN(rangeEnd)&&ms===rangeEnd)cls.push('range-end');
        if(!Number.isNaN(cal.start)&&!Number.isNaN(rangeEnd)&&ms>cal.start&&ms<rangeEnd)cls.push('in-range');
        cells.push(`<button type="button" class="${cls.join(' ')}" data-day="${ms}" aria-label="${ymd(ms)}"><span>${d}</span></button>`);
      }
      return `<div class="cal-month"><div class="cal-head"><button type="button" class="cal-nav${offset===0?' show':''}" data-cal-nav="-1" aria-label="上個月">‹</button><span>${y} 年 ${m+1} 月</span><button type="button" class="cal-nav${offset===1?' show':''}" data-cal-nav="1" aria-label="下個月">›</button></div><div class="cal-week">${WEEK.map(w=>`<span>${w}</span>`).join('')}</div><div class="cal-days">${cells.join('')}</div></div>`;
    }
    const rangeDays=(s,e)=>(Number.isNaN(s)||Number.isNaN(e))?0:Math.round((e-s)/DAY)+1;

      pop.innerHTML=`<div class="cal-months">${monthHtml(0)}${monthHtml(1)}</div><div class="cal-foot"><span class="cal-summary">${esc(summary)}</span><span><button type="button" class="btn" data-cal-clear>清除</button> <button type="button" class="btn primary" data-cal-done>完成</button></span></div>`;

    const AI_MAX_FILES=3,AI_MAX_BYTES=10*1024*1024;

        const r=ai.result,tone=r.stage==='新製'?'':r.stage==='再製'?'is-rework':'is-unknown',tasks=(r.tasks||[]).map(t=>`<li>${esc(t)}</li>`).join(''),missing=(r.missing||[]).map(t=>`<li>${esc(t)}</li>`).join('');

        ${ai.urls.length?`<div class="ai-prev">${ai.urls.map((u,i)=>`<div><img src="${esc(u)}" alt="截圖 ${i+1}"><button type="button" data-ai-remove="${i}" aria-label="移除截圖 ${i+1}">×</button></div>`).join('')}</div>`:''}

    function addAiFiles(list){

    async function runAi(){
      ai.slides=String(document.querySelector('[data-ai-slides]')?.value||'').trim();
      if(!ai.files.length&&!ai.slides){ai.error='請上傳截圖，或貼上公開的 Google Slides 連結。';renderAi();return}
      ai.view='loading';ai.error='';renderAi();

    /* ---------- 事件 ---------- */
    document.addEventListener('click',e=>{
      const t=e.target;
      if(state.loginMenu&&!t.closest('.rail-login')){state.loginMenu=false;renderLogin()}
      if(state.filterOpen&&!t.closest('.filter-wrap')){state.filterOpen=false;if(state.view==='board')renderBoard();if(state.view==='projects')renderProjects()}
      const lbA=t.closest('[data-lb-act]')?.dataset.lbAct;if(lbA){lbA==='close'?lbClose():lbStep(lbA==='next'?1:-1);return}
      if(t.id==='lightbox'){lbClose();return}
      const lbT=t.closest('[data-lb]');if(lbT){e.preventDefault();lbOpen(+lbT.dataset.lb,+lbT.dataset.i);return}
      if(window.__v5Grabbed){window.__v5Grabbed=false;e.preventDefault();e.stopPropagation();return}
      if(state.cellEdit&&!t.closest('#cellPop')&&!t.closest('[data-edit]'))closeCellPop();
      if(state.colsOpen&&!t.closest('.cols-wrap')){state.colsOpen=false;rerenderList()}
      const cpS=t.closest('[data-cp-status]');if(cpS){const id=state.cellEdit.id;closeCellPop();moveCase(id,cpS.dataset.cpStatus);return}
      const cpD=t.closest('[data-cp-designer]');if(cpD){const id=state.cellEdit.id,v=cpD.dataset.cpDesigner;closeCellPop();applyChange(id,{designer:v},['設計負責人'],{'設計負責人':v});return}
      if(t.closest('[data-cp-close]')){closeCellPop();return}
      const cpT=t.closest('[data-cp-type]');if(cpT){const id=state.cellEdit.id,v=cpT.dataset.cpType,row=allRows().find(r=>idKey(r)===id),cur=String(row['階段']||'').trim(),stage=stagesFor(v).includes(cur)?cur:defaultStage(v);closeCellPop();applyChange(id,{type:v,stage},['設計類型','階段','加權'],{'設計種類':v,'設計類型':v,'階段':stage});return}
      const cpG=t.closest('[data-cp-stage]');if(cpG){const id=state.cellEdit.id,v=cpG.dataset.cpStage;closeCellPop();applyChange(id,{stage:v},['階段','加權'],{'階段':v});return}
      if(t.closest('[data-cp-details]')){const id=state.cellEdit.id,v=[...document.querySelectorAll('#cellPop input:checked')].map(i=>i.value).join(', ');closeCellPop();applyChange(id,{details:v},['項目細節','加權'],{'項目細節':v});return}
      const editEl=t.closest('[data-edit]');if(editEl&&isDesignerSession()){openCellPop(editEl);return}
      if(t.closest('[data-cols-toggle]')){state.colsOpen=!state.colsOpen;rerenderList();return}
      if(t.closest('[data-cols-reset]')){state.cols={order:COL_DEFS.map(c=>c.key),hidden:new Set(COL_DEFS.map(c=>c.key).filter(k=>!COL_DEFAULT.includes(k)))};saveCols();rerenderList();return}
      const nav=t.closest('[data-nav]')?.dataset.nav;if(nav){state.home=nav;state.form=null;state.mail=null;state.editing=false;closeCal();show(nav);return}
      const dm=t.closest('[data-dm]')?.dataset.dm;
      if(dm==='cancel'){closeDetailModal();return}
      if(dm==='ok'){const pm=state.pendingMove;if(pm){const picked=[...document.querySelectorAll('#dmList input:checked')].map(i=>i.value).join(', ');closeDetailModal();applyMove(pm.id,pm.status,picked)}return}
      const lp=t.closest('[data-lp]')?.dataset.lp;
      if(lp==='google'){googleStart();return}
      if(lp==='toggle'){login.showPw=!login.showPw;renderLoginPage();return}
      if(lp==='cancel'){e.preventDefault();show(state.back&&state.back!=='login'&&state.back!=='form'?state.back:state.home);return}
      const loginAct=t.closest('[data-login]')?.dataset.login;
      if(loginAct==='toggle'){if(loggedIn()){state.loginMenu=!state.loginMenu;renderLogin()}else startLogin();return}
      if(loginAct==='logout'){logout();return}
      if(t.closest('[data-ai-close]')||t.id==='aiModal'){closeAi();return}
      if(t.closest('[data-ai-run]')){runAi();return}
      if(t.closest('[data-ai-restart]')){ai.view='input';ai.result=null;renderAi();return}
      const aiFill=t.closest('[data-ai-fill]');if(aiFill){applyAiStage(aiFill.dataset.aiFill);return}
      const aiRemove=t.closest('[data-ai-remove]');if(aiRemove){ai.files.splice(+aiRemove.dataset.aiRemove,1);renderAi();return}
      if(t.closest('[data-ai-drop]')){document.querySelector('[data-ai-file]')?.click();return}
      const layout=t.closest('[data-layout]');if(layout){state.layout=layout.dataset.layout;try{localStorage.setItem('v5Layout',state.layout)}catch(err){}rerenderList();return}
      const sort=t.closest('[data-sort]');if(sort){state.sort=sort.dataset.sort;rerenderList();return}
      if(t.closest('[data-filter-toggle]')){state.filterOpen=!state.filterOpen;rerenderList();return}
      if(t.closest('[data-filter-clear]')){state.filters.months.clear();state.filters.statuses.clear();state.filters.designers.clear();state.latestLimit=LATEST_PAGE;rerenderList();return}
      const card=t.closest('[data-case]');if(card&&(state.view==='board'||state.view==='projects')){state.detailId=card.dataset.case;state.editing=false;show('detail');return}
      const more=t.closest('[data-more]');if(more){const k=more.dataset.more;if(k==='latest')state.latestLimit+=LATEST_PAGE;else if(k==='plist')state.plistLimit+=50;else state.limits[k]+=COLUMN_PAGE;rerenderList();return}
      const act=t.closest('[data-act]')?.dataset.act;
      if(act==='back'){backToBoard();return}
      if(act==='edit'){startEdit();return}
      if(act==='cancel-edit'){cancelEdit();return}
      if(act==='batch'){readRowsSafe();const f=state.form;f.batch=!f.batch;if(f.batch&&!f.extra.length)f.extra.push(newRow({client:f.client,owner:f.owner,designer:f.designer,type:f.type,start:f.start,end:f.end,platforms:[...f.platforms],supp:{...f.supp},designerTouched:f.designerTouched}));if(!f.batch)f.extra=[];renderForm();return}
      if(act==='batch-add'){readRowsSafe();const f=state.form;f.extra.push(newRow({client:f.client,owner:f.owner,designer:f.designer,start:f.start,end:f.end}));renderForm();return}
      if(act==='batch-copy'){readRowsSafe();const f=state.form,last=f.extra.length?f.extra[f.extra.length-1]:f;f.extra.push(copyRow(last));renderForm();toast(`已把第 ${f.extra.length} 筆的資料套用到第 ${f.extra.length+1} 筆`);return}
      const del=t.closest('[data-batch-del]');if(del){readRowsSafe();state.form.extra.splice(+del.dataset.batchDel,1);if(!state.form.extra.length)state.form.batch=false;renderForm();return}
      const rangeBtn=t.closest('[data-range-btn]');if(rangeBtn){const key=rangeBtn.closest('[data-row]').dataset.row;(cal.open&&cal.key===key)?closeCal():openCal(key);return}
      const calNav=t.closest('[data-cal-nav]');if(calNav){const d=new Date(cal.anchor);cal.anchor=Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+(+calNav.dataset.calNav),1);renderCal();return}
      const day=t.closest('[data-day]');if(day){pickDay(+day.dataset.day);return}
      if(t.closest('[data-cal-clear]')){cal.start=NaN;cal.end=NaN;cal.picking=false;const r=rowOf(cal.key);r.start=NaN;r.end=NaN;updateRangeButtons();renderCal();return}
      if(t.closest('[data-cal-done]')){closeCal();return}
      if(cal.open&&!t.closest('.range'))closeCal();
      const mail=t.closest('[data-mail]')?.dataset.mail;
      if(mail==='send'){sendCurrent();return}
      if(mail==='skip'){saveMailDraft();const m=state.mail;toast(m&&m.sentCount?`已寄出 ${m.sentCount} 封；其餘案件已建立，可稍後補寄`:'案件已建立，信件稍後再寄');state.mail=null;show('board');return}
      if(mail==='prev'||mail==='next'){saveMailDraft();state.mail.index+=mail==='next'?1:-1;renderMail();return}
      const fmt=t.closest('[data-fmt]')?.dataset.fmt;
      if(fmt){$('mBody').focus();if(fmt==='link'){const url=prompt('連結網址（https://…）');if(url&&/^https?:\/\//i.test(url))document.execCommand('createLink',false,url)}else document.execCommand(fmt,false,null)}
    });
    document.addEventListener('mousemove',e=>{if(!cal.open||!cal.picking)return;const day=e.target.closest?.('[data-day]');if(!day)return;const ms=+day.dataset.day;if(ms!==cal.hover){cal.hover=ms;renderCal()}});
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'){if(cal.open)closeCal();if(!$('aiModal').hidden)closeAi();if(state.filterOpen){state.filterOpen=false;rerenderList()}if(!$('detailModal').hidden)closeDetailModal();if(state.cellEdit)closeCellPop();if(state.colsOpen){state.colsOpen=false;rerenderList()}}
      if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('td[data-case]')){e.preventDefault();e.target.click()}
    });
    document.addEventListener('paste',e=>{if($('aiModal').hidden||ai.view!=='input')return;const files=[...(e.clipboardData?.files||[])];if(files.length){e.preventDefault();addAiFiles(files)}});
    document.addEventListener('dragover',e=>{if(e.target.closest?.('[data-ai-drop]')){e.preventDefault();e.target.closest('[data-ai-drop]').classList.add('over')}});
    document.addEventListener('dragleave',e=>{e.target.closest?.('[data-ai-drop]')?.classList.remove('over')});
    document.addEventListener('drop',e=>{const zone=e.target.closest?.('[data-ai-drop]');if(zone){e.preventDefault();zone.classList.remove('over');addAiFiles(e.dataTransfer.files)}});
    let searchTimer=0;
    document.addEventListener('input',e=>{
      const t=e.target;
      if(t.id==='boardSearch'){clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.query=t.value.trim();rerenderList()},160)}
      if(t.dataset?.f==='qty')t.value=t.value.replace(/[^0-9]/g,'');
    });
    document.addEventListener('change',async e=>{
      const t=e.target;
      if(t.matches?.('[data-col-show]')){ensureCols();t.checked?state.cols.hidden.delete(t.dataset.colShow):state.cols.hidden.add(t.dataset.colShow);if(state.cols.hidden.size>=COL_DEFS.length)state.cols.hidden.delete('id');saveCols();rerenderList();return}
      if(t.matches?.('[data-ai-file]')){addAiFiles(t.files);return}
      if(t.matches?.('[data-filter]')){const set=state.filters[t.dataset.filter];t.checked?set.add(t.value):set.delete(t.value);state.latestLimit=LATEST_PAGE;rerenderList();return}
      if(t.id==='clientSelect'){
        if(t.value==='__new__'){const name=await addCustomerFlow();t.value=name;}
        t.classList.toggle('is-empty',!t.value);$('promptGo').disabled=!t.value;return;
      }
      const rowBox=t.closest?.('[data-row]');if(!rowBox||!(state.view==='form'||state.editing))return;
      const key=rowBox.dataset.row,r=rowOf(key),field=t.dataset?.f;if(!r)return;
      if(field==='client'){
        readRowsSafe();
        if(t.value==='__new__'){const name=await addCustomerFlow();r.client=name||r.client}else r.client=t.value;
        if(key!=='edit'&&(!r.designerTouched||!r.designer)){r.designer=defaultDesignerFor(r.client);toast(r.designer?`設計負責人已依客戶別設定帶入：${r.designer}`:'這個客戶別沒有設定偏好設計師，請自行選擇')}
        rerender();return;
      }
      if(field==='designer'){r.designerTouched=true;return}
      if(field==='type'){readRowsSafe();r.type=t.value;r.stage=defaultStage(r.type);rerender();return}
      if(field==='stage'&&t.value==='__ai__'){t.value=r.stage||'';readRowsSafe();openAi(key);return}
    });
    document.addEventListener('submit',e=>{
      if(e.target.id==='pwForm'){e.preventDefault();passwordLogin(e.target);return}
      if(e.target.id==='requestForm'){e.preventDefault();submitForm()}
      if(e.target.id==='editForm'){e.preventDefault();saveEdit()}
      if(e.target.id==='prompt'){
        e.preventDefault();const client=$('clientSelect').value;if(!client||client==='__new__')return;
        if(!loggedIn()){state.pendingStart=client;toast('請先登入才能新增設計需求',true);startLogin();return}
        state.form=newForm(client);show('form');
      }
    });

    /* ---------- 資料 ---------- */
    async function loadDatabase(){
      try{
        const res=await fetch('backend/data/db.json',{cache:'no-cache'});const db=await res.json(),t=db.tables||{};
        state.rows=(t.database?.rows||[]).filter(r=>r&&r['案件編號']);
        state.settings=t['設定']?.rows||[];state.avatars=buildAvatarMap(state.settings);
        state.customers=t['客戶別']?.rows||[];state.weights=t['加權計分標準']?.rows||[];
        state.mods=new Map();for(const r of t['修改統計表']?.rows||[]){const k=String(r['案件編號']||'');if(!state.mods.has(k))state.mods.set(k,[]);state.mods.get(k).push(r)}
        for(const [id,edit] of [...state.edits]){if(Date.now()-edit.at>10*60*1000){state.edits.delete(id);continue}const hit=state.rows.find(r=>String(r['案件編號'])===id);if(hit)Object.assign(hit,edit.headers)} // 剛編輯完、db.json 還沒更新時，先保留本機的修改
        const dbIds=new Set(state.rows.map(r=>String(r['案件編號'])));for(const id of [...state.localRows.keys()])if(dbIds.has(id))state.localRows.delete(id); // db.json 已經包含剛建立的案件，就不用本機暫存
        state.loaded=true;
        const stamp=new Date(db.updatedAt||Date.now());
        state.syncText=`資料更新：${stamp.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}`;
        fillClients();
      }catch(err){console.warn('案件資料讀取失敗',err);state.loaded=true;state.syncText='案件資料讀取失敗，請重新整理'}
      if(state.view==='board')renderBoard();else if(state.view==='projects')renderProjects();renderTeam();renderLogin();
    }
    function fillClients(){
      const select=$('clientSelect'),keep=select.value;
      select.innerHTML='<option value="">選擇客戶別，開始新增設計需求…</option>'+sortCustomers(state.customers).map(r=>String(r['客戶別']||'').trim()).filter(Boolean).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')+'<option value="__new__">+ 新增客戶別</option>';
      select.value=keep;select.classList.toggle('is-empty',!select.value);$('promptGo').disabled=!select.value;
    }
    async function loadOffice(){
      try{
        const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'pixelOfficeState'}),cache:'no-store'});
        const data=await res.json();state.officeLoaded=true;
        if(data&&data.ok){state.people=Object.fromEntries((data.people||[]).map(p=>[p.name,p]));if(data.levels&&data.levels.ok)state.levelConfig=data.levels;renderTeam()}
      }catch(err){console.warn('像素辦公室狀態讀取失敗',err);if(!state.officeLoaded){state.officeLoaded=true;renderTeam()}}
    }

    /* 往下滾動時，客戶別下拉列固定在畫面上方 */
    (()=>{const slot=$('promptSlot'),bar=$('prompt'),band=$('stickBand');function stick(){if(document.body.classList.contains('no-hero')){band.classList.remove('show');bar.classList.remove('is-stuck');slot.style.height='';return}const stuck=bar.classList.contains('is-stuck'),top=slot.getBoundingClientRect().top;if(!stuck&&top<12){slot.style.height=bar.offsetHeight+'px';bar.classList.add('is-stuck')}else if(stuck&&top>=12){bar.classList.remove('is-stuck');slot.style.height=''}if(bar.classList.contains('is-stuck')){const r=slot.getBoundingClientRect();bar.style.left=r.left+'px';bar.style.width=r.width+'px'}else{bar.style.left='';bar.style.width=''}band.classList.toggle('show',bar.classList.contains('is-stuck'))}window.addEventListener('scroll',stick,{passive:true});window.addEventListener('resize',stick)})();
    /* 往下滾動收合設計師頭像，往上滾動再展開 */
    (()=>{let last=window.scrollY,lock=0;window.addEventListener('scroll',()=>{if(Date.now()<lock||state.view!=='board')return;const y=window.scrollY,team=$('team');if(y>last+6&&y>60&&!team.classList.contains('is-collapsed')){team.classList.add('is-collapsed');lock=Date.now()+450}else if(y<last-6&&team.classList.contains('is-collapsed')){team.classList.remove('is-collapsed');lock=Date.now()+450}last=y},{passive:true})})();
    renderTeam();renderBoard();bindTeam();renderLogin();
    loadDatabase();loadOffice();
    setInterval(loadOffice,60000);
    setInterval(()=>{if(!document.hidden&&(state.view==='board'||state.view==='projects'))loadDatabase()},5*60000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadOffice();renderLogin()}});
    window.__v5=state; // 方便除錯
  })();
  </script>
</body>
</html>
