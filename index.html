<!-- OAuth 返回頁：Google 登入／Gmail 連接的彈出視窗會導回網站根網址（這一頁）。彈出視窗把結果廣播給原頁後自動關閉；
     不是彈出視窗的舊流程（整頁跳轉、ERP 登入）則轉交給舊版 legacy.html 處理。 -->
<script>
(()=>{
  try{
    const hash=new URLSearchParams(location.hash.replace(/^#/,'')),query=new URLSearchParams(location.search);
    const done=(msg)=>{document.documentElement.innerHTML='<body style="font-family:-apple-system,sans-serif;padding:32px;text-align:center"><h2>'+msg+'</h2><p>正在返回設計需求系統...</p></body>';setTimeout(()=>window.close(),180)};
    const idToken=hash.get('id_token')||'',gErr=hash.get('error')||'';
    if(idToken||gErr){
      if(window.name==='machiGoogleLogin'){
        const result={type:'machi-google-oauth-result',idToken,state:hash.get('state')||'',error:gErr,errorDescription:hash.get('error_description')||''};
        let ok=false;try{const ch=new BroadcastChannel('machi-google-oauth-v1');ch.postMessage(result);ch.close();ok=true}catch(e){}
        if(!ok&&window.opener){try{window.opener.postMessage(result,location.origin);ok=true}catch(e){}}
        if(ok){history.replaceState(null,'',location.pathname);done('Google 登入完成');return}
      }
      location.replace('legacy.html'+location.search+location.hash);return;
    }
    const code=query.get('code')||'',qState=query.get('state')||'',qErr=query.get('error')||'';
    if(qState&&(code||qErr)){
      if(qState.startsWith('machi_gmail_connect_')&&window.name==='machiGmailConnect'){
        const result={type:'machi-gmail-oauth-result',code,state:qState,error:qErr,errorDescription:query.get('error_description')||''};
        let ok=false;try{const ch=new BroadcastChannel('machi-gmail-oauth-v1');ch.postMessage(result);ch.close();ok=true}catch(e){}
        if(!ok&&window.opener){try{window.opener.postMessage(result,location.origin);ok=true}catch(e){}}
        if(ok){history.replaceState(null,'',location.pathname);done('Gmail 連接完成');return}
      }
      location.replace('legacy.html'+location.search+location.hash);
    }
  }catch(e){}
})();
</script>

<script>
(()=>{
  const splash=document.getElementById('emcSplash'),fill=document.getElementById('emcSplashFill');
  if(!splash||!fill)return;
  const start=performance.now(),MIN_SHOW=700,MAX_SHOW=20000;
  let progress=0,finished=false,timer=0;
  const paint=()=>{fill.style.transform='scaleX('+progress.toFixed(3)+')'};
  // 進度條用緩動曲線慢慢逼近 90%（真實載入時間未知），load 完成才一口氣補滿
  const tick=()=>{
    if(finished)return;
    progress+=(0.9-progress)*0.045;
    paint();
    timer=setTimeout(tick,120);
  };
  const finish=()=>{
    if(finished)return;
    finished=true;
    clearTimeout(timer);clearInterval(quoteTimer);
    const wait=Math.max(0,MIN_SHOW-(performance.now()-start));
    setTimeout(()=>{
      progress=1;paint();
      setTimeout(()=>{
        splash.classList.add('is-done');
        setTimeout(()=>splash.remove(),600);
      },380);
    },wait);
  };
  // 進度條下方輪播設計師語錄（約 3.6 秒換一句，先隨機挑一句，連續不重複）
  const quoteEl=document.getElementById('emcSplashQuote'),quotes=window.emcQuotes||[];
  let quoteIdx=Math.floor(Math.random()*quotes.length),quoteTimer=0;
  const showQuote=()=>{if(quoteEl&&quotes.length)quoteEl.textContent=quotes[quoteIdx]};
  const nextQuote=()=>{
    if(!quoteEl||quotes.length<2||document.hidden)return;
    quoteEl.classList.add('is-fading');
    setTimeout(()=>{quoteIdx=(quoteIdx+1+Math.floor(Math.random()*(quotes.length-1)))%quotes.length;showQuote();quoteEl.classList.remove('is-fading')},250);
  };
  showQuote();quoteTimer=setInterval(nextQuote,matchMedia('(hover:none)').matches?7000:3600);
  tick();
  const ready=()=>{if(document.readyState==='complete'&&window.__v5&&window.__v5.loaded)finish();else setTimeout(ready,150)};ready();
  setTimeout(finish,MAX_SHOW);
})();
</script>
