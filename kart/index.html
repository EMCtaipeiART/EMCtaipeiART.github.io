<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>辦公室賽車</title>
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}button,a,[role=button]{touch-action:manipulation}</style>
<script>/* 手機防誤放大 */
(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,p,{passive:false})});
document.addEventListener('touchmove',function(e){if(e.touches.length>1&&e.cancelable)e.preventDefault()},{passive:false});})();</script>
<script>try{var t=localStorage.getItem('designRequestThemeV1');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* ====== 街機賽車風：霓虹橘黃＋深紫夜色、斜體大數字、速度感（刻意不同於遠征隊／對決的綠色面板與足球賽的藍色日光） ====== */
:root{--ink:#2a1500;--dim:#8a5a2a;--bg:#fff4e0;--panel:#ffffff;--panel2:#fff0d6;--line:#f3c98b;--org:#ff7a1a;--yel:#ffd23f;--mag:#e8307a;--ok:#19b36b}
:root[data-theme=dark]{--ink:#fff1dc;--dim:#c9a37a;--bg:#150a26;--panel:#241240;--panel2:#31195a;--line:#5a2f93;--org:#ff8a2a;--yel:#ffd84d;--mag:#ff4d94;--ok:#35d58a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#fff1dc;--dim:#c9a37a;--bg:#150a26;--panel:#241240;--panel2:#31195a;--line:#5a2f93;--org:#ff8a2a;--yel:#ffd84d;--mag:#ff4d94;--ok:#35d58a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
canvas#c3{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
@media (pointer:coarse) and (orientation:portrait){
  html.playing,html.playing body{width:100vh;height:100vw}
  html.playing body{position:fixed;top:0;left:0;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
}
[hidden]{display:none!important}
.num{font-weight:900;font-style:italic;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hud{position:absolute;pointer-events:none;z-index:5;color:#fff;text-shadow:0 3px 0 rgba(20,5,40,.85),0 0 10px rgba(20,5,40,.7)}
#pos{left:16px;top:10px;line-height:.85}
#pos b{font-size:clamp(64px,13vw,120px);font-weight:900;font-style:italic;color:var(--yel);-webkit-text-stroke:3px #2a0f4a;paint-order:stroke fill}
#pos sup{font-size:clamp(20px,4vw,34px);font-weight:900;font-style:italic;color:#fff;vertical-align:top;margin-left:2px}
#pos small{display:block;font-size:clamp(13px,2.2vw,18px);font-weight:900;letter-spacing:.12em;color:#fff}
#lapb{left:50%;top:10px;transform:translateX(-50%);text-align:center;background:linear-gradient(#2a0f4a,#1a0933);border:3px solid var(--org);border-radius:12px;padding:5px 18px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
#lapb small{display:block;font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--org);text-shadow:none}
#lapb b{font-size:22px;line-height:1}
#lapb i{display:block;font-style:normal;font-size:12px;color:#ffd9a8;margin-top:2px;text-shadow:none}
#mini{right:12px;top:10px;width:130px;height:130px;border-radius:16px;background:rgba(26,9,51,.78);border:3px solid var(--org);box-shadow:0 5px 0 rgba(0,0,0,.35);overflow:hidden}
#mini canvas{width:100%;height:100%;display:block}
#spd{left:16px;bottom:16px;min-width:170px}
#spd b{font-size:clamp(34px,6vw,52px);font-weight:900;font-style:italic;line-height:1}
#spd small{font-size:13px;font-weight:900;margin-left:4px;color:var(--yel)}
#spd .bar{height:10px;margin-top:6px;border-radius:99px;background:rgba(20,5,40,.65);border:2px solid #fff;overflow:hidden}
#spd .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff7a1a,#e8307a)}
#spd .dr{height:7px;margin-top:5px;border-radius:99px;background:rgba(20,5,40,.65);border:2px solid #fff;overflow:hidden;opacity:.35}
#spd .dr i{display:block;height:100%;width:0;background:#7fe3ff}
#itembox{right:14px;bottom:16px;width:92px;height:92px;border-radius:20px;background:linear-gradient(#3b1a6b,#1a0933);border:4px solid var(--yel);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;box-shadow:0 6px 0 rgba(0,0,0,.4)}
#itembox .ic{font-size:44px;line-height:1;text-shadow:none}
#itembox kbd{position:absolute;top:-10px;left:-6px;font:900 11px/1 system-ui;background:var(--org);color:#2a0f00;border-radius:6px;padding:3px 6px;text-shadow:none}
#itembox .nm{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;white-space:nowrap}
#itembox.has{animation:pulse .5s infinite alternate;border-color:var(--ok)}
@keyframes pulse{to{transform:scale(1.07)}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;z-index:6;pointer-events:none;opacity:0;transition:opacity .12s}
#banner.on{opacity:1}
#banner b{display:inline-block;font-size:clamp(60px,14vw,150px);font-weight:900;font-style:italic;color:var(--yel);-webkit-text-stroke:5px #2a0f4a;paint-order:stroke fill;text-shadow:0 9px 0 #2a0f4a;transform:skewX(-10deg)}
#banner small{display:block;font-size:clamp(14px,2.6vw,28px);font-weight:900;color:#fff;text-shadow:0 2px 0 #2a0f4a,0 0 8px #2a0f4a;margin-top:4px}
#toast{position:absolute;left:50%;top:150px;transform:translateX(-50%);z-index:6;pointer-events:none;font-weight:900;font-style:italic;font-size:26px;color:#fff;-webkit-text-stroke:2px #2a0f4a;paint-order:stroke fill;text-shadow:0 4px 0 #2a0f4a;opacity:0;transition:opacity .12s}
#toast.on{opacity:1}
.sys{position:absolute;right:10px;top:150px;display:flex;gap:6px;z-index:7}
.pb{font:900 13px/1 inherit;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-radius:10px;padding:7px 11px;box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer}
.pb:active{transform:translateY(2px)}
/* 手機控制 */
#stick{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.3),rgba(255,255,255,.1));box-shadow:inset 0 4px 10px rgba(0,0,0,.3),0 3px 0 rgba(255,255,255,.3);display:none;z-index:6;touch-action:none}
#stick i{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0 10%,transparent 34%),linear-gradient(180deg,#ffb25a,#ff7a1a);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 4px 0 #a64a00,0 7px 8px rgba(0,0,0,.3);pointer-events:none}
#stick::before{content:'';position:absolute;inset:-26px}
.tbtn{position:absolute;display:none;z-index:6;width:68px;height:68px;border-radius:50%;border:4px solid #2a0f4a;background:linear-gradient(#6b3fb5,#3a1a78);color:#fff;font:900 13px/1 inherit;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 5px 0 rgba(0,0,0,.4);touch-action:none}
.tbtn .ic{font-size:24px}.tbtn span{font-size:11px;margin-top:2px}
.tbtn.on{background:linear-gradient(#ffd23f,#ff7a1a);color:#2a0f00}
@media (pointer:coarse){
  #stick{display:block}.tbtn{display:flex}
  #drift{right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:78px;height:78px}
  #brake{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  #itembox{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));width:76px;height:76px}
  #itembox .ic{font-size:36px}#itembox kbd{display:none}
  #spd{bottom:auto;top:84px;left:16px}#spd .dr{display:none}
  #mini{width:96px;height:96px}.sys{top:112px}
}
/* 選單 */
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto;background:radial-gradient(ellipse at 50% 20%,rgba(255,122,26,.35),rgba(21,10,38,.9) 75%),#150a26}
:root:not([data-theme=dark]) .ov{background:radial-gradient(ellipse at 50% 20%,rgba(255,122,26,.3),rgba(255,244,224,.95) 75%),#fff4e0}
:root[data-theme=dark] .ov{background:radial-gradient(ellipse at 50% 20%,rgba(255,122,26,.35),rgba(21,10,38,.95) 75%),#150a26}
.card{width:min(720px,100%);background:var(--panel);border:4px solid var(--org);border-radius:22px;box-shadow:0 10px 0 rgba(0,0,0,.35);padding:18px 18px 20px;text-align:center}
.logo{font-size:clamp(34px,6.5vw,58px);font-weight:900;font-style:italic;line-height:1;color:var(--yel);-webkit-text-stroke:3px #2a0f4a;paint-order:stroke fill;text-shadow:0 5px 0 #2a0f4a;transform:skewX(-8deg)}
.logo small{display:block;font-size:12px;letter-spacing:.5em;font-style:normal;color:var(--mag);-webkit-text-stroke:0;text-shadow:none;margin-bottom:6px}
.row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.lab{font-weight:900;font-size:13px;color:var(--dim);min-width:56px;text-align:right}
.pill{font:900 15px/1 inherit;color:var(--ink);background:var(--panel2);border:3px solid var(--line);border-radius:99px;padding:9px 16px;cursor:pointer}
.pill.on{background:var(--org);border-color:#2a0f4a;color:#2a0f00;box-shadow:0 3px 0 #2a0f4a}
.pick{display:flex;align-items:center;gap:10px}
.pick canvas{width:84px;height:84px;border-radius:50%;border:4px solid var(--org);background:var(--panel2)}
.pick b{font-size:20px;min-width:5em}
.arr{font:900 18px/1 inherit;width:38px;height:38px;border-radius:50%;border:3px solid #2a0f4a;background:var(--yel);color:#2a0f00;cursor:pointer}
.go{margin-top:18px;font:900 22px/1 inherit;color:#fff;background:linear-gradient(#ff5fa0,#e8307a);border:4px solid #2a0f4a;border-radius:16px;padding:14px 38px;box-shadow:0 6px 0 #2a0f4a;cursor:pointer;letter-spacing:.1em;font-style:italic}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #2a0f4a}
.help{margin-top:14px;font-size:12.5px;line-height:1.7;color:var(--dim);text-align:left;background:var(--panel2);border-radius:12px;padding:10px 14px}
.help b{color:var(--ink)}
table.rk{width:100%;border-collapse:collapse;margin-top:10px;font-weight:800;font-size:14px}
table.rk td{padding:5px 8px;border-bottom:2px dashed var(--line);text-align:left}table.rk td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.rk tr.me td{background:var(--yel);color:#2a0f00}
@media (max-width:700px){
  #pos b{font-size:56px}#lapb{padding:3px 10px}#lapb b{font-size:16px}#lapb i{font-size:10px}
  .card{padding:12px}.help{display:none}.row{margin-top:8px}.pick canvas{width:60px;height:60px}.go{margin-top:12px;padding:11px 28px;font-size:18px}.logo{font-size:30px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c3"></canvas>
  <div class="hud" id="pos" hidden><b class="num" id="posN">1</b><sup id="posS">ST</sup><small id="posT">/ 8</small></div>
  <div class="hud" id="lapb" hidden><small>LAP</small><b class="num" id="lapN">1/3</b><i id="timeT">0:00.0</i></div>
  <div class="hud" id="mini" hidden><canvas id="miniC" width="260" height="260"></canvas></div>
  <div class="hud" id="spd" hidden><b class="num" id="spdN">0</b><small>km/h</small><div class="bar"><i id="spdB"></i></div><div class="dr"><i id="drB"></i></div></div>
  <div class="hud" id="itembox" hidden><kbd>Shift</kbd><b class="ic" id="itemIc"></b><span class="nm" id="itemNm"></span></div>
  <div id="toast"></div>
  <div id="banner"><b id="bnT"></b><small id="bnS"></small></div>
  <div class="sys" id="sys" hidden><button class="pb" id="pauseB" type="button">暫停</button><button class="pb" id="exitB2" type="button" hidden>離開</button></div>
  <div id="stick" hidden><i></i></div>
  <button class="tbtn" id="drift" type="button" hidden><b class="ic">🌀</b><span>漂移</span></button>
  <button class="tbtn" id="brake" type="button" hidden><b class="ic">🛑</b><span>煞車</span></button>

  <div class="ov" id="menu">
    <div class="card">
      <div class="logo"><small>OFFICE  KART  GRAND  PRIX</small>辦公室賽車</div>
      <div class="row"><span class="lab">我的角色</span><div class="pick"><button class="arr" id="prev" type="button">◀</button><canvas id="pv" width="120" height="120"></canvas><b id="pvN"></b><button class="arr" id="next" type="button">▶</button></div></div>
      <div class="row"><span class="lab">難度</span><span id="gDiff"></span></div>
      <div class="row"><span class="lab">圈數</span><span id="gLaps"></span></div>
      <button class="go" id="startB" type="button">出發！</button>
      <div class="row"><button class="pill" id="exitB" type="button" hidden>離開遊戲</button></div>
      <div class="help"><b>電腦：</b>W／↑ 油門　S／↓ 煞車倒車　A D／←→ 轉向　<b>空白鍵</b>漂移（過彎時按住，放開有加速）　<b>Shift／E</b> 使用道具<br>
      <b>手機：</b>自動油門，左下搖桿轉向，右下 漂移／煞車，上方方塊鈕用道具。<br>
      <b>道具：</b>☕咖啡（加速）　🧻碎紙屑（丟在身後，後車踩到打轉）　📌訂書機彈（直射）　📎迴紋針（追蹤前車）。踩橘色箭頭板也能加速。<br>
      <b>起跑：</b>倒數 GO 前一瞬間按油門有起跑加速，太早會打滑。</div>
    </div>
  </div>
  <div class="ov" id="endO" hidden><div class="card" id="endC"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id), Q = new URLSearchParams(location.search);
const ANGLES = 12, LOCAL_NAMES = ['Machi', 'Anna', 'Leona', 'Amber', 'Noise', '余采馨', '吳冠賢', '廖秦葦', '李明庭', '王藍庭', '鄭筱舢', '黎子瑄'];
const CHAR_SCALE = { Leona: 1.1, 廖秦葦: 1.18 };
const CHAR_API = 'https://emc-ai-stage-classifier.machi-chen.workers.dev/api/public/characters';   // 與元宇宙／辦公室對決同一份「最新角色」
let cloud = {}, cloudWalks = {}, cloudDone = false;
const cloudReady = (async () => { try { const r = await fetch(CHAR_API, { signal: AbortSignal.timeout(5000) }); if (r.ok) { const j = await r.json(); cloud = j.characters || {}; cloudWalks = j.walks || {}; } } catch (e) {} cloudDone = true; })();
const atlasSrc = (n, walk) => { const v = walk ? cloudWalks[n] : cloud[n]; return v ? CHAR_API + '/' + encodeURIComponent(n) + '/' + (walk ? 'walk-hd.png' : 'atlas-hd.png') + '?v=' + v : null; };
const localSrc = (n, walk) => '../pixel-plaza/' + (walk ? 'sprites-walk-hd/' : 'sprites-hd/') + n + '.webp';
function loadImg(n, walk, cb, fail) { const im = new Image(); im.crossOrigin = 'anonymous'; let local = false; im.onload = () => cb(im); im.onerror = () => { if (!local) { local = true; im.removeAttribute('crossorigin'); im.src = localSrc(n, walk); } else if (fail) fail(); }; im.src = atlasSrc(n, walk) || localSrc(n, walk); }
function texFromAtlas(n, walk, rx, ry, fail) { const t = new THREE.Texture(); t.magFilter = t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; t.repeat.set(rx, ry); loadImg(n, walk, im => { t.image = im; t.needsUpdate = true; }, fail); return t; }
const CFG = { diff: 1, laps: 3, who: 'Machi' };
try { Object.assign(CFG, JSON.parse(localStorage.getItem('kartCfgV1') || '{}')); } catch (e) {}
if (!LOCAL_NAMES.includes(CFG.who)) CFG.who = 'Machi';
const saveCfg = () => { try { localStorage.setItem('kartCfgV1', JSON.stringify(CFG)); } catch (e) {} };
const rand = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v)), wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
const touch = matchMedia('(pointer:coarse)').matches, embed = /[?&]embed=1/.test(location.search);
try { const mm = Q.get('me'); if (mm && LOCAL_NAMES.includes(mm)) CFG.who = mm; } catch (e) {}
const leave = () => { try { parent.postMessage({ type: 'expeditionExit' }, location.origin); } catch (e) {} };

// ───────── 音效 ─────────
let AC = null, eng = null;
const unlock = () => { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} };
function tone(f, d, type = 'sine', vol = .12, f2 = 0, delay = 0) { if (!AC) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02); }
const SFX = { beep: () => tone(660, .12, 'square', .08), go: () => tone(990, .4, 'square', .1), item: () => { tone(600, .1, 'triangle', .12, 900); tone(900, .12, 'triangle', .1, 1300, .08); }, boost: () => tone(300, .5, 'sawtooth', .08, 900), hit: () => tone(180, .3, 'square', .14, 60), bump: () => tone(110, .12, 'square', .08, 60), use: () => tone(500, .15, 'triangle', .1, 250), fin: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'square', .08, 0, i * .12)) };
function engine(on, sp) {
  if (!AC) return;
  if (on && !eng) { const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter(); o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 420; g.gain.value = 0; o.connect(f); f.connect(g); g.connect(AC.destination); o.start(); eng = { o, g }; }
  if (eng) { const t = AC.currentTime; eng.o.frequency.setTargetAtTime(55 + sp * 3.2, t, .08); eng.g.gain.setTargetAtTime(on ? .035 : 0, t, .1); }
}

// ───────── 場景 ─────────
const cv = $('c3'), renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(62, 16 / 9, .5, 400);
const isRot = () => touch && matchMedia('(orientation:portrait)').matches && document.documentElement.classList.contains('playing');
const rotW = () => isRot() ? innerHeight : innerWidth, rotH = () => isRot() ? innerWidth : innerHeight;
function resize() { const w = Math.max(320, rotW()), h = Math.max(240, rotH()); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); try { matchMedia('(orientation:portrait)').addEventListener('change', () => setTimeout(resize, 60)); } catch (e) {}
const dark = () => { const t = document.documentElement.getAttribute('data-theme'); return t === 'dark' || (!t && matchMedia('(prefers-color-scheme:dark)').matches); };
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a7a9a, .95), sun = new THREE.DirectionalLight(0xfff0d8, .6); sun.position.set(40, 80, 30); scene.add(hemi, sun);
function applyTheme() { const d = dark(), c = d ? 0x232a3d : 0xdfe6f2; scene.background = new THREE.Color(c); scene.fog = new THREE.Fog(c, 110, 330); hemi.intensity = d ? .6 : .95; sun.intensity = d ? .4 : .6; }
applyTheme(); addEventListener('storage', applyTheme); addEventListener('message', applyTheme);
const mk = (g, m) => new THREE.Mesh(g, m), lam = (c, o = {}) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o)), bas = (c, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o));
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t; }

// ───────── 賽道（封閉樣條） ─────────
const CP = [[0, 0], [60, -12], [120, 8], [172, 58], [184, 122], [142, 174], [84, 164], [52, 122], [8, 140], [-42, 184], [-104, 172], [-136, 118], [-112, 58], [-62, 40], [-30, 8]];

  $('endO').hidden = false; for (const id of ['pos', 'lapb', 'mini', 'spd', 'itembox', 'sys', 'stick', 'drift', 'brake']) $(id).hidden = true;

}
let bnTimer = 0, toastTimer = 0, camShake = 0, camH = 0, camSp = 0;
function banner(t, s, dur) { $('bnT').textContent = t; $('bnS').textContent = s || ''; $('banner').classList.add('on'); clearTimeout(bnTimer); if (dur) bnTimer = setTimeout(() => $('banner').classList.remove('on'), dur); }

function togglePause() { if (state !== 'race' && state !== 'countdown') return; paused = !paused; banner(paused ? '暫停' : '', paused ? '按 P 繼續' : '', 0); if (!paused) $('banner').classList.remove('on'); $('pauseB').textContent = paused ? '繼續' : '暫停'; engine(!paused, me ? me.sp : 0); }

// ───────── 繪製 ─────────
const mcv = $('miniC'), mctx = mcv.getContext('2d');
