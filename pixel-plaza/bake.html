<!doctype html><meta charset="utf-8"><title>bake</title>
<script type="module">
// 12 面向像素圖集（每 30° 一格）：0°/90°/180° 用原始手繪三視圖，270° 為側面鏡像，
// 其餘 8 個中間角度使用 ai-views/<名稱>/view_XXX.png（由 Codex 依三視圖生成）。
const ANGLES = 12, HV = 112, CELL = 120, OUT = 60;
const img = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('load ' + src)); i.src = src; });
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// 取得最大連通區（保留面積 >3% 的碎片，如髮絲），去掉生成圖的雜點
function clean(im, flipX){
  const c = mk(im.width, im.height), g = c.getContext('2d', {willReadFrequently:true});
  if (flipX) { g.translate(c.width, 0); g.scale(-1, 1); }
  g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), W = c.width, H = c.height, lab = new Int32Array(W * H), sizes = [0];
  for (let s = 0; s < W * H; s++) {
    if (lab[s] || d.data[s * 4 + 3] < 100) continue;
    const id = sizes.length; let n = 0; const st = [s]; lab[s] = id;
    while (st.length) { const p = st.pop(); n++; const x = p % W, y = (p / W) | 0;
      for (const q of [x > 0 ? p - 1 : -1, x < W - 1 ? p + 1 : -1, y > 0 ? p - W : -1, y < H - 1 ? p + W : -1]) if (q >= 0 && !lab[q] && d.data[q * 4 + 3] >= 100) { lab[q] = id; st.push(q); } }
    sizes.push(n);
  }
  const max = Math.max(...sizes);
  for (let p = 0; p < W * H; p++) if (!lab[p] || sizes[lab[p]] < max * .03) d.data[p * 4 + 3] = 0;
  g.putImageData(d, 0, 0); return c;
}
// 裁切、統一高度、腳底對齊、以質心水平置中，畫進 CELL×CELL 的大圖
function place(src, big){
  const g0 = src.getContext('2d', {willReadFrequently:true}), d = g0.getImageData(0, 0, src.width, src.height).data;
  let x0 = src.width, x1 = 0, y0 = src.height, y1 = 0, sx = 0, n = 0;
  for (let y = 0; y < src.height; y++) for (let x = 0; x < src.width; x++) if (d[(y * src.width + x) * 4 + 3] > 100) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); sx += x; n++; }
  const s = HV / (y1 - y0 + 1), cx = sx / n;
  const t = mk(CELL, CELL), g = t.getContext('2d'); g.imageSmoothingQuality = 'high';
  g.drawImage(src, 0, 0, src.width, src.height, CELL / 2 - (cx) * s, CELL - 6 - HV - y0 * s, src.width * s, src.height * s);
  return t;
}
function toCell(big){
  const bd = big.getContext('2d', {willReadFrequently:true}).getImageData(0, 0, CELL, CELL).data, cell = new Uint8ClampedArray(OUT * OUT * 4);
  for (let y = 0; y < OUT; y++) for (let x = 0; x < OUT; x++) {
    let r = 0, g = 0, b = 0, a = 0;
    for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) { const o = ((y * 2 + dy) * CELL + x * 2 + dx) * 4, w = bd[o + 3]; r += bd[o] * w; g += bd[o + 1] * w; b += bd[o + 2] * w; a += w; }
    const o = (y * OUT + x) * 4;
    if (a >= 4 * 255 * .5) { cell[o] = Math.round(r / a / 24) * 24; cell[o + 1] = Math.round(g / a / 24) * 24; cell[o + 2] = Math.round(b / a / 24) * 24; cell[o + 3] = 255; }
  }
  return cell;
}

window.bake = async (prefix, name) => {
  const ref = v => img(`../character-studio/references/${prefix}_${name}_${v}.png`);
  const ai = a => img(`ai-views/${name}/view_${String(a).padStart(3, '0')}.png`);
  const out = mk(OUT * ANGLES, OUT), og = out.getContext('2d');
  for (let k = 0; k < ANGLES; k++) {
    const a = k * 30;
    const src = a === 0 ? clean(await ref('front')) : a === 90 ? clean(await ref('side')) : a === 180 ? clean(await ref('back'))
      : a === 270 ? clean(await ref('side'), true) : clean(await ai(a));
    const cell = toCell(place(src));
    const res = new Uint8ClampedArray(cell);   // 補 1px 深色外框讓邊緣更俐落
    for (let y = 0; y < OUT; y++) for (let x = 0; x < OUT; x++) if (!cell[(y * OUT + x) * 4 + 3] &&
      [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => x + dx >= 0 && y + dy >= 0 && x + dx < OUT && y + dy < OUT && cell[((y + dy) * OUT + x + dx) * 4 + 3])) {
      const o = (y * OUT + x) * 4; res[o] = 36; res[o + 1] = 28; res[o + 2] = 40; res[o + 3] = 255;
    }
    og.putImageData(new ImageData(res, OUT, OUT), k * OUT, 0);
  }
  return out.toDataURL('image/png');
};
window.ready = true;
</script>
