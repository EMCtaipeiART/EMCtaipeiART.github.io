<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最後一版</title>
<style>
  :root{--bg:#0d1117;--fg:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Noto Sans TC','Fredoka',system-ui,sans-serif}
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--bg);opacity:0;pointer-events:none}
  video.on{opacity:1}
  #sub{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);max-width:88%;text-align:center;color:var(--fg);font-weight:700;font-size:clamp(13px,2.4vw,24px);line-height:1.45;padding:4px 14px;border-radius:8px;background:rgba(0,0,0,.62);opacity:0;transition:opacity .18s;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  #sub.on{opacity:1}
  #sub b{margin-right:8px;font-weight:800}
  #bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15)}
  #bar i{display:block;height:100%;width:0;background:#7be08a}
  #scn{position:absolute;left:3%;top:6%;display:flex;align-items:baseline;gap:10px;color:#fff;background:rgba(0,0,0,.55);padding:6px 16px;border-radius:999px;opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .35s;pointer-events:none}
  #scn.on{opacity:1;transform:none}
  #scn small{font-size:clamp(11px,1.4vw,14px);letter-spacing:.3em;opacity:.8}
  #scn b{font-size:clamp(15px,2.4vw,26px);font-weight:900;letter-spacing:.08em}
  #end{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#fff;background:#000;opacity:0;pointer-events:none;transition:opacity 1s}
  #end.on{opacity:1}
  #end small{display:block;letter-spacing:.6em;font-size:clamp(12px,2vw,20px);opacity:.85;margin-bottom:.7em}
  #end h1{margin:0;font-size:clamp(30px,7vw,72px);font-weight:900;letter-spacing:.1em;text-shadow:0 0 24px rgba(123,224,138,.45)}
  #pz{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);width:clamp(54px,9vw,86px);height:clamp(54px,9vw,86px);border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
  #pz.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #pz svg{width:42%;height:42%;fill:#fff}
  #mask{position:absolute;border-radius:10px;backdrop-filter:blur(16px) brightness(.55);-webkit-backdrop-filter:blur(16px) brightness(.55);background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .12s}
  #mask.on{opacity:1}
  #ld{position:absolute;right:3%;top:6%;color:#fff;font-size:12px;font-weight:700;letter-spacing:.15em;background:rgba(0,0,0,.55);padding:4px 12px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
  #ld.on{opacity:1}
  #ctl{position:absolute;right:10px;top:10px;display:none;gap:6px}
  body.solo #ctl{display:flex}
  body.solo #stage{cursor:pointer}
  #ctl button{border:0;border-radius:999px;padding:7px 14px;font:700 13px/1 inherit;color:#fff;background:rgba(0,0,0,.6);cursor:pointer}
  #ctl button:hover{background:rgba(0,0,0,.85)}
  #poster{position:absolute;inset:0;background:var(--bg) url(cinema/poster.webp) center/contain no-repeat}
</style>
</head>
<body>
<div id="stage">
  <div id="poster"></div>
  <video id="vA" playsinline preload="auto" aria-label="辦公室小短劇《最後一版》"></video>
  <video id="vB" playsinline preload="auto" aria-hidden="true"></video>
  <div id="mask"></div>
  <div id="sub" aria-live="polite"></div>
  <div id="scn"><small></small><b></b></div>
  <div id="end"><div><small>EMC PIXEL OFFICE</small><h1>下一位，就是你</h1></div></div>
  <div id="pz"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></div>
  <div id="ld">載入下一幕…</div>
  <div id="bar"><i></i></div>
  <div id="ctl">
    <button id="bPlay" type="button">暫停</button>
    <button id="bNext" type="button">下一句</button>
    <button id="bSub" type="button">字幕：開</button>
    <button id="bMute" type="button">開聲音</button>
  </div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search), embedded = params.get('embed') === '1', VER = '4';
  if (!embedded) document.body.classList.add('solo');
  var $ = function (id) { return document.getElementById(id); };
  var maskEl = $('mask'), subEl = $('sub'), scnEl = $('scn'), endEl = $('end'), pzEl = $('pz'), ldEl = $('ld'), barI = document.querySelector('#bar i'), poster = $('poster');
  var COLORS = { Machi: '#7be08a', Anna: '#ff9cc0', Amber: '#ffc864', Leona: '#b7a2ff', Noise: '#7cc4ff', '企劃': '#ffe082', '新同事': '#ffd0e0' };
  var TITLES = ['客戶來信', '第七版', '布丁', '小小的想法', '會議室大戰', '歡迎入職'], NUM = ['一', '二', '三', '四', '五', '六'];
  var PAD = 0.12;   // 每個分幕檔開頭多錄了約 0.12 秒，字幕時間與切換點都要加上
  var scenes = [], offs = [], total = 0;
  var vids = [$('vA'), $('vB')], cur = vids[0], nxt = vids[1];
  var urls = [], idx = 0, prepared = -1, waiting = -1;
  var ready = false, ended = false, userPaused = false, autoPaused = false, inView = true, subsOn = true, ctaOn = false, curCue = -1, curScn = -1, muted = false;
  var say = function (m) { try { parent.postMessage(m, '*'); } catch (e) {} };
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function label() { $('bMute').textContent = muted ? '開聲音' : '關聲音'; }
  function srcOf(i) { return urls[i] || ('cinema/' + scenes[i].file + '?v=' + VER); }

  // ---------- 載入：先播第一幕，其餘在背景一幕一幕抓（抓完存成 blob，切過去時不用再等網路） ----------
  function prepare(i) {   // 把第 i 幕放進「待命」的 video，先解碼好第一格
    if (i >= scenes.length || !urls[i] || prepared === i || prepared === -2) return; prepared = -2;
    nxt.muted = muted; nxt.src = urls[i]; nxt.load();
    nxt.addEventListener('loadeddata', function () { prepared = i; if (waiting === i) goto(i); }, { once: true });
  }
  function backgroundLoad(i) {
    if (i >= scenes.length) return;
    fetch('cinema/' + scenes[i].file + '?v=' + VER, { priority: 'low' }).then(function (r) { return r.blob(); }).then(function (b) {
      urls[i] = URL.createObjectURL(b);
      if (i === idx + 1 || waiting === i) prepare(i);
      backgroundLoad(i + 1);
    }).catch(function () { setTimeout(function () { backgroundLoad(i); }, 4000); });
  }

  // ---------- 切幕 ----------
  function goto(i) {
    if (i >= scenes.length) { finish(); return; }
    if (prepared !== i) {   // 還沒備好：停在目前這一幕的尾巴，備好再切
      waiting = i; ldEl.classList.add('on'); if (!cur.paused && i !== idx) { autoPaused = true; cur.pause(); }
      if (urls[i]) { prepared = -1; prepare(i); }
      else if (i === 0) { prepared = -2; nxt.muted = muted; nxt.src = srcOf(0); nxt.load(); nxt.addEventListener('loadeddata', function () { prepared = 0; goto(0); }, { once: true }); }
      return;
    }
    waiting = -1; ldEl.classList.remove('on');
    var old = cur; cur = nxt; nxt = old; idx = i; prepared = -1; curScn = -2; curCue = -2;
    cur.muted = muted; cur.currentTime = 0; autoPaused = false;
    cur.classList.add('on'); old.classList.remove('on');
    if (!userPaused) cur.play().catch(fallbackMuted);
    setTimeout(function () { old.pause(); }, 120);
    if (urls[i + 1]) prepare(i + 1);
  }
  function finish() { ended = true; cur.pause(); endEl.classList.add('on'); pzEl.classList.remove('on'); say({ type: 'cinemaEnded', on: true }); }
  function replay() { ended = false; autoPaused = false; userPaused = false; pzEl.classList.remove('on'); endEl.classList.remove('on'); curScn = -2; say({ type: 'cinemaEnded', on: false }); if (idx === 0) { cur.currentTime = 0; cur.play().catch(fallbackMuted); } else { prepared = -1; goto(0); } }

  // ---------- 字幕、幕標題、進度 ----------
  function layoutMask() {   // 影片是 16:9、在舞台裡置中縮放；遮罩蓋在影片自帶字幕所在的下緣（影片高度 82%～94%、寬度中間 76%）
    var W = innerWidth, H = innerHeight, vw = Math.min(W, H * 16 / 9), vh = vw * 9 / 16, l = (W - vw) / 2, t = (H - vh) / 2;
    maskEl.style.left = (l + vw * 0.12) + 'px'; maskEl.style.width = (vw * 0.76) + 'px'; maskEl.style.top = (t + vh * 0.82) + 'px'; maskEl.style.height = (vh * 0.12) + 'px';
  }
  addEventListener('resize', layoutMask); layoutMask();
  function showCue(i) {
    if (i === curCue) return; curCue = i;
    var c = i >= 0 ? scenes[idx].cues[i] : null; maskEl.classList.toggle('on', Boolean(c && c.mask));   // 就算關了字幕，也要蓋住影片自帶的簡體字
    if (!c || !subsOn) { subEl.classList.remove('on'); return; }
     subEl.innerHTML = (c.who ? '<b style="color:' + (COLORS[c.who] || '#ffe082') + '">' + esc(c.who) + '</b>' : '') + esc(c.text); subEl.classList.add('on');
  }
  function tick() {
    if (!scenes.length) { requestAnimationFrame(tick); return; }
    var t = cur.currentTime - PAD, sc = scenes[idx], i, ci = -1;
    for (i = 0; i < sc.cues.length; i++) if (t >= sc.cues[i].s && t < sc.cues[i].e) { ci = i; break; }
    showCue(ci);
    var from = idx === 0 ? 1.9 : 0.3, si = t >= from && t < from + 2.8 ? idx : -1;   // 第一幕要等片頭字卡演完才出標題
    if (si !== curScn) { curScn = si; if (si < 0) scnEl.classList.remove('on'); else { scnEl.querySelector('small').textContent = '第' + NUM[si] + '幕'; scnEl.querySelector('b').textContent = TITLES[si] || ''; scnEl.classList.add('on'); } }
    var on = idx === scenes.length - 1 && t >= 5; if (on !== ctaOn) { ctaOn = on; say({ type: 'cinemaCta', on: on }); }
    barI.style.width = Math.min(100, (offs[idx] + Math.max(0, t)) / total * 100) + '%';
    if (!ended && waiting < 0 && !cur.paused && t >= sc.dur - 0.02) { if (idx < scenes.length - 1) goto(idx + 1); else finish(); }
    requestAnimationFrame(tick);
  }

  // ---------- 操作 ----------
  function skip() {   // 下一句：目前這一幕的下一句台詞；沒有就到下一幕；最後一幕之後是片尾黑幕
    if (ended) { replay(); return; }
    var t = cur.currentTime - PAD + 0.15, sc = scenes[idx], nx = null, i;
    for (i = 0; i < sc.cues.length; i++) if (sc.cues[i].s > t) { nx = sc.cues[i].s - 0.25 + PAD; break; }
    if (nx !== null) { cur.currentTime = Math.max(0, nx); if (cur.paused && !userPaused) cur.play().catch(function () {}); return; }
    if (idx < scenes.length - 1) goto(idx + 1); else finish();
  }
  function toggle() {
    if (ended || waiting >= 0) return;
    if (userPaused) { userPaused = false; autoPaused = false; cur.play().catch(fallbackMuted); pzEl.classList.remove('on'); $('bPlay').textContent = '暫停'; }
    else { userPaused = true; cur.pause(); pzEl.classList.add('on'); $('bPlay').textContent = '播放'; }
  }
  function fallbackMuted() { muted = true; vids.forEach(function (v) { v.muted = true; }); label(); say({ type: 'cinemaMuted', muted: true }); if (!userPaused) cur.play().catch(function () {}); }
  function setMuted(m) { muted = m; vids.forEach(function (v) { v.muted = m; }); label(); if (!m && !userPaused && !ended) cur.play().then(function () { say({ type: 'cinemaMuted', muted: false }); }).catch(fallbackMuted); }
  function applyActive() {   // 離開頁面（切分頁／捲出畫面）就暫停，回來接著播
    if (!ready || ended || userPaused) return;
    var on = !document.hidden && inView;
    if (on && cur.paused && waiting < 0) { autoPaused = false; cur.play().catch(function () {}); }
    else if (!on && !cur.paused) { autoPaused = true; cur.pause(); }
  }
  vids.forEach(function (v) { v.addEventListener('pause', function () { if (v === cur && !userPaused && !autoPaused && !ended && waiting < 0 && !document.hidden && !muted) fallbackMuted(); }); });
  document.addEventListener('visibilitychange', applyActive);
  addEventListener('pagehide', function () { if (!cur.paused) { autoPaused = true; cur.pause(); } });
  addEventListener('pageshow', applyActive);
  if ('IntersectionObserver' in window) new IntersectionObserver(function (es) { inView = es[es.length - 1].isIntersecting; applyActive(); }, { threshold: 0.2 }).observe($('stage'));

  addEventListener('message', function (e) {
    var d = e.data; if (!d || typeof d !== 'object') return;
    if (d.type === 'cinemaSkip') skip();
    if (d.type === 'cinemaReplay') replay();
    if (d.type === 'cinemaToggle') toggle();
    if (d.type === 'cinemaMute') setMuted(Boolean(d.muted));
  });
  $('bNext').onclick = function (e) { e.stopPropagation(); skip(); };
  $('bPlay').onclick = function (e) { e.stopPropagation(); toggle(); };
  $('bSub').onclick = function (e) { e.stopPropagation(); subsOn = !subsOn; this.textContent = '字幕：' + (subsOn ? '開' : '關'); curCue = -2; };
  $('bMute').onclick = function (e) { e.stopPropagation(); setMuted(!muted); };
  $('stage').addEventListener('click', function () { if (!embedded) toggle(); });

  // ---------- 啟動 ----------
  fetch('cinema/scenes.json?v=' + VER).then(function (r) { return r.json(); }).then(function (j) {
    scenes = j.scenes; var acc = 0; scenes.forEach(function (s) { offs.push(acc); acc += s.dur; }); total = acc;
    cur.muted = false; label(); cur.src = srcOf(0);
    cur.addEventListener('canplay', function () {
      if (ready) return; ready = true; cur.classList.add('on'); poster.style.display = 'none';
      cur.play().then(function () { say({ type: 'cinemaMuted', muted: false }); }).catch(fallbackMuted);
      say({ type: 'cinemaReady' }); backgroundLoad(1); requestAnimationFrame(tick);
    }, { once: true });
  }).catch(function () {});
})();
</script>
</body>
</html>
