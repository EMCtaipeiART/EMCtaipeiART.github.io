{

  m.position.set((x + w / 2) * U, .75, (y + h / 2) * U); scene.add(m);

const R_PLAYER = .75;
function blocked(x, z){
  if (x < 1 || x > 1201 * U - 1 || z < 1 || z > 1526 * U - 1) return true;
  return rects.some(([a, b, c, d]) => x > a - R_PLAYER && x < c + R_PLAYER && z > b - R_PLAYER * .55 && z < d + R_PLAYER * .55);

// 道具與桌組的 billboard：先把素材縮成螢幕上實際的像素大小（才會是清楚的像素風）
const billboards = [];
function trimmed(img, sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight){
  const c = document.createElement('canvas'); c.width = sw; c.height = sh; const g = c.getContext('2d', {willReadFrequently:true}); g.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);

  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) if (d[(y * sw + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }

}
function propTexture(src, dw, dh){
  const w = Math.max(4, Math.round(dw * PPU)), h = Math.max(4, Math.round(dh * PPU));
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d', {willReadFrequently:true});

  m.geometry.translate(0, dh / 2, 0); m.position.set(cx, 0, z); scene.add(m); billboards.push(m); return m;
}
const imgs = {};
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
async function buildOffice(){
  await Promise.all(Object.entries(FILES).map(async ([k, f]) => { imgs[k] = await loadImg(ASSET + f); }));
  const T = {};      // 裁邊後的素材
  for (const k of Object.keys(FILES)) if (imgs[k]) T[k] = trimmed(imgs[k]);
  const place = (src, x, bottom, w, o = {}) => {
    if (!src) return;
    const dh = o.h ? o.h * U : w * U * src.height / src.width, dw = dh * src.width / src.height;

    place(T[key], x, bottom, w, o);

  }
  build3dObjects(T, place);

  const I = v => v * U;
  GROUPS.forEach((xs, gi) => ROW_TOPS.forEach((top, ri) => {
    deskBlock3d(xs[0] - 52.5, top, 3, 0x1d4ba0, 'imac', gi === 0 && ri === 2);
    xs.forEach(cx => { officeChair3d(I(cx), I(top - 18), 'S'); officeChair3d(I(cx), I(top + 116), 'N'); });
  }));
  // 書櫃：靠緊兩張背對背辦公桌的整面層櫃（人物高），開口朝左；白柱填滿兩個桌組之間的縫，紅色工具櫃靠在上排的柱旁
  [355, 592, 828].forEach(top => bookcase3d(388, top, 22, 94));

  pillar3d(725.5, 828, 55, 94);

function bookcase3d(x, z, w, d, h = 2.0){   // 版面圖像素；層櫃開口朝左（-x），其餘面是黑色側板

// 整塊辦公桌：cols 欄 × 2 排（上排人坐北側、螢幕朝北；下排人坐南側、螢幕朝南），桌腳在外緣與欄界

function monitor3d(x, z, dir, color){   // 螢幕：背面為機身色、正面（朝 dir）為深色螢幕
  const body = new THREE.MeshLambertMaterial({color}), face = new THREE.MeshLambertMaterial({color:color === 0x15181c ? 0x23303f : 0x2a3340});

// 椅子（3D、方向固定）：face = 椅面朝向 'N' | 'S' | 'E' | 'W'。每張都登記成「座位」，人物靠近按 E 可坐下

const OUT_T = .04, outlineMat = new THREE.MeshBasicMaterial({color:0x0b0d10, side:THREE.BackSide});   // 外框粗細（世界單位）
function hull(parent, w, h, d, px, py, pz, t = OUT_T){ const m = new THREE.Mesh(new THREE.BoxGeometry(w + 2 * t, h + 2 * t, d + 2 * t), outlineMat); m.position.set(px, py, pz); parent.add(m); return m; }
function pbox(w, h, d, color, x, y, z, edge = true){
  const geo = new THREE.BoxGeometry(w, h, d), m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({color}));
  m.position.set(x, y + h / 2, z); scene.add(m);

}
function table3d(cx, cz, w, d, color, h = .95){   // 世界座標；桌面＋四支桌腳

const chairsAt = [];   // 等素材載入後再放椅子
function build3dObjects(T, place){
  const I = v => v * U;

  // 影廳螢幕（北牆前）
  { const c = document.createElement('canvas'); c.width = 64; c.height = 40; const g = c.getContext('2d');
    g.fillStyle = '#2f64c8'; g.fillRect(0, 0, 64, 8); g.fillStyle = '#fff'; g.fillRect(0, 8, 64, 32); g.fillStyle = '#fff'; g.font = 'bold 7px sans-serif'; g.fillText('影廳', 3, 6);
    g.fillStyle = '#334'; g.font = '6px sans-serif'; g.fillText('你發現了投影機的秘密！', 3, 26);
    const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(I(84), I(52)), new THREE.MeshBasicMaterial({map:t})); m.position.set(I(184), 1.9, I(1062)); scene.add(m); }
  // 會議室 D：U 型白色會議桌
  const uc = 0xeeeee4;
  table3d(I(846), I(1196), I(252), I(60), uc); table3d(I(699), I(1256), I(46), I(180), uc); table3d(I(995), I(1256), I(46), I(180), uc);
  pbox(.55, .16, .4, 0xf2f2f2, I(846), .95, I(1196));
  rects.push([I(720), I(1166), I(972), I(1226)], [I(676), I(1166), I(722), I(1346)], [I(972), I(1166), I(1018), I(1346)]);
  for (const x of [752, 817, 880, 945]) chair3d(I(x), I(1140), 'S');
  for (const y of [1200, 1245, 1292, 1334]) { chair3d(I(650), I(y), 'E'); chair3d(I(1044), I(y), 'W'); }
  // 廁所
  for (const dx of STALLS) {
    toilet3d(I(342 + dx), I(98)); toilet3d(I(342 + dx), I(160));
    sink3d(I(334 + dx), I(224));
    rects.push([I(308 + dx), I(76), I(388 + dx), I(182)], [I(308 + dx), I(206), I(360 + dx), I(240)]);
    for (const [x, y, w, h] of [[305,64,83,4],[305,126,83,4],[305,188,83,4],[305,64,4,128]]) pbox(I(w), .7, I(h), 0xd7cfc6, I(x + dx + w / 2), 0, I(y + h / 2));
  }
}
// 地圖上的文字標籤（DOM，才清楚）
const labelEls = LABELS.map(([t, ix, iy]) => { const e = document.createElement('div'); e.className = 'lbl'; e.textContent = t; document.body.appendChild(e); return {e, p:new THREE.Vector3(ix * U, 2.6, iy * U)}; });
const _lp = new THREE.Vector3();
function updateLabels(){
  for (const {e, p} of labelEls) {
    _lp.copy(p).project(camera);
    const vis = _lp.z < 1 && Math.abs(_lp.x) < 1.1 && Math.abs(_lp.y) < 1.1;
    e.style.display = vis ? 'block' : 'none';
    if (vis) e.style.transform = 'translate(-50%,-50%) translate(' + ((_lp.x * .5 + .5) * innerWidth) + 'px,' + ((-_lp.y * .5 + .5) * innerHeight) + 'px)';
  }
}

// ---------- 角色（平面像素 billboard） ----------
const chars = {};   // name -> {holder, sprite, tex, ...}
const roster = document.getElementById('roster');
let player = null, target = null;
const ANGLES = 12, ROWS = 1, CELL_W = 60, CELL_H = 60, WORLD_H = 2.04;   // 圖集：由三視圖合成的 12 個面向（每 30°）
const loadTex = src => new Promise((res, rej) => new THREE.TextureLoader().load(src, t => {
  t.magFilter = t.minFilter = HD ? THREE.LinearFilter : THREE.NearestFilter; t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace;
  t.repeat.set(1 / ANGLES, 1 / ROWS); res(t);
}, undefined, rej));
const shadowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 16; const g = c.getContext('2d'); g.fillStyle = '#000'; g.beginPath(); g.ellipse(8, 8, 7, 5, 0, 0, 7); g.fill(); const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; return t; })();

async function addChar(name, i){
  const tex = await loadTex(url(name));
  const sprite = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_H * CELL_W / CELL_H, WORLD_H),
    new THREE.MeshBasicMaterial({map:tex, transparent:true, alphaTest:.5, side:THREE.DoubleSide}));
  sprite.geometry.translate(0, WORLD_H / 2 - .03, 0);
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(1.1, .8), new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, opacity:.28, depthWrite:false}));
  blob.rotation.x = -Math.PI / 2; blob.position.y = .02;
  const holder = new THREE.Group(); holder.add(blob, sprite);
  const seat = SEATS[name], a = i / NAMES.length * Math.PI * 2;
  if (seat) {   // 入座：上排坐在桌後（面向鏡頭）、下排坐在桌前（背對鏡頭）
    const top = ROW_TOPS[seat[1]], cx = GROUPS[seat[0]][seat[2]];
    holder.position.set(cx * U, 0, (seat[3] === 'top' ? top - 14 : top + 120) * U);
  } else holder.position.set((560 + 42 * (i % 6)) * U, 0, (1085 + 28 * Math.floor(i / 6)) * U);
  scene.add(holder);
  const c = {name, holder, sprite, tex, face:seat ? (seat[3] === 'top' ? 0 : Math.PI) : -a, moving:0, phase:Math.random() * 9, wander:!seat, t:Math.random() * 5, dir:new THREE.Vector3()};
  chars[name] = c;
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => select(name); roster.appendChild(b); c.btn = b;
}
const SIT_DROP = .2;
function sitDown(c){
  if (c.sitting) return false;
  let best = null, bd = 2.2;
  for (const st of chairSeats) { if (st.by) continue; const d = Math.hypot(st.x - c.holder.position.x, st.z - c.holder.position.z); if (d < bd) { bd = d; best = st; } }
  if (!best) return false;
  best.by = c; c.sitting = best; c.wander = false; c.moving = 0; c.face = best.face;
  c.holder.position.set(best.x + Math.sin(best.face) * .32, 0, best.z + Math.cos(best.face) * .32);
  return true;
}
function standUp(c){
  const st = c.sitting; if (!st) return;
  const fx = Math.sin(st.face), fz = Math.cos(st.face);
  for (const k of [-1, 1]) { const x = st.x + fx * k * 1.0, z = st.z + fz * k * 1.0; if (!blocked(x, z)) { c.holder.position.set(x, 0, z); break; } }
  st.by = null; c.sitting = null;
}
function toggleSit(){ if (!player) return; if (player.sitting) standUp(player); else sitDown(player); }
addEventListener('keydown', e => { if (e.code === 'KeyE') toggleSit(); });
document.getElementById('sit').addEventListener('click', toggleSit);
function select(name){
  player = chars[name]; target = null;
  for (const c of Object.values(chars)) { c.btn.classList.toggle('on', c === player); c.wander = c !== player && !SEATS[c.name] && !c.sitting; }
}

let done = 0;
Promise.all([buildOffice(), ...NAMES.map((n, i) => addChar(n, i).then(() => { document.getElementById('load').textContent = `載入角色 ${++done}/${NAMES.length}`; }))])
  .then(() => { for (const c of Object.values(chars)) if (SEATS[c.name]) sitDown(c); select('Machi'); document.getElementById('load').remove(); window.__plaza = {chars, camera, seats:chairSeats}; });

const _cam = new THREE.Vector3(), _tilt = new THREE.Quaternion(), _z = new THREE.Vector3(0, 0, 1);
const TILT = 0, STRETCH = 1 / Math.cos(Math.atan(8.4 / 9.4)), _e = new THREE.Euler(0, 0, 0, 'YXZ');   // 垂直站立：不再後傾（避免穿進桌子、牆），高度拉長 STRETCH 倍抵消俯視縮短
   // 後傾約 22°：夠像站著的人，又不會讓上半身穿進後方物件
function updateBillboards(){ _e.set(-TILT, 0, 0); for (const m of billboards) { m.quaternion.setFromEuler(_e); m.scale.y = STRETCH; } }   // 道具方向固定（永遠朝南），只有人物會轉向
function updateSprite(c, dt){
  // 依角色朝向與鏡頭的相對角度，挑選 12 個面向中最接近的一格
  c.holder.getWorldPosition(_cam); _cam.subVectors(camera.position, _cam);
  const toCam = Math.atan2(_cam.x, _cam.z);
  const rel = Math.atan2(Math.sin(c.face - toCam), Math.cos(c.face - toCam));   // 0 = 面向鏡頭
  const col = (Math.round(rel / (Math.PI * 2) * ANGLES) + ANGLES) % ANGLES;
  c.tex.offset.set(col / ANGLES, 0);
  c.phase += dt * (c.moving > 3.5 ? 16 : 10) * (c.moving > 0 ? 1 : 0);   // 沒有走路影格，以彈跳加搖擺表現
  const sw = Math.sin(c.phase);
  c.sprite.position.y = (c.sitting ? -SIT_DROP : 0) + (c.moving > 0 ? Math.abs(sw) * (c.moving > 3.5 ? .2 : .1) : 0);
  c.sprite.scale.y = STRETCH; _e.set(-TILT, toCam, 0); c.sprite.quaternion.setFromEuler(_e).multiply(_tilt.setFromAxisAngle(_z, c.moving > 0 ? sw * .07 : 0));   // 面向鏡頭，走路時輕微搖擺
}

// ---------- 輸入 ----------
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);
const joy = {x:0, y:0};
const stick = document.getElementById('stick'), knob = stick.firstElementChild;
function joyMove(e){
  const r = stick.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
  let dx = (t.clientX - r.left - r.width / 2) / 45, dy = (t.clientY - r.top - r.height / 2) / 45;
  const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  joy.x = dx; joy.y = dy; knob.style.transform = `translate(${dx * 30}px,${dy * 30}px)`;
}
stick.addEventListener('pointerdown', e => { stick.setPointerCapture(e.pointerId); joyMove(e); });
stick.addEventListener('pointermove', e => { if (e.buttons) joyMove(e); });
stick.addEventListener('pointerup', () => { joy.x = joy.y = 0; knob.style.transform = ''; });

const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
renderer.domElement.addEventListener('pointerdown', e => {
  ray.setFromCamera({x:e.clientX / innerWidth * 2 - 1, y:-(e.clientY / innerHeight * 2 - 1)}, camera);
  const p = new THREE.Vector3();
  if (ray.ray.intersectPlane(plane, p) && !blocked(p.x, p.z)) target = p;
});

// ---------- 主迴圈 ----------
const clock = new THREE.Clock(), camPos = new THREE.Vector3(20, 8.4, 33), look = new THREE.Vector3();
const up = new THREE.Vector3(0, 1, 0);
function moveChar(c, dir, speed, dt){
  if (dir.lengthSq() < 1e-4) { c.moving = 0; return; }
  dir.normalize();
  const p = c.holder.position, sx = dir.x * speed * dt, sz = dir.z * speed * dt;
  if (!blocked(p.x + sx, p.z)) p.x += sx;
  if (!blocked(p.x, p.z + sz)) p.z += sz;
  const want = Math.atan2(dir.x, dir.z);
  c.face = want; c.moving = speed;
}
function tick(){
  const dt = Math.min(clock.getDelta(), .05);
  if (player) {
    const dir = new THREE.Vector3(
      (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x,
      0,
      (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + joy.y);
    const run = keys.ShiftLeft || keys.ShiftRight || Math.hypot(joy.x, joy.y) > .85;
    if (dir.lengthSq() > .01) target = null;
    else if (target) { dir.copy(target).sub(player.holder.position); dir.y = 0; if (dir.length() < .2) target = null; }
    if (player.sitting && dir.lengthSq() > 1e-4) standUp(player);
    if (!player.sitting) moveChar(player, dir, run ? 5 : 2.4, dt);
  }
  for (const c of Object.values(chars)) {
    if (c.wander && !c.sitting) {                                   // 其他角色隨機閒晃
      c.t -= dt;
      if (c.t < 0) { c.t = 1.5 + Math.random() * 4; const a = Math.random() * 6.283; c.dir.set(Math.random() < .4 ? 0 : Math.cos(a), 0, Math.sin(a)); }
      moveChar(c, c.dir.clone(), 1.6, dt);
    }
    updateSprite(c, dt);
  }
  if (player) {
    const p = player.holder.position;
    camPos.lerp(new THREE.Vector3(p.x, 8.4, p.z + 9.4), 1 - Math.pow(.001, dt));
    camera.position.copy(camPos); look.lerp(p, 1 - Math.pow(.001, dt)); camera.lookAt(look.x, 1, look.z);
  } else { camera.position.copy(camPos); camera.lookAt(0, 1, 0); }
  updateBillboards(); updateLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
