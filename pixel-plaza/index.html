<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EMC · 像素廣場</title>
<script type="importmap">{"imports":{"three":"../character-studio/vendor/three.module.js"}}</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:system-ui,"Noto Sans TC",sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#hud{position:fixed;left:12px;top:10px;color:#fff;text-shadow:0 2px 0 #0006;font-size:14px;pointer-events:none;line-height:1.5}
#hud b{font-size:18px}
#roster{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0008}
#roster button{flex:none;border:2px solid #fff6;background:#0006;color:#fff;border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
#roster button.on{background:#ffd23f;color:#222;border-color:#fff}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#1b2a41;color:#fff;font-size:18px;z-index:5}
#stick{position:fixed;left:18px;bottom:78px;width:110px;height:110px;border-radius:50%;background:#fff3;border:2px solid #fff6;display:none}
#stick i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fffc}
@media (pointer:coarse){#stick{display:block}}
</style></head><body>
<div id="load">載入像素廣場…</div>
<div id="hud"><b>EMC 像素廣場</b><br>WASD / 方向鍵移動 · Shift 跑步 · 點地面走過去 · 下方切換角色</div>
<div id="stick"><i></i></div>
<div id="roster"></div>
<script type="module">
import * as THREE from 'three';

const PIXEL = 3;                       // 每個像素放大倍率
const NAMES = ['Amber','Anna','Leona','Machi','Noise','余采馨','吳冠賢','廖秦葦','李明庭','鄭筱舢','黎子瑄'];
const url = (n, v) => `../character-studio/references/${/^[A-Za-z]+$/.test(n) ? 'designer' : 'staff'}_${n}_${v}.png`;

const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.fog = new THREE.Fog(0x8fd3ff, 28, 60);
const camera = new THREE.PerspectiveCamera(45, 1, .1, 120);

scene.add(new THREE.HemisphereLight(0xffffff, 0x6b8f5a, 1.6));
const sun = new THREE.DirectionalLight(0xfff1d0, 2.2);
sun.position.set(10, 18, 8); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, {left:-22,right:22,top:22,bottom:-22,near:1,far:60});
scene.add(sun);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(1 / PIXEL);   // 低解析度渲染，CSS 放大成方塊像素
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- 體素地形 ----------
const mat = c => new THREE.MeshLambertMaterial({color:c});
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const R = 14;
const grass = [0x6bbf59, 0x62b350, 0x74c862], path = [0xd9c08a, 0xcdb27a];
const tileGeo = new THREE.BoxGeometry(1, 1, 1);
const cells = [];
for (let x = -R; x <= R; x++) for (let z = -R; z <= R; z++) {
  if (x * x + z * z > R * R) continue;
  const onPath = Math.abs(x) <= 1 || Math.abs(z) <= 1 || (x * x + z * z) < 16;
  cells.push([x, z, onPath]);
}
const ground = new THREE.InstancedMesh(tileGeo, new THREE.MeshLambertMaterial(), cells.length);
const m4 = new THREE.Matrix4(), col = new THREE.Color();
cells.forEach(([x, z, p], i) => {
  m4.makeTranslation(x, -.5, z); ground.setMatrixAt(i, m4);
  col.set((p ? path : grass)[Math.floor(rnd() * (p ? 2 : 3))]); ground.setColorAt(i, col);
});
ground.receiveShadow = true; scene.add(ground);

function box(w, h, d, c, x, y, z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
  m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
// 噴泉
box(3.2, .5, 3.2, 0xb8c0cc, 0, 0, 0); box(2.2, .5, 2.2, 0x4aa8ff, 0, .5, 0); box(.6, 1.6, .6, 0xdfe6ee, 0, .5, 0);
// 建築與樹
[[-9,-9,0xe4572e],[9,-9,0x29a3a3],[-9,9,0xf2b134],[9,9,0x7b5ea7]].forEach(([x,z,c]) => {
  box(5, 3, 4, c, x, 0, z); box(5.4, .5, 4.4, 0x444b5a, x, 3, z); box(1, 1.8, .2, 0x2b2118, x, 0, z + (z > 0 ? -2.1 : 2.1));
});
for (let i = 0; i < 26; i++) {
  const a = rnd() * 6.283, r = 9 + rnd() * 4.5, x = Math.cos(a) * r, z = Math.sin(a) * r;
  if ((Math.abs(x) < 2.5) || (Math.abs(z) < 2.5) || (Math.abs(Math.abs(x) - 9) < 3.6 && Math.abs(Math.abs(z) - 9) < 3)) continue;
  box(.5, 1.5, .5, 0x7a5230, x, 0, z); box(2, 1.6, 2, 0x2f8f46, x, 1.5, z); box(1.2, 1, 1.2, 0x3aa655, x, 3, z);
}

// ---------- 角色（平面像素 billboard） ----------
const chars = {};   // name -> {holder, sprite, tex, ...}
const roster = document.getElementById('roster');
let player = null, target = null;
const SPRITE_H = 56, WORLD_H = 1.9;   // 像素貼圖高度 / 世界高度

function pixelTex(img){
  // 縮成小點陣圖並降色，再用 nearest 放大，變成真正的像素角色
  const h = SPRITE_H, w = Math.round(img.width / img.height * h);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', {willReadFrequently:true}); g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    p[i + 3] = p[i + 3] > 110 ? 255 : 0;
    for (let k = 0; k < 3; k++) p[i + k] = Math.round(p[i + k] / 24) * 24;
  }
  g.putImageData(d, 0, 0);
  const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.colorSpace = THREE.SRGBColorSpace; t.userData = {aspect:w / h}; return t;
}
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const shadowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 16; const g = c.getContext('2d'); g.fillStyle = '#000'; g.beginPath(); g.ellipse(8, 8, 7, 5, 0, 0, 7); g.fill(); const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; return t; })();

async function addChar(name, i){
  const [front, side, back] = await Promise.all(['front', 'side', 'back'].map(v => loadImg(url(name, v)).then(pixelTex)));
  const aspect = front.userData.aspect;
  const sprite = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_H * aspect, WORLD_H),
    new THREE.MeshBasicMaterial({map:front, transparent:true, alphaTest:.5, side:THREE.DoubleSide}));
  sprite.geometry.translate(0, WORLD_H / 2, 0);
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(1.1, .8), new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, opacity:.28, depthWrite:false}));
  blob.rotation.x = -Math.PI / 2; blob.position.y = .02;
  const holder = new THREE.Group(); holder.add(blob, sprite);
  const a = i / NAMES.length * Math.PI * 2;
  holder.position.set(Math.cos(a) * 5, 0, Math.sin(a) * 5);
  scene.add(holder);
  const c = {name, holder, sprite, tex:{front, side, back}, face:-a, moving:0, phase:Math.random() * 9, wander:i > 0, t:Math.random() * 5, dir:new THREE.Vector3()};
  chars[name] = c;
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => select(name); roster.appendChild(b); c.btn = b;
}
function select(name){
  player = chars[name]; target = null;
  for (const c of Object.values(chars)) { c.btn.classList.toggle('on', c === player); c.wander = c !== player; }
}

let done = 0;
Promise.all(NAMES.map((n, i) => addChar(n, i).then(() => { document.getElementById('load').textContent = `載入角色 ${++done}/${NAMES.length}`; })))
  .then(() => { select('Amber'); document.getElementById('load').remove(); window.__plaza = {chars, camera}; });

const _cam = new THREE.Vector3();
function updateSprite(c, dt){
  // 依角色朝向與鏡頭的相對角度，挑選正面／側面／背面（側面左右翻轉）
  c.holder.getWorldPosition(_cam); _cam.subVectors(camera.position, _cam);
  const toCam = Math.atan2(_cam.x, _cam.z);
  let rel = Math.atan2(Math.sin(c.face - toCam), Math.cos(c.face - toCam));   // 0=面向鏡頭
  const ar = Math.abs(rel);
  const m = c.sprite.material, view = ar < Math.PI / 4 ? 'front' : ar > Math.PI * .75 ? 'back' : 'side';
  m.map = c.tex[view]; c.sprite.scale.x = view === 'side' && rel < 0 ? -1 : 1;
  c.sprite.rotation.y = toCam;                                      // 圓柱形 billboard
  c.phase += dt * (c.moving > 3.5 ? 14 : 9) * (c.moving > 0 ? 1 : 0);
  const hop = c.moving > 0 ? Math.abs(Math.sin(c.phase)) * (c.moving > 3.5 ? .22 : .12) : 0;
  c.sprite.position.y = hop; c.sprite.rotation.z = c.moving > 0 ? Math.sin(c.phase) * .06 : 0;
}

// ---------- 輸入 ----------
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);
const joy = {x:0, y:0};
const stick = document.getElementById('stick'), knob = stick.firstElementChild;
function joyMove(e){
  const r = stick.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
  let dx = (t.clientX - r.left - r.width / 2) / 45, dy = (t.clientY - r.top - r.height / 2) / 45;
  const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  joy.x = dx; joy.y = dy; knob.style.transform = `translate(${dx * 30}px,${dy * 30}px)`;
}
stick.addEventListener('pointerdown', e => { stick.setPointerCapture(e.pointerId); joyMove(e); });
stick.addEventListener('pointermove', e => { if (e.buttons) joyMove(e); });
stick.addEventListener('pointerup', () => { joy.x = joy.y = 0; knob.style.transform = ''; });

const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
renderer.domElement.addEventListener('pointerdown', e => {
  ray.setFromCamera({x:e.clientX / innerWidth * 2 - 1, y:-(e.clientY / innerHeight * 2 - 1)}, camera);
  const p = new THREE.Vector3();
  if (ray.ray.intersectPlane(plane, p) && p.length() < R) target = p;
});

// ---------- 主迴圈 ----------
const clock = new THREE.Clock(), camPos = new THREE.Vector3(0, 12, 14), look = new THREE.Vector3();
const up = new THREE.Vector3(0, 1, 0);
function moveChar(c, dir, speed, dt){
  if (dir.lengthSq() < 1e-4) { c.moving = 0; return; }
  dir.normalize();
  c.holder.position.addScaledVector(dir, speed * dt);
  const len = c.holder.position.length(); if (len > R - 1) c.holder.position.multiplyScalar((R - 1) / len);
  const want = Math.atan2(dir.x, dir.z);
  c.face = want; c.moving = speed;
}
function tick(){
  const dt = Math.min(clock.getDelta(), .05);
  if (player) {
    const dir = new THREE.Vector3(
      (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x,
      0,
      (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + joy.y);
    const run = keys.ShiftLeft || keys.ShiftRight || Math.hypot(joy.x, joy.y) > .85;
    if (dir.lengthSq() > .01) target = null;
    else if (target) { dir.copy(target).sub(player.holder.position); dir.y = 0; if (dir.length() < .2) target = null; }
    moveChar(player, dir, run ? 5 : 2.4, dt);
  }
  for (const c of Object.values(chars)) {
    if (c.wander) {                                   // 其他角色隨機閒晃
      c.t -= dt;
      if (c.t < 0) { c.t = 1.5 + Math.random() * 4; const a = Math.random() * 6.283; c.dir.set(Math.random() < .4 ? 0 : Math.cos(a), 0, Math.sin(a)); }
      moveChar(c, c.dir.clone(), 1.6, dt);
    }
    updateSprite(c, dt);
  }
  if (player) {
    const p = player.holder.position;
    camPos.lerp(new THREE.Vector3(p.x * .6, 11, p.z * .6 + 13), 1 - Math.pow(.001, dt));
    camera.position.copy(camPos); look.lerp(p, 1 - Math.pow(.001, dt)); camera.lookAt(look.x, 1, look.z);
  } else { camera.position.copy(camPos); camera.lookAt(0, 1, 0); }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script></body></html>
