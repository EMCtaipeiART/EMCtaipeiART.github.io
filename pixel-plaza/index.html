<script type="module">
import * as THREE from 'three';

const RH = 300;                        // 內部渲染高度（像素）
const NAMES = ['Amber','Anna','Leona','Machi','Noise','余采馨','吳冠賢','廖秦葦','李明庭','鄭筱舢','黎子瑄'];
const url = n => `sprites/${n}.png`;

const renderer = new THREE.WebGLRenderer({antialias:false});
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfd9e0);
const camera = new THREE.PerspectiveCamera(45, 1, .1, 120);

scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa7b3, 2));

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(1);   // 固定內部高度，CSS 放大成方塊像素；角色貼圖約 1:1 取樣
  renderer.setSize(Math.round(RH * w / h), RH, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- 辦公室整層（依使用者提供的平面配置圖） ----------
// 版面圖座標（1201×1526 px）× U = 世界座標。桌子 105 px 寬 ≈ 3.15 單位，與角色身高 2.04 的比例同遊戲內一致。
const U = 0.03, PPU = 29.5;               // PPU：每單位約幾個螢幕像素（貼圖縮成這個大小才會清楚）
const ASSET = '../EMC-ART-Pixel-Office/dist/assets/';
const FILES = {elevator:'props2/elevator.png',stall:'props2/toilet_stall.png',sink:'props2/pedestal_sink.png',tableA:'props2/meeting_table_black_6.png',table4:'props2/meeting_table_black_4.png',tableU:'props2/meeting_table_white_U.png',pantry:'props2/pantry_counter.png',fridge:'props2/fridge_double.png',plant:'props2/plant_pot.png',deskBeige:'props2/desk_beige_front.png',deskL:'props2/desk_white_L.png',shelf:'props2/bookshelf_black_small.png',pillarCab:'props2/pillar_cabinet.png',chair:'props/chair_black.png',pillar:'props/pillar_white.png',sheet:'furniture-v4.webp'};
// [素材, 左上 x, 底部 y, 寬, 選項{h 指定高, fh 碰撞高, col 自訂碰撞[x,y,w,h]}]（版面圖像素）
const PROPS = [
  ['elevator',165,255,72,{fh:40}],
  ['stall',305,190,83,{col:[305,64,83,128],h:125}],['sink',305,242,36,{fh:30,h:48}],
  ['stall',460,190,83,{col:[460,64,83,128],h:125}],['sink',460,242,36,{fh:30,h:48}],
  ['tableA',735,210,256,{col:[735,118,256,84]}],
  ['table4',118,1205,132,{col:[118,1112,132,78]}],['table4',122,1405,128,{col:[122,1320,128,78]}],
  ['tableU',658,1350,380,{col:[676,1166,340,60]}],
  ['pantry',333,1268,125,{fh:34}],['fridge',477,1285,73,{fh:50}],['plant',570,1320,22,{fh:14}],
  ...[0,237].flatMap(dy=>[[85,355],[190,355],[85,400],[190,400]].map(([x,y])=>['deskBeige',x,y+48+dy,105,{fh:42}])),
  ...[0,237].flatMap(dy=>[['chair',113,497+dy,50,{fh:20}],['chair',218,497+dy,50,{fh:20}]]),
  ['deskL',85,930,223,{fh:56}],['chair',198,952,48,{fh:20}],
  ['shelf',388,445,22,{fh:90,h:90}],['shelf',388,682,22,{fh:90,h:90}],['shelf',388,920,22,{fh:90,h:90}],
  ['shelf',872,445,20,{fh:70,h:70}],['shelf',725,682,26,{fh:56,h:57}],['shelf',850,682,30,{fh:56,h:57}],
  ['pillarCab',730,445,70,{fh:90}],['pillar',730,920,42,{fh:90,h:92}]
];
// 玻璃隔間牆（缺口＝門）
const WALLS = [
  [290,48,153,12],[290,48,12,222],[431,48,12,222],[290,258,95,12],
  [443,48,165,12],[596,48,12,222],[443,258,100,12],
  [660,48,402,12],[1050,48,12,222],[660,258,402,12],[660,48,12,77],[660,210,12,60],
  [82,1045,208,12],[82,1045,12,205],[278,1045,12,205],[82,1238,208,12],
  [82,1250,208,12],[82,1250,12,210],[278,1250,12,75],[278,1380,12,80],[82,1448,208,12],
  [610,1045,210,12],[872,1045,210,12],[610,1045,12,417],[1070,1045,12,417],[610,1450,472,12]
];
const LABELS = [['男廁',370,44],['女廁',526,44],['會議室 A',863,110],['影廳',215,1062],['會議室 C',186,1432],['茶水間',396,1226],['冰箱',512,1208],['會議室 D',845,1285],['電梯',201,262]];
// 藍色桌組：三排（y 為桌面上緣），設計部 x 中心 463/568/673，同仁區 833/938/1043。type：1 有 iMac、7 空桌、4 Mac mini 桌。
const SHEET_RECT = {1:[0,328,517,328],7:[0,1913,517,291],4:[0,1306,520,316]};
const ROW_TOPS = [355, 592, 828];
const GROUPS = [[463,568,673],[833,938,1043]];
// 入座：名字 → [組, 排, 欄, 上排/下排]（僅設計部最下面那排有人）
const SEATS = {Leona:[0,2,0,'top'],Amber:[0,2,1,'top'],Noise:[0,2,2,'top'],Anna:[0,2,1,'bottom'],Machi:[0,2,2,'bottom']};

const FLOOR_X0 = -3, FLOOR_X1 = 1201 * U + 3, FLOOR_Z0 = -3, FLOOR_Z1 = 1526 * U + 3;
// 地板：淺灰藍方格
{
  const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d');
  g.fillStyle = '#e4eaef'; g.fillRect(0, 0, 32, 32); g.fillStyle = '#dde4ea'; g.fillRect(0, 0, 16, 16); g.fillRect(16, 16, 16, 16);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace;
  t.repeat.set((FLOOR_X1 - FLOOR_X0) / 2, (FLOOR_Z1 - FLOOR_Z0) / 2);
  const f = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR_X1 - FLOOR_X0, FLOOR_Z1 - FLOOR_Z0), new THREE.MeshLambertMaterial({map:t}));
  f.rotation.x = -Math.PI / 2; f.position.set((FLOOR_X0 + FLOOR_X1) / 2, 0, (FLOOR_Z0 + FLOOR_Z1) / 2); scene.add(f);
}
// 玻璃牆：半透明方塊加深色邊線
const rects = [];     // 碰撞：[x0, z0, x1, z1]（世界座標）
const wallMat = new THREE.MeshBasicMaterial({color:0xcfe6ee, transparent:true, opacity:.5, depthWrite:false});
for (const [x, y, w, h] of WALLS) {
  const geo = new THREE.BoxGeometry(w * U, 1.5, h * U), m = new THREE.Mesh(geo, wallMat);
  m.position.set((x + w / 2) * U, .75, (y + h / 2) * U); scene.add(m);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color:0x26323a})); e.position.copy(m.position); scene.add(e);
  rects.push([x * U, y * U, (x + w) * U, (y + h) * U]);
}
const R_PLAYER = .35;
function blocked(x, z){
  if (x < 1 || x > 1201 * U - 1 || z < 1 || z > 1526 * U - 1) return true;
  return rects.some(([a, b, c, d]) => x > a - R_PLAYER && x < c + R_PLAYER && z > b - R_PLAYER * .6 && z < d + R_PLAYER * .6);
}

// 道具與桌組的 billboard：先把素材縮成螢幕上實際的像素大小（才會是清楚的像素風）
const billboards = [];
function trimmed(img, sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight){
  const c = document.createElement('canvas'); c.width = sw; c.height = sh; const g = c.getContext('2d', {willReadFrequently:true}); g.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  const d = g.getImageData(0, 0, sw, sh).data; let x0 = sw, x1 = -1, y0 = sh, y1 = -1;
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) if (d[(y * sw + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const t = document.createElement('canvas'); t.width = x1 - x0 + 1; t.height = y1 - y0 + 1; t.getContext('2d').drawImage(c, x0, y0, t.width, t.height, 0, 0, t.width, t.height); return t;
}
function propTexture(src, dw, dh){
  const w = Math.max(4, Math.round(dw * PPU)), h = Math.max(4, Math.round(dh * PPU));
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d', {willReadFrequently:true});
  g.imageSmoothingQuality = 'high'; g.drawImage(src, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) { p[i + 3] = p[i + 3] > 110 ? 255 : 0; for (let k = 0; k < 3; k++) p[i + k] = Math.min(255, Math.round(p[i + k] / 16) * 16); }
  g.putImageData(d, 0, 0);
  const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace; return t;
}
function addBillboard(src, cx, z, dw, dh){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(dw, dh), new THREE.MeshBasicMaterial({map:propTexture(src, dw, dh), transparent:true, alphaTest:.5, side:THREE.DoubleSide}));
  m.geometry.translate(0, dh / 2, 0); m.position.set(cx, 0, z); scene.add(m); billboards.push(m); return m;
}
const imgs = {};
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
async function buildOffice(){
  await Promise.all(Object.entries(FILES).map(async ([k, f]) => { imgs[k] = await loadImg(ASSET + f); }));
  const T = {};      // 裁邊後的素材
  for (const k of Object.keys(FILES)) if (k !== 'sheet' && imgs[k]) T[k] = trimmed(imgs[k]);
  const sheet = {};  // 藍桌：從家具圖集裁出
  for (const [t, [x, y, w, h]] of Object.entries(SHEET_RECT)) if (imgs.sheet) sheet[t] = trimmed(imgs.sheet, x, y, w, h);
  const place = (src, x, bottom, w, o = {}) => {
    if (!src) return;
    const dh = o.h ? o.h * U : w * U * src.height / src.width, dw = dh * src.width / src.height;
    addBillboard(src, (x + w / 2) * U, bottom * U, dw, dh);
  };
  for (const [key, x, bottom, w, o] of PROPS) {
    place(T[key], x, bottom, w, o);
    if (o.col) rects.push([o.col[0] * U, o.col[1] * U, (o.col[0] + o.col[2]) * U, (o.col[1] + o.col[3]) * U]);
    else rects.push([x * U, (bottom - (o.fh || 30)) * U, (x + w) * U, bottom * U]);
  }
  // 藍色桌組：每組兩排×三張，設計部最下面那排有人入座
  GROUPS.forEach((xs, gi) => ROW_TOPS.forEach((top, ri) => {
    xs.forEach((cx, ci) => {
      [['top', top + 60], ['bottom', top + 108]].forEach(([side, bottomY]) => {
        const occupied = gi === 0 && ri === 2 && Object.values(SEATS).some(s => s[3] === side && s[2] === ci);
        const miniDesk = gi === 0 && ri === 2 && side === 'bottom' && ci === 0;
        place(sheet[occupied ? 1 : miniDesk ? 4 : 7], cx - 52, bottomY, 105);
        place(T.chair, cx - 25, side === 'top' ? top + 22 : top + 150, 50);
      });
    });
    const x0 = xs[0] - 52;
    rects.push([x0 * U, (top + 30) * U, (x0 + 315) * U, (top + 108) * U]);
  }));
}
// 地圖上的文字標籤（DOM，才清楚）
const labelEls = LABELS.map(([t, ix, iy]) => { const e = document.createElement('div'); e.className = 'lbl'; e.textContent = t; document.body.appendChild(e); return {e, p:new THREE.Vector3(ix * U, 2.6, iy * U)}; });
const _lp = new THREE.Vector3();
function updateLabels(){
  for (const {e, p} of labelEls) {
    _lp.copy(p).project(camera);
    const vis = _lp.z < 1 && Math.abs(_lp.x) < 1.1 && Math.abs(_lp.y) < 1.1;
    e.style.display = vis ? 'block' : 'none';
    if (vis) e.style.transform = 'translate(-50%,-50%) translate(' + ((_lp.x * .5 + .5) * innerWidth) + 'px,' + ((-_lp.y * .5 + .5) * innerHeight) + 'px)';
  }
}

// ---------- 角色（平面像素 billboard） ----------
const chars = {};   // name -> {holder, sprite, tex, ...}
const roster = document.getElementById('roster');
let player = null, target = null;
const ANGLES = 12, ROWS = 1, CELL_W = 60, CELL_H = 60, WORLD_H = 2.04;   // 圖集：由三視圖合成的 12 個面向（每 30°）
const loadTex = src => new Promise((res, rej) => new THREE.TextureLoader().load(src, t => {
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace;
  t.repeat.set(1 / ANGLES, 1 / ROWS); res(t);
}, undefined, rej));
const shadowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 16; const g = c.getContext('2d'); g.fillStyle = '#000'; g.beginPath(); g.ellipse(8, 8, 7, 5, 0, 0, 7); g.fill(); const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; return t; })();

async function addChar(name, i){
  const tex = await loadTex(url(name));
  const sprite = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_H * CELL_W / CELL_H, WORLD_H),
    new THREE.MeshBasicMaterial({map:tex, transparent:true, alphaTest:.5, side:THREE.DoubleSide}));
  sprite.geometry.translate(0, WORLD_H / 2 - .03, 0);
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(1.1, .8), new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, opacity:.28, depthWrite:false}));
  blob.rotation.x = -Math.PI / 2; blob.position.y = .02;
  const holder = new THREE.Group(); holder.add(blob, sprite);
  const seat = SEATS[name], a = i / NAMES.length * Math.PI * 2;
  if (seat) {   // 入座：上排坐在桌後（面向鏡頭）、下排坐在桌前（背對鏡頭）
    const top = ROW_TOPS[seat[1]], cx = GROUPS[seat[0]][seat[2]];
    holder.position.set(cx * U, 0, (seat[3] === 'top' ? top + 22 : top + 138) * U);
  } else holder.position.set((560 + 42 * (i % 6)) * U, 0, (1085 + 28 * Math.floor(i / 6)) * U);
  scene.add(holder);
  const c = {name, holder, sprite, tex, face:seat ? (seat[3] === 'top' ? 0 : Math.PI) : -a, moving:0, phase:Math.random() * 9, wander:!seat, t:Math.random() * 5, dir:new THREE.Vector3()};
  chars[name] = c;
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => select(name); roster.appendChild(b); c.btn = b;
}
function select(name){
  player = chars[name]; target = null;
  for (const c of Object.values(chars)) { c.btn.classList.toggle('on', c === player); c.wander = c !== player && !SEATS[c.name]; }
}

let done = 0;
Promise.all([buildOffice(), ...NAMES.map((n, i) => addChar(n, i).then(() => { document.getElementById('load').textContent = `載入角色 ${++done}/${NAMES.length}`; }))])
  .then(() => { select('Machi'); document.getElementById('load').remove(); window.__plaza = {chars, camera}; });

const _cam = new THREE.Vector3(), _tilt = new THREE.Quaternion(), _z = new THREE.Vector3(0, 0, 1);
function updateBillboards(){ for (const m of billboards) m.quaternion.copy(camera.quaternion); }
function updateSprite(c, dt){
  // 依角色朝向與鏡頭的相對角度，挑選 12 個面向中最接近的一格
  c.holder.getWorldPosition(_cam); _cam.subVectors(camera.position, _cam);
  const toCam = Math.atan2(_cam.x, _cam.z);
  const rel = Math.atan2(Math.sin(c.face - toCam), Math.cos(c.face - toCam));   // 0 = 面向鏡頭
  const col = (Math.round(rel / (Math.PI * 2) * ANGLES) + ANGLES) % ANGLES;
  c.tex.offset.set(col / ANGLES, 0);
  c.phase += dt * (c.moving > 3.5 ? 16 : 10) * (c.moving > 0 ? 1 : 0);   // 沒有走路影格，以彈跳加搖擺表現
  const sw = Math.sin(c.phase);
  c.sprite.position.y = c.moving > 0 ? Math.abs(sw) * (c.moving > 3.5 ? .2 : .1) : 0;
  c.sprite.quaternion.copy(camera.quaternion).multiply(_tilt.setFromAxisAngle(_z, c.moving > 0 ? sw * .07 : 0));   // 面向鏡頭，走路時輕微搖擺
}

// ---------- 輸入 ----------
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);
const joy = {x:0, y:0};
const stick = document.getElementById('stick'), knob = stick.firstElementChild;
function joyMove(e){
  const r = stick.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
  let dx = (t.clientX - r.left - r.width / 2) / 45, dy = (t.clientY - r.top - r.height / 2) / 45;
  const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  joy.x = dx; joy.y = dy; knob.style.transform = `translate(${dx * 30}px,${dy * 30}px)`;
}
stick.addEventListener('pointerdown', e => { stick.setPointerCapture(e.pointerId); joyMove(e); });
stick.addEventListener('pointermove', e => { if (e.buttons) joyMove(e); });
stick.addEventListener('pointerup', () => { joy.x = joy.y = 0; knob.style.transform = ''; });

const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
renderer.domElement.addEventListener('pointerdown', e => {
  ray.setFromCamera({x:e.clientX / innerWidth * 2 - 1, y:-(e.clientY / innerHeight * 2 - 1)}, camera);
  const p = new THREE.Vector3();
  if (ray.ray.intersectPlane(plane, p) && !blocked(p.x, p.z)) target = p;
});

// ---------- 主迴圈 ----------
const clock = new THREE.Clock(), camPos = new THREE.Vector3(20, 8.4, 33), look = new THREE.Vector3();
const up = new THREE.Vector3(0, 1, 0);
function moveChar(c, dir, speed, dt){
  if (dir.lengthSq() < 1e-4) { c.moving = 0; return; }
  dir.normalize();
  const p = c.holder.position, sx = dir.x * speed * dt, sz = dir.z * speed * dt;
  if (!blocked(p.x + sx, p.z)) p.x += sx;
  if (!blocked(p.x, p.z + sz)) p.z += sz;
  const want = Math.atan2(dir.x, dir.z);
  c.face = want; c.moving = speed;
}
function tick(){
  const dt = Math.min(clock.getDelta(), .05);
  if (player) {
    const dir = new THREE.Vector3(
      (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x,
      0,
      (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + joy.y);
    const run = keys.ShiftLeft || keys.ShiftRight || Math.hypot(joy.x, joy.y) > .85;
    if (dir.lengthSq() > .01) target = null;
    else if (target) { dir.copy(target).sub(player.holder.position); dir.y = 0; if (dir.length() < .2) target = null; }
    moveChar(player, dir, run ? 5 : 2.4, dt);
  }
  for (const c of Object.values(chars)) {
    if (c.wander) {                                   // 其他角色隨機閒晃
      c.t -= dt;
      if (c.t < 0) { c.t = 1.5 + Math.random() * 4; const a = Math.random() * 6.283; c.dir.set(Math.random() < .4 ? 0 : Math.cos(a), 0, Math.sin(a)); }
      moveChar(c, c.dir.clone(), 1.6, dt);
    }
    updateSprite(c, dt);
  }
  if (player) {
    const p = player.holder.position;
    camPos.lerp(new THREE.Vector3(p.x, 8.4, p.z + 9.4), 1 - Math.pow(.001, dt));
    camera.position.copy(camPos); look.lerp(p, 1 - Math.pow(.001, dt)); camera.lookAt(look.x, 1, look.z);
  } else { camera.position.copy(camPos); camera.lookAt(0, 1, 0); }
  updateBillboards(); updateLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script></body></html>
