<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}button,.pk,a,[role=button]{touch-action:manipulation}</style>
<script>/* 手機防誤放大：禁止雙擊放大與雙指縮放（iOS 會忽略 viewport 設定，要自己擋） */
(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,p,{passive:false})});
document.addEventListener('touchmove',function(e){if(e.touches.length>1&&e.cancelable)e.preventDefault()},{passive:false});})();</script>

<meta name="color-scheme" content="light dark">
<title>辦公室對決</title>
<script>try{var t=localStorage.getItem('designRequestThemeV1');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--ink:#0d2a1c;--dim:#4a7660;--bg:#eaf5ee;--line:#86bfa0;--blue:#1c9a52;--gold:#f0b429;--red:#d9534f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 16px 28px}
.wrap{width:min(100%,max(860px,min(1560px,calc((100vh - 170px) * 5 / 3))));display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;flex:1;min-width:140px}
header h1 small{display:block;font-size:12px;font-weight:600;color:var(--dim)}
.pk{font:inherit;font-weight:800;font-size:13px;color:var(--ink);background:linear-gradient(#fff,#eafff2);border:3px solid var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.pk:active{filter:brightness(.92)}.pk.off{opacity:.55}.pk[hidden]{display:none}
.pk.big{font-size:17px;padding:10px 26px;background:linear-gradient(#ffe08a,#f0b429)}
.chip{font-weight:800;font-size:12px;border:2px solid var(--ink);border-radius:99px;padding:3px 10px;background:#fff}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;font-weight:800;font-variant-numeric:tabular-nums}.hud .r{text-align:right}
.bar{height:12px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4caf6a,#f0b429)}.bar.hot i{background:linear-gradient(90deg,#d9534f,#ff8a4a)}
#stage{position:relative;border:4px solid var(--ink);border-radius:12px;overflow:hidden;background:#cfeadb;touch-action:none;user-select:none}
#c3{display:block;width:100%;aspect-ratio:5/3;cursor:crosshair}
#stage.shake{animation:sh .25s}@keyframes sh{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-2px,1px)}}
.pop{position:absolute;pointer-events:none;font-weight:900;font-size:clamp(16px,3.4vw,26px);text-shadow:0 2px 0 #fff,0 0 6px #fff;transform:translate(-50%,-50%);animation:up 1.1s ease-out forwards;white-space:nowrap}
@keyframes up{to{transform:translate(-50%,-140%);opacity:0}}
.power{position:absolute;left:12px;bottom:12px;width:120px;height:10px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;display:none}.power i{display:block;height:100%;width:0;background:#4caf6a}
.wind{position:absolute;right:12px;top:10px;font-weight:800;font-size:13px;background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:99px;padding:2px 10px;display:none}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-weight:800;font-size:13px;color:var(--ink);text-shadow:0 1px 0 #fff;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;background:rgba(234,245,238,.95);overflow:auto}.ov[hidden]{display:none}
.ov h2{margin:0;font-size:clamp(22px,5vw,32px)}.ov p{margin:0;color:var(--dim);max-width:44ch;font-size:14px;line-height:1.5}
.ov .big3{font-size:clamp(64px,18vw,120px);font-weight:900;line-height:1;color:var(--blue)}
.tips{font-size:12.5px;color:var(--dim);text-align:left;max-width:46ch;margin:0;padding-left:18px;line-height:1.6}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px 14px;width:min(100%,520px);font-size:13px;text-align:left}.kv div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}.kv span{color:var(--dim)}
.score{font-size:clamp(34px,9vw,56px);font-weight:900;color:var(--blue);line-height:1}
.title-up{font-weight:900;color:#8a5300;font-size:15px}
.ach{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.ach b{font-size:12px;border:2px solid var(--gold);background:#fff8e0;border-radius:99px;padding:2px 10px}
.lb{width:min(100%,520px);text-align:left;font-size:13px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:8px 10px}
.lb h3{margin:0 0 6px;font-size:14px;display:flex;gap:6px;align-items:center}.lb h3 span{flex:1}
.lb .tab{font-size:12px;border:2px solid var(--ink);border-radius:99px;padding:1px 10px;background:#fff;cursor:pointer;font-weight:800}.lb .tab.on{background:var(--ink);color:#fff}
.lb .r{display:flex;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line)}.lb .r i{width:26px;font-style:normal;color:var(--dim)}.lb .r span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb .r b{font-variant-numeric:tabular-nums}.lb .me{color:#8a5300;font-weight:800}
.note{font-size:12px;color:var(--dim);text-align:center}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){color-scheme:dark;--ink:#eafff2;--dim:#9cc5ae;--bg:#0b1d15;--line:#2f6b4f}
:root:not([data-theme="light"]) .pk{background:linear-gradient(#1d4a36,#163a2a);border-color:#4f9a74}
:root:not([data-theme="light"]) .pk.big{background:linear-gradient(#ffd96b,#d9a21e);color:#0d2a1c;border-color:#f6e3a8}
:root:not([data-theme="light"]) .chip,:root:not([data-theme="light"]) .lb .tab{background:#163a2a;border-color:#4f9a74}
:root:not([data-theme="light"]) .lb .tab.on{background:#eafff2;color:#0b1d15}
:root:not([data-theme="light"]) .bar{background:#163a2a;border-color:#4f9a74}
:root:not([data-theme="light"]) #stage{border-color:#4f9a74;background:#0b1d15}
:root:not([data-theme="light"]) .ov{background:rgba(11,29,21,.94)}
:root:not([data-theme="light"]) .lb{background:#102a1e;border-color:#4f9a74}
:root:not([data-theme="light"]) .ach b{background:#3a3414}
:root:not([data-theme="light"]) .title-up,:root:not([data-theme="light"]) .lb .me{color:#ffd166}
:root:not([data-theme="light"]) .score,:root:not([data-theme="light"]) .ov .big3{color:#5fe08a}
:root:not([data-theme="light"]) .hint{color:#eafff2;text-shadow:0 1px 0 #000}
:root:not([data-theme="light"]) .wind{background:rgba(11,29,21,.88)}
:root:not([data-theme="light"]) .power{background:#163a2a;border-color:#4f9a74}
:root:not([data-theme="light"]) .pop{text-shadow:0 2px 0 #000,0 0 6px #000}
}
:root[data-theme="dark"]{color-scheme:dark;--ink:#eafff2;--dim:#9cc5ae;--bg:#0b1d15;--line:#2f6b4f}
:root[data-theme="dark"] .pk{background:linear-gradient(#1d4a36,#163a2a);border-color:#4f9a74}
:root[data-theme="dark"] .pk.big{background:linear-gradient(#ffd96b,#d9a21e);color:#0d2a1c;border-color:#f6e3a8}
:root[data-theme="dark"] .chip,:root[data-theme="dark"] .lb .tab{background:#163a2a;border-color:#4f9a74}
:root[data-theme="dark"] .lb .tab.on{background:#eafff2;color:#0b1d15}
:root[data-theme="dark"] .bar{background:#163a2a;border-color:#4f9a74}
:root[data-theme="dark"] #stage{border-color:#4f9a74;background:#0b1d15}
:root[data-theme="dark"] .ov{background:rgba(11,29,21,.94)}
:root[data-theme="dark"] .lb{background:#102a1e;border-color:#4f9a74}
:root[data-theme="dark"] .ach b{background:#3a3414}
:root[data-theme="dark"] .title-up,:root[data-theme="dark"] .lb .me{color:#ffd166}
:root[data-theme="dark"] .score,:root[data-theme="dark"] .ov .big3{color:#5fe08a}
:root[data-theme="dark"] .hint{color:#eafff2;text-shadow:0 1px 0 #000}
:root[data-theme="dark"] .wind{background:rgba(11,29,21,.88)}
:root[data-theme="dark"] .power{background:#163a2a;border-color:#4f9a74}
:root[data-theme="dark"] .pop{text-shadow:0 2px 0 #000,0 0 6px #000}


/* ---- 辦公室對決 ---- */
.wrap{width:min(100%,max(860px,min(1400px,calc((100vh - 120px) * 16 / 9))))}
#stage{touch-action:none;user-select:none;background:var(--bg)}
#c3{display:block;width:100%;aspect-ratio:16/9;cursor:crosshair}
.dhud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;padding:10px 14px;pointer-events:none;align-items:start}
.dhud[hidden],.cds[hidden],.banner[hidden]{display:none}
.dhud .side{display:flex;flex-direction:column;gap:4px}.dhud .side.r{align-items:flex-end}
.dhud .nm{font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000}
.dhud .hp,.dhud .ul{width:100%;border:3px solid #000;border-radius:99px;background:rgba(0,0,0,.5);overflow:hidden}
.dhud .hp{height:16px}.dhud .ul{height:8px;width:70%}
.dhud .hp i{display:block;height:100%;width:100%;background:linear-gradient(#7ff0a6,#2fa862);transition:width .12s}
.dhud .side.r .hp i{margin-left:auto;background:linear-gradient(#ff9a8f,#d9534f)}
.dhud .ul i{display:block;height:100%;width:0;background:#ffd166}.dhud .ul.full{box-shadow:0 0 10px #ffd166}.dhud .ul.full i{background:#fff3b0}
.dhud .mid{text-align:center;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;min-width:96px}.dhud .tm{font-weight:900;font-size:30px;line-height:1}
.dhud .rd{display:flex;justify-content:center;align-items:center;gap:5px;font-weight:800;font-size:12px}
.pip{display:inline-block;width:12px;height:12px;border:2px solid #000;border-radius:50%;background:rgba(0,0,0,.45)}.pip.w{background:#ffd166}
.cds{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:8px;justify-content:center;pointer-events:none;flex-wrap:wrap;padding:0 10px}
.cds span{font-size:12px;font-weight:800;color:#fff;background:rgba(0,0,0,.55);border:2px solid #000;border-radius:99px;padding:2px 10px}
.cds span.cd{opacity:.4}.cds span.on{background:#ffd166;color:#0d2a1c;animation:ulp .6s infinite alternate}@keyframes ulp{to{transform:scale(1.08)}}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:clamp(34px,7vw,78px);color:#fff;text-shadow:0 4px 0 #000,0 0 18px #000;pointer-events:none}
.pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.pick label{font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.pick select{font:inherit;font-weight:800;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:8px;padding:3px 6px}
.prev{display:flex;gap:14px;align-items:center;justify-content:center}.prev canvas{width:84px;height:84px;border:3px solid var(--ink);border-radius:12px;background:rgba(255,255,255,.4)}.prev b{font-size:22px}
.pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop2{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(18px,3vw,28px);color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;animation:up2 .9s ease-out forwards;white-space:nowrap}
.pop2.big{font-size:clamp(26px,4.4vw,42px);color:#ffd166}.pop2.hi{color:#7ff0a6}.pop2.red{color:#ff9a8f}
@keyframes up2{to{transform:translate(-50%,-190%);opacity:0}}
@media (max-width:700px){.dhud .nm{font-size:12px}.dhud .tm{font-size:22px}.cds{display:none}}
</style>

<body>
<div class="wrap">
  <header>
    <h1>辦公室對決<small id="sub">高低落差 1 對 1・單機版</small></h1>
    <button class="pk off" id="sndB" type="button">音效：開</button>
    <button class="pk off" id="fsB" type="button">全螢幕</button>
    <button class="pk" id="exitB" type="button" hidden>離開</button>
  </header>
  <div id="stage">
    <canvas id="c3"></canvas>
    <div class="dhud" id="dhud" hidden>
      <div class="side l"><div class="nm" id="nmL"></div><div class="hp"><i id="hpL"></i></div><div class="ul"><i id="ulL"></i></div></div>
      <div class="mid"><div class="rd" id="rdDots"></div><div class="tm" id="tmV">90</div></div>
      <div class="side r"><div class="nm" id="nmR"></div><div class="hp"><i id="hpR"></i></div><div class="ul"><i id="ulR"></i></div></div>
    </div>
    <div class="cds" id="cds" hidden>
      <span id="cdJ">跳 空白</span><span id="cdA">攻擊 左鍵</span><span id="cdD">衝刺 Shift</span><span id="cdU">大招 R</span><span id="cdL">鎖定 右鍵</span>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="ov" id="startO">
      <h2>辦公室對決</h2>
      <p>桌子、斜坡和資料櫃都是戰場。站得比對手高，打人更痛。先贏 2 局的人獲勝。</p>
      <div class="pick">
        <label>我是<select id="selMe"></select></label>
        <label>對手<select id="selOp"></select></label>
        <label>強度<select id="selLv"><option value="0">簡單</option><option value="1" selected>普通</option><option value="2">困難</option></select></label>
      </div>
      <div class="prev"><canvas id="pvMe" width="120" height="120"></canvas><b>VS</b><canvas id="pvOp" width="120" height="120"></canvas></div>
      <ul class="tips"><li>WASD 移動，滑鼠轉視角（點一下畫面鎖定滑鼠，Esc 解除；方向鍵也能轉）。空白鍵跳，Shift 衝刺閃避。</li><li>左鍵或 J 往前揮擊，連打 3 下第三下最重。R 大招（打人、被打都會充能）。右鍵或 Tab 鎖定對手。</li><li>站在高處打低處多 25% 傷害；掉下去不會受傷，但要重新爬上來。</li></ul>
      <button class="pk big" id="startB" type="button">開始對決</button>
      <div class="note" id="startNote"></div>
    </div>
    <div class="ov" id="pauseO" hidden><h2>暫停</h2><p>點一下畫面繼續</p></div>
    <div class="ov" id="endO" hidden></div>
  </div>
  <div class="note">單機版：對手是電腦。連線 1 對 1 之後再做。</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const SITE_THEME_KEY = 'designRequestThemeV1';
const siteTheme = () => { try { const t = localStorage.getItem(SITE_THEME_KEY); return t === 'dark' || t === 'light' ? t : ''; } catch (e) { return ''; } };
const isDarkNow = () => { const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
function syncTheme(t) { t = t || siteTheme(); if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); applyTheme(); }
addEventListener('storage', e => { if (e.key === SITE_THEME_KEY) syncTheme(); });
addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.type === 'pixelOfficeTheme' && (e.data.theme === 'dark' || e.data.theme === 'light')) syncTheme(e.data.theme); });
const embed = /[?&]embed=1/.test(location.search);
if (embed) { $('exitB').hidden = false; $('exitB').onclick = () => { try { parent.postMessage({ type: 'expeditionExit' }, location.origin); } catch (e) {} }; }
const Q = new URLSearchParams(location.search);
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

// ───────── 音效 ─────────
const SFX = (() => {
  let ac = null, master = null, muted = store.get('duel:mute') === '1';
  const ok = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = muted ? 0 : .45; master.connect(ac.destination); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return !!ac; };
  const tone = (f0, f1, d, type, v) => { if (!ok()) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + d); g.gain.setValueAtTime(v || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .02); };
  const noise = (d, v, hp) => { if (!ok()) return; const t = ac.currentTime, n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), a = b.getChannelData(0); for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = ac.createBufferSource(); s.buffer = b; const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 800; const g = ac.createGain(); g.gain.value = v || .25; s.connect(f); f.connect(g); g.connect(master); s.start(t); };
  return { unlock: ok, get muted() { return muted; }, setMuted(m) { muted = m; store.set('duel:mute', m ? '1' : '0'); if (master) master.gain.value = m ? 0 : .45; },
    swing: () => noise(.12, .2, 1500), hit: heavy => { noise(.14, .35, 300); tone(heavy ? 120 : 180, 50, .16, 'square', .22); }, jump: () => tone(300, 620, .12, 'triangle', .16),
    dash: () => noise(.18, .22, 2500), ult: () => { tone(90, 30, .5, 'sawtooth', .3); noise(.4, .35, 200); }, land: () => tone(110, 60, .08, 'square', .1),
    beep: () => tone(660, 660, .1, 'square', .15), go: () => tone(990, 990, .25, 'square', .2), win: () => { tone(523, 523, .15, 'square', .18); setTimeout(() => tone(784, 784, .3, 'square', .18), 150); }, lose: () => tone(300, 90, .6, 'sawtooth', .2) };
})();
{ const mb = $('sndB'), sync = () => { mb.textContent = SFX.muted ? '音效：關' : '音效：開'; mb.classList.toggle('off', !SFX.muted); }; sync(); mb.onclick = () => { SFX.unlock(); SFX.setMuted(!SFX.muted); sync(); }; }
$('fsB').onclick = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else $('stage').requestFullscreen(); } catch (e) {} };

// ───────── 角色圖集（沿用元宇宙的 12 面向圖集）─────────
const CHAR_API = 'https://emc-ai-stage-classifier.machi-chen.workers.dev/api/public/characters';
const LOCAL_NAMES = ['Machi', 'Anna', 'Leona', 'Amber', 'Noise', '余采馨', '吳冠賢', '廖秦葦', '李明庭', '王藍庭', '鄭筱舢', '黎子瑄'];
const CHAR_SCALE = { Leona: 1.1, 廖秦葦: 1.18 };
let cloud = {}, NAMES = LOCAL_NAMES.slice();
const cloudReady = (async () => {
  try { const r = await fetch(CHAR_API, { signal: AbortSignal.timeout(5000) }); if (r.ok) { const j = await r.json(); cloud = j.characters || {}; } } catch (e) {}
  for (const n of Object.keys(cloud)) if (n !== '設計測試組' && !NAMES.includes(n)) NAMES.push(n);
})();
const atlasUrl = (n, local) => (!local && cloud[n]) ? CHAR_API + '/' + encodeURIComponent(n) + '/atlas-hd.png?v=' + cloud[n] : '../pixel-plaza/sprites-hd/' + n + '.webp';
const ANGLES = 12;
function loadAtlas(n) {   // 先雲端、失敗退回本機；回傳 THREE.Texture
  return new Promise(res => {
    const go = local => { const ld = new THREE.TextureLoader(); ld.setCrossOrigin('anonymous'); ld.load(atlasUrl(n, local), t => { t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; t.repeat.set(1 / ANGLES, 1); res(t); }, undefined, () => { if (!local) go(true); else res(null); }); };
    go(false);
  });
}
function drawPreview(cv, n) {   // 開始畫面的頭像：用圖集第 0 格（正面）
  const g = cv.getContext('2d'); g.clearRect(0, 0, cv.width, cv.height); if (!n) return;
  const draw = src => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => { g.clearRect(0, 0, cv.width, cv.height); const cw = im.naturalWidth / ANGLES; g.imageSmoothingEnabled = true; g.drawImage(im, 0, 0, cw, im.naturalHeight, 0, 0, cv.width, cv.height); }; im.onerror = () => { if (src.indexOf('pixel-plaza') < 0) draw(atlasUrl(n, true)); }; im.src = src; };
  draw(atlasUrl(n, false));
}
