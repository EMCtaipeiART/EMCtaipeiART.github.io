<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}button,.pk,a,[role=button]{touch-action:manipulation}</style>
<script>/* 手機防誤放大：禁止雙擊放大與雙指縮放（iOS 會忽略 viewport 設定，要自己擋） */
(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,p,{passive:false})});
document.addEventListener('touchmove',function(e){if(e.touches.length>1&&e.cancelable)e.preventDefault()},{passive:false});})();</script>

<meta name="color-scheme" content="light dark">
<title>辦公室對決</title>
<script>try{var t=localStorage.getItem('designRequestThemeV1');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--ink:#0d2a1c;--dim:#4a7660;--bg:#eaf5ee;--line:#86bfa0;--blue:#1c9a52;--gold:#f0b429;--red:#d9534f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 16px 28px}
.wrap{width:min(100%,max(860px,min(1560px,calc((100vh - 170px) * 5 / 3))));display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;flex:1;min-width:140px}
header h1 small{display:block;font-size:12px;font-weight:600;color:var(--dim)}
.pk{font:inherit;font-weight:800;font-size:13px;color:var(--ink);background:linear-gradient(#fff,#eafff2);border:3px solid var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.pk:active{filter:brightness(.92)}.pk.off{opacity:.55}.pk[hidden]{display:none}
.pk.big{font-size:17px;padding:10px 26px;background:linear-gradient(#ffe08a,#f0b429)}
.chip{font-weight:800;font-size:12px;border:2px solid var(--ink);border-radius:99px;padding:3px 10px;background:#fff}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;font-weight:800;font-variant-numeric:tabular-nums}.hud .r{text-align:right}
.bar{height:12px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4caf6a,#f0b429)}.bar.hot i{background:linear-gradient(90deg,#d9534f,#ff8a4a)}
#stage{position:relative;border:4px solid var(--ink);border-radius:12px;overflow:hidden;background:#cfeadb;touch-action:none;user-select:none}
#c3{display:block;width:100%;aspect-ratio:5/3;cursor:crosshair}
#stage.shake{animation:sh .25s}@keyframes sh{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-2px,1px)}}
.pop{position:absolute;pointer-events:none;font-weight:900;font-size:clamp(16px,3.4vw,26px);text-shadow:0 2px 0 #fff,0 0 6px #fff;transform:translate(-50%,-50%);animation:up 1.1s ease-out forwards;white-space:nowrap}
@keyframes up{to{transform:translate(-50%,-140%);opacity:0}}
.power{position:absolute;left:12px;bottom:12px;width:120px;height:10px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;display:none}.power i{display:block;height:100%;width:0;background:#4caf6a}
.wind{position:absolute;right:12px;top:10px;font-weight:800;font-size:13px;background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:99px;padding:2px 10px;display:none}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-weight:800;font-size:13px;color:var(--ink);text-shadow:0 1px 0 #fff;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;background:rgba(234,245,238,.95);overflow:auto}.ov[hidden]{display:none}
.ov h2{margin:0;font-size:clamp(22px,5vw,32px)}.ov p{margin:0;color:var(--dim);max-width:44ch;font-size:14px;line-height:1.5}
.ov .big3{font-size:clamp(64px,18vw,120px);font-weight:900;line-height:1;color:var(--blue)}
.tips{font-size:12.5px;color:var(--dim);text-align:left;max-width:46ch;margin:0;padding-left:18px;line-height:1.6}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px 14px;width:min(100%,520px);font-size:13px;text-align:left}.kv div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}.kv span{color:var(--dim)}
.score{font-size:clamp(34px,9vw,56px);font-weight:900;color:var(--blue);line-height:1}
.title-up{font-weight:900;color:#8a5300;font-size:15px}
.ach{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.ach b{font-size:12px;border:2px solid var(--gold);background:#fff8e0;border-radius:99px;padding:2px 10px}
.lb{width:min(100%,520px);text-align:left;font-size:13px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:8px 10px}
.lb h3{margin:0 0 6px;font-size:14px;display:flex;gap:6px;align-items:center}.lb h3 span{flex:1}
.lb .tab{font-size:12px;border:2px solid var(--ink);border-radius:99px;padding:1px 10px;background:#fff;cursor:pointer;font-weight:800}.lb .tab.on{background:var(--ink);color:#fff}
.lb .r{display:flex;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line)}.lb .r i{width:26px;font-style:normal;color:var(--dim)}.lb .r span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb .r b{font-variant-numeric:tabular-nums}.lb .me{color:#8a5300;font-weight:800}
.note{font-size:12px;color:var(--dim);text-align:center}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){color-scheme:dark;--ink:#eafff2;--dim:#9cc5ae;--bg:#0b1d15;--line:#2f6b4f}
:root:not([data-theme="light"]) .pk{background:linear-gradient(#1d4a36,#163a2a);border-color:#4f9a74}
:root:not([data-theme="light"]) .pk.big{background:linear-gradient(#ffd96b,#d9a21e);color:#0d2a1c;border-color:#f6e3a8}
:root:not([data-theme="light"]) .chip,:root:not([data-theme="light"]) .lb .tab{background:#163a2a;border-color:#4f9a74}
:root:not([data-theme="light"]) .lb .tab.on{background:#eafff2;color:#0b1d15}
:root:not([data-theme="light"]) .bar{background:#163a2a;border-color:#4f9a74}
:root:not([data-theme="light"]) #stage{border-color:#4f9a74;background:#0b1d15}
:root:not([data-theme="light"]) .ov{background:rgba(11,29,21,.94)}
:root:not([data-theme="light"]) .lb{background:#102a1e;border-color:#4f9a74}
:root:not([data-theme="light"]) .ach b{background:#3a3414}
:root:not([data-theme="light"]) .title-up,:root:not([data-theme="light"]) .lb .me{color:#ffd166}
:root:not([data-theme="light"]) .score,:root:not([data-theme="light"]) .ov .big3{color:#5fe08a}
:root:not([data-theme="light"]) .hint{color:#eafff2;text-shadow:0 1px 0 #000}
:root:not([data-theme="light"]) .wind{background:rgba(11,29,21,.88)}
:root:not([data-theme="light"]) .power{background:#163a2a;border-color:#4f9a74}
:root:not([data-theme="light"]) .pop{text-shadow:0 2px 0 #000,0 0 6px #000}
}
:root[data-theme="dark"]{color-scheme:dark;--ink:#eafff2;--dim:#9cc5ae;--bg:#0b1d15;--line:#2f6b4f}
:root[data-theme="dark"] .pk{background:linear-gradient(#1d4a36,#163a2a);border-color:#4f9a74}
:root[data-theme="dark"] .pk.big{background:linear-gradient(#ffd96b,#d9a21e);color:#0d2a1c;border-color:#f6e3a8}
:root[data-theme="dark"] .chip,:root[data-theme="dark"] .lb .tab{background:#163a2a;border-color:#4f9a74}
:root[data-theme="dark"] .lb .tab.on{background:#eafff2;color:#0b1d15}
:root[data-theme="dark"] .bar{background:#163a2a;border-color:#4f9a74}
:root[data-theme="dark"] #stage{border-color:#4f9a74;background:#0b1d15}
:root[data-theme="dark"] .ov{background:rgba(11,29,21,.94)}
:root[data-theme="dark"] .lb{background:#102a1e;border-color:#4f9a74}
:root[data-theme="dark"] .ach b{background:#3a3414}
:root[data-theme="dark"] .title-up,:root[data-theme="dark"] .lb .me{color:#ffd166}
:root[data-theme="dark"] .score,:root[data-theme="dark"] .ov .big3{color:#5fe08a}
:root[data-theme="dark"] .hint{color:#eafff2;text-shadow:0 1px 0 #000}
:root[data-theme="dark"] .wind{background:rgba(11,29,21,.88)}
:root[data-theme="dark"] .power{background:#163a2a;border-color:#4f9a74}
:root[data-theme="dark"] .pop{text-shadow:0 2px 0 #000,0 0 6px #000}


/* ---- 辦公室對決 ---- */
.wrap{width:min(100%,max(860px,min(1400px,calc((100vh - 120px) * 16 / 9))))}
#stage{touch-action:none;user-select:none;background:var(--bg)}
#c3{display:block;width:100%;aspect-ratio:16/9;cursor:crosshair}
.dhud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;padding:10px 14px;pointer-events:none;align-items:start}
.dhud[hidden],.cds[hidden],.banner[hidden]{display:none}
.dhud .side{display:flex;flex-direction:column;gap:4px}.dhud .side.r{align-items:flex-end}
.dhud .nm{font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000}
.dhud .hp,.dhud .ul{width:100%;border:3px solid #000;border-radius:99px;background:rgba(0,0,0,.5);overflow:hidden}
.dhud .hp{height:16px}.dhud .ul{height:8px;width:70%}
.dhud .hp i{display:block;height:100%;width:100%;background:linear-gradient(#7ff0a6,#2fa862);transition:width .12s}
.dhud .side.r .hp i{margin-left:auto;background:linear-gradient(#ff9a8f,#d9534f)}
.dhud .ul i{display:block;height:100%;width:0;background:#ffd166}.dhud .ul.full{box-shadow:0 0 10px #ffd166}.dhud .ul.full i{background:#fff3b0}
.dhud .mid{text-align:center;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;min-width:96px}.dhud .tm{font-weight:900;font-size:30px;line-height:1}
.dhud .rd{display:flex;justify-content:center;align-items:center;gap:5px;font-weight:800;font-size:12px}
.pip{display:inline-block;width:12px;height:12px;border:2px solid #000;border-radius:50%;background:rgba(0,0,0,.45)}.pip.w{background:#ffd166}
.cds{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:8px;justify-content:center;pointer-events:none;flex-wrap:wrap;padding:0 10px}
.cds span{font-size:12px;font-weight:800;color:#fff;background:rgba(0,0,0,.55);border:2px solid #000;border-radius:99px;padding:2px 10px}
.cds span.cd{opacity:.4}.cds span.on{background:#ffd166;color:#0d2a1c;animation:ulp .6s infinite alternate}@keyframes ulp{to{transform:scale(1.08)}}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:clamp(34px,7vw,78px);color:#fff;text-shadow:0 4px 0 #000,0 0 18px #000;pointer-events:none}
.pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.pick label{font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.pick select{font:inherit;font-weight:800;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:8px;padding:3px 6px}
.prev{display:flex;gap:14px;align-items:center;justify-content:center}.prev canvas{width:84px;height:84px;border:3px solid var(--ink);border-radius:12px;background:rgba(255,255,255,.4)}.prev b{font-size:22px}
.pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop2{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(18px,3vw,28px);color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;animation:up2 .9s ease-out forwards;white-space:nowrap}
.pop2.big{font-size:clamp(26px,4.4vw,42px);color:#ffd166}.pop2.hi{color:#7ff0a6}.pop2.red{color:#ff9a8f}
@keyframes up2{to{transform:translate(-50%,-190%);opacity:0}}
.ov{justify-content:flex-start}.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
/* 全螢幕：畫面佔滿整個視窗，按鈕縮到右下角 */
html,body{height:100%;overflow:hidden}body{padding:0;display:block}
.wrap{width:100vw;max-width:none;height:100vh;gap:0}
#stage{position:fixed;inset:0;border:0;border-radius:0}
#c3{width:100vw;height:100vh;aspect-ratio:auto}
header{position:fixed;right:8px;bottom:8px;z-index:6;width:auto;gap:6px;flex-wrap:nowrap}header h1{display:none}header .pk{font-size:12px;padding:3px 9px;border-width:2px;opacity:.85}
.wrap>.note{display:none}
.cds{bottom:10px;padding-right:200px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.netbox{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px}.netrow{display:flex;gap:8px;align-items:center;justify-content:center}
.netbox input{font:inherit;font-weight:900;letter-spacing:.25em;text-transform:uppercase;text-align:center;width:9.5em;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:8px;padding:5px 6px}
.netst{min-height:1.4em;font-weight:800;font-size:14px;text-align:center}.netst .code{font-size:30px;letter-spacing:.2em;color:#1c9a52;user-select:all}
.netbox[hidden],.netbox button[hidden]{display:none}
.dhud .lo{font-size:12px;font-weight:800;color:#fff;opacity:.92;text-shadow:0 2px 0 #000,0 0 5px #000}
.lodesc{font-size:13px;line-height:1.5;text-align:left;max-width:560px;margin:2px auto;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;background:rgba(255,255,255,.22)}.lodesc b{color:#1c9a52}
.pick.gear{margin-top:4px}
/* ---- 遊戲感開始畫面 ---- */
.menu [hidden],.hid{display:none!important}
.ov.menu{justify-content:flex-start;align-items:center;overflow:auto;padding:0;color:#eafff2;text-align:center;background:radial-gradient(ellipse at 50% 28%,rgba(20,70,48,.5),rgba(3,12,9,.93) 78%)}
.mwrap{width:min(1120px,100%);margin:auto!important;padding:20px 16px 26px;display:flex;flex-direction:column;align-items:center;gap:16px}
.logo{line-height:1}.logo small{display:block;letter-spacing:.55em;font-size:12px;font-weight:800;color:#5fe08a;margin-bottom:4px}
.logo h2{margin:0;font-size:clamp(42px,7.5vw,84px);font-weight:900;letter-spacing:.06em;color:#fff;-webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:0 6px 0 #000,0 0 30px rgba(95,224,138,.6);transform:skewX(-6deg)}
.logosub{margin-top:10px;font-weight:800;color:#ffd166;text-shadow:0 2px 0 #000;letter-spacing:.12em}
.vsrow{display:flex;align-items:stretch;justify-content:center;gap:14px;width:100%}
.card{flex:1 1 0;max-width:440px;position:relative;border:3px solid #000;border-radius:18px;background:linear-gradient(180deg,#22664a,#143a2b);box-shadow:0 6px 0 #000,inset 0 0 0 2px rgba(255,255,255,.13);padding:20px 12px 12px;display:flex;flex-direction:column;gap:10px}
.card.op{background:linear-gradient(180deg,#6a2e2e,#3c1c1c)}
.ctag{position:absolute;top:-14px;left:16px;background:#ffd166;color:#241a00;font-weight:900;font-size:12px;padding:2px 14px;border:3px solid #000;border-radius:8px;letter-spacing:.14em;transform:skewX(-8deg)}.card.op .ctag{left:auto;right:16px;background:#ff9a8a}
.por{position:relative;align-self:center;width:150px;height:150px;border:3px solid #000;border-radius:16px;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.3),rgba(0,0,0,.3));overflow:hidden;box-shadow:0 4px 0 #000}.por canvas{width:100%;height:100%;display:block}
.qm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:900;color:#ff9a8a;-webkit-text-stroke:3px #000;paint-order:stroke fill;animation:qmb 1s infinite alternate}@keyframes qmb{to{transform:scale(1.12)}}
.pk2{display:flex;align-items:center;justify-content:center;gap:10px}.pk2 b{min-width:7.5em;font-size:22px;font-weight:900;text-shadow:0 2px 0 #000}
.arr{width:34px;height:34px;border:3px solid #000;border-radius:10px;background:linear-gradient(#ffe08a,#e0a82a);font:900 13px/1 inherit;color:#241a00;cursor:pointer;box-shadow:0 3px 0 #000;padding:0}.arr:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.vsmid{display:flex;align-items:center}.vsmid span{font-size:clamp(36px,5.4vw,60px);font-weight:900;font-style:italic;color:#ffd166;-webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:0 5px 0 #000}
.slots{display:flex;flex-direction:column;gap:8px;text-align:left}
.slot{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:8px;border:3px solid #000;border-radius:12px;background:rgba(0,0,0,.34);padding:7px 8px}
.slot .ic{font-size:32px;text-align:center;filter:drop-shadow(0 2px 0 #000)}
.slot .kind{display:block;font-size:10px;font-weight:900;color:#5fe08a;letter-spacing:.16em}
.slot .tx b{display:block;font-size:16px}.slot .tx b em{font-style:normal;font-size:11px;font-weight:800;color:#241a00;background:#ffd166;border-radius:6px;padding:1px 6px;margin-left:6px}
.slot .tx small{display:block;font-size:12px;color:#bfe0cd;line-height:1.4;margin-top:1px}
.bars{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 6px;margin-top:5px;font-size:10px;color:#9cc5ae;align-items:center}.bars i{display:block;height:7px;border:2px solid #000;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden}.bars u{display:block;height:100%;background:linear-gradient(90deg,#5fe08a,#ffd166)}
.sa{display:flex;gap:4px}.sa .arr{width:28px;height:26px;border-radius:8px;font-size:11px}
.lvrow{display:flex;gap:6px;justify-content:center}.seg{border:3px solid #000;border-radius:10px;background:rgba(0,0,0,.38);color:#eafff2;font:900 14px/1 inherit;padding:7px 14px;cursor:pointer;box-shadow:0 3px 0 #000}.seg.on{background:linear-gradient(#ffe08a,#e0a82a);color:#241a00}
.opnote{font-size:12.5px;color:#f1c9c2;font-weight:700}
.acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}.acts .go{font-size:22px;padding:12px 34px}
.lobby{width:min(640px,100%);border:3px solid #000;border-radius:18px;background:linear-gradient(#1b4a36,#0f2b20);box-shadow:0 6px 0 #000,inset 0 0 0 2px rgba(255,255,255,.1);padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.lobtitle{font-weight:900;font-size:18px;color:#ffd166;letter-spacing:.2em;text-shadow:0 2px 0 #000}
.lobgrid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.lobgrid .pk.big{min-width:170px}
.joinrow{display:flex;gap:8px;align-items:center}.joinrow input,.share input{font:inherit;font-weight:900;color:#eafff2;background:rgba(0,0,0,.4);border:3px solid #000;border-radius:10px;padding:7px 10px;text-align:center;outline:none}
.joinrow input{width:9.5em;letter-spacing:.3em;text-transform:uppercase}.share input{width:100%;font-size:13px;letter-spacing:0}
.pulse{animation:pls .7s infinite alternate}@keyframes pls{to{transform:scale(1.07);filter:brightness(1.15)}}
.share{width:100%;display:flex;flex-direction:column;gap:8px;align-items:center;border:3px dashed rgba(255,209,102,.7);border-radius:14px;padding:10px;background:rgba(0,0,0,.25)}
.sc small{display:block;font-size:11px;letter-spacing:.3em;color:#9cc5ae}.sc b{font-size:clamp(34px,6vw,50px);letter-spacing:.22em;color:#5fe08a;text-shadow:0 3px 0 #000;user-select:all}
.sbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.shnote{font-size:12px;color:#bfe0cd}
.netst{min-height:1.3em;font-weight:800;font-size:14px;color:#eafff2}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:#9cc5ae}.keys kbd{font:900 11px/1 inherit;color:#241a00;background:#ffd166;border:2px solid #000;border-radius:6px;padding:2px 6px;margin-right:5px}
.ov.menu .note{color:#9cc5ae}
@media (max-width:860px){.vsrow{flex-direction:column;align-items:center}.vsmid{display:none}.card{max-width:540px;width:100%}.por{width:112px;height:112px}}

.hurt{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,40,0) 42%,rgba(255,40,40,.7) 100%)}
.pop2.miss{font-size:15px;color:#d9e6de;opacity:.85}
.cine{position:absolute;inset:0;pointer-events:none;overflow:hidden}

  const r = await netConnect(code, 'guest'); if (my !== netTry) { if (r.ws) r.ws.close(); return; }
  if (r.state === 'ready') { netAdopt(r.ws, code, 'guest'); netReady(); return; }
  netUi(false, r.code === 4404 ? '找不到這個房間（房主不在）' : r.code === 4409 ? '這個房間已經滿了' : '連線失敗，稍後再試');
}

// ───────── 開始畫面 ─────────
async function setup() {
  await cloudReady;
  const me0 = Q.get('me') || Q.get('as') || store.get('duel:me') || 'Machi', opts = n => NAMES.map(x => '<option value="' + x + '"' + (x === n ? ' selected' : '') + '>' + x + '</option>').join('');
  const op0 = store.get('duel:op'); const rest = NAMES.filter(n => n !== me0);
  $('selMe').innerHTML = opts(NAMES.includes(me0) ? me0 : NAMES[0]); $('selOp').innerHTML = opts(op0 && NAMES.includes(op0) && op0 !== me0 ? op0 : rest[Math.floor(Math.random() * rest.length)]); $('selLv').value = store.get('duel:lv') || '1';
  const fillSel = (id, o, cur) => { $(id).innerHTML = Object.keys(o).map(k => '<option value="' + k + '"' + (k === cur ? ' selected' : '') + '>' + o[k].n + '</option>').join(''); };
  fillSel('selW', WEAPONS, store.get('duel:w') || 'tablet'); fillSel('selP', PASSIVES, store.get('duel:p') || 'coffee'); fillSel('selU', ULTS, store.get('duel:u') || 'quake');
  const IC_P = { coffee: '☕', thick: '🛡️', dodge: '💨', sip: '🍵', overtime: '🌙', slack: '🐟' }, IC_U = { quake: '💥', rush: '⚡', heal: '💚', shield: '🫧', rage: '🔥' };
  const bar = (l, v) => '<span>' + l + '</span><i><u style="width:' + Math.round(Math.max(.06, Math.min(1, v)) * 100) + '%"></u></i>';
  const slotHtml = (sel, kind, ic, name, tag, desc, extra) => '<div class="slot"><div class="ic">' + ic + '</div><div class="tx"><span class="kind">' + kind + '</span><b>' + name + (tag ? '<em>' + tag + '</em>' : '') + '</b><small>' + desc + '</small>' + (extra || '') + '</div><div class="sa"><button class="arr" data-sel="' + sel + '" data-d="-1" type="button">◀</button><button class="arr" data-sel="' + sel + '" data-d="1" type="button">▶</button></div></div>';
  let pvKey = '';
  const menuSync = () => {
    const W = WEAPONS[$('selW').value], P = PASSIVES[$('selP').value], U = ULTS[$('selU').value];
    const reach = W.ranged ? W.speed * W.life / 12.75 : W.range / 4.9, wide = W.ranged ? W.r / .9 * .35 : W.arc / 124;
    $('slotsMe').innerHTML = slotHtml('selW', '武器', W.ic, W.n, W.tag, W.d, '<div class="bars">' + bar('傷害', W.dmg / 17) + bar('攻速', 1 / W.cd / 3.4) + bar('距離', reach) + bar(W.ranged ? '彈幅' : '範圍', wide) + '</div>') + slotHtml('selP', '被動', IC_P[$('selP').value], P.n, '', P.d) + slotHtml('selU', '大招', IC_U[$('selU').value], U.n, '', U.d);
    $('nmMe').textContent = $('selMe').value; $('nmOp').textContent = $('selOp').value;
    document.querySelectorAll('.seg').forEach(x => x.classList.toggle('on', x.dataset.lv === $('selLv').value));
    store.set('duel:w', $('selW').value); store.set('duel:p', $('selP').value); store.set('duel:u', $('selU').value);
    const k = $('selMe').value + '|' + $('selOp').value; if (k !== pvKey) { pvKey = k; drawPreview($('pvMe'), $('selMe').value); drawPreview($('pvOp'), $('selOp').value); }
  };
  $('startO').addEventListener('click', e => { const t = e.target.closest('.arr,.seg'); if (!t) return; if (t.dataset.lv !== undefined) $('selLv').value = t.dataset.lv; else { const sel = $(t.dataset.sel), n = sel.options.length; sel.selectedIndex = (sel.selectedIndex + (+t.dataset.d) + n) % n; } SFX.unlock(); menuSync(); });
  menuSync();
  const online = on => { $('opTag').textContent = on ? 'ONLINE' : 'CPU'; $('opPick').hidden = $('lvRow').hidden = on; $('opQ').hidden = !on; $('pvOp').style.visibility = on ? 'hidden' : 'visible'; $('opNote').textContent = on ? '配對成功後會顯示對手的角色與裝備' : '電腦每場隨機帶一套裝備'; $('startB').hidden = on; };
  const inviteLink = code => location.origin + location.pathname + '?room=' + code;
  const inviteText = code => $('selMe').value + ' 邀請你一起玩「辦公室對決」1 對 1！\n房間碼：' + code + '\n點此直接加入：' + inviteLink(code);
  const copyText = async (t, btn) => { try { await navigator.clipboard.writeText(t); } catch (e) { const x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); try { document.execCommand('copy'); } catch (e2) {} x.remove(); } const o = btn.textContent; btn.textContent = '已複製 ✓'; setTimeout(() => { btn.textContent = o; }, 1400); };
  showShare = code => { $('shareBox').hidden = false; $('shCode').textContent = code; $('shLink').value = inviteLink(code); $('cpLink').onclick = () => copyText(inviteLink(code), $('cpLink')); $('cpText').onclick = () => copyText(inviteText(code), $('cpText')); $('shLink').onclick = () => $('shLink').select(); };
  if (matchMedia('(pointer:coarse)').matches) $('startNote').textContent = '這款需要鍵盤與滑鼠，請用電腦玩。';
  $('netB').onclick = () => { const b = $('netBox'); b.hidden = !b.hidden; online(!b.hidden); if (b.hidden) { netClose(); netUi(false, ''); } else setTimeout(() => b.scrollIntoView({ behavior: 'smooth', block: 'end' }), 50); };
  { const rm = (Q.get('room') || '').toUpperCase(); if (/^[A-Z0-9]{6}$/.test(rm)) { $('netBox').hidden = false; online(true); $('joinIn').value = rm; netSt('受邀加入房間 ' + rm + '：選好角色與裝備，按「加入」'); $('joinB').classList.add('pulse'); } }
  $('qmB').onclick = netQuick; $('mkB').onclick = netMake; $('joinB').onclick = netJoin; $('joinIn').onkeydown = e => { if (e.key === 'Enter') netJoin(); };
  $('netCancel').onclick = () => { netClose(); netUi(false, ''); };
  $('startB').onclick = async () => {
    netClose(true);
    SFX.unlock(); const a = $('selMe').value, b = $('selOp').value; lvl = +$('selLv').value; store.set('duel:me', a); store.set('duel:op', b); store.set('duel:lv', String(lvl));
    $('startB').disabled = true; $('startB').textContent = '載入角色中…';
    const [ta, tb, wa, wb] = await Promise.all([loadAtlas(a), loadAtlas(b), loadWalk(a), loadWalk(b)]);
    if (ME) { scene.remove(ME.holder, ME.blob); scene.remove(OP.holder, OP.blob); fighters.length = 0; }
    ME = makeFighter(a, ta, false, 0x3b9f6a); OP = makeFighter(b, tb, true, 0xd9534f); fighters.push(ME, OP); OP.isBot = true; ME.walk = wa; OP.walk = wb;
    place(ME, -14, 0, Math.PI / 2); place(OP, 14, 0, -Math.PI / 2);
    $('startB').disabled = false; $('startB').textContent = '開始對決（對電腦）'; $('startO').hidden = true; beginMatch();
  };
}
resize(); syncTheme(); applyTheme(); requestAnimationFrame(frame); setup();
window.__duel = { get me() { return ME; }, get op() { return OP; }, get state() { return state; }, get net() { return net; }, get wins() { return wins; }, SOL, hAt, groundAt, keys, R, set lvl(v) { lvl = v; }, setBot(v) { AI_ON = v; } };
})();
</script>
